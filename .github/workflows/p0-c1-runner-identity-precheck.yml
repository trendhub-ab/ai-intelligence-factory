name: P0 C-1 Runner Identity Precheck [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0-c1-access-config-audit-20261005
    paths:
      - '.github/workflows/p0-c1-runner-identity-precheck.yml'

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Bounded identity precheck with metadata restore
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/c1-id-precheck"; mkdir -p "$work"
          vm_json="$work/vm.json"; original="$work/original-startup.sh"; diag="$work/diag.sh"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$vm_json"
          VM_JSON="$vm_json" ORIGINAL="$original" python3 - <<'PY'
          import json,os
          vm=json.load(open(os.environ['VM_JSON'],encoding='utf-8'))
          if vm.get('status')!='TERMINATED': raise SystemExit('VM must be TERMINATED')
          items=(vm.get('metadata') or {}).get('items') or []
          vals={x.get('key'):x.get('value') for x in items}
          if 'startup-script' not in vals: raise SystemExit('startup-script missing')
          open(os.environ['ORIGINAL'],'w',encoding='utf-8').write(str(vals['startup-script'] or ''))
          PY
          cat > "$diag" <<'EOS'
          #!/usr/bin/env bash
          set +e
          emit(){ printf 'AIIF_C1_ID %s=%s\n' "$1" "$2" > /dev/ttyS0 2>/dev/null || true; }
          mapfile -t units < <(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'actions\.runner|github.*runner|runner.*github' || true)
          mapfile -t cfgs < <(find /home /opt -maxdepth 6 -type f -name '.runner' 2>/dev/null || true)
          emit unit_count_one "$([ "${#units[@]}" -eq 1 ] && echo true || echo false)"
          emit config_count_one "$([ "${#cfgs[@]}" -eq 1 ] && echo true || echo false)"
          if [ "${#units[@]}" -eq 1 ] && [ "${#cfgs[@]}" -eq 1 ]; then
            unit="${units[0]}"; cfg="${cfgs[0]}"; dir="$(dirname "$cfg")"
            unit_user="$(systemctl show "$unit" -p User --value 2>/dev/null)"
            owner="$(stat -c '%U' "$cfg" 2>/dev/null)"
            id "$unit_user" >/dev/null 2>&1; unit_user_exists=$?
            id "$owner" >/dev/null 2>&1; owner_exists=$?
            [ -n "$unit_user" ] && [ "$unit_user" = "$owner" ]; user_matches_owner=$?
            systemctl cat "$unit" 2>/dev/null | grep -Fq "$dir/runsvc.sh"; exec_matches=$?
            [ -f "$dir/runsvc.sh" ] && [ -x "$dir/runsvc.sh" ]; runsvc_ok=$?
            [ -f "$dir/bin/Runner.Listener" ] && [ -x "$dir/bin/Runner.Listener" ]; listener_ok=$?
            systemctl is-enabled "$unit" >/dev/null 2>&1; enabled=$?
            emit unit_user_exists "$([ "$unit_user_exists" -eq 0 ] && echo true || echo false)"
            emit config_owner_exists "$([ "$owner_exists" -eq 0 ] && echo true || echo false)"
            emit unit_user_matches_owner "$([ "$user_matches_owner" -eq 0 ] && echo true || echo false)"
            emit exec_matches_runner_dir "$([ "$exec_matches" -eq 0 ] && echo true || echo false)"
            emit runsvc_executable "$([ "$runsvc_ok" -eq 0 ] && echo true || echo false)"
            emit listener_executable "$([ "$listener_ok" -eq 0 ] && echo true || echo false)"
            emit service_enabled "$([ "$enabled" -eq 0 ] && echo true || echo false)"
          fi
          emit done true
          sleep 5
          systemctl poweroff --no-wall >/dev/null 2>&1 || shutdown -h now >/dev/null 2>&1 || true
          EOS
          chmod 700 "$diag"
          restore(){
            set +e
            state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null)"
            if [ -n "$state" ] && [ "$state" != TERMINATED ]; then
              gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet >/dev/null 2>&1 || true
              for _ in $(seq 1 60); do
                state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null)"
                [ "$state" = TERMINATED ] && break; sleep 5
              done
            fi
            gcloud compute instances add-metadata "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --metadata-from-file="startup-script=$original" >/dev/null 2>&1 || true
          }
          trap restore EXIT
          gcloud compute instances add-metadata "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --metadata-from-file="startup-script=$diag" >/dev/null
          gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet >/dev/null
          sleep 50
          serial="$work/serial.txt"
          gcloud compute instances get-serial-port-output "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --port=1 > "$serial" 2>/dev/null
          SERIAL="$serial" python3 - <<'PY'
          import os,re
          allowed={'unit_count_one','config_count_one','unit_user_exists','config_owner_exists','unit_user_matches_owner','exec_matches_runner_dir','runsvc_executable','listener_executable','service_enabled','done'}
          vals={}
          for line in open(os.environ['SERIAL'],encoding='utf-8',errors='ignore'):
              m=re.search(r'AIIF_C1_ID ([a-z_]+)=(true|false)',line)
              if m and m.group(1) in allowed: vals[m.group(1)]=m.group(2)
          safe={k:vals.get(k,'missing') for k in sorted(allowed)}
          print('C1_RUNNER_IDENTITY_PRECHECK='+str(safe))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 runner identity precheck\n')
              for k,v in safe.items(): fh.write(f'- {k}: `{v}`\n')
              fh.write('- Usernames, unit names, paths, runner config and tokens are intentionally not published.\n')
          required={
            'unit_count_one':'true','config_count_one':'true','unit_user_exists':'false','config_owner_exists':'true',
            'unit_user_matches_owner':'false','exec_matches_runner_dir':'true','runsvc_executable':'true','listener_executable':'true','service_enabled':'true','done':'true'}
          bad=[k for k,v in required.items() if vals.get(k)!=v]
          if bad: raise SystemExit('repair preconditions not satisfied: '+','.join(bad))
          PY
