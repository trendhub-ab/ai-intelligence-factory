name: One Shot Member Sync Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.member-sync-once'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current member presentation sync on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run member-presentation-sync.yml --ref main --repo trendhub-ab/ai-intelligence-factory
