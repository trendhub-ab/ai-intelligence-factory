name: Note UI Clean Live Proof [ONE-SHOT]

on:
  push:
    branches:
      - fix/note-draft-ui-contract-clean
    paths:
      - '.github/workflows/note-ui-clean-live-once.yml'

permissions:
  contents: read

concurrency:
  group: note-ui-clean-live-proof
  cancel-in-progress: false

jobs:
  verify-and-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AIIF_RUNTIME_STATE_BRANCH: runtime-state
      GEMINI_COUNTER_BRANCH: runtime-state
      EYECATCH_GITHUB_BRANCH: runtime-state
    steps:
      - name: Checkout clean note UI branch
        uses: actions/checkout@v6
        with:
          ref: fix/note-draft-ui-contract-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright google-cloud-storage

      - name: Focused note UI regression
        run: |
          python -m pytest -q \
            tests/test_p0b_note_header_image_button.py \
            tests/test_p0b_note_browser_user_agent.py \
            tests/test_run187_note_editor_readiness.py \
            tests/test_run194_note_current_contract.py

      - name: Full repository pytest
        run: python -m pytest tests -q

      - name: Repository guards
        run: |
          set -euo pipefail
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
          git diff --check

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Execute one isolated private-draft UI proof
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_UI_PROBE_RESULT_FILE: ${{ runner.temp }}/note-ui-clean-live-proof.json
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          from PIL import Image, ImageDraw

          import note_eyecatch_persistence as eyecatch_persistence
          import run194_note_current_contract as current_contract
          import run222_note_presentation_integrity as presentation

          base = current_contract.base
          events = {
              'crop_dialog_seen': False,
              'crop_save_clicked': False,
              'body_pasted': False,
              'draft_save_control_seen': False,
              'draft_save_clicked': False,
              'persistence_verified': False,
          }

          # Install the exact clean-branch production UI adapters first.
          current_contract.install()
          presentation.install_note(base)
          eyecatch_persistence.install_creation_persistence_guard(base)

          # Observe the crop-dialog contract without changing selectors or behavior.
          original_find_crop = current_contract._find_unique_crop_dialog_with_save_control
          def observed_find_crop(page):
              result = original_find_crop(page)
              if result is not None:
                  events['crop_dialog_seen'] = True
              return result
          current_contract._find_unique_crop_dialog_with_save_control = observed_find_crop

          original_wait_crop = current_contract._wait_for_bound_dialog_hidden
          def observed_wait_crop(page, dialog, *, timeout_ms, after_bind=None):
              wrapped = None
              if after_bind is not None:
                  def wrapped():
                      result = after_bind()
                      events['crop_save_clicked'] = True
                      return result
              return original_wait_crop(
                  page,
                  dialog,
                  timeout_ms=timeout_ms,
                  after_bind=wrapped,
              )
          current_contract._wait_for_bound_dialog_hidden = observed_wait_crop

          # Observe the final installed paste path.
          original_paste = base._paste_manuscript
          def observed_paste(page, body, manuscript):
              result = original_paste(page, body, manuscript)
              events['body_pasted'] = True
              return result
          base._paste_manuscript = observed_paste

          # Observe the real draft-save control returned by the existing selector helper.
          original_first_visible = base._first_visible
          class TrackedSaveControl:
              def __init__(self, locator):
                  self._locator = locator
              def __getattr__(self, name):
                  return getattr(self._locator, name)
              def is_enabled(self, *args, **kwargs):
                  return self._locator.is_enabled(*args, **kwargs)
              def click(self, *args, **kwargs):
                  result = self._locator.click(*args, **kwargs)
                  events['draft_save_clicked'] = True
                  return result

          def observed_first_visible(page, selectors, *args, **kwargs):
              locator = original_first_visible(page, selectors, *args, **kwargs)
              if any('下書き保存' in str(selector) for selector in selectors):
                  if locator is not None:
                      events['draft_save_control_seen'] = True
                      return TrackedSaveControl(locator)
              return locator
          base._first_visible = observed_first_visible

          # Wrap the shared persistence guard only to record successful completion.
          original_save_verify = base._save_draft_and_verify
          def observed_save_verify(*args, **kwargs):
              result = original_save_verify(*args, **kwargs)
              events['persistence_verified'] = True
              return result
          base._save_draft_and_verify = observed_save_verify

          temp = Path(os.environ['RUNNER_TEMP'])
          image_path = temp / 'aiif-note-ui-live-proof.png'
          storage_path = None

          # 1280x670 matches the normal AIIF note eyecatch surface.
          image = Image.new('RGB', (1280, 670), 'white')
          draw = ImageDraw.Draw(image)
          draw.rectangle((40, 40, 1240, 630), outline='black', width=6)
          draw.rectangle((80, 80, 1200, 590), outline='black', width=2)
          image.save(image_path)

          run_id = str(os.environ.get('GITHUB_RUN_ID') or 'manual')
          title = f'AIIF UI LIVE PROBE {run_id}'
          manuscript = (
              'これはAIIFのnote下書きUI契約を確認するための非公開テスト原稿です。'
              '見出し画像のアップロード、crop保存、本文入力、下書き保存、再読込後の永続化だけを検証します。'
              '公開操作は行いません。既存の下書きも変更しません。\n\n'
              '## 検証本文\n\n'
              + ('clean branchの実UI検証です。保存後に同じ本文が残ることを確認します。' * 12)
          )

          try:
              storage_path = base._decode_storage_state()
              draft_url = base._create_browser_draft(
                  title,
                  manuscript,
                  image_path,
                  storage_path,
              )
              if not re.match(r'^https://(?:editor\.)?note\.com/notes/[^/?#]+/edit/?', str(draft_url), re.I):
                  raise SystemExit('live proof did not return a stable private edit route')

              required = [
                  'crop_dialog_seen',
                  'crop_save_clicked',
                  'body_pasted',
                  'draft_save_control_seen',
                  'draft_save_clicked',
                  'persistence_verified',
              ]
              missing = [name for name in required if events.get(name) is not True]
              if missing:
                  raise SystemExit('live UI proof missed required events: ' + ','.join(missing))

              result = {
                  'status': 'clean_note_ui_live_proof_passed',
                  'authenticated': True,
                  'header_image_uploaded': True,
                  'crop_dialog_seen': True,
                  'crop_save_clicked': True,
                  'body_pasted': True,
                  'draft_save_control_seen': True,
                  'draft_save_clicked': True,
                  'persistence_verified': True,
                  'private_edit_route_obtained': True,
                  'existing_draft_mutation_count': 0,
                  'public_release': False,
                  'model_calls': 0,
              }
              Path(os.environ['NOTE_UI_PROBE_RESULT_FILE']).write_text(
                  json.dumps(result, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              print('NOTE_UI_CLEAN_LIVE_PROOF=' + json.dumps(result, ensure_ascii=False, sort_keys=True))
          finally:
              image_path.unlink(missing_ok=True)
              if storage_path is not None:
                  storage_path.unlink(missing_ok=True)
          PY

      - name: Summarize safe result
        env:
          RESULT_FILE: ${{ runner.temp }}/note-ui-clean-live-proof.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Clean note UI live proof\n')
              for key in (
                  'status', 'authenticated', 'header_image_uploaded', 'crop_dialog_seen',
                  'crop_save_clicked', 'body_pasted', 'draft_save_control_seen',
                  'draft_save_clicked', 'persistence_verified', 'private_edit_route_obtained',
                  'existing_draft_mutation_count', 'public_release', 'model_calls',
              ):
                  fh.write(f'- {key}: `{result.get(key)}`\n')
          PY
