name: Existing Ready Draft Regeneration [ONE-SHOT]

on:
  workflow_dispatch:
    inputs:
      sync_id:
        description: Exact 32-hex Content Intelligence sync id
        required: true
        type: string
      confirm:
        description: Type RUN_ONCE to run one exact existing-draft regeneration
        required: true
        default: ''
        type: string
      operation:
        description: regenerate or resume_persisted
        required: false
        default: regenerate
        type: string

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.confirm == 'RUN_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      start_vm: ${{ steps.ok.outputs.start_vm }}
    env:
      READY_DRAFT_REGENERATION_CONFIRM: REGENERATE_EXISTING_READY_DRAFT
      READY_DRAFT_REGENERATION_SYNC_ID: ${{ inputs.sync_id }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
    steps:
      - name: Require exact target, operation, and literal confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = 'RUN_ONCE'
          [[ "${{ inputs.sync_id }}" =~ ^[0-9a-fA-F]{32}$ ]]
          case "${{ inputs.operation }}" in
            regenerate|resume_persisted) ;;
            *) echo "::error::Invalid operation"; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zero-browser preflight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify exact existing private-draft binding before VM start
        run: |
          python ready_draft_regeneration.py \
            --sync-id "$READY_DRAFT_REGENERATION_SYNC_ID" \
            --confirm "$READY_DRAFT_REGENERATION_CONFIRM" \
            --prepare-only

      - id: ok
        run: echo 'start_vm=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.start_vm == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note VM if needed
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != 'RUNNING' ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  regenerate-existing-draft:
    if: ${{ needs.preflight.outputs.start_vm == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      AIIF_RUNTIME_STATE_GITHUB_TOKEN: ${{ github.token }}
      AIIF_EDITORIAL_STYLE: human_narrative
      READY_DRAFT_REGENERATION_CONFIRM: REGENERATE_EXISTING_READY_DRAFT
      READY_DRAFT_REGENERATION_SYNC_ID: ${{ inputs.sync_id }}
      ARTICLE_REVALIDATION_REQUEST_BUDGET: '8'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
      GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
      GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.6-flash,gemini-3.5-flash,gemini-3.7-flash,gemini-3.8-flash'
      GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: '8'
      GEMINI_36_FLASH_DAILY_BUDGET: '18'
      GEMINI_35_FLASH_DAILY_BUDGET: '18'
      GEMINI_37_FLASH_DAILY_BUDGET: '18'
      GEMINI_38_FLASH_DAILY_BUDGET: '18'
      GEMINI_QUOTA_TIMEZONE: America/Los_Angeles
      GEMINI_DEEP_DIVE_CALL_TIMEOUT_SECONDS: '120'
      GEMINI_DEEP_DIVE_CALL_PACING_SECONDS: '20'
      GEMINI_MODEL_TIMEOUT_CIRCUIT_BREAKER_THRESHOLD: '2'
      GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
      GEMINI_COUNTER_BRANCH: runtime-state
      GH_PAT: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
      ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
      ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
      NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
      NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
      NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
      NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
      ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
      EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
      NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
      NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
      ARTICLE_PUBLICATION_MODE: free
      ENABLE_SUBSCRIPTION_ATTRIBUTION: 'true'
      SUBSCRIPTION_LANDING_URL: ${{ vars.SUBSCRIPTION_LANDING_URL }}
      SUBSCRIPTION_CAMPAIGN_ID: ai_intelligence_factory_subscription
      SUBSCRIPTION_ATTRIBUTION_DIR: subscription_attribution/articles
      SUBSCRIPTION_ATTRIBUTION_GITHUB_DIR: subscription_attribution/articles
      EYECATCH_MIN_DECISION_SCORE: '60'
      EYECATCH_GITHUB_BRANCH: main
      ENABLE_DETERMINISTIC_PUBLICATION_RESCUE: 'true'
      NOTION_SAVE_THRESHOLD_SCORE: '60'
      MAX_EVIDENCE_DOCUMENTS: '3'
      VERIFICATION_CONTEXT_MAX_CHARS: '180000'
      NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
      NOTE_CHROME_CHANNEL: chrome
      NOTE_CHROME_HEADLESS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install current Production and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest

      - name: Run focused exact-draft regression contract
        run: python -m unittest tests.test_ready_draft_regeneration -v

      - name: Run exact current-main regeneration or zero-provider resume and same-draft replacement
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$OPERATION" = 'resume_persisted' ]; then
            extra+=(--resume-persisted)
          fi
          xvfb-run -a python ready_draft_regeneration.py \
            --sync-id "$READY_DRAFT_REGENERATION_SYNC_ID" \
            --confirm "$READY_DRAFT_REGENERATION_CONFIRM" \
            "${extra[@]}" \
            | tee "${RUNNER_TEMP}/ready-draft-regeneration.json"

      - name: Verify private-draft boundaries
        env:
          RESULT_FILE: ${{ runner.temp }}/ready-draft-regeneration.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8').splitlines()[-1])
          if result.get('status') != 'existing_ready_draft_regenerated':
              raise SystemExit('exact existing-draft regeneration did not complete')
          for key in ('same_edit_route', 'title_verified', 'body_verified', 'eyecatch_verified'):
              if result.get(key) is not True:
                  raise SystemExit(f'invariant failed: {key}')
          if result.get('new_draft_created') is not False:
              raise SystemExit('boundary crossed: new draft created')
          if result.get('public_release') is not False:
              raise SystemExit('boundary crossed: external release')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, regenerate-existing-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          [ "$state" != 'RUNNING' ] || gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
