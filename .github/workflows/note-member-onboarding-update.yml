name: Update exact member onboarding note

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact Run325 finalize token; keeps full article members-only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-member-onboarding-update-n284e428c80f4
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify exact Run323 to Run325 progression
        run: |
          python -m unittest tests.test_run323_member_onboarding_publish_surface_deep_probe -v
          python -m unittest tests.test_run324_member_onboarding_trial_read_surface_probe -v
          python -m unittest tests.test_run325_member_onboarding_finalize_latest -v
      - name: Validate exact latest-draft authorization
        id: auth
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = 'FINALIZE_MEMBER_ONBOARDING_N284E428C80F4_SHAAAB9E57B_KEEP_MEMBERS_ONLY' ] || exit 1
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  update:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact Run325 regression
        run: python -m unittest tests.test_run325_member_onboarding_finalize_latest -v
      - name: Finalize exact latest draft while preserving members-only access
        env:
          NOTE_MEMBER_ONBOARDING_FINALIZE_LATEST_CONFIRM: ${{ inputs.confirm }}
          NOTE_MEMBER_ONBOARDING_FINALIZE_LATEST_RESULT_FILE: ${{ runner.temp }}/run325-result.json
          NOTE_MEMBER_ONBOARDING_FINALIZE_LATEST_SCREENSHOT_FILE: ${{ runner.temp }}/run325-post-membership.png
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run325_member_onboarding_finalize_latest.py
      - name: Enforce exact postconditions
        env:
          RESULT_FILE: ${{ runner.temp }}/run325-result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          status = r.get('status')
          if status not in {'latest_draft_published_and_membership_verified', 'already_current_verified_no_mutation'}:
              raise SystemExit(f'Run325 unexpected status: {status!r}')
          if r.get('trial_read_line_clicked') is not False:
              raise SystemExit('Run325 changed the trial-read line')
          if r.get('membership_mutation') is not False or r.get('settings_mutation') is not False:
              raise SystemExit('Run325 changed membership/settings outside the authorized update')
          membership = r.get('membership_postcondition') or {}
          if membership.get('plan_added') is not True or membership.get('all_plans_not_added') is not True:
              raise SystemExit('Run325 membership postcondition failed')
          if r.get('zero_gemini_calls') is not True or r.get('notion_writes') != 0:
              raise SystemExit('Run325 zero-model/zero-Notion contract failed')
          if status == 'latest_draft_published_and_membership_verified':
              if r.get('final_update_clicked') is not True or r.get('public_mutation') is not True:
                  raise SystemExit('Run325 expected one successful public update')
              if r.get('members_only_access_preserved') is not True:
                  raise SystemExit('Run325 members-only access postcondition missing')
          else:
              if r.get('final_update_clicked') is not False or r.get('public_mutation') is not False:
                  raise SystemExit('Run325 idempotent no-mutation contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run325 exact member onboarding update\n')
              fh.write(f'- status: `{status}`\n')
              fh.write(f'- target: `{r.get("target_note_id")}`\n')
              fh.write(f'- exact body sha: `{r.get("source_body_sha256")}`\n')
              fh.write(f'- final update clicked: `{str(r.get("final_update_clicked")).lower()}`\n')
              fh.write('- trial-read line changed: `false`\n')
              fh.write('- AI Decision Intelligence membership: `追加済`\n')
              fh.write('- all-plans exposure: `not added`\n')
              fh.write(f'- public mutation: `{str(r.get("public_mutation")).lower()}`\n')
              fh.write('- Gemini calls: `0`\n')
              fh.write('- Notion writes: `0`\n')
          PY
      - name: Preserve Run325 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run325-onboarding-update
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/run325-result.json
            ${{ runner.temp }}/run325-post-membership.png

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
