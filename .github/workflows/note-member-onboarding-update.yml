name: Update exact member onboarding note

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPDATE_MEMBER_ONBOARDING_N284E428C80F4_SHA4826AABC'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-member-onboarding-update-n284e428c80f4
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify exact onboarding update
        run: python -m unittest tests.test_run315_member_onboarding_update tests.test_run315_dom_range_replace -v
      - name: Validate exact audited-state authorization
        id: auth
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = 'UPDATE_MEMBER_ONBOARDING_N284E428C80F4_SHA4826AABC' ] || exit 1
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  update:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact onboarding regression
        run: python -m unittest tests.test_run315_member_onboarding_update tests.test_run315_dom_range_replace -v
      - name: Rewrite, re-associate, and verify exact onboarding note
        env:
          NOTE_MEMBER_ONBOARDING_UPDATE_CONFIRM: ${{ inputs.confirm }}
          NOTE_MEMBER_ONBOARDING_UPDATE_RESULT_FILE: ${{ runner.temp }}/run315-member-onboarding-update.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run315_member_onboarding_update_dom_range.py
      - name: Summarize verified update
        env:
          RESULT_FILE: ${{ runner.temp }}/run315-member-onboarding-update.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if r.get('status') != 'updated_and_verified':
              raise SystemExit('Run315 onboarding update did not verify')
          if r.get('not_for_sale_removed') is not True:
              raise SystemExit('Run315 not-for-sale state remains')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run315 exact member onboarding update\n')
              fh.write(f'- target: `{r.get("target_note_id")}`\n')
              fh.write(f'- title: `{r.get("title")}`\n')
              fh.write(f'- membership changed: `{bool(r.get("membership", {}).get("changed"))}`\n')
              fh.write(f'- not-for-sale removed: `{r.get("not_for_sale_removed") is True}`\n')
              fh.write('- zero Gemini calls: `true`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
