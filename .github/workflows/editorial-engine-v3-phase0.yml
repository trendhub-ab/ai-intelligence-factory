name: Editorial Engine v3 Phase 0

on:
  push:
    branches:
      - feature/editorial-engine-v3-phase0
    paths:
      - 'experiments/editorial_engine_v3_phase0/**'
      - 'tests/test_editorial_engine_v3_phase0.py'
      - 'tests/test_editorial_engine_v3_phase0_live.py'
      - '.github/workflows/editorial-engine-v3-phase0.yml'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run Gemini Phase 0 live proof'
        required: true
        default: false
        type: boolean
      model_candidates:
        description: 'Ordered non-Lite Gemini candidates; first successful model is locked for the whole experiment'
        required: true
        default: 'gemini-3.8-flash,gemini-3.6-flash'
        type: string
      case_cooldown_seconds:
        description: 'Cooldown between completed cases'
        required: true
        default: '45'
        type: string
      resume_run_id:
        description: 'Optional prior Phase 0 run ID whose checkpoint artifact should be resumed'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Phase 0 contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused Phase 0 tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_editorial_engine_v3_phase0.py \
            tests/test_editorial_engine_v3_phase0_live.py

  live-proof:
    name: Phase 0 bounded Gemini replay
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-intelligence-gemini-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore prior Phase 0 checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: editorial-engine-v3-phase0-checkpoint
          path: phase0_artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Install isolated Gemini client
        run: python -m pip install --disable-pip-version-check 'google-genai>=1.56.0,<2.0.0'
      - name: Run bounded three-case replay
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_PHASE0_MODELS: ${{ inputs.model_candidates }}
          AIIF_PHASE0_CASE_COOLDOWN_SECONDS: ${{ inputs.case_cooldown_seconds }}
          AIIF_PHASE0_OUTPUT_DIR: phase0_artifacts
        run: python -m experiments.editorial_engine_v3_phase0.live
      - name: Upload checkpoint and blind evaluation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-engine-v3-phase0-checkpoint
          path: phase0_artifacts
          if-no-files-found: warn
          retention-days: 7
