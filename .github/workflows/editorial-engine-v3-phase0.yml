name: Editorial Engine v3 Phase 0

on:
  push:
    branches:
      - feature/editorial-engine-v3-phase0
    paths:
      - 'experiments/editorial_engine_v3_phase0/**'
      - 'tests/test_editorial_engine_v3_phase0.py'
      - 'tests/test_editorial_engine_v3_phase0_live.py'
      - '.github/workflows/editorial-engine-v3-phase0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Phase 0 contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused Phase 0 tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_editorial_engine_v3_phase0.py \
            tests/test_editorial_engine_v3_phase0_live.py

  live-proof:
    name: Phase 0 bounded Gemini replay
    needs: contract
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[phase0-live]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-intelligence-gemini-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Gemini client
        run: python -m pip install --disable-pip-version-check 'google-genai>=1.56.0,<2.0.0'
      - name: Run bounded three-case replay
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_PHASE0_MODEL: gemini-3-flash-preview
          AIIF_PHASE0_OUTPUT_DIR: phase0_artifacts
        run: python -m experiments.editorial_engine_v3_phase0.live
      - name: Upload blind evaluation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-engine-v3-phase0
          path: phase0_artifacts
          if-no-files-found: error
          retention-days: 7
