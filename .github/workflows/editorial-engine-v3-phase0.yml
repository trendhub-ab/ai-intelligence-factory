name: Editorial Engine v3 Phase 0

on:
  push:
    branches:
      - feature/editorial-engine-v3-phase0
    paths:
      - 'experiments/editorial_engine_v3_phase0/**'
      - 'tests/test_editorial_engine_v3_phase0.py'
      - '.github/workflows/editorial-engine-v3-phase0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Phase 0 contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused Phase 0 tests
        shell: bash
        run: |
          if [[ -f tests/test_editorial_engine_v3_phase0.py ]]; then
            python -m pytest -q tests/test_editorial_engine_v3_phase0.py
          else
            echo 'Phase 0 test file not added yet; workflow bootstrap only.'
          fi
