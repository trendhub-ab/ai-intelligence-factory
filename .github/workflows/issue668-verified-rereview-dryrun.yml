name: Issue 668 Verified Re-review Dry Run [READ ONLY]

on:
  push:
    branches:
      - feat/issue-668-readonly-rereview-20261001
    paths:
      - member_verified_rereview_dryrun.py
      - tests/test_issue668_verified_rereview_dryrun.py
      - .github/workflows/issue668-verified-rereview-dryrun.yml

permissions:
  contents: read

jobs:
  verified-rereview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main plus Issue 668 branch
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prove model credentials are absent
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GOOGLE_API_KEY:-}"
          test -z "${GOOGLE_GENAI_API_KEY:-}"

      - name: Issue 668 dedicated safety tests
        run: python -m unittest tests.test_issue668_verified_rereview_dryrun -v

      - name: Existing Evidence gate regressions
        run: |
          python -m unittest tests.test_run113_cross_source_evidence_resolution -v
          python -m unittest tests.test_run118_evidence_authority -v
          python -m unittest tests.test_run119_evidence_entity_binding -v
          python -m unittest tests.test_run244_decision_product_protocol_module -v

      - name: Run five-record live read-only re-review
        env:
          TZ: 'Asia/Tokyo'
          GITHUB_TOKEN: ${{ github.token }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
        run: |
          set +e
          python member_verified_rereview_dryrun.py --limit 5 --stale-days 30 --as-of 2026-10-01 \
            > "${RUNNER_TEMP}/issue668.out" 2> "${RUNNER_TEMP}/issue668.err"
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Issue 668 read-only re-review failed closed; per-record output is intentionally redacted."
            rm -f "${RUNNER_TEMP}/issue668.out" "${RUNNER_TEMP}/issue668.err"
            exit "$code"
          fi

          aggregate="$(grep '^ISSUE_668_READ_ONLY_AGGREGATE ' "${RUNNER_TEMP}/issue668.out" | tail -n 1)"
          if [ -z "$aggregate" ]; then
            echo "::error::Issue 668 aggregate result missing; raw output intentionally withheld."
            rm -f "${RUNNER_TEMP}/issue668.out" "${RUNNER_TEMP}/issue668.err"
            exit 1
          fi

          printf '%s\n' "$aggregate"
          rm -f "${RUNNER_TEMP}/issue668.out" "${RUNNER_TEMP}/issue668.err"
