name: Integration Reconciliation CI
# Run267: required zero-api-regression must produce a status context for every PR to main.
# Run264 hermeticity remains unchanged: full pytest is the single regression authority,
# structural guards run before it, and Synthetic smoke validates the assembled current Production stack.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-api-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Integration must never consult the repository-backed Production Gemini counter.
      GEMINI_PERSISTENT_DAILY_COUNTER: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install locked test environment
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check

      - name: Compile current Python surfaces
        run: python -m compileall -q *.py tests

      - name: Enforce Integration hermeticity and stability contract
        run: python integration_stability_guard.py

      - name: Run repository-wide falsification guard
        run: python repository_falsification_guard.py

      - name: Run full deterministic regression once
        run: python -m pytest -q tests

      - name: Run synthetic smoke through current Production stack
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python production_pipeline.py
