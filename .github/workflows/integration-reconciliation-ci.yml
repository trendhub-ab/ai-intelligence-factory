name: Integration Reconciliation CI
# Run267: required zero-api-regression must produce a status context for every PR to main.
# Run264 hermeticity remains unchanged: full pytest is the single regression authority,
# structural guards run before it, and Synthetic smoke validates the assembled current Production stack.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - member_monthly_decision_brief_sync.py
      - member_reader_quality_policy.py
      - member_ux_guard.py
      - run307_use_decision_member_surface.py
      - member_customer_surface_contract.py
      - .github/workflows/member-presentation-sync.yml

permissions:
  contents: read

jobs:
  zero-api-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Integration must never consult the repository-backed Production Gemini counter.
      GEMINI_PERSISTENT_DAILY_COUNTER: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install locked test environment
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check

      - name: Compile current Python surfaces
        run: python -m compileall -q *.py tests

      - name: Enforce Integration hermeticity and stability contract
        run: python integration_stability_guard.py

      - name: Run repository-wide falsification guard
        run: python repository_falsification_guard.py

      - name: Run full deterministic regression once
        run: python -m pytest -q tests test_run360_gemini_retry_owner.py

      - name: Run synthetic smoke through current Production stack
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python production_pipeline.py

  # PR #832 synthetic-only temporary proof. Revert after canary.
  pr832_synthetic_writer:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/v1-eyecatch-complete-title-fallback-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-copy dependencies only
        run: python -m pip install 'cryptography==50.0.1' 'requests>=2.32.4,<3'
      - name: Write synthetic encrypted copy to runtime-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANARY_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from eyecatch_copy_runtime_store import EyecatchCopyStore
          key = base64.urlsafe_b64encode(hashlib.sha256(b"PR832-SYNTHETIC-CANARY-ONLY-NOT-A-SECRET").digest()).decode()
          env = {
              "GITHUB_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "AIIF_RUNTIME_STATE_GITHUB_TOKEN": os.environ["GITHUB_TOKEN"],
              "AIIF_EYECATCH_COPY_FERNET_KEY": key,
          }
          store = EyecatchCopyStore(env=env)
          title = "SYNTHETIC-PR832-NOT-A-REAL-DRAFT-" + os.environ["CANARY_RUN_ID"]
          summary = "SYNTHETIC-ONLY-SUMMARY"
          text = "SYNTHETIC-ONLY-ARTICLE"
          plan = {"eyecatch_title": "SYNTHETIC COPY ONLY", "title_lines": ["SYNTHETIC COPY ONLY"]}
          assert store.enabled
          assert store.save(title, summary, plan, text), "synthetic encrypted write failed"
          assert store.load(title, summary, text) == plan, "writer readback mismatch"
          print("SYNTHETIC_ENCRYPTED_WRITER=PASS")
          PY
  pr832_synthetic_reader:
    needs: pr832_synthetic_writer
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-copy dependencies only
        run: python -m pip install 'cryptography==50.0.1' 'requests>=2.32.4,<3'
      - name: Verify separate runner reuses matching encrypted copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANARY_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from eyecatch_copy_runtime_store import EyecatchCopyStore
          key = base64.urlsafe_b64encode(hashlib.sha256(b"PR832-SYNTHETIC-CANARY-ONLY-NOT-A-SECRET").digest()).decode()
          store = EyecatchCopyStore(env={
              "GITHUB_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "AIIF_RUNTIME_STATE_GITHUB_TOKEN": os.environ["GITHUB_TOKEN"],
              "AIIF_EYECATCH_COPY_FERNET_KEY": key,
          })
          title = "SYNTHETIC-PR832-NOT-A-REAL-DRAFT-" + os.environ["CANARY_RUN_ID"]
          plan = {"eyecatch_title": "SYNTHETIC COPY ONLY", "title_lines": ["SYNTHETIC COPY ONLY"]}
          assert store.load(title, "SYNTHETIC-ONLY-SUMMARY", "SYNTHETIC-ONLY-ARTICLE") == plan, "reader readback mismatch"
          assert store.load(title, "SYNTHETIC-ONLY-SUMMARY", "CHANGED-SYNTHETIC-ARTICLE") is None, "source digest did not invalidate"
          print("SEPARATE_RUNNER_ENCRYPTED_REUSE=PASS")
          PY
  pr832_synthetic_cleanup:
    if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/v1-eyecatch-complete-title-fallback-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [pr832_synthetic_writer, pr832_synthetic_reader]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-copy dependencies only
        run: python -m pip install 'cryptography==50.0.1' 'requests>=2.32.4,<3'
      - name: Remove test-only encrypted cache from runtime-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANARY_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import requests
          from eyecatch_copy_runtime_store import EyecatchCopyStore
          key = base64.urlsafe_b64encode(hashlib.sha256(b"PR832-SYNTHETIC-CANARY-ONLY-NOT-A-SECRET").digest()).decode()
          store = EyecatchCopyStore(env={
              "GITHUB_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "AIIF_RUNTIME_STATE_GITHUB_TOKEN": os.environ["GITHUB_TOKEN"],
              "AIIF_EYECATCH_COPY_FERNET_KEY": key,
          })
          title = "SYNTHETIC-PR832-NOT-A-REAL-DRAFT-" + os.environ["CANARY_RUN_ID"]
          url = store._url(store.source_digest(title, "SYNTHETIC-ONLY-SUMMARY", "SYNTHETIC-ONLY-ARTICLE"))
          response = requests.get(url, headers=store._headers(), params={"ref": "runtime-state"}, timeout=15)
          if response.status_code == 404:
              print("SYNTHETIC_CANARY_CLEANUP=PASS (nothing persisted)")
          else:
              response.raise_for_status()
              sha = response.json()["sha"]
              result = requests.delete(url, headers=store._headers(), json={
                  "branch": "runtime-state",
                  "message": "test(runtime): clean PR832 synthetic cross-run canary",
                  "sha": sha,
              }, timeout=20)
              result.raise_for_status()
              check = requests.get(url, headers=store._headers(), params={"ref": "runtime-state"}, timeout=15)
              assert check.status_code == 404, "canary cleanup incomplete"
              print("SYNTHETIC_CANARY_CLEANUP=PASS")
          PY

