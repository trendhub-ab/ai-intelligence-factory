# AIIF V1 is retired. This check verifies retirement, not historical V1 runtime quality.
# No Gemini, Apify, Notion, note, cloud runners, or production setup is invoked.
name: Integration Reconciliation CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  zero-api-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout shutdown branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify V1 retirement is fail-closed
        run: python v1_retirement_contract_guard.py
      - name: Verify P1.5 VM audit exception is strictly read-only
        run: python -m unittest tests.test_run_p15_vm_audit_bridge -v
      - name: Verify business authority and required PR impact review
        run: |
          python business_north_star_guard.py
          python -m unittest tests.test_business_north_star_guard -v
