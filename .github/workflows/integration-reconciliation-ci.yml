name: Integration Reconciliation CI
# Run233: collect the entire repository test surface with pytest so standalone test functions cannot false-green.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'subscription_attribution.py'
      - 'inventory_bootstrap.py'
      - 'decision_intelligence.py'
      - 'pipeline.py'
      - 'production_pipeline.py'
      - 'runtime_layers.py'
      - 'legacy_eyecatch_renderer.py'
      - 'publication_contract.py'
      - 'note_ready_sync.py'
      - 'note_draft_automation.py'
      - 'daily_portfolio_review.py'
      - 'run*.py'
      - 'reader_value_review_bridge.py'
      - 'repository_falsification_guard.py'
      - '.github/workflows/daily.yml'
      - '.github/workflows/daily-one-shot.yml'
      - '.github/workflows/regression-test.yml'
      - '.github/workflows/note-ready-sync.yml'
      - '.github/workflows/note-create-draft.yml'
      - '.github/workflows/member-presentation-sync.yml'
      - '.github/workflows/subscriber-decision-brief.yml'
      - '.github/workflows/run231-stage2-surgical-migration.yml'
      - 'tests/**'
      - '.github/workflows/integration-reconciliation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=8,<9'
      - name: Compile reconciled production modules
        run: |
          python -m compileall -q \
            subscription_attribution.py \
            inventory_bootstrap.py \
            decision_intelligence.py \
            pipeline.py \
            production_pipeline.py \
            runtime_layers.py \
            legacy_eyecatch_renderer.py \
            run231_performance_telemetry.py \
            publication_contract.py \
            note_ready_sync.py \
            run194_publication_contract.py \
            run194_note_current_contract.py \
            reader_value_review_bridge.py \
            daily_portfolio_review.py \
            run175_semantic_fact_precision.py \
            run176_scope_fidelity.py \
            repository_falsification_guard.py
      - name: Run repository-wide falsification guard
        run: python repository_falsification_guard.py
      - name: Validate manual production workflow safety surface
        run: |
          grep -F 'workflow_dispatch:' .github/workflows/daily-one-shot.yml
          grep -F "inputs.confirm == 'RUN_ONCE'" .github/workflows/daily-one-shot.yml
          grep -F -- '- article_validation' .github/workflows/daily-one-shot.yml
          grep -F "inputs.mode == 'full'" .github/workflows/daily-one-shot.yml
          grep -F 'ref: main' .github/workflows/daily-one-shot.yml
          ! grep -Eq '^[[:space:]]+(push|schedule):' .github/workflows/daily-one-shot.yml
          grep -F 'if: $' .github/workflows/daily.yml | grep -F '{{ false }}'
          ! grep -Eq '^[[:space:]]+schedule:' .github/workflows/daily.yml
      - name: Validate current-stack real regression workflow
        run: |
          grep -F 'article_set:' .github/workflows/regression-test.yml
          grep -F -- '- fresh' .github/workflows/regression-test.yml
          grep -F 'permissions:' .github/workflows/regression-test.yml
          grep -F 'contents: read' .github/workflows/regression-test.yml
          grep -F 'run: python production_pipeline.py' .github/workflows/regression-test.yml
          ! grep -F 'run: python reader_value_review_bridge.py' .github/workflows/regression-test.yml
      - name: Run Run231 modularization falsification
        run: |
          python -m unittest tests.test_run231_pipeline_slim -v
          python -m unittest tests.test_run231_stage2_legacy_eyecatch_module -v
          python -m unittest tests.test_run233_ci_collection_integrity -v
      - name: Run article quality reconciliation tests
        run: |
          python -m unittest discover -s tests -p 'test_run130_fresh_article_regression_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_run131_reader_proximity_information_budget.py' -v
          python -m unittest discover -s tests -p 'test_run132_warm_rewrite_budget.py' -v
          python -m unittest discover -s tests -p 'test_run133_reader_first_editorial_compression.py' -v
          python -m unittest discover -s tests -p 'test_run136_reader_value_priority.py' -v
          python -m unittest discover -s tests -p 'test_run137_human_voice.py' -v
          python -m unittest discover -s tests -p 'test_run138_source_note_direction.py' -v
          python -m unittest discover -s tests -p 'test_run140_reader_delight_priority.py' -v
          python -m unittest discover -s tests -p 'test_run142_narrative_understanding.py' -v
          python -m unittest discover -s tests -p 'test_run144_reader_delight_balance.py' -v
          python -m unittest discover -s tests -p 'test_run145_real_article_closure.py' -v
          python -m unittest discover -s tests -p 'test_run147_rescue_loss_precision.py' -v
          python -m unittest discover -s tests -p 'test_run169_reader_value_review_bridge.py' -v
      - name: Run Run134 reconciliation tests
        run: |
          python -m unittest discover -s tests -p 'test_run134_revenue_product_value.py' -v
          python -m unittest discover -s tests -p 'test_run134_paid_product_value_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_run134_monthly_decision_brief_reconciliation.py' -v
      - name: Run adjacent product and context regressions
        run: |
          python -m unittest discover -s tests -p 'test_revenue_product_phase2.py' -v
          python -m unittest discover -s tests -p 'test_inventory_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_run131_profit_aligned_portfolio.py' -v
          python -m unittest discover -s tests -p 'test_run132_context_first_decision_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_decision_intelligence.py' -v
      - name: Run full pytest regression
        shell: bash
        run: |
          set +e
          python -m pytest -q tests > full-pytest.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- full pytest failure tail ---'
            tail -n 240 full-pytest.log
            exit "$status"
          fi
          tail -n 30 full-pytest.log
      - name: Run synthetic smoke through current production stack
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python production_pipeline.py
      - name: Export exact pipeline source for Stage2 surgical inspection
        uses: actions/upload-artifact@v4
        with:
          name: run231-stage2-pipeline-source
          path: pipeline.py
          retention-days: 1
