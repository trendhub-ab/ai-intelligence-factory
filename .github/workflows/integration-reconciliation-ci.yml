name: Integration Reconciliation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'subscription_attribution.py'
      - 'inventory_bootstrap.py'
      - 'decision_intelligence.py'
      - 'pipeline.py'
      - 'tests/**'
      - 'tools/reconcile_run134_paid_product_value.py'
      - '.github/workflows/integration-reconciliation-ci.yml'
  workflow_dispatch:

# TEMPORARY reconciliation permission. Returned to read-only immediately after
# the validated Run134 production-file commit lands on the integration branch.
permissions:
  contents: write

jobs:
  zero-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Run134 paid-product diagnostic patch if absent
        run: |
          if grep -q '^def paid_product_utility' inventory_bootstrap.py; then
            echo 'Run134 paid-product diagnostics already present.'
          else
            python tools/reconcile_run134_paid_product_value.py
          fi
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile core modules
        run: |
          python -m compileall -q \
            subscription_attribution.py \
            inventory_bootstrap.py \
            decision_intelligence.py \
            pipeline.py
      - name: Run current reconciliation cohort
        run: |
          python -m unittest discover -s tests -p 'test_run134_revenue_product_value.py' -v
          python -m unittest discover -s tests -p 'test_run134_paid_product_value_reconciliation.py' -v
      - name: Run adjacent product regressions
        run: |
          python -m unittest discover -s tests -p 'test_revenue_product_phase2.py' -v
          python -m unittest discover -s tests -p 'test_inventory_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_run131_profit_aligned_portfolio.py' -v
          python -m unittest discover -s tests -p 'test_decision_intelligence.py' -v
      - name: Run full unittest regression
        run: |
          python -m unittest discover -s tests -v
      - name: Commit validated Run134 production change if needed
        run: |
          git add inventory_bootstrap.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No production change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile Run134 paid product value diagnostics'
          git push origin HEAD:integration/main-run147-reconciliation
