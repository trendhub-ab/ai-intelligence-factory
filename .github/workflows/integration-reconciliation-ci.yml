name: Integration Reconciliation CI
# Run263: deterministic, hermetic integration signal. Full pytest is the single regression authority;
# structural guards run before it, and Synthetic smoke validates the assembled current Production stack.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'subscription_attribution.py'
      - 'inventory_bootstrap.py'
      - 'decision_intelligence.py'
      - 'pipeline.py'
      - 'production_pipeline.py'
      - 'runtime_layers.py'
      - 'source_normalization.py'
      - 'evidence_context.py'
      - 'product_delivery_maintenance.py'
      - 'deep_dive_portfolio.py'
      - 'reader_experience_signals.py'
      - 'editorial_naturalness.py'
      - 'candidate_identity.py'
      - 'note_manuscript.py'
      - 'gate_reasoning.py'
      - 'screening_protocol.py'
      - 'source_roi_policy.py'
      - 'notion_payloads.py'
      - 'source_document_parsing.py'
      - 'deferred_queue_policy.py'
      - 'content_generation_protocol.py'
      - 'evidence_sufficiency.py'
      - 'product_review_protocol.py'
      - 'fact_validation_signals.py'
      - 'source_boundary_validation.py'
      - 'legacy_eyecatch_renderer.py'
      - 'publication_contract.py'
      - 'note_ready_sync.py'
      - 'note_draft_automation.py'
      - 'daily_portfolio_review.py'
      - 'run*.py'
      - 'reader_value_review_bridge.py'
      - 'repository_falsification_guard.py'
      - 'integration_stability_guard.py'
      - 'cross_db_contract_guard.py'
      - 'content_db_contract_guard.py'
      - 'evidence_db_contract_guard.py'
      - 'evidence_ledger.py'
      - 'member_presentation_sync.py'
      - 'member_presentation_identity.py'
      - 'provision_member_presentation_db.py'
      - 'notion_access_policy_guard.py'
      - 'notion_audit_views.json'
      - 'documentation_freshness_guard.py'
      - 'requirements.txt'
      - 'requirements-ci-constraints.txt'
      - '.github/workflows/daily.yml'
      - '.github/workflows/daily-one-shot.yml'
      - '.github/workflows/regression-test.yml'
      - '.github/workflows/note-ready-sync.yml'
      - '.github/workflows/note-create-draft.yml'
      - '.github/workflows/member-presentation-sync.yml'
      - '.github/workflows/subscriber-decision-brief.yml'
      - '.github/workflows/cross-db-contract-guard.yml'
      - 'tests/**'
      - '.github/workflows/integration-reconciliation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-api-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Integration must never consult the repository-backed Production Gemini counter.
      GEMINI_PERSISTENT_DAILY_COUNTER: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install locked test environment
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check

      - name: Compile current Python surfaces
        run: python -m compileall -q *.py tests

      - name: Enforce Integration hermeticity and stability contract
        run: python integration_stability_guard.py

      - name: Run repository-wide falsification guard
        run: python repository_falsification_guard.py

      - name: Run full deterministic regression once
        run: python -m pytest -q tests

      - name: Run synthetic smoke through current Production stack
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python production_pipeline.py
