name: Run231 Stage2B Compatibility Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run231-stage2-surgical-migration.yml'

permissions:
  contents: write

jobs:
  restore-direct-pipeline-compatibility:
    if: github.head_ref == 'run231-stage2-pipeline-modularization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore extracted legacy API as a thin compatibility surface
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import pathlib
          import py_compile

          path = pathlib.Path('pipeline.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          removed_defs = {
              '_load_eyecatch_background',
              '_extract_eyecatch_score_components',
              '_eyecatch_score_color',
              '_eyecatch_vertical_center_shift',
              '_draw_eyecatch_text_stack_centered',
              '_eyecatch_centered_pair_boxes',
              'generate_eyecatch_image',
          }
          top_defs = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          leaked = sorted(removed_defs & top_defs)
          if leaked:
              raise SystemExit(
                  'Run231 compatibility repair fail-closed: extracted definitions unexpectedly '
                  f'returned to pipeline.py: {leaked}'
              )

          editorial_import = any(
              isinstance(node, ast.ImportFrom)
              and node.module == 'editorial_eyecatch'
              and any(alias.name == 'generate_note_editorial_eyecatch' for alias in node.names)
              for node in tree.body
          )
          if not editorial_import:
              raise SystemExit(
                  'Run231 compatibility repair fail-closed: live editorial renderer import missing'
              )

          marker = '# Run231 Stage2B direct-import compatibility bridge'
          bridge = (
              f'{marker}\n'
              '# Keep the extracted implementation out of pipeline.py while preserving the historical\n'
              '# ``import pipeline`` API used by zero-API regressions and internal callers. The installer\n'
              '# is provider/persistence-free and idempotent; production_pipeline may safely call it again.\n'
              'from legacy_eyecatch_renderer import install as _install_legacy_eyecatch_renderer\n'
              '_install_legacy_eyecatch_renderer(sys.modules[__name__])\n'
              'del _install_legacy_eyecatch_renderer\n\n\n'
          )
          anchor = 'if __name__ == "__main__":\n    main()'

          if marker not in source:
              if source.count(anchor) != 1:
                  raise SystemExit(
                      'Run231 compatibility repair fail-closed: main guard anchor count='
                      f'{source.count(anchor)}'
                  )
              source = source.replace(anchor, bridge + anchor, 1)
              path.write_text(source, encoding='utf-8')
          elif source.count(marker) != 1:
              raise SystemExit(
                  'Run231 compatibility repair fail-closed: compatibility marker duplicated'
              )

          py_compile.compile(str(path), doraise=True)

          repaired = path.read_text(encoding='utf-8')
          repaired_tree = ast.parse(repaired)
          repaired_defs = {
              node.name
              for node in repaired_tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          leaked_after = sorted(removed_defs & repaired_defs)
          if leaked_after:
              raise SystemExit(
                  'Run231 compatibility repair fail-closed: legacy implementation leaked back in: '
                  f'{leaked_after}'
              )
          if repaired.count(marker) != 1:
              raise SystemExit('Run231 compatibility repair fail-closed: bridge missing/duplicated')
          if 'from legacy_eyecatch_renderer import install as _install_legacy_eyecatch_renderer' not in repaired:
              raise SystemExit('Run231 compatibility repair fail-closed: installer import missing')
          print('Run231 Stage2B direct-import compatibility bridge verified')
          PY

      - name: Verify surgical diff
        shell: bash
        run: |
          git diff --check -- pipeline.py
          changed="$(git -c core.quotePath=false diff --name-only | sort)"
          test "$changed" = 'pipeline.py'

      - name: Commit compatibility repair to PR head
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Compatibility bridge already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py
          git commit -m 'Run231 Stage2B: restore direct pipeline compatibility'
          git push origin HEAD:${{ github.head_ref }}
