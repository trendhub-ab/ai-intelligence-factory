name: Reconcile exact hand-edited note LP

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RECONCILE_PUBLIC_LP_NED673E381EF8_SHA3E356937'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-public-lp-reconcile-ned673e381ef8
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal preflight dependency
        run: pip install requests
      - name: Falsify exact-state minimal reconciler
        run: python -m unittest tests.test_run313_public_lp_minimal_reconcile -v
      - name: Validate exact audited-state authorization
        id: auth
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != 'RECONCILE_PUBLIC_LP_NED673E381EF8_SHA3E356937' ]; then
            echo '::error::Run313 refuses any non-exact fixed-LP reconciliation token.'
            exit 1
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable: ${name}"
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  reconcile-public-lp:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact-state reconciliation regression
        run: python -m unittest tests.test_run313_public_lp_minimal_reconcile -v
      - name: Apply two exact corrections and verify public LP
        env:
          NOTE_PUBLIC_LP_RECONCILE_CONFIRM: ${{ inputs.confirm }}
          NOTE_PUBLIC_LP_RECONCILE_RESULT_FILE: ${{ runner.temp }}/run313-public-lp-reconcile.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run313_public_lp_minimal_reconcile.py
      - name: Summarize verified result
        env:
          RESULT_FILE: ${{ runner.temp }}/run313-public-lp-reconcile.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if result.get('status') not in {'reconciled_and_verified', 'already_reconciled'}:
              raise SystemExit('Run313 did not reach a verified terminal state')
          if result.get('membership_link_verified') is not True:
              raise SystemExit('Run313 CTA verification failed')
          if result.get('pc_first_copy_verified') is not True:
              raise SystemExit('Run313 PC-first copy verification failed')
          if result.get('malformed_prefix_removed') is not True:
              raise SystemExit('Run313 malformed-prefix verification failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run313 exact hand-edited LP reconciliation\n')
              fh.write(f'- target: `{result.get("target_note_id")}`\n')
              fh.write(f'- status: `{result.get("status")}`\n')
              fh.write(f'- public mutation: `{result.get("public_mutation") is True}`\n')
              fh.write(f'- malformed prefix removed: `{result.get("malformed_prefix_removed") is True}`\n')
              fh.write(f'- PC-first wording verified: `{result.get("pc_first_copy_verified") is True}`\n')
              fh.write(f'- membership CTA verified: `{result.get("membership_link_verified") is True}`\n')
              fh.write('- zero Gemini calls: `true`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, reconcile-public-lp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
