name: P0-A History Cleanup Verify

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-history-cleanup-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_PERSISTENT_DAILY_COUNTER: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'
      - name: Install locked test environment
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check
      - name: Verify stable identity contract
        run: python -m pytest -q tests/test_p0a_stable_draft_identity.py
      - name: Compile current Python surfaces
        run: python -m compileall -q *.py tests
      - name: Enforce hermeticity and stability contract
        run: python integration_stability_guard.py
      - name: Run production safety tests hermetically
        run: python -m pytest -q tests
      - name: Run harness self-test
        run: python regression_suite.py --self-test
      - name: Run synthetic regression suite
        run: python regression_suite.py --bootstrap --smoke
