name: X Defense Factory Stock Once

on:
  push:
    branches: ['validation/defense-stock-once-20260911']
    paths: ['.github/workflows/x-stock-once.yml']

permissions:
  contents: read

concurrency:
  group: aiif-notion-stock-write
  cancel-in-progress: false

jobs:
  stock-once:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify the bounded Stock contract offline
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          GH_PAT: ''
          NOTION_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python -m unittest discover -s tests -p 'test_x_stock_once.py' -v
      - name: Save the observed Final as one Stock record
        env:
          AIIF_ONE_SHOT_MODE: x_saved_candidate_stock_once
          AIIF_X_STOCK_OPERATION: defense-factory-stock-20260911
          AIIF_X_SAVED_CANDIDATE_PATH: x_discovery/fixtures/defense_factory_boundary_20260911.json
          AIIF_X_CALIBRATION_OBSERVATION_PATH: x_discovery/observations/defense_factory_calibration_20260911.json
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_COUNTER_BRANCH: runtime-state
          AIIF_RUNTIME_STATE_BRANCH: runtime-state
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: |
          set -o pipefail
          python -u production_pipeline.py 2>&1 | tee stock-once.log
      - name: Preserve the write result without retrying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defense-factory-stock-once
          path: stock-once.log
          if-no-files-found: ignore
