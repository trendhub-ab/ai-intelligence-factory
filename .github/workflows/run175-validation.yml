name: Run175 Validation

on:
  push:
    branches:
      - run175-semantic-fact-precision

permissions:
  contents: read

concurrency:
  group: run175-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Run175 falsification tests
        run: python -m unittest tests.test_run175_semantic_fact_precision -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Run regression harness self-test
        run: python regression_suite.py --self-test
        env:
          SYNTHETIC_REGRESSION_MODE: "true"
      - name: Run full synthetic regression
        run: python regression_suite.py --bootstrap --full
        env:
          SYNTHETIC_REGRESSION_MODE: "true"
