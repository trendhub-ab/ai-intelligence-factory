name: Groq Credential Check
on:
  push:
    branches: ['dev/groq-provider-foundation']
    paths: ['.github/workflows/groq-credential-check.yml']
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Groq key and model access without generation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("GROQ_API_KEY", "").strip()
          if not key:
              print("GROQ_CREDENTIAL_CHECK=FAIL reason=secret_missing generation_calls=0")
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization": "Bearer " + key, "User-Agent": "AI-Intelligence-Factory/1.0", "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.build_opener(NoRedirect()).open(req, timeout=30) as response:
                  payload = json.load(response)
              found = any(row.get("id") == "openai/gpt-oss-120b" for row in payload.get("data", []))
              if not found:
                  print("GROQ_CREDENTIAL_CHECK=FAIL reason=model_not_listed generation_calls=0")
                  sys.exit(1)
              print("GROQ_CREDENTIAL_CHECK=PASS secret_present=true model=openai/gpt-oss-120b generation_calls=0")
          except urllib.error.HTTPError as exc:
              print("GROQ_CREDENTIAL_CHECK=FAIL http_status=" + str(exc.code) + " generation_calls=0")
              sys.exit(1)
          except Exception:
              print("GROQ_CREDENTIAL_CHECK=FAIL reason=transport_or_response_error generation_calls=0")
              sys.exit(1)
