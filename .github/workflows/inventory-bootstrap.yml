name: Subscriber Inventory Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan=0 API/read-only, apply=Product Review only"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      target_inventory:
        description: "Stretch target; never force-promotes records"
        required: true
        default: "30"
      min_sellable:
        description: "Launch-readiness minimum"
        required: true
        default: "24"
      max_reviews:
        description: "Max Evidence-ready Gemini reviews in one apply (1-6)"
        required: true
        default: "4"
      product_request_budget:
        description: "Product Review Gemini local budget (1-9)"
        required: true
        default: "6"
      max_source_share:
        description: "Planning cap for one discovery source (0.10-1.00)"
        required: true
        default: "0.60"
      confirm:
        description: "apply only: type CONFIRM_BOOTSTRAP"
        required: false
        default: ""

permissions:
  contents: read

# Daily / Real Regressionと同じ永続Gemini予算ロックを共有する。
# Bootstrapを同時実行してFree Tier counterを競合更新させない。
concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bootstrap planner / accelerator
        env:
          TZ: Asia/Tokyo
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: "20"
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2026-03-11"
          GEMINI_PERSISTENT_DAILY_COUNTER: "true"
          GEMINI_PERSISTENT_COUNTER_PATH: ".runtime/gemini_daily_usage.json"
          GEMINI_COUNTER_BRANCH: "main"
          GEMINI_QUOTA_TIMEZONE: "America/Los_Angeles"
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_36_FLASH_DAILY_BUDGET: "18"
          GEMINI_37_FLASH_DAILY_BUDGET: "18"
          GEMINI_35_FLASH_DAILY_BUDGET: "18"
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "plan" ]; then
            python inventory_bootstrap.py plan \
              --target "${{ inputs.target_inventory }}" \
              --min-sellable "${{ inputs.min_sellable }}"
          else
            python inventory_bootstrap.py apply \
              --target "${{ inputs.target_inventory }}" \
              --min-sellable "${{ inputs.min_sellable }}" \
              --max-reviews "${{ inputs.max_reviews }}" \
              --product-request-budget "${{ inputs.product_request_budget }}" \
              --max-source-share "${{ inputs.max_source_share }}" \
              --confirm "${{ inputs.confirm }}"
          fi

      # Persistent Gemini counterは既存pipelineのContents API transactionを唯一の権威とする。
      # Bootstrap側では二重永続化やrebase競合を作る独自のGit書込みを行わない。
      - name: Upload bootstrap audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subscriber-inventory-bootstrap-${{ github.run_id }}
          path: inventory_bootstrap_artifacts/
          if-no-files-found: warn
          retention-days: 30
