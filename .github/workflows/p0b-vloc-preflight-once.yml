name: P0-B Offline Trigger Coverage RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B trigger test head
        uses: actions/checkout@v6
        with:
          ref: 01cf59d5d9af383521a6187c673dff9b5d3830ba

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run offline trigger coverage test expecting RED
        run: python -m pytest tests/test_p0b_production_installation.py -q
