name: P0-B Workflow Ledger Gate GREEN [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  green-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B implementation head
        uses: actions/checkout@v6
        with:
          ref: c72544bfa1bb22b96377058b8ed0a9f147c67cbf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run ledger and workflow tests expecting GREEN
        run: |
          python -m pytest tests/test_note_delivery_ledger.py -q
          python -m pytest tests/test_p0b_production_installation.py -q
