name: P0-B Private Identity GREEN [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  green-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact privacy-fix head
        uses: actions/checkout@v6
        with:
          ref: 332b2a34a132e47114ee9f52fc93998e307ff2e9

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run production installation tests expecting privacy GREEN
        run: python -m pytest tests/test_p0b_production_installation.py -q
