name: P0-B CREATION_UNKNOWN Recovery Gate Diagnostic [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  start-cloud-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Verify immutable repository gates
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = '6f2c7b308ae2d49c4f34092dfbd682221d2bf040'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/design/p0-b-durable-delivery-ledger" --jq '.commit.sha')" = 'c2aa1e625c08cc19eaa5fa8ad0da8ee8ce0a2649'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/716" --jq '.draft')" = 'true'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/716" --jq '.merged')" = 'false'

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start persistent note VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo 'Persistent note VM started for read-only recovery gate diagnostic.'

  recovery-diagnostic:
    needs: start-cloud-vm
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout exact P0-B head
        uses: actions/checkout@v6
        with:
          ref: c2aa1e625c08cc19eaa5fa8ad0da8ee8ce0a2649

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install read-only diagnostic dependencies
        run: |
          python -m pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1
          command -v xvfb-run >/dev/null 2>&1

      - name: Count each read-only recovery gate without exposing private identity
        env:
          PREFLIGHT_RESULT_FILE: ${{ runner.temp }}/p0b_recovery_diag_preflight.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          NOTE_DRAFT_CONFIRM='CREATE_NOTE_DRAFT' NOTE_TARGET_SYNC_ID='' NOTE_DRAFT_RESULT_FILE="$PREFLIGHT_RESULT_FILE" python run199_note_vm_preflight.py >/dev/null
          selected="$(python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['PREFLIGHT_RESULT_FILE']).read_text(encoding='utf-8'))
          selected = str(data.get('selected_sync_id') or '').strip()
          if str(data.get('status') or '') != 'eligible_ready' or len(selected) != 32:
              raise SystemExit('eligible recovery target unavailable')
          print(selected)
          PY
          )"
          NOTE_TARGET_SYNC_ID="$selected" NOTE_TARGET_IDENTITY='trendhub_biz' NOTE_DELIVERY_LEDGER_PATH='~/.aiif-note/delivery-ledger-v1.sqlite3' xvfb-run -a python - <<'PY'
          import json, os
          from pathlib import Path

          import note_delivery_creation_recovery as recovery
          import run187_note_editor_readiness as editor_readiness
          import run190_note_persistent_cloud as cloud
          import run291_note_private_draft_audit as draft_audit
          from note_delivery_ledger import SQLiteDeliveryLedger
          from playwright.sync_api import sync_playwright

          sync_id = os.environ['NOTE_TARGET_SYNC_ID'].strip()
          note_target = os.environ['NOTE_TARGET_IDENTITY'].strip()
          ledger = SQLiteDeliveryLedger(Path(os.environ['NOTE_DELIVERY_LEDGER_PATH']).expanduser())
          record = recovery.require_creation_unknown_record(ledger, sync_id=sync_id, note_target=note_target)
          prepared = recovery._expected_prepared_delivery(record)
          article = dict(prepared.article)
          candidates = cloud._recent_private_edit_urls(cloud._profile_dir())

          counts = {
              'history_candidate_count': int(len(candidates)),
              'navigation_success_count': 0,
              'authenticated_count': 0,
              'private_editor_count': 0,
              'title_match_count': 0,
              'run291_match_count': 0,
              'canonical_read_count': 0,
              'canonical_exact_match_count': 0,
          }

          with sync_playwright() as playwright:
              context = cloud._launch_persistent_context(playwright)
              page = context.new_page()
              page.set_default_timeout(30000)
              seeded = False
              try:
                  for candidate in candidates:
                      try:
                          page.goto(candidate, wait_until='domcontentloaded', timeout=60000)
                          page.wait_for_timeout(1200)
                          counts['navigation_success_count'] += 1
                          if draft_audit.note_base._looks_logged_out(page) and not seeded:
                              seeded = bool(cloud._seed_note_state(context, page))
                              if seeded:
                                  page.goto(candidate, wait_until='domcontentloaded', timeout=60000)
                                  page.wait_for_timeout(1200)
                          if draft_audit.note_base._looks_logged_out(page):
                              continue
                          counts['authenticated_count'] += 1
                          if not editor_readiness._is_editor_url(str(page.url or '')):
                              continue
                          counts['private_editor_count'] += 1
                          if draft_audit._title_value(page) != str(article['title']).strip():
                              continue
                          counts['title_match_count'] += 1
                          try:
                              draft_audit._audit_current_page(page, str(article['title']), str(article['manuscript']))
                          except draft_audit.PrivateDraftAuditError:
                              continue
                          counts['run291_match_count'] += 1
                          try:
                              canonical_sha = recovery._current_canonical_sha256(page)
                          except recovery.CreationRecoveryAuditError:
                              continue
                          counts['canonical_read_count'] += 1
                          if canonical_sha == record.snapshot.canonical_document_sha256:
                              counts['canonical_exact_match_count'] += 1
                      except Exception:
                          continue
              finally:
                  context.close()

          safe = {
              'status': 'recovery_gate_diagnostic',
              **counts,
              'immutable_snapshot_match': True,
              'zero_gemini_calls': True,
              'ledger_mutation': False,
              'notion_mutation': False,
              'note_mutation': False,
              'public_release': False,
          }
          print(json.dumps(safe, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### P0-B recovery gate diagnostic\n')
              for key, value in safe.items():
                  fh.write(f'- {key}: `{value}`\n')
          PY
          rm -f "$PREFLIGHT_RESULT_FILE"

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [start-cloud-vm, recovery-diagnostic]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo 'Persistent note VM stop check completed.'
