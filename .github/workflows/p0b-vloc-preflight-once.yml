name: P0-B Member Classification RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B classification test head
        uses: actions/checkout@v6
        with:
          ref: e0098523b80b86f9654b263a17fab5753a57c11b

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run classification test expecting RED
        run: python -m pytest tests/test_p0b_member_surface_classification.py -q
