name: P0-B Ledger Gate RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B test head
        uses: actions/checkout@v6
        with:
          ref: cc2ec30834934dd4c552553682a1209e0c45d6e5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run ledger tests expecting new gate test to fail
        run: python -m pytest tests/test_note_delivery_ledger.py -q
