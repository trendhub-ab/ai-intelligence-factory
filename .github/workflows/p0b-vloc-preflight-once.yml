name: P0-B Privacy Contract Regression [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B head
        uses: actions/checkout@v6
        with:
          ref: 7acc021cf810f8f1047e53c41b09e43405ec3641

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Verify updated workflow contracts
        run: |
          python -m pytest \
            tests/test_p0b_production_installation.py \
            tests/test_run190_note_cloud_workflow.py \
            tests/test_run273_reader_draft_autoflow.py -q
