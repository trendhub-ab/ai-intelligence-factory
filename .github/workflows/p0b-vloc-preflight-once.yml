name: P0-B Recovery CI Path GREEN [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  green-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B CI-path head
        uses: actions/checkout@v6
        with:
          ref: 6761160577042b5ad9e7b3afda44e2781f50ceab

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run P0-B installation test expecting GREEN
        run: python -m pytest tests/test_p0b_production_installation.py -q
