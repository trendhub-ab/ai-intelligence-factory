name: P0-B Private Identity RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact privacy-test head
        uses: actions/checkout@v6
        with:
          ref: 2f1b2ffaeac0f25c2fef427d4af637d1ada1f616

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run production installation tests expecting privacy RED
        run: python -m pytest tests/test_p0b_production_installation.py -q
