name: P0-B Ledger Gate GREEN [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  green-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B implementation head
        uses: actions/checkout@v6
        with:
          ref: 87966db3b5388510f5f181c4a30efaced0b5510e

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run ledger tests expecting GREEN
        run: python -m pytest tests/test_note_delivery_ledger.py -q
