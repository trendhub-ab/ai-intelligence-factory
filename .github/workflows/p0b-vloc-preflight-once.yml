name: P0-B Member Classification GREEN [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  green-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B classification head
        uses: actions/checkout@v6
        with:
          ref: 5738a21100eb146c8a955347386c1f434837e246

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run classification and member coverage tests expecting GREEN
        run: |
          python -m pytest tests/test_p0b_member_surface_classification.py -q
          python -m pytest tests/test_member_customer_surface_contract.py -q
          python member_surface_coverage_guard.py
