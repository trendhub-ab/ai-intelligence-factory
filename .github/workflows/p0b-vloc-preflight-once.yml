name: P0-B Workflow Ledger Gate RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B workflow test head
        uses: actions/checkout@v6
        with:
          ref: fccbea49006c8db926b8f860f88711c0e81a12fc

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest requests

      - name: Run workflow installation test expecting RED
        run: python -m pytest tests/test_p0b_production_installation.py -q
