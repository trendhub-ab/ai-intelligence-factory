name: P0-B Recovery Full Regression [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact P0-B recovery head
        uses: actions/checkout@v6
        with:
          ref: 528487d42144909683ffc2ec56241ae4bd546e87
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright

      - name: Full repository pytest
        run: python -m pytest tests -q

      - name: Repository guards
        run: |
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD
