name: P0-B CREATION_UNKNOWN Recovery GREEN [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  green-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B recovery implementation head
        uses: actions/checkout@v6
        with:
          ref: 528487d42144909683ffc2ec56241ae4bd546e87

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run recovery tests expecting GREEN
        run: python -m pytest tests/test_p0b_creation_unknown_recovery_audit.py -q
