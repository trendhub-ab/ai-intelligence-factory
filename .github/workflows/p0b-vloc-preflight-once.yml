name: P0-B CREATION_UNKNOWN Recovery RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B recovery test head
        uses: actions/checkout@v6
        with:
          ref: ccc7d9d97c3a0be2f242723271be396ac86b468d

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run recovery tests expecting RED
        run: python -m pytest tests/test_p0b_creation_unknown_recovery_audit.py -q
