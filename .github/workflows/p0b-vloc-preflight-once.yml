name: P0-B Recovery CI Path RED [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-vloc-preflight-20261004
    paths:
      - .github/workflows/p0b-vloc-preflight-once.yml

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0-B CI-path test head
        uses: actions/checkout@v6
        with:
          ref: e6a3c941df540606f6f0548622da49ad1a2625bf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run P0-B installation test expecting RED
        run: python -m pytest tests/test_p0b_production_installation.py -q
