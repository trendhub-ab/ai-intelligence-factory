name: P0-B Queue Sync [OPS ONE-SHOT]
# attempt: exact-ready-to-posting-wait-v2

on:
  push:
    branches:
      - ops/p0b-eyecatch-fallback-20261004
    paths:
      - .github/workflows/p0b-eyecatch-fallback-once.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: '6f2c7b308ae2d49c4f34092dfbd682221d2bf040'
      TARGET_ARTICLE_TITLE: 'Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Verify main source of truth
        run: |
          set -euo pipefail
          actual="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')"
          test "$actual" = "$EXPECTED_MAIN_SHA"

      - name: Resolve exactly one Ready source with persisted eyecatch
        id: resolve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          token = os.environ['NOTION_API_KEY'].strip()
          ds = os.environ['NOTION_DATA_SOURCE_ID'].strip()
          title = os.environ['TARGET_ARTICLE_TITLE']
          payload = {'page_size': 10, 'filter': {'and': [
              {'property': '記事名', 'title': {'equals': title}},
              {'property': '記事状態', 'select': {'equals': 'Ready'}},
          ]}}
          req = urllib.request.Request(
              f'https://api.notion.com/v1/data_sources/{ds}/query',
              data=json.dumps(payload).encode(), method='POST',
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json',
                       'Notion-Version': os.environ['NOTION_API_VERSION']})
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.load(r).get('results') or []
          if len(rows) != 1:
              raise SystemExit(f'Expected exactly one current Ready source, got {len(rows)}')
          row = rows[0]
          files = ((row.get('properties') or {}).get('アイキャッチ') or {}).get('files') or []
          if not files:
              raise SystemExit('Persisted eyecatch is required before queue sync')
          sync_id = re.sub(r'[^0-9a-fA-F]', '', str(row.get('id') or '')).lower()
          if not re.fullmatch(r'[0-9a-f]{32}', sync_id):
              raise SystemExit('Invalid resolved source identity')
          print(f'::add-mask::{sync_id}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'sync_id={sync_id}\n')
          PY

      - name: Dispatch exact queue sync with private-draft fan-out disabled
        env:
          TARGET_SYNC_ID: ${{ steps.resolve.outputs.sync_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test -n "${TARGET_SYNC_ID:-}"
          gh workflow run note-ready-sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f create_private_draft=false \
            -f target_sync_id="$TARGET_SYNC_ID" \
            -f target_source_url=''
          echo 'Exact note-ready-sync dispatched with create_private_draft=false.'
