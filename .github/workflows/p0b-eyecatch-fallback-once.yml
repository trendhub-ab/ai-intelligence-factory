name: P0-B Eyecatch Runtime Title GREEN [OPS ZERO-MUTATION]
# attempt: green-actual-runtime-title-v9

on:
  push:
    branches:
      - ops/p0b-eyecatch-fallback-20261004
    paths:
      - .github/workflows/p0b-eyecatch-fallback-once.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies and fonts
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y fonts-noto-cjk fonts-lato >/dev/null
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt >/dev/null
      - name: GREEN — actual runtime note title is supported
        run: python -m unittest tests.test_ops_p0b_eyecatch_bounded_compression -v
      - name: Verify zero-mutation provider-free contract
        run: |
          python - <<'PY'
          import ops_ready_eyecatch_finalize as ops
          assert ops.EXACT_SOURCE_TITLE.endswith('：いま何を判断材料にするべきか。')
          assert ops.COMPRESSED_EYECATCH_TITLE == 'Argo-Bench: Data Agents on Enterprise-Scale Workflows'
          assert ops.PROVIDER_MODE == 'provider_free_exact_source_compression'
          PY
