name: P0-B Eyecatch Fallback [OPS ONE-SHOT]
# attempt: green-provider-free-plan-v5

on:
  push:
    branches:
      - ops/p0b-eyecatch-fallback-20261004
    paths:
      - .github/workflows/p0b-eyecatch-fallback-once.yml

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_TITLE: 'Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
      GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
      GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
      GEMINI_COUNTER_BRANCH: 'main'
      EYECATCH_GITHUB_BRANCH: 'runtime-state'
      GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: GREEN — bounded provider-free eyecatch contract
        run: python -m unittest tests.test_ops_p0b_eyecatch_bounded_compression -v

      - name: Verify provider-free proof mode
        run: |
          python - <<'PY'
          import ops_ready_eyecatch_finalize as ops
          assert ops.PROVIDER_MODE == 'provider_free_exact_source_compression'
          assert ops.COMPRESSED_EYECATCH_TITLE == 'Argo-Bench: Data Agents on Enterprise-Scale Workflows'
          assert 'Evaluating' not in ops.COMPRESSED_EYECATCH_TITLE
          PY

      - name: Resolve exactly one current Ready article with no eyecatch
        if: ${{ false }}
        id: resolve
        run: echo 'GREEN-only run: mutation lane disabled'

      - name: Finalize exact Ready eyecatch provider-free
        if: ${{ false }}
        run: echo 'GREEN-only run: mutation lane disabled'

      - name: Verify zero-article and zero-note mutation result
        if: ${{ false }}
        run: echo 'GREEN-only run: mutation lane disabled'
