# Separate explicitly approved owner Issue, no implicit dispatch or publication.
# Only copies existing old GH_PAT once into Next's GitHub Secret via sealed-box API.
# Old V1 production remains disabled; no Gemini, GCP, Notion or note calls.
name: AIIF OnePath - Relay Existing Owner PAT to Private Next (Once)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: onepath-old-to-next-gh-pat-relay-once
  cancel-in-progress: false

jobs:
  onepath-owner-pat-relay:
    if: >-
      ${{ github.repository == 'trendhub-ab/ai-intelligence-factory' &&
          github.ref == 'refs/heads/main' &&
          github.event.repository.private == false &&
          github.event_name == 'issues' &&
          github.event.action == 'opened' &&
          github.actor == 'trendhub-ab' &&
          github.event.issue.user.login == 'trendhub-ab' &&
          github.event.issue.title == 'AIIF OLD: APPROVE ONEPATH RELAY EXISTING PAT TO NEXT' &&
          github.event.issue.body == 'OWNER_APPROVES_ENCRYPTED_EXISTING_GH_PAT_RELAY_V1' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned GitHub sealed-box crypto
        run: python -m pip install PyNaCl==1.5.0
      - name: Require owner Issue and transfer PAT encrypted without printing
        env:
          OLD_OWNER_PAT: ${{ secrets.GH_PAT }}
          OLD_OWNER_PAT_PRESENT: ${{ secrets.GH_PAT != '' }}
        run: |
          set -euo pipefail
          set +x
          PYTHONDONTWRITEBYTECODE=1 python -B onepath_relay_existing_pat_to_next.py
