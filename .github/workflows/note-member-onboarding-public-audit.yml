name: Audit public onboarding note logged out

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact Run326 logged-out public-audit token'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-member-onboarding-public-audit-n284e428c80f4
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify exact logged-out public audit
        run: python -m unittest tests.test_run326_member_onboarding_public_audit -v
      - name: Validate exact read-only authorization
        id: auth
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = 'AUDIT_PUBLIC_MEMBER_ONBOARDING_N284E428C80F4_SHAAAB9E57B_LOGGED_OUT' ] || exit 1
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  audit:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact Run326 regression
        run: python -m unittest tests.test_run326_member_onboarding_public_audit -v
      - name: Audit exact public article in fresh logged-out browser
        env:
          NOTE_MEMBER_ONBOARDING_PUBLIC_AUDIT_CONFIRM: ${{ inputs.confirm }}
          NOTE_MEMBER_ONBOARDING_PUBLIC_AUDIT_RESULT_FILE: ${{ runner.temp }}/run326-result.json
          NOTE_MEMBER_ONBOARDING_PUBLIC_AUDIT_SCREENSHOT_FILE: ${{ runner.temp }}/run326-public-logged-out.png
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run326_member_onboarding_public_audit.py
      - name: Enforce customer-facing postconditions
        env:
          RESULT_FILE: ${{ runner.temp }}/run326-result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if r.get('status') != 'logged_out_public_surface_verified':
              raise SystemExit('Run326 public audit did not verify')
          required = {
              'new_title_verified': True,
              'legacy_title_absent': True,
              'not_for_sale_absent': True,
              'members_only_gate_verified': True,
              'fresh_no_cookie_context': True,
              'public_mutation': False,
              'membership_mutation': False,
              'settings_mutation': False,
              'zero_gemini_calls': True,
          }
          for key, expected in required.items():
              if r.get(key) is not expected:
                  raise SystemExit(f'Run326 postcondition failed: {key}={r.get(key)!r}')
          if r.get('protected_body_markers_exposed'):
              raise SystemExit('Run326 protected member body leaked to logged-out visitor')
          if r.get('clicks_performed') != 0 or r.get('notion_writes') != 0:
              raise SystemExit('Run326 read-only/zero-Notion contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run326 logged-out public audit\n')
              fh.write(f'- HTTP status: `{r.get("http_status")}`\n')
              fh.write(f'- page title: `{r.get("page_title", "")}`\n')
              fh.write(f'- new title verified: `{r.get("new_title_verified") is True}`\n')
              fh.write(f'- legacy title absent: `{r.get("legacy_title_absent") is True}`\n')
              fh.write(f'- not-for-sale absent: `{r.get("not_for_sale_absent") is True}`\n')
              fh.write(f'- members-only gate verified: `{r.get("members_only_gate_verified") is True}`\n')
              fh.write(f'- gate markers: `{json.dumps(r.get("gate_markers_seen") or [], ensure_ascii=False)}`\n')
              fh.write('- logged-out context: `true`\n')
              fh.write('- clicks: `0`\n')
              fh.write('- public mutation: `false`\n')
              fh.write('- Gemini calls: `0`\n')
              fh.write('- Notion writes: `0`\n')
          PY
      - name: Preserve Run326 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run326-onboarding-public-audit
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/run326-result.json
            ${{ runner.temp }}/run326-public-logged-out.png

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
