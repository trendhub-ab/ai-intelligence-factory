name: P0-B Hosted-Only TDD

on:
  push:
    branches:
      - p0b-hosted-only-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run hosted-only runtime tests
        run: |
          python -m pytest \
            tests/test_p0b_hosted_only_protocol.py \
            tests/test_note_delivery_gcs.py \
            tests/test_p0b_hosted_runtime_factory.py \
            tests/test_note_delivery_ledger.py \
            tests/test_note_delivery_runtime.py -q
