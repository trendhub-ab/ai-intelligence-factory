name: Apply Run145 Real Article Closure

on:
  push:
    branches:
      - run129-conversational-warmth
    paths:
      - '.github/chat-triggers/apply-run145-real-article-closure.txt'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Run145 patch
        run: python tools/apply_run145_real_article_closure.py
      - name: Run dedicated Run145 tests
        run: python -m unittest tests.test_run145_real_article_closure -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Verify Gemini call sites unchanged
        run: |
          python - <<'PY'
          import pathlib
          s=pathlib.Path('pipeline.py').read_text(encoding='utf-8')
          assert s.count('_generate_via_chat(')==7
          assert s.count('genai.Client(')==1
          print('Gemini call sites unchanged')
          PY
      - name: Commit Run145 if tests pass
        run: |
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add pipeline.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: Run145 close real article defects'
          git push origin HEAD:run129-conversational-warmth
