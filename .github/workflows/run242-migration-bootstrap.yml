name: Run242 Migration Bootstrap

on:
  push:
    branches:
      - run242-notion-deferred-modularization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run242-notion-deferred-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=8,<9'
      - name: Guarded dry run
        run: python run242_notional_source_deferred_migration.py
      - name: Apply migration
        run: python run242_notional_source_deferred_migration.py --write
      - name: Compile migrated stack
        run: |
          python -m py_compile pipeline.py notion_payloads.py source_document_parsing.py deferred_queue_policy.py run242_notional_source_deferred_migration.py
      - name: Run Run242 dedicated falsification
        run: |
          python -m unittest tests.test_run242_notional_source_deferred_modules -v
          python -m unittest tests.test_run242_notional_source_deferred_integration -v
      - name: Run existing deferred and adjacent regressions
        run: |
          python -m unittest discover -s tests -p 'test_revenue_product_phase2.py' -v
          python -m unittest discover -s tests -p 'test_run132_context_first_decision_intelligence.py' -v
          python -m unittest tests.test_cross_db_contract_guard -v
      - name: Validate diff
        run: |
          git diff --check
          python run242_notional_source_deferred_migration.py
      - name: Commit migrated pipeline
        run: |
          if git diff --quiet -- pipeline.py; then
            echo 'pipeline already migrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py
          git commit -m 'Run242: wire canonical Notion source and deferred modules'
          git push origin HEAD:run242-notion-deferred-modularization
