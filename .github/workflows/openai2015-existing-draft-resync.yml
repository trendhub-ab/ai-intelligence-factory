name: Resync exact existing OpenAI 2015 note draft

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai2015-existing-draft-resync.yml'

permissions:
  contents: read
  issues: read

concurrency:
  group: openai2015-existing-note-draft-resync
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.run_attempt == 1 &&
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 71 &&
          github.event.issue.pull_request == null &&
          github.event.comment.user.login == 'trendhub-ab' &&
          github.actor == 'trendhub-ab' &&
          github.event.comment.body == '/aiif resync openai2015-existing-draft'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'trendhub-ab' &&
          github.event.head_commit.message == 'Trigger exact OpenAI 2015 note resync'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_start_vm: ${{ steps.decision.outputs.should_start_vm }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zero-browser dependency
        run: pip install requests

      - name: Compile exact-target maintenance script
        run: python -m py_compile run_openai2015_existing_draft_resync.py

      - name: Exact source and queue preflight
        env:
          OPENAI2015_RESYNC_CONFIRM: RESYNC_OPENAI2015_EXISTING_DRAFT
          OPENAI2015_RESYNC_PREPARE_ONLY: 'true'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run_openai2015_existing_draft_resync.py | tee "${RUNNER_TEMP}/openai2015-preflight.json"

      - name: Require fail-closed exact target
        id: decision
        env:
          RESULT_FILE: ${{ runner.temp }}/openai2015-preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8").splitlines()[-1])
          required = {
              "status": "resync_ready",
              "sync_id": "3e8479ffdca9812e9661f337a84b1df4",
              "zero_gemini_calls": True,
              "new_draft_created": False,
              "public_release": False,
              "eyecatch_unchanged": True,
              "posting_state_preserved": "投稿準備中",
          }
          for key, expected in required.items():
              if result.get(key) != expected:
                  raise SystemExit(f"unsafe OpenAI 2015 resync preflight: {key}={result.get(key)!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("should_start_vm=true\n")
          PY

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.should_start_vm == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  resync-existing-draft:
    if: ${{ needs.preflight.outputs.should_start_vm == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || {
            echo "::error::Google Chrome is not installed on the persistent note VM."
            exit 1
          }
          command -v xvfb-run >/dev/null 2>&1 || {
            echo "::error::xvfb-run is not installed on the persistent note VM."
            exit 1
          }

      - name: Recompile exact-target maintenance script
        run: python -m py_compile run_openai2015_existing_draft_resync.py

      - name: Resync exact existing private draft
        env:
          OPENAI2015_RESYNC_CONFIRM: RESYNC_OPENAI2015_EXISTING_DRAFT
          OPENAI2015_RESYNC_PREPARE_ONLY: 'false'
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: xvfb-run -a python run_openai2015_existing_draft_resync.py | tee "${RUNNER_TEMP}/openai2015-resync.json"

      - name: Verify same-route resync result
        env:
          RESULT_FILE: ${{ runner.temp }}/openai2015-resync.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8").splitlines()[-1])
          required_true = (
              "same_edit_route",
              "title_match",
              "body_verified",
              "eyecatch_unchanged",
              "zero_gemini_calls",
          )
          if result.get("status") != "existing_draft_resynced":
              raise SystemExit("OpenAI 2015 existing draft was not resynced")
          for key in required_true:
              if result.get(key) is not True:
                  raise SystemExit(f"OpenAI 2015 invariant failed: {key}")
          if result.get("new_draft_created") is not False or result.get("public_release") is not False:
              raise SystemExit("OpenAI 2015 resync crossed the draft/publication boundary")
          if result.get("quality_state_after_sync") != "Ready":
              raise SystemExit("OpenAI 2015 queue did not return to Ready")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### OpenAI 2015 existing private draft resync\n")
              fh.write("- same edit route: `true`\n")
              fh.write("- body persisted: `true`\n")
              fh.write("- eyecatch changed: `false`\n")
              fh.write("- new draft created: `false`\n")
              fh.write("- public release: `false`\n")
              fh.write("- Gemini/model calls: `0`\n")
              fh.write(f"- route proof hash: `{result.get('editor_route_hash', '')}`\n")
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, resync-existing-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Stop persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
