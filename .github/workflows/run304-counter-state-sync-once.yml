name: Run304 Product Review Counter State Sync Once
# PR #200 exists; this synchronization commit intentionally triggers the one-shot patcher.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-run304:
    if: github.head_ref == 'run304-product-review-counter-state'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: run304-product-review-counter-state
          token: ${{ secrets.GH_PAT }}
      - name: Patch counter-state handoff, tests, docs, and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('daily_portfolio_review.py')
          s = p.read_text(encoding='utf-8')
          old = '''    env = os.environ.copy()\n    env.update(ib.product_only_environment(max_reviews, request_budget))\n    env["INVENTORY_BOOTSTRAP_ENTITY_IDS"] = ",".join(allowlist)\n'''
          new = '''    env = os.environ.copy()\n    env.update(ib.product_only_environment(max_reviews, request_budget))\n    runtime_state_branch = str(os.environ.get("AIIF_RUNTIME_STATE_BRANCH") or "").strip()\n    if runtime_state_branch:\n        # Run304: the product-only child is pipeline.py (not production_pipeline.py),\n        # so it does not install the runtime-state channel itself. Force the child\n        # counter reader onto the parent's authoritative runtime-state branch.\n        env["GEMINI_COUNTER_BRANCH"] = runtime_state_branch\n    env["INVENTORY_BOOTSTRAP_ENTITY_IDS"] = ",".join(allowlist)\n'''
          if old not in s:
              raise SystemExit('daily_portfolio_review patch anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          w = Path('.github/workflows/daily-one-shot.yml')
          y = w.read_text(encoding='utf-8')
          marker = "      - name: Portfolio-aware Product Review\n"
          if marker not in y:
              raise SystemExit('Product Review workflow step missing')
          before, after = y.split(marker, 1)
          step, tail = after.split("\n      - name: API-saving mode guard", 1)
          old_branch = '          GEMINI_COUNTER_BRANCH: "main"'
          if old_branch not in step:
              raise SystemExit('Product Review GEMINI_COUNTER_BRANCH=main anchor missing')
          step = step.replace(old_branch, '          GEMINI_COUNTER_BRANCH: "runtime-state"', 1)
          y = before + marker + step + "\n      - name: API-saving mode guard" + tail
          w.write_text(y, encoding='utf-8')

          test = r'''from __future__ import annotations

import os
import subprocess
from pathlib import Path
from types import SimpleNamespace
from unittest import mock

import daily_portfolio_review as dpr

ROOT = Path(__file__).resolve().parents[1]


def test_product_only_child_prefers_authoritative_runtime_state_branch():
    captured = {}
    def fake_run(*args, **kwargs):
        captured["env"] = dict(kwargs["env"])
        return SimpleNamespace(returncode=0, stdout="[PRODUCT REVIEW] observed\n", stderr="")
    with mock.patch.dict(os.environ, {"AIIF_RUNTIME_STATE_BRANCH": "runtime-state", "GEMINI_COUNTER_BRANCH": "main"}, clear=False), mock.patch.object(subprocess, "run", side_effect=fake_run):
        result = dpr._run_product_only(["entity:test"], 1, 1, timeout=1)
    assert result["returncode"] == 0
    assert captured["env"]["GEMINI_COUNTER_BRANCH"] == "runtime-state"


def test_product_only_child_preserves_explicit_counter_branch_without_runtime_overlay():
    captured = {}
    def fake_run(*args, **kwargs):
        captured["env"] = dict(kwargs["env"])
        return SimpleNamespace(returncode=0, stdout="[PRODUCT REVIEW] observed\n", stderr="")
    with mock.patch.dict(os.environ, {"GEMINI_COUNTER_BRANCH": "operator-branch"}, clear=False), mock.patch.object(subprocess, "run", side_effect=fake_run):
        os.environ.pop("AIIF_RUNTIME_STATE_BRANCH", None)
        dpr._run_product_only(["entity:test"], 1, 1, timeout=1)
    assert captured["env"]["GEMINI_COUNTER_BRANCH"] == "operator-branch"


def test_one_shot_product_review_pins_runtime_state_counter_branch():
    text = (ROOT / ".github/workflows/daily-one-shot.yml").read_text(encoding="utf-8")
    marker = "      - name: Portfolio-aware Product Review\n"
    assert marker in text
    step = text.split(marker, 1)[1].split("\n      - name: API-saving mode guard", 1)[0]
    assert 'GEMINI_COUNTER_BRANCH: "runtime-state"' in step
    assert 'GEMINI_COUNTER_BRANCH: "main"' not in step
'''
          Path('tests/test_run304_product_review_counter_state.py').write_text(test, encoding='utf-8')

          doc = '''# Run304 — Product Review Runtime-State Counter Handoff\n\nDate: 2026-09-09\n\n## Observed failure\n\nRun37 proved Run303 provider-503 recovery in live Production, but the separate Portfolio-aware Product Review child printed `Persistent Gemini Daily Counter(scope=3fc8d874): 0` while the immediately preceding Production process printed non-zero current counts. The ONE-SHOT Product Review step explicitly passed `GEMINI_COUNTER_BRANCH=main`; the authoritative counter had been persisted on `runtime-state`. Because the child executes `pipeline.py` directly, it does not install `production_pipeline.py` runtime-state overlays.\n\n## Fix\n\n- `daily_portfolio_review._run_product_only` hands `AIIF_RUNTIME_STATE_BRANCH` to the child as `GEMINI_COUNTER_BRANCH` when the runtime-state overlay is present.\n- `.github/workflows/daily-one-shot.yml` pins the Product Review step to `GEMINI_COUNTER_BRANCH=runtime-state` as defense in depth.\n- If no `AIIF_RUNTIME_STATE_BRANCH` exists, an operator-supplied `GEMINI_COUNTER_BRANCH` is preserved.\n- No quota ceiling, review budget, Evidence/Fact gate, publication policy, or scheduled-Daily state is changed.\n\n## Regression contract\n\n`tests/test_run304_product_review_counter_state.py` verifies dynamic child environment handoff, preservation of explicit non-overlay operation, and the static ONE-SHOT Product Review branch contract.\n'''
          Path('docs/reference/RUN304_PRODUCT_REVIEW_COUNTER_STATE.md').write_text(doc, encoding='utf-8')

          sp = Path('AI_Intelligence_Factory_最終仕様書.md')
          spec = sp.read_text(encoding='utf-8')
          baseline = 'Product Review Counter State Baseline: **Run304 — runtime-state handoff to product-only child**  \n'
          if baseline not in spec:
              anchor = 'Provider Resilience Baseline: **Run303 — Verified HTTP 503 confirmation / consecutive-only run-local circuit**  \n'
              if anchor not in spec:
                  raise SystemExit('Run303 canonical baseline anchor missing')
              spec = spec.replace(anchor, anchor + baseline, 1)
          run304 = '''\nRun304 Product Review counter-state handoff:\n\n- ONE-SHOTの別process Product Reviewは、親Productionと同じauthoritative `runtime-state` のGemini persistent counterを読む。\n- `daily_portfolio_review.py` のproduct-only childは `pipeline.py` を直接起動するため、`AIIF_RUNTIME_STATE_BRANCH` がある場合はそれを `GEMINI_COUNTER_BRANCH` として明示継承する。\n- ONE-SHOT Product Review stepも `GEMINI_COUNTER_BRANCH=runtime-state` を明示し、main上のstale counterを0件と誤認しない。\n- quota ceiling / Product Review request budget / Evidence・Fact・Publication Gateは変更しない。\n- 詳細は `docs/reference/RUN304_PRODUCT_REVIEW_COUNTER_STATE.md` を正本とする。\n'''
          if 'Run304 Product Review counter-state handoff:' not in spec:
              anchor = 'Run261 article model routing:\n'
              if anchor not in spec:
                  raise SystemExit('Gemini routing section anchor missing')
              spec = spec.replace(anchor, run304 + '\n' + anchor, 1)
          current = '**現在のProduct Review Counter State正本はRun304。**  \n'
          if current not in spec:
              anchor = '**現在のProvider Resilience正本はRun303。**  \n'
              if anchor not in spec:
                  raise SystemExit('Run303 current authority anchor missing')
              spec = spec.replace(anchor, anchor + current, 1)
          sp.write_text(spec, encoding='utf-8')

          Path('.github/workflows/run304-counter-state-sync-once.yml').unlink()
          PY

          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add daily_portfolio_review.py .github/workflows/daily-one-shot.yml tests/test_run304_product_review_counter_state.py docs/reference/RUN304_PRODUCT_REVIEW_COUNTER_STATE.md AI_Intelligence_Factory_最終仕様書.md .github/workflows/run304-counter-state-sync-once.yml
          git commit -m 'Run304: hand Product Review the authoritative runtime-state counter'
          git push origin HEAD:run304-product-review-counter-state
