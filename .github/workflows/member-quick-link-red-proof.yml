name: Member Quick Link RED Proof

on:
  push:
    branches:
      - ops/member-home-host-migration-proof
    paths:
      - .github/workflows/member-quick-link-red-proof.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Prove quick-link contract is RED before implementation
        run: python -m pytest tests/test_member_presentation_display_names.py -q
