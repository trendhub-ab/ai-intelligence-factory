name: P0-B Task 6 Candidate Diagnose [READ ONLY]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-candidate-diagnose.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      NOTE_DELIVERY_LEDGER_BACKEND: gcs
      NOTE_DELIVERY_LEDGER_PREFIX: delivery/v1
      NOTE_TARGET_IDENTITY: trendhub_biz
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install read-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt google-cloud-storage
      - name: Authenticate to private ledger with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Resolve private durable-ledger bucket
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-aiif-note-ledger-v1"
          echo "::add-mask::$bucket"
          echo "NOTE_DELIVERY_LEDGER_BUCKET=$bucket" >> "$GITHUB_ENV"
      - name: Classify manual strong-zero candidate without mutation
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          import note_draft_automation as base
          import note_delivery_runtime as delivery_runtime
          import run185_note_ready_legacy_skip as run185
          import run194_note_current_contract as current
          from note_delivery_ledger import DeliveryState
          from note_delivery_strong_zero import StrongZeroEvidenceError, parse_strong_zero_evidence_category

          ledger = delivery_runtime.delivery_ledger_from_environment()
          counts = Counter()
          state_counts = Counter()
          prefix = f"{ledger.prefix}/records/"
          current.install()

          for blob in ledger.bucket.list_blobs(prefix=prefix):
              record, _events = ledger._decode_envelope(blob.download_as_text())
              state_counts[record.state.value] += 1
              if record.state != DeliveryState.MANUAL_RECONCILIATION_REQUIRED:
                  continue
              counts['manual'] += 1
              if str(record.draft_id or '').strip():
                  counts['manual_with_draft'] += 1
                  continue
              counts['manual_no_draft'] += 1
              try:
                  parse_strong_zero_evidence_category(str(record.conflict_category or ''))
              except StrongZeroEvidenceError:
                  counts['manual_bad_evidence'] += 1
                  continue
              counts['manual_strong_zero'] += 1
              sync_id = str(record.snapshot.sync_id or '').strip().lower()
              if len(sync_id) != 32:
                  counts['invalid_sync'] += 1
                  continue
              counts['valid_sync'] += 1
              try:
                  matches = run185._ordered_candidates(base._query_ready_queue(), requested_sync_id=sync_id)
              except base.NoteDraftError:
                  counts['not_exact_ready'] += 1
                  continue
              counts['exact_ready'] += 1
              try:
                  current._prepare_one(matches[0])
              except current.StalePublicationContract:
                  counts['stale_contract'] += 1
              except current.IncompletePublicationAsset:
                  counts['incomplete_asset'] += 1
              except run185.UnsafeLegacyPaidMarker:
                  counts['paid_marker'] += 1
              except base.NoteDraftError:
                  counts['other_prepare_block'] += 1
              else:
                  counts['complete_current_ready'] += 1

          safe = {
              'record_states': dict(sorted(state_counts.items())),
              'candidate_counts': dict(sorted(counts.items())),
              'note_mutation_count': 0,
              'notion_write_count': 0,
              'model_calls': 0,
              'public_release': False,
          }
          print('P0B_TASK6_CANDIDATE_DIAG=' + json.dumps(safe, sort_keys=True))
          PY
