name: Run164 Apply Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'RUN164 APPLY B10 FIX')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Normalize Batch10 scoring schema
        run: |
          python - <<'PY'
          import json
          src='external_reviews/run164_batch10.json'
          dst='/tmp/run164_batch10_fixed.json'
          data=json.load(open(src, encoding='utf-8'))
          for item in data['reviews']:
              review=item['review']
              comps=review['components']
              comps['Ecosystem / Support Durability']=min(5, int(comps['Ecosystem / Support Durability']))
              review['adoption_score']=sum(int(v) for v in comps.values())
          with open(dst,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False)
          print('normalized', len(data['reviews']))
          PY
      - name: Apply external reviews
        env:
          TZ: Asia/Tokyo
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_DECISION_INTELLIGENCE_DB: 'true'
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          ENABLE_SUBSCRIBER_TECH_SYNC: 'false'
          NOTION_API_VERSION: '2026-03-11'
        run: |
          python external_product_review_import.py apply --input /tmp/run164_batch10_fixed.json --target 200 --max-rows 15 --confirm CONFIRM_EXTERNAL_REVIEW_IMPORT
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run164-b10-apply-fixed-${{ github.run_id }}
          path: external_review_artifacts/
          if-no-files-found: warn
          retention-days: 30
