name: Subscriber Decision Brief Sync

on:
  workflow_run:
    workflows: ["Daily Intelligence & Content Pipeline"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - subscriber_decision_brief.py
      - tests/test_run158_subscriber_decision_brief.py
      - .github/workflows/subscriber-decision-brief.yml
  workflow_dispatch:

concurrency:
  group: subscriber-decision-brief-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Run Run158 focused regression
        run: python -m unittest tests.test_run158_subscriber_decision_brief -v

      - name: Sync member Decision Briefs
        run: python subscriber_decision_brief.py
        env:
          TZ: 'Asia/Tokyo'
          NOTION_API_VERSION: "2026-03-11"
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          ENABLE_SUBSCRIBER_TECH_SYNC: ${{ vars.ENABLE_SUBSCRIBER_TECH_SYNC || 'false' }}
          ENABLE_SUBSCRIBER_DECISION_BRIEF: ${{ vars.ENABLE_SUBSCRIBER_DECISION_BRIEF || 'true' }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          SUBSCRIBER_DECISION_BRIEF_PACING_SECONDS: "0.35"
