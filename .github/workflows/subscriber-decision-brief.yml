name: Subscriber Decision Brief Sync

on:
  workflow_run:
    workflows:
      - Daily Intelligence & Content Pipeline
      - Daily Intelligence & Content Pipeline [ONE-SHOT]
    types: [completed]
  push:
    branches: [main]
    paths:
      - subscriber_decision_brief.py
      - tests/test_run158_subscriber_decision_brief.py
      - .github/workflows/subscriber-decision-brief.yml
  pull_request:
    paths:
      - subscriber_decision_brief.py
      - tests/test_run158_subscriber_decision_brief.py
      - .github/workflows/subscriber-decision-brief.yml
  workflow_dispatch:

# Member Presentation uses the same Notion integration and member-facing database family.
# Serialize both workflows across ONE-SHOT/push fan-out; do not cancel a writer mid-commit.
concurrency:
  group: member-derived-notion-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # A valid Notion Retry-After can be tens of seconds. Allow bounded recovery across the
    # full member inventory rather than converting normal throttling into a partial failure.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Run Run158 focused regression
        run: python -m unittest tests.test_run158_subscriber_decision_brief -v

      - name: Sync member Decision Briefs
        if: github.event_name != 'pull_request'
        run: python subscriber_decision_brief.py
        env:
          TZ: 'Asia/Tokyo'
          NOTION_API_VERSION: "2026-03-11"
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          ENABLE_SUBSCRIBER_DECISION_BRIEF: ${{ vars.ENABLE_SUBSCRIBER_DECISION_BRIEF || 'true' }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          SUBSCRIBER_DECISION_BRIEF_PACING_SECONDS: "0.40"
          SUBSCRIBER_DECISION_BRIEF_REQUEST_MAX_ATTEMPTS: "8"
          SUBSCRIBER_DECISION_BRIEF_RETRY_AFTER_MAX_SECONDS: "120"
          SUBSCRIBER_DECISION_BRIEF_SERVER_BACKOFF_MAX_SECONDS: "12"