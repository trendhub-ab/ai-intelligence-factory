name: P0-A Canonical Contract Verification

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - 'tests/test_p0a_production_canonical_gate.py'
      - 'note_canonical_persistence_guard.py'
      - 'run417_note_body_verification.py'
      - 'run190_note_persistent_cloud.py'
      - '.github/workflows/p0a-production-canonical-gate-tdd.yml'

permissions:
  contents: read

jobs:
  canonical-contract-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install repository test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run effective production C23 falsification set
        run: python -m pytest tests/test_p0a_production_canonical_gate.py -q
      - name: Run focused P0-A and B2 regression
        run: |
          python -m pytest \
            tests/test_note_document_contract.py \
            tests/test_note_document_dom.py \
            tests/test_note_draft_automation.py \
            tests/test_run291_private_draft_audit.py \
            tests/test_run292_note_rendered_body_audit.py \
            tests/test_run293_private_draft_guard_diagnostics.py \
            tests/test_run294_note_eyecatch_persistence_diagnostics.py \
            tests/test_run295_note_eyecatch_persistence.py \
            tests/test_p0a_stable_draft_identity.py \
            tests/test_p0b2_note_draft_identity.py -q
      - name: Run full current tests regression
        run: python -m pytest tests -q
