name: Current Ready Metadata Rebase [ONE-SHOT]

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact confirmation token'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: current-ready-metadata-rebase
  cancel-in-progress: false

jobs:
  rebase-genrec-ready:
    if: ${{ github.event.inputs.confirm == 'REBASE_GENREC_READY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: pip install requests

      - name: Zero-API Run288/289 contract tests
        run: |
          python -m unittest tests.test_run288_zero_api_ready_rebase -v
          python -m unittest tests.test_run289_genrec_queue_reactivation -v
          python -m unittest tests.test_run202_chatops_control -v
          python -m unittest tests.test_run199_note_vm_preflight -v

      - name: Rebase exact GenRec Ready manuscript metadata
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python run288_zero_api_ready_rebase.py

      - name: Reconcile Note Ready and require one current-policy source
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          python note_ready_sync.py | tee /tmp/run288-note-ready.txt
          python - <<'PY'
          import ast
          from pathlib import Path

          payload = None
          for line in reversed(Path('/tmp/run288-note-ready.txt').read_text(encoding='utf-8').splitlines()):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  candidate = ast.literal_eval(line)
              except (SyntaxError, ValueError):
                  continue
              if isinstance(candidate, dict) and 'source_ready' in candidate:
                  payload = candidate
                  break
          if payload is None:
              raise SystemExit('Run288 verification failed: Note Ready payload missing')
          if int(payload.get('source_ready') or 0) < 1:
              raise SystemExit('Run288 verification failed: current-policy source_ready stayed 0')
          if not bool(payload.get('zero_gemini_calls')):
              raise SystemExit('Run288 verification failed: Note Ready sync lost zero-model contract')
          print(f"RUN288_CURRENT_POLICY_READY_VERIFIED={payload.get('source_ready')}")
          PY

      - name: Reactivate exact GenRec queue row after audited system revocation
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run289_genrec_queue_reactivation.py

      - name: Verify exact GenRec is draft-eligible without starting VM
        env:
          NOTE_DRAFT_CONFIRM: CREATE_NOTE_DRAFT
          NOTE_TARGET_SYNC_ID: '3bd479ffdca9817f926aeaffbb779c4b'
          NOTE_DRAFT_RESULT_FILE: /tmp/run289-note-preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          python run199_note_vm_preflight.py
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/run289-note-preflight.json').read_text(encoding='utf-8'))
          if result.get('status') != 'eligible_ready':
              raise SystemExit(f"Run289 preflight failed: status={result.get('status')!r}")
          if result.get('should_start_vm') is not True:
              raise SystemExit('Run289 preflight failed: exact GenRec is not VM-eligible')
          if result.get('selected_sync_id') != '3bd479ffdca9817f926aeaffbb779c4b':
              raise SystemExit('Run289 preflight failed: selected sync_id drifted')
          if result.get('zero_gemini_calls') is not True:
              raise SystemExit('Run289 preflight lost zero-model contract')
          print('RUN289_GENREC_DRAFT_ELIGIBLE=true')
          PY

      - name: Record publication boundary
        if: always()
        run: |
          {
            echo '### Run288/289 Zero-API Ready Recovery'
            echo '- target: exact Netflix GenRec only'
            echo '- manuscript change: exactly one Run287 provenance-label line'
            echo '- queue repair: only audited system-induced `取下げ` -> `投稿待ち`'
            echo '- current policy SHA pinned: `b1b4d1e9d5e52788dc16396480ca0b7097701dc9354d91fd299394296fd1cd45`'
            echo '- Gemini/provider calls: `0`'
            echo '- fresh acquisition / screening: `false`'
            echo '- eyecatch regeneration: `false`'
            echo '- draft preflight: exact sync_id, zero-VM'
            echo '- private note draft created by this workflow: `false`'
            echo '- VM / browser started by this workflow: `false`'
            echo '- public note publication: `false`'
            echo '- Daily schedule changed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
