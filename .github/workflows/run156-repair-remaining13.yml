name: Run156 Repair Remaining 13

on:
  push:
    branches: [feature/run156-paid-db-decision-density]
    paths:
      - run156_fix_remaining13.py
      - .github/workflows/run156-repair-remaining13.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply narrow wording repair
        run: python run156_fix_remaining13.py
      - name: Commit repaired review set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external_reviews/run156_remaining68.json
          git diff --cached --exit-code && { echo "Expected repaired JSON diff but none found"; exit 1; } || true
          git commit -m "Run156: repair 13 evidence-boundary phrases"
          git push origin HEAD:feature/run156-paid-db-decision-density
