name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q requests playwright && python -m playwright install chromium
      - name: Compare safe CORS preflight user agents
        run: |
          python - <<'PY'
          import json
          import requests
          from playwright.sync_api import sync_playwright

          API='https://note.com/api/v1/text_notes'
          ORIGIN='https://editor.note.com'
          STANDARD='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          HEADLESS='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/153.0.0.0 Safari/537.36'
          ACRH='content-type,x-requested-with'

          def options(ua):
              r=requests.options(API,headers={
                  'Origin':ORIGIN,
                  'Access-Control-Request-Method':'POST',
                  'Access-Control-Request-Headers':ACRH,
                  'User-Agent':ua,
              },timeout=20,allow_redirects=False)
              return {
                  'status':r.status_code,
                  'acao':r.headers.get('access-control-allow-origin',''),
                  'acah':r.headers.get('access-control-allow-headers',''),
                  'server':r.headers.get('server',''),
                  'body_len':len(r.content),
              }

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              actual=str(page.evaluate('navigator.userAgent'))
              browser.close()
          result={
              'actual_is_headless': 'HeadlessChrome/' in actual,
              'standard':options(STANDARD),
              'headless':options(HEADLESS),
              'note_mutation_count':0,'model_calls':0,'public_release':False,
          }
          print('P0B_CORS_UA_CLASSIFY='+json.dumps(result,sort_keys=True))
          PY
