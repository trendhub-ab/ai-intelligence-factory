name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect session shape and failing editor request without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
        run: |
          python - <<'PY'
          import base64, collections, json, os, re, tempfile
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          def clean(value, limit=220):
              return re.sub(r'\s+', ' ', str(value or '')).strip()[:limit]

          def safe_url(value):
              p=urlparse(str(value or ''))
              return f'{p.scheme}://{p.netloc}{p.path}'[:240]

          raw=base64.b64decode(os.environ['NOTE_STORAGE_STATE_B64'], validate=True)
          state=json.loads(raw.decode('utf-8'))
          domains=collections.Counter(str(c.get('domain') or '') for c in state.get('cookies',[]))
          origins=[]
          for item in state.get('origins',[]):
              origins.append({
                  'origin': safe_url(item.get('origin')),
                  'local_storage_count': len(item.get('localStorage') or []),
              })
          print('P0B_STORAGE_SHAPE=' + json.dumps({
              'cookie_count': len(state.get('cookies',[])),
              'cookie_domains': dict(sorted(domains.items())),
              'origins': origins,
          }, ensure_ascii=False, sort_keys=True))

          fd,name=tempfile.mkstemp(prefix='note-state-',suffix='.json')
          os.close(fd)
          storage=Path(name)
          storage.write_bytes(raw)
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--lang=ja-JP'])
                  context=browser.new_context(storage_state=str(storage),locale='ja-JP',timezone_id='Asia/Tokyo',viewport={'width':1440,'height':1100})
                  page=context.new_page()
                  target_requests=[]
                  target_responses=[]
                  failures=[]
                  def on_request(req):
                      if urlparse(req.url).path == '/api/v1/text_notes':
                          try:
                              header_names=sorted(k.lower() for k in req.all_headers().keys())
                          except Exception:
                              header_names=[]
                          target_requests.append({
                              'method': req.method,
                              'resource_type': req.resource_type,
                              'url': safe_url(req.url),
                              'header_names': header_names,
                          })
                  def on_response(resp):
                      if urlparse(resp.url).path == '/api/v1/text_notes':
                          try:
                              h={k.lower():v for k,v in resp.all_headers().items()}
                          except Exception:
                              h={}
                          target_responses.append({
                              'status': resp.status,
                              'url': safe_url(resp.url),
                              'acao': clean(h.get('access-control-allow-origin'),100),
                              'acam': clean(h.get('access-control-allow-methods'),100),
                              'acah': clean(h.get('access-control-allow-headers'),160),
                              'location_present': bool(h.get('location')),
                              'content_type': clean(h.get('content-type'),100),
                              'vary': clean(h.get('vary'),100),
                          })
                  def on_failed(req):
                      if urlparse(req.url).path == '/api/v1/text_notes':
                          failures.append({'method':req.method,'error':clean(req.failure,160),'url':safe_url(req.url)})
                  page.on('request',on_request)
                  page.on('response',on_response)
                  page.on('requestfailed',on_failed)
                  try:
                      page.goto('https://note.com/new',wait_until='domcontentloaded',timeout=60000)
                      page.wait_for_timeout(8000)
                      after=context.storage_state()
                      after_origins=[{
                          'origin':safe_url(i.get('origin')),
                          'local_storage_count':len(i.get('localStorage') or []),
                      } for i in after.get('origins',[])]
                      print('P0B_CORS_SHAPE=' + json.dumps({
                          'final_url':safe_url(page.url),
                          'target_requests':target_requests[:10],
                          'target_responses':target_responses[:10],
                          'target_failures':failures[:10],
                          'after_origins':after_origins,
                          'note_mutation_count':0,
                          'model_calls':0,
                          'public_release':False,
                      },ensure_ascii=False,sort_keys=True))
                  finally:
                      context.close(); browser.close()
          finally:
              storage.unlink(missing_ok=True)
          PY
