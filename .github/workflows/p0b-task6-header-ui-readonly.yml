name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Classify current note new route without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, re
          import note_draft_automation as note
          from playwright.sync_api import sync_playwright

          def clean(value, limit=500):
              return re.sub(r'\s+', ' ', str(value or '')).strip()[:limit]

          def attr(locator, name):
              try:
                  return clean(locator.get_attribute(name), 120)
              except Exception:
                  return ''

          storage = note._decode_storage_state()
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=['--lang=ja-JP'])
                  context = browser.new_context(
                      storage_state=str(storage), locale='ja-JP', timezone_id='Asia/Tokyo',
                      viewport={'width': 1440, 'height': 1100},
                  )
                  page = context.new_page()
                  try:
                      response = page.goto(note.NOTE_NEW_URL, wait_until='domcontentloaded', timeout=60000)
                      page.wait_for_timeout(5000)
                      frame_rows=[]
                      for frame in page.frames:
                          frame_rows.append({
                              'name': clean(frame.name, 80),
                              'url': clean(frame.url, 180),
                          })
                      iframe_rows=[]
                      frames=page.locator('iframe')
                      for i in range(min(frames.count(),20)):
                          item=frames.nth(i)
                          iframe_rows.append({
                              'src': attr(item,'src'),
                              'title': attr(item,'title'),
                              'name': attr(item,'name'),
                          })
                      body_text=''
                      try:
                          body_text=clean(page.locator('body').inner_text(timeout=3000), 600)
                      except Exception:
                          pass
                      print('P0B_NEW_ROUTE=' + json.dumps({
                          'status': response.status if response else None,
                          'url': clean(page.url, 180),
                          'document_title': clean(page.title(), 160),
                          'body_text': body_text,
                          'frames': frame_rows,
                          'iframes': iframe_rows,
                          'contenteditable_count': page.locator('[contenteditable="true"]').count(),
                          'textbox_count': page.locator('[role="textbox"]').count(),
                          'input_count': page.locator('input').count(),
                          'textarea_count': page.locator('textarea').count(),
                          'button_count': page.locator('button').count(),
                          'note_mutation_count': 0,
                          'model_calls': 0,
                          'public_release': False,
                      }, ensure_ascii=False, sort_keys=True))
                  finally:
                      context.close(); browser.close()
          finally:
              storage.unlink(missing_ok=True)
          PY
