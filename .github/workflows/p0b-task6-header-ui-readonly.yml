name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Diagnose editor auth bootstrap without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter
          from urllib.parse import urlparse
          import note_draft_automation as note
          from playwright.sync_api import sync_playwright

          def safe_url(url):
              p=urlparse(str(url or ''))
              return {'host':p.hostname or '', 'path':p.path[:160]}
          def safe_message(text):
              value=str(text or '')
              value=re.sub(r'https?://[^\s)]+', '<url>', value)
              value=re.sub(r'[A-Za-z0-9_\-]{32,}', '<redacted>', value)
              return value[:240]

          storage_path=note._decode_storage_state()
          try:
              state=json.loads(storage_path.read_text(encoding='utf-8'))
              cookie_domains=Counter(str(c.get('domain') or '') for c in state.get('cookies',[]) if isinstance(c,dict))
              origins=[]
              for item in state.get('origins',[]):
                  if not isinstance(item,dict): continue
                  origin=str(item.get('origin') or '')
                  keys=sorted(str(x.get('name') or '') for x in item.get('localStorage',[]) if isinstance(x,dict))
                  origins.append({'host':urlparse(origin).hostname or '', 'local_storage_keys':keys})

              failed=[]; errors=[]; redirects=[]
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--lang=ja-JP'])
                  context=browser.new_context(storage_state=str(storage_path),locale='ja-JP',timezone_id='Asia/Tokyo',viewport={'width':1440,'height':1100})
                  page=context.new_page(); page.set_default_timeout(15000)
                  page.on('requestfailed', lambda r: failed.append({'url':safe_url(r.url),'method':r.method,'type':r.resource_type,'failure':safe_message(r.failure)}))
                  page.on('console', lambda m: errors.append(safe_message(m.text)) if m.type=='error' else None)
                  def on_response(r):
                      if 300 <= r.status < 400:
                          loc=r.headers.get('location','')
                          redirects.append({'status':r.status,'from':safe_url(r.url),'to':safe_url(loc)})
                  page.on('response', on_response)
                  try:
                      nav=page.goto(note.NOTE_NEW_URL,wait_until='domcontentloaded',timeout=60000)
                      page.wait_for_timeout(10000)
                      print('P0B_EDITOR_AUTH_BOOTSTRAP='+json.dumps({
                          'nav_status':None if nav is None else nav.status,
                          'page':safe_url(page.url),'html_len':len(page.content()),
                          'body_text_len':len(page.locator('body').inner_text(timeout=1000) or ''),
                          'cookie_domains':dict(cookie_domains),'origins':origins,
                          'failed_requests':failed[:20],'redirects':redirects[:20],
                          'console_errors':errors[:10],
                          'note_mutation_count':0,'model_calls':0,'public_release':False,
                      },ensure_ascii=False,sort_keys=True))
                  finally:
                      context.close(); browser.close()
          finally:
              storage_path.unlink(missing_ok=True)
          PY
