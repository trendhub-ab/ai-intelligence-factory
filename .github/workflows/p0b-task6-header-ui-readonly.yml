name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Capture editor initialization failures without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urlparse
          import note_draft_automation as note
          from playwright.sync_api import sync_playwright

          def clean(value, limit=320):
              return re.sub(r'\s+', ' ', str(value or '')).strip()[:limit]

          def safe_url(value):
              try:
                  p=urlparse(str(value or ''))
                  return f'{p.scheme}://{p.netloc}{p.path}'[:240]
              except Exception:
                  return ''

          storage = note._decode_storage_state()
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=['--lang=ja-JP'])
                  context = browser.new_context(
                      storage_state=str(storage), locale='ja-JP', timezone_id='Asia/Tokyo',
                      viewport={'width': 1440, 'height': 1100},
                  )
                  page = context.new_page()
                  console_errors=[]
                  page_errors=[]
                  request_failures=[]
                  bad_responses=[]
                  page.on('console', lambda msg: console_errors.append(clean(msg.text)) if msg.type in {'error','warning'} else None)
                  page.on('pageerror', lambda exc: page_errors.append(clean(exc)))
                  page.on('requestfailed', lambda req: request_failures.append({'url': safe_url(req.url), 'error': clean(req.failure,160)}))
                  page.on('response', lambda resp: bad_responses.append({'status': resp.status, 'url': safe_url(resp.url)}) if resp.status >= 400 else None)
                  try:
                      response = page.goto(note.NOTE_NEW_URL, wait_until='domcontentloaded', timeout=60000)
                      page.wait_for_timeout(8000)
                      html=''
                      try:
                          html=page.content()
                      except Exception:
                          pass
                      scripts=page.locator('script[src]')
                      script_hosts=[]
                      for i in range(min(scripts.count(),80)):
                          src=scripts.nth(i).get_attribute('src') or ''
                          parsed=urlparse(src if '://' in src else page.url)
                          host=parsed.netloc
                          if host and host not in script_hosts:
                              script_hosts.append(host)
                      cookies=context.cookies('https://editor.note.com')
                      print('P0B_EDITOR_INIT=' + json.dumps({
                          'status': response.status if response else None,
                          'url': safe_url(page.url),
                          'document_title': clean(page.title(),160),
                          'html_length': len(html),
                          'body_child_count': page.locator('body > *').count(),
                          'script_src_count': scripts.count(),
                          'script_hosts': script_hosts[:20],
                          'editor_cookie_count': len(cookies),
                          'console_errors': console_errors[:20],
                          'page_errors': page_errors[:20],
                          'request_failures': request_failures[:20],
                          'bad_responses': bad_responses[:20],
                          'note_mutation_count': 0,
                          'model_calls': 0,
                          'public_release': False,
                      }, ensure_ascii=False, sort_keys=True))
                  finally:
                      context.close(); browser.close()
          finally:
              storage.unlink(missing_ok=True)
          PY
