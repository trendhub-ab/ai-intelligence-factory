name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compare CORS preflight with headless vs normal Chrome UA
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          endpoint='https://note.com/api/v1/text_notes'
          common={
              'Origin':'https://editor.note.com',
              'Access-Control-Request-Method':'POST',
              'Access-Control-Request-Headers':'content-type,x-requested-with',
              'Sec-Fetch-Mode':'cors',
              'Sec-Fetch-Site':'same-site',
              'Accept':'*/*',
          }
          agents={
              'headless':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/153.0.0.0 Safari/537.36',
              'normal':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36',
          }
          allow={'access-control-allow-origin','access-control-allow-methods','access-control-allow-headers','vary','content-type'}
          results={}
          for label,ua in agents.items():
              req=urllib.request.Request(endpoint,method='OPTIONS',headers={**common,'User-Agent':ua})
              try:
                  resp=urllib.request.urlopen(req,timeout=20)
                  status=resp.status
                  headers=resp.headers
                  resp.close()
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  headers=exc.headers
                  exc.close()
              results[label]={
                  'status':status,
                  'headers':{k.lower():v for k,v in headers.items() if k.lower() in allow},
              }
          print('P0B_CORS_UA_AB=' + json.dumps({
              'results':results,
              'request_method':'OPTIONS',
              'note_mutation_count':0,
              'model_calls':0,
              'public_release':False,
          },ensure_ascii=False,sort_keys=True))
          PY
