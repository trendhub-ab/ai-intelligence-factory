name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Inspect new-editor frame structure without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          import note_draft_automation as note
          from playwright.sync_api import sync_playwright

          def route(url):
              p=urlparse(str(url or ''))
              path=p.path or '/'
              if path.rstrip('/') in ('/new','/notes/new'): kind='new'
              elif '/edit' in path: kind='edit'
              elif any(x in path.lower() for x in ('login','signin','signup')): kind='auth'
              else: kind='other'
              return {'host':p.hostname or '', 'kind':kind, 'path_depth':len([x for x in path.split('/') if x])}

          storage=note._decode_storage_state()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--lang=ja-JP'])
                  context=browser.new_context(storage_state=str(storage),locale='ja-JP',timezone_id='Asia/Tokyo',viewport={'width':1440,'height':1100})
                  page=context.new_page(); page.set_default_timeout(15000)
                  try:
                      response=page.goto(note.NOTE_NEW_URL,wait_until='domcontentloaded',timeout=60000)
                      page.wait_for_timeout(8000)
                      frames=[]
                      for f in page.frames:
                          counts={}
                          for key,sel in {
                              'inputs':'input','textareas':'textarea','editable':'[contenteditable="true"]',
                              'buttons':'button','role_buttons':'[role="button"]','file_inputs':'input[type="file"]'
                          }.items():
                              try: counts[key]=int(f.locator(sel).count())
                              except Exception: counts[key]=-1
                          try: body_len=len(str(f.locator('body').inner_text(timeout=1000) or ''))
                          except Exception: body_len=-1
                          frames.append({'route':route(f.url),'counts':counts,'body_text_len':body_len})
                      try: html_len=len(page.content())
                      except Exception: html_len=-1
                      print('P0B_EDITOR_FRAME_UI='+json.dumps({
                          'response_status': None if response is None else response.status,
                          'page_route':route(page.url),'frame_count':len(page.frames),'frames':frames,
                          'html_len':html_len,'logged_out':note._looks_logged_out(page),
                          'note_mutation_count':0,'model_calls':0,'public_release':False,
                      },sort_keys=True))
                  finally:
                      context.close(); browser.close()
          finally:
              storage.unlink(missing_ok=True)
          PY
