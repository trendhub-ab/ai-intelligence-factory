name: P0-B Task 6 Header UI Read-Only [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-header-ui-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Inspect public editor bundles without authentication or mutation
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from urllib.parse import urljoin, urlparse

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/javascript,*/*'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  return resp.read().decode('utf-8','replace')

          html=get('https://editor.note.com/new')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              url=urljoin('https://editor.note.com/new',src)
              if url not in scripts:
                  scripts.append(url)

          tokens=['画像を追加','画像をアップロード','見出し画像','アイキャッチ','coverImage','cover_image','headerImage','header_image','eyecatch','imageUpload','uploadImage']
          hits=[]
          for url in scripts[:40]:
              try:
                  text=get(url)
              except Exception as exc:
                  hits.append({'script':urlparse(url).path[-120:],'error':type(exc).__name__})
                  continue
              for token in tokens:
                  start=0
                  found=0
                  while found < 3:
                      idx=text.find(token,start)
                      if idx < 0:
                          break
                      excerpt=re.sub(r'\s+',' ',text[max(0,idx-180):idx+len(token)+220])
                      hits.append({'script':urlparse(url).path[-120:],'token':token,'excerpt':excerpt[:500]})
                      start=idx+len(token)
                      found+=1
          print('P0B_EDITOR_BUNDLE_HINTS='+json.dumps({
              'script_count':len(scripts),
              'hits':hits[:80],
              'request_type':'GET-only',
              'authenticated':False,
              'note_mutation_count':0,
              'model_calls':0,
              'public_release':False,
          },ensure_ascii=False,sort_keys=True))
          PY
