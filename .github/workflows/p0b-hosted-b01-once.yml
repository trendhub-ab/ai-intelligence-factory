name: P0-B Hosted B01 Ledger Audit [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-hosted-b01-20261006
    paths:
      - .github/workflows/p0b-hosted-b01-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  audit-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      NOTE_DELIVERY_LEDGER_BACKEND: 'gcs'
      NOTE_DELIVERY_LEDGER_BUCKET: ''
      NOTE_DELIVERY_LEDGER_PREFIX: 'delivery/v1'
    steps:
      - name: Checkout hosted-only implementation
        uses: actions/checkout@v6
        with:
          ref: p0b-hosted-only-implementation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install read-only audit dependencies
        run: pip install -q requests google-cloud-storage

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Resolve private ledger bucket
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-aiif-note-ledger-v1"
          echo "::add-mask::$bucket"
          echo "NOTE_DELIVERY_LEDGER_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Pin current eligible candidate without browser
        env:
          NOTE_DRAFT_CONFIRM: CREATE_NOTE_DRAFT
          NOTE_TARGET_SYNC_ID: ''
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/note_preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run199_note_vm_preflight.py

      - name: Read durable ledger state only
        env:
          PREFLIGHT_RESULT: ${{ runner.temp }}/note_preflight.json
          LEDGER_RESULT: ${{ runner.temp }}/ledger_audit.json
        run: |
          set -euo pipefail
          selected="$(python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['PREFLIGHT_RESULT']).read_text(encoding='utf-8'))
          print(str(r.get('selected_sync_id') or '').strip())
          PY
          )"
          test -n "$selected" || { echo 'P0B_LEDGER_AUDIT=no_eligible_candidate'; exit 0; }
          NOTE_TARGET_SYNC_ID="$selected" NOTE_TARGET_IDENTITY='trendhub_biz' NOTE_DRAFT_RESULT_FILE="$LEDGER_RESULT" bash note_delivery_ledger_preflight.sh
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['LEDGER_RESULT'])
          r=json.loads(p.read_text(encoding='utf-8'))
          print('P0B_LEDGER_AUDIT=' + str(r.get('status') or 'unknown'))
          print('P0B_SECOND_CREATE_ALLOWED=' + ('true' if r.get('should_run_delivery') is True else 'false'))
          PY