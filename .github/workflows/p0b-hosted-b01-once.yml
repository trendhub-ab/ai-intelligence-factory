name: P0-B Hosted Existing Storage Probe [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-hosted-b01-20261006
    paths:
      - .github/workflows/p0b-hosted-b01-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Probe bucket visibility without exposing names
        run: |
          set -euo pipefail
          if gcloud storage buckets list --project "$GCP_PROJECT_ID" --format='value(name)' > "$RUNNER_TEMP/buckets" 2> "$RUNNER_TEMP/list.err"; then
            echo 'P0B_BUCKET_LIST_ALLOWED=true'
            echo "P0B_BUCKET_VISIBLE_COUNT=$(grep -c . "$RUNNER_TEMP/buckets" || true)"
          else
            echo 'P0B_BUCKET_LIST_ALLOWED=false'
          fi

          found=0
          secure=0
          for bucket in \
            "$GCP_PROJECT_ID" \
            "${GCP_PROJECT_ID}.appspot.com" \
            "${GCP_PROJECT_ID}.firebasestorage.app" \
            "${GCP_PROJECT_ID}-aiif-note-ledger-v1"; do
            echo "::add-mask::$bucket"
            if gcloud storage buckets describe "gs://$bucket" --format=json > "$RUNNER_TEMP/describe.json" 2>/dev/null; then
              found=$((found+1))
              if python3 - "$RUNNER_TEMP/describe.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          iam=d.get('iamConfiguration') or d.get('iam_config') or {}
          ub=(iam.get('uniformBucketLevelAccess') or iam.get('uniform_bucket_level_access') or {})
          enabled=ub.get('enabled') is True
          pap=str(iam.get('publicAccessPrevention') or iam.get('public_access_prevention') or '').lower()=='enforced'
          raise SystemExit(0 if enabled and pap else 1)
          PY
              then secure=$((secure+1)); fi
            fi
          done
          echo "P0B_KNOWN_BUCKET_FOUND_COUNT=$found"
          echo "P0B_KNOWN_BUCKET_SECURE_COUNT=$secure"