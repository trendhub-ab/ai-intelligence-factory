name: P0-B Hosted Storage Capability Audit [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-hosted-b01-20261006
    paths:
      - .github/workflows/p0b-hosted-b01-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Audit effective project roles and existing private storage
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/p0b-storage-audit"
          mkdir -p "$work"

          roles="$(gcloud projects get-iam-policy "$GCP_PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:${GCP_SERVICE_ACCOUNT}" \
            --format='value(bindings.role)' 2>/dev/null || true)"
          if [ -n "$roles" ]; then
            printf '%s\n' "$roles" | sort -u > "$work/roles.txt"
          else
            : > "$work/roles.txt"
          fi

          gcloud storage buckets list --project "$GCP_PROJECT_ID" --format='value(name)' > "$work/buckets.txt" 2>/dev/null || :

          WORK="$work" PROJECT="$GCP_PROJECT_ID" python3 - <<'PY'
          import os, pathlib, subprocess
          work = pathlib.Path(os.environ['WORK'])
          roles = [x.strip() for x in (work/'roles.txt').read_text().splitlines() if x.strip()]
          buckets = [x.strip() for x in (work/'buckets.txt').read_text().splitlines() if x.strip()]
          print('P0B_STORAGE_ROLE_COUNT=' + str(len(roles)))
          for role in roles:
              print('P0B_STORAGE_ROLE=' + role)
          print('P0B_STORAGE_BUCKET_COUNT=' + str(len(buckets)))

          secure = 0
          named = 0
          for name in buckets:
              low = name.lower()
              if 'aiif' not in low and 'note' not in low and os.environ['PROJECT'].lower() not in low:
                  continue
              named += 1
              subprocess.run(['bash','-lc',f'echo "::add-mask::{name}"'], check=False)
              p = subprocess.run(
                  ['gcloud','storage','buckets','describe',f'gs://{name}','--format=value(iam_config.uniform_bucket_level_access.enabled,iam_config.public_access_prevention)'],
                  text=True, capture_output=True
              )
              if p.returncode == 0:
                  text = p.stdout.lower()
                  if 'true' in text and 'enforced' in text:
                      secure += 1
          print('P0B_NAMED_BUCKET_COUNT=' + str(named))
          print('P0B_SECURE_NAMED_BUCKET_COUNT=' + str(secure))
          PY