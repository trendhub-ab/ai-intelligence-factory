name: Run241 Bootstrap

on:
  push:
    branches:
      - run241-batched-pipeline-modularization

permissions:
  contents: write

concurrency:
  group: run241-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run241-batched-pipeline-modularization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate fail-closed migration plan
        run: python run241_batched_modularization_migration.py
      - name: Apply fail-closed Run241 migration
        run: python run241_batched_modularization_migration.py --write
      - name: Compile batched ownership surface
        run: |
          python -m compileall -q \
            pipeline.py candidate_identity.py note_manuscript.py gate_reasoning.py \
            screening_protocol.py source_roi_policy.py run241_batched_modularization_migration.py
      - name: Assert physical reduction
        run: |
          test "$(wc -l < pipeline.py)" -eq 11497
          grep -F 'from candidate_identity import canonicalize_url as _canonicalize_url_impl' pipeline.py
          grep -F 'from source_roi_policy import (' pipeline.py
      - name: Run Run241 module and live-binding tests
        run: |
          python -m unittest tests.test_run241_batched_modules -v
          python -m unittest tests.test_run241_batched_integration -v
      - name: Whitespace check
        run: git diff --check
      - name: Commit migrated pipeline when changed
        run: |
          if git diff --quiet -- pipeline.py; then
            echo 'Run241 pipeline already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py
          git commit -m 'Run241: batch-extract five deterministic pipeline domains'
          git push origin HEAD:run241-batched-pipeline-modularization
