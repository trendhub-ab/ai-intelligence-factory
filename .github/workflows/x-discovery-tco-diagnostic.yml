name: X Discovery t.co Diagnostic

on:
  push:
    branches:
      - feature/x-discovery-ingestion
    paths:
      - '.github/workflows/x-discovery-tco-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect first-hop t.co redirects only
        run: |
          python - <<'PY'
          import http.client
          import json
          from urllib.parse import urlsplit, urljoin

          urls = [
              'https://t.co/9VSrFcBiPU',
              'https://t.co/m8IBLK4pH2',
              'https://t.co/0mjTRiYuBi',
              'https://t.co/hMBpXP5HWX',
              'https://t.co/ZURDbiBA4i',
          ]
          out = []
          for url in urls:
              parts = urlsplit(url)
              path = parts.path or '/'
              if parts.query:
                  path += '?' + parts.query
              row = {'short': url}
              for method in ('HEAD', 'GET'):
                  conn = http.client.HTTPSConnection('t.co', timeout=10)
                  try:
                      conn.request(method, path, headers={
                          'User-Agent': 'Mozilla/5.0 (compatible; AIFactoryDiagnostic/1.0)',
                          'Accept': '*/*',
                      })
                      resp = conn.getresponse()
                      loc = resp.getheader('Location')
                      absolute = urljoin(url, loc) if loc else None
                      row[method] = {
                          'status': resp.status,
                          'location': absolute,
                          'location_host': (urlsplit(absolute).hostname or '').lower() if absolute else None,
                      }
                      if method == 'GET':
                          resp.read(1)
                  except Exception as exc:
                      row[method] = {'error': type(exc).__name__, 'message': str(exc)[:300]}
                  finally:
                      conn.close()
              out.append(row)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
