name: Run296 Canonical Spec Sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'AI_Intelligence_Factory_Run296_仕様追補.md'
      - '.github/workflows/run296-canonical-spec-sync.yml'

permissions:
  contents: write

jobs:
  sync-run296-spec:
    if: >-
      github.head_ref == 'run296-editorial-format-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'trendhub-ab'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Insert Run296 into canonical Production spec
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AI_Intelligence_Factory_最終仕様書.md')
          text = path.read_text(encoding='utf-8')
          marker = '`run296_editorial_format_v2.py`'
          if marker in text:
              print('Run296 already documented; no change')
              raise SystemExit(0)

          text = text.replace('最終更新: 2026-09-07', '最終更新: 2026-09-08', 1)
          baseline = 'Operational Reliability Baseline: **Run272 — Bounded Daily Failure Tails / Notion Date Boundary / arXiv Run-Local Circuit / Product Review 600s Bound**'
          if baseline not in text:
              raise SystemExit('canonical baseline insertion point missing')
          text = text.replace(
              baseline,
              baseline + '\nNote Editorial Format Baseline: **Run296 — Reader-approved Note Editorial Format v2**',
              1,
          )

          runtime_anchor = '- `run222_note_presentation_integrity.py`\n'
          if runtime_anchor not in text:
              raise SystemExit('runtime manifest insertion point missing')
          text = text.replace(
              runtime_anchor,
              runtime_anchor + '- `run296_editorial_format_v2.py`\n',
              1,
          )

          eyecatch_anchor = '### Eyecatch\n\n'
          if eyecatch_anchor not in text:
              raise SystemExit('eyecatch section insertion point missing')
          run296 = '''### Run296 Reader-approved Note Editorial Format v2\n\n最初の実note Private Draftの人間レビューをProduction標準へ反映する。`run296_editorial_format_v2.py` はRun222後段のreader-facing surfaceを正規化し、追加Gemini/model requestを作らない。\n\n- 記事冒頭は `どんな内容？` とし、`30秒でわかるこの記事` と `何が出た？` を廃止する。\n- 有料CTAは `有料サブスクのご案内`、指定本文、`詳しくはこちら` をcanonical copyとし、既存tracking URLは保持する。\n- 長い記事タイトルをアイキャッチへそのまま複製せず、意味を保った短いvisual copyへ圧縮する。\n- `舞台裏` 等の保護対象複合語を行境界で分割しない。\n- highlightは意味の完結したフレーズを使い、Netflix GenRecでは `舵を切った理由` 全体を強調する。\n- アイキャッチ下部説明文/subheadlineは描画しない。\n- Netflix GenRecのreviewed specimenは `Netflix推薦の舞台裏` / `LLMネイティブへ` / `舵を切った理由` の3行をdeterministicに使う。\n- Public releaseは引き続きhuman-only。既存private draft更新は別のspecimen-bound workflowでin-place実施し、read-only監査を再実行する。\n\n'''
          text = text.replace(eyecatch_anchor, run296 + eyecatch_anchor, 1)
          path.write_text(text, encoding='utf-8')
          print('canonical spec updated for Run296')
          PY

      - name: Commit canonical spec update
        run: |
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo 'No canonical spec change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run296: sync canonical Production specification'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
