name: P0-A history diagnostics implementation once

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-history-diagnostics-impl-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: design/p0-a-note-lossless-contract
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'
      - name: Apply minimal content-free history diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('run291_note_private_draft_audit.py')
          s = p.read_text(encoding='utf-8')
          old = '''class PrivateDraftAuditError(RuntimeError):\n    pass\n'''
          new = '''class PrivateDraftAuditError(RuntimeError):\n    def __init__(self, message: str, *, safe_metrics: dict[str, Any] | None = None) -> None:\n        super().__init__(message)\n        self.safe_metrics = dict(safe_metrics or {})\n'''
          if old not in s:
              raise SystemExit('run291 error class anchor not found')
          s = s.replace(old, new, 1)

          old = '''    candidates = _recent_private_edit_urls(profile)\n    if not candidates:\n        raise PrivateDraftAuditError("No private note edit route is present in persistent Chrome history")\n\n    with sync_playwright() as playwright:\n'''
          new = '''    candidates = _recent_private_edit_urls(profile)\n    history_metrics: dict[str, int] = {\n        "history_candidate_count": len(candidates),\n        "history_navigation_success_count": 0,\n        "history_navigation_error_count": 0,\n        "history_authenticated_count": 0,\n        "history_editor_route_count": 0,\n        "history_title_read_count": 0,\n        "history_title_match_count": 0,\n    }\n    if not candidates:\n        raise PrivateDraftAuditError(\n            "No private note edit route is present in persistent Chrome history",\n            safe_metrics={"history_candidate_count": 0},\n        )\n\n    with sync_playwright() as playwright:\n'''
          if old not in s:
              raise SystemExit('run291 candidates anchor not found')
          s = s.replace(old, new, 1)

          old = '''            for rank, candidate in enumerate(candidates, start=1):\n                try:\n                    page.goto(candidate, wait_until="domcontentloaded", timeout=60000)\n                    page.wait_for_timeout(1200)\n                    if note_base._looks_logged_out(page) and not seeded:\n                        seeded = bool(run190._seed_note_state(context, page))\n                        if seeded:\n                            page.goto(candidate, wait_until="domcontentloaded", timeout=60000)\n                            page.wait_for_timeout(1200)\n                    if note_base._looks_logged_out(page):\n                        continue\n                    if not run187._is_editor_url(str(page.url or "")):\n                        continue\n                    if _title_value(page) != str(article["title"]).strip():\n                        continue\n                    metrics = _audit_current_page(page, str(article["title"]), str(article["manuscript"]))\n                    metrics["history_candidate_count"] = len(candidates)\n                    metrics["matched_history_rank"] = rank\n                    metrics["editor_route_hash"] = hashlib.sha256(candidate.encode("utf-8")).hexdigest()[:12]\n                    return metrics\n                except PrivateDraftAuditError:\n                    raise\n                except Exception:\n                    continue\n'''
          new = '''            for rank, candidate in enumerate(candidates, start=1):\n                try:\n                    try:\n                        page.goto(candidate, wait_until="domcontentloaded", timeout=60000)\n                        page.wait_for_timeout(1200)\n                        history_metrics["history_navigation_success_count"] += 1\n                    except Exception:\n                        history_metrics["history_navigation_error_count"] += 1\n                        continue\n                    if note_base._looks_logged_out(page) and not seeded:\n                        seeded = bool(run190._seed_note_state(context, page))\n                        if seeded:\n                            try:\n                                page.goto(candidate, wait_until="domcontentloaded", timeout=60000)\n                                page.wait_for_timeout(1200)\n                            except Exception:\n                                history_metrics["history_navigation_error_count"] += 1\n                                continue\n                    if note_base._looks_logged_out(page):\n                        continue\n                    history_metrics["history_authenticated_count"] += 1\n                    if not run187._is_editor_url(str(page.url or "")):\n                        continue\n                    history_metrics["history_editor_route_count"] += 1\n                    try:\n                        persisted_title = _title_value(page)\n                    except PrivateDraftAuditError:\n                        continue\n                    history_metrics["history_title_read_count"] += 1\n                    if persisted_title != str(article["title"]).strip():\n                        continue\n                    history_metrics["history_title_match_count"] += 1\n                    metrics = _audit_current_page(page, str(article["title"]), str(article["manuscript"]))\n                    metrics.update(history_metrics)\n                    metrics["matched_history_rank"] = rank\n                    metrics["editor_route_hash"] = hashlib.sha256(candidate.encode("utf-8")).hexdigest()[:12]\n                    return metrics\n                except PrivateDraftAuditError:\n                    raise\n                except Exception:\n                    continue\n'''
          if old not in s:
              raise SystemExit('run291 loop anchor not found')
          s = s.replace(old, new, 1)

          old = '''    raise PrivateDraftAuditError("The requested private draft could not be matched safely from local Chrome history")\n'''
          new = '''    raise PrivateDraftAuditError(\n        "The requested private draft could not be matched safely from local Chrome history",\n        safe_metrics=history_metrics,\n    )\n'''
          if old not in s:
              raise SystemExit('run291 final failure anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('run292_note_rendered_body_audit.py')
          s = p.read_text(encoding='utf-8')
          old = '''    except base.PrivateDraftAuditError as exc:\n        result = _safe_failure_result(args.sync_id, _safe_non_body_guard_code(exc))\n        exit_code = 2\n'''
          new = '''    except base.PrivateDraftAuditError as exc:\n        result = _safe_failure_result(\n            args.sync_id, _safe_non_body_guard_code(exc), getattr(exc, "safe_metrics", None)\n        )\n        exit_code = 2\n'''
          if old not in s:
              raise SystemExit('run292 generic catch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('run295_note_private_draft_audit.py')
          s = p.read_text(encoding='utf-8')
          old = '''    except base.PrivateDraftAuditError as exc:\n        result = _safe_failure_result(args.sync_id, base292._safe_non_body_guard_code(exc))\n        exit_code = 2\n'''
          new = '''    except base.PrivateDraftAuditError as exc:\n        result = _safe_failure_result(\n            args.sync_id, base292._safe_non_body_guard_code(exc), getattr(exc, "safe_metrics", None)\n        )\n        exit_code = 2\n'''
          if old not in s:
              raise SystemExit('run295 generic catch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/note-private-draft-audit.yml')
          s = p.read_text(encoding='utf-8')
          old = "              'title_box', 'body_box', 'history_candidate_count',\n              'matched_history_rank', 'editor_route_hash',\n"
          new = "              'title_box', 'body_box', 'history_candidate_count',\n              'history_navigation_success_count', 'history_navigation_error_count',\n              'history_authenticated_count', 'history_editor_route_count',\n              'history_title_read_count', 'history_title_match_count',\n              'matched_history_rank', 'editor_route_hash',\n"
          if old not in s:
              raise SystemExit('workflow safe keys anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit minimal implementation
        run: |
          set -euo pipefail
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add run291_note_private_draft_audit.py run292_note_rendered_body_audit.py run295_note_private_draft_audit.py .github/workflows/note-private-draft-audit.yml
          git diff --cached --check
          git commit -m 'feat: add content-free private draft history diagnostics'
          git push origin HEAD:design/p0-a-note-lossless-contract
