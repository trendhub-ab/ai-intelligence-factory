name: Run368 Branch Pilot Ready Recovery [ONE-TIME]

# One-time branch-only pilot. Creating this file is the only intended trigger.
# It reuses the proven Run282 controller: one stale Ready row, max four Gemini
# deep-dive requests, canonical Gates/persistence, and no note draft/publication.
on:
  push:
    branches:
      - fix/run367-readonly-audit-reader-conflict
    paths:
      - '.github/workflows/run368-branch-pilot-recovery.yml'

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-one-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Safety contract
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/run367-readonly-audit-reader-conflict"
          echo 'Run368 pilot: reuse Run282, max candidates=1, max model requests=4, public publication=false.'

      - name: Checkout triggering branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install locked production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zero-API safety tests
        run: |
          python -m unittest tests.test_run282_current_policy_ready_recovery -v
          python -m pytest tests/test_run367_readonly_and_reader_interaction.py -q
          python run280_publication_dependency_guard.py

      - name: Recover exactly one stale Ready row with Gemini allowed
        run: python production_pipeline.py
        env:
          TZ: 'Asia/Tokyo'
          AIIF_ONE_SHOT_MODE: 'current_policy_ready_recovery'
          ENABLE_RUN286_NOTION_LIVE_STATUS_GUARD: 'true'
          CURRENT_POLICY_READY_RECOVERY_LIMIT: '1'
          CURRENT_POLICY_READY_RECOVERY_REQUEST_BUDGET: '4'
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: '4'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: '0'
          ENABLE_REVENUE_PRODUCT_PHASE2: ${{ vars.ENABLE_REVENUE_PRODUCT_PHASE2 || 'true' }}
          TRACKING_ELIGIBILITY_MIN_SCORE: '55'
          TRACKING_REVIEW_DAYS: '14'
          PRODUCT_REVIEW_MAX_PER_RUN: '0'
          LEGACY_BOOTSTRAP_MAX_PER_RUN: '0'
          DEFERRED_DEEP_DIVE_MAX_PER_RUN: '0'
          ENABLE_SUBSCRIBER_TECH_SYNC: 'false'
          ENABLE_DECISION_MONTHLY_DIGEST: 'false'
          ARTICLE_PUBLICATION_MODE: 'free'
          ENABLE_SUBSCRIPTION_ATTRIBUTION: 'true'
          SUBSCRIPTION_LANDING_URL: ${{ vars.SUBSCRIPTION_LANDING_URL }}
          SUBSCRIPTION_CAMPAIGN_ID: 'ai_intelligence_factory_subscription'
          SUBSCRIPTION_ATTRIBUTION_DIR: 'subscription_attribution/articles'
          SUBSCRIPTION_ATTRIBUTION_GITHUB_DIR: 'subscription_attribution/articles'
          EYECATCH_MIN_DECISION_SCORE: '60'
          TOP_N_FOR_DEEP_DIVE: '1'
          ENABLE_PUBLICATION_RELIABILITY_SLOT: 'false'
          ENABLE_DETERMINISTIC_PUBLICATION_RESCUE: 'true'
          NOTION_SAVE_THRESHOLD_SCORE: '60'
          ENABLE_PROFIT_PRIORITY: 'true'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: 'main'
          EYECATCH_GITHUB_BRANCH: 'main'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_38_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          GEMINI_SCREENING_MODEL_CANDIDATES: 'gemini-3.5-flash-lite,gemini-3.1-flash-lite'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.7-flash,gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_PENDING_RETRY_REQUEST_BUDGET: '0'
          MAX_EVIDENCE_DOCUMENTS: '3'
          VERIFICATION_CONTEXT_MAX_CHARS: '180000'

      - name: Reconcile Note Ready only
        run: python note_ready_sync.py | tee /tmp/run368-note-ready.txt
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'

      - name: Save pilot audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run368-branch-pilot-${{ github.run_number }}
          path: |
            article_audit/
            review_candidates/
            quality_failures/
            gate_history/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record boundary
        if: always()
        run: |
          {
            echo '### Run368 branch pilot'
            echo '- stale Ready candidates: at most `1`'
            echo '- Gemini/model requests: at most `4`'
            echo '- current canonical Gate stack: `true`'
            echo '- Notion persistence/read-back verification: `true`'
            echo '- fresh acquisition / Screening / Product Review: `false`'
            echo '- private note draft / browser / VM: `false`'
            echo '- public note publication: `false`'
            echo '- Daily schedule changed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
