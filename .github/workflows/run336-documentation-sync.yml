name: Run336 canonical Run335 documentation sync

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC_RUN335_CANONICAL_DOCUMENTATION'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: run336-canonical-doc-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.run_attempt == 1 &&
       github.event.issue.number == 71 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'trendhub-ab' &&
       github.actor == 'trendhub-ab' &&
       github.event.comment.body == '/aiif docs sync-run335')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate exact authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            [ "$CONFIRM" = 'SYNC_RUN335_CANONICAL_DOCUMENTATION' ] || exit 1
          else
            [ "$COMMENT" = '/aiif docs sync-run335' ] || exit 1
          fi
      - name: Falsify deterministic documentation migration
        run: python -m unittest tests.test_run336_documentation_sync -v
      - name: Apply Run336 canonical documentation sync
        run: python run336_documentation_sync.py
      - name: Enforce exact output file set
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'README.md',
              'AI_Intelligence_Factory_最終仕様書.md',
              'docs/reference/RUN335_NOTE_ONBOARDING_CUSTOMER_SURFACE_BASELINE.md',
              '.github/workflows/note-membership-description-postsave-audit.yml',
              'run335_membership_description_postsave_readonly_audit.py',
              'tests/test_run335_membership_description_postsave_readonly_audit.py',
              '.github/workflows/run336-documentation-sync.yml',
              'run336_documentation_sync.py',
              'tests/test_run336_documentation_sync.py',
          }
          raw = subprocess.check_output(
              ['git', '-c', 'core.quotepath=false', 'status', '--short'],
              text=True,
          )
          observed = set()
          for line in raw.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              observed.add(path)
          if observed != expected:
              raise SystemExit(f'Run336 unexpected changed paths: observed={sorted(observed)!r} expected={sorted(expected)!r}')
          print('RUN336_OUTPUT_FILESET=PASS')
          PY
      - name: Create deterministic output branch
        env:
          OUTPUT_BRANCH: run336-doc-sync-output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$OUTPUT_BRANCH"
          git add -A
          git commit -m 'Run336: promote Run335 note customer-surface baseline'
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH" --force
      - name: Summarize zero-provider contract
        run: |
          {
            echo '### Run336 canonical documentation sync'
            echo '- output branch: `run336-doc-sync-output`'
            echo '- paid member note onboarding baseline: `Run335`'
            echo '- note mutations: `0`'
            echo '- Gemini/model calls: `0`'
            echo '- Notion writes: `0`'
            echo '- one-shot Run335/Run336 machinery retired in output branch: `true`'
          } >> "$GITHUB_STEP_SUMMARY"
