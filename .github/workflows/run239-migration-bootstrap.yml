name: Run239 Guarded Reader Experience Migration

on:
  push:
    branches:
      - run239-pipeline-modularization-next
    paths:
      - .github/workflows/run239-migration-bootstrap.yml
      - run239_reader_experience_migration.py
      - tests/test_run239_reader_experience_module.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run239-pipeline-modularization-next
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply fail-closed mechanical extraction
        run: python run239_reader_experience_migration.py
      - name: Compile ownership surface
        run: python -m py_compile pipeline.py reader_experience_signals.py run239_reader_experience_migration.py
      - name: Falsify pure module ownership contract
        run: python -m unittest tests.test_run239_reader_experience_module -v
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit migrated production source
        shell: bash
        run: |
          if git diff --quiet -- pipeline.py reader_experience_signals.py; then
            echo "Expected Run239 migration produced no production diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py reader_experience_signals.py
          git commit -m "Run239: extract reader experience diagnostics from pipeline"
          git push origin HEAD:run239-pipeline-modularization-next
