name: Real Article Regression Test

on:
  workflow_dispatch:

concurrency:
  group: ai-intelligence-regression
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 指定3記事を再生成・検証
        run: python pipeline.py
        env:
          REGEN_TEST_MODE: "true"
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2026-03-11"
          GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: "gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash"
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_36_FLASH_DAILY_BUDGET: "18"
          GEMINI_37_FLASH_DAILY_BUDGET: "18"
          GEMINI_35_FLASH_DAILY_BUDGET: "18"
      - name: 回帰テスト出力を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-test-output
          path: regen_test_outputs/
          if-no-files-found: error
          retention-days: 14
