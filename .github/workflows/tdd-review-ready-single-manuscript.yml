name: TDD Review Ready Single Manuscript

on:
  push:
    branches:
      - fix/review-ready-single-manuscript-20261012

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/review-ready-single-manuscript-20261012
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Write RED contract tests
        run: |
          cat > tests/test_review_ready_single_manuscript.py <<'PY'
          from pathlib import Path
          import unittest

          SOURCE = Path("pipeline.py").read_text(encoding="utf-8")
          START = SOURCE.index("def upgrade_notion_page_with_report")
          END = SOURCE.find("\ndef ", START + 10)
          BODY = SOURCE[START: END if END != -1 else len(SOURCE)]


          class ReviewReadySingleManuscriptContractTests(unittest.TestCase):
              def test_review_cleanup_is_required_before_ready_property_commit(self):
                  call = "_delete_notion_review_manuscripts_before_ready(page_id, repo_name, headers)"
                  self.assertIn(call, BODY)
                  self.assertLess(BODY.index(call), BODY.index("# Phase 2:"))
                  self.assertIn("Notion Review manuscript cleanup failed before Ready commit", BODY)

              def test_ready_commit_is_not_allowed_to_precede_review_cleanup(self):
                  self.assertNotIn("Ready commit後の旧Review原稿整理はbest-effort", BODY)
                  self.assertNotIn("[NOTION REVIEW CLEANUP PARTIAL]", BODY)

              def test_properties_failure_keeps_formal_manuscript_for_idempotent_retry(self):
                  marker = "[NOTION UPGRADE PROPERTIES ERROR]"
                  pos = BODY.index(marker)
                  failure_window = BODY[pos:pos + 700]
                  self.assertNotIn("_rollback_notion_manuscript_children", failure_window)
                  self.assertIn("_mark_pending_retry_or_escalate", failure_window)

              def test_existing_formal_manuscript_guard_still_prevents_reappend(self):
                  guard = "has_existing_manuscript = _notion_page_has_manuscript(page_id, headers)"
                  skip = "[NOTION UPGRADE CHILDREN SKIPPED]"
                  append = "build_notion_manuscript_children(clean_manuscript)"
                  self.assertIn(guard, BODY)
                  self.assertIn(skip, BODY)
                  self.assertIn(append, BODY)
                  self.assertLess(BODY.index(guard), BODY.index(append))


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: RED must fail before implementation
        run: |
          set +e
          python -m unittest tests.test_review_ready_single_manuscript -v > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Expected RED test failure before implementation'
            exit 1
          fi
          echo 'RED confirmed: current implementation violates the single-manuscript Ready invariant.'
      - name: Apply minimal fail-closed implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pipeline.py")
          source = path.read_text(encoding="utf-8")

          helper_anchor = "\ndef _rollback_notion_manuscript_children(block_ids: list[str], repo_name: str, headers: dict) -> None:\n"
          if helper_anchor not in source:
              raise SystemExit("helper anchor not found")
          helper = r'''
          def _delete_notion_review_manuscripts_before_ready(page_id: str, repo_name: str, headers: dict) -> bool:
              """Delete every Review manuscript before the page may be committed Ready.

              Review cleanup is part of the Ready transaction, not post-commit housekeeping.
              A read/delete failure therefore fails closed: the page must remain non-Ready and
              can be retried without appending another formal manuscript.
              """
              try:
                  review_block_ids = _notion_review_manuscript_block_ids(page_id, headers)
              except Exception as exc:
                  logger.error(
                      f"[NOTION REVIEW CLEANUP READ FAILED] {repo_name} -> "
                      f"Ready確定前の旧Review manuscript確認失敗: {exc}"
                  )
                  return False

              for block_id in review_block_ids:
                  try:
                      cleanup_res = requests.delete(
                          f"https://api.notion.com/v1/blocks/{block_id}",
                          headers=headers,
                          timeout=20,
                      )
                      cleanup_res.raise_for_status()
                  except Exception as exc:
                      logger.error(
                          f"[NOTION REVIEW CLEANUP FAILED] {repo_name} -> "
                          f"Ready確定前の旧Review manuscript削除失敗 block={block_id}: {exc}"
                      )
                      return False

              if review_block_ids:
                  logger.info(
                      f"[NOTION REVIEW CLEANUP OK] {repo_name} -> "
                      f"Ready確定前に旧Review manuscript {len(review_block_ids)}件を削除"
                  )
              return True

          '''
          source = source.replace(helper_anchor, "\n" + helper + helper_anchor.lstrip("\n"), 1)

          phase2 = "    # Phase 2: children保存成功（またはスキップ）後にのみ、\n"
          if phase2 not in source:
              raise SystemExit("Phase 2 anchor not found")
          strict_cleanup = '''    # Review稿の削除はReady transactionの必須条件。\n    # cleanup失敗時はReadyへ進めず、次回retryで同じ正式稿を再利用する。\n    if not _delete_notion_review_manuscripts_before_ready(page_id, repo_name, headers):\n        _mark_pending_retry_or_escalate(\n            page_id, repo_name, "Notion Review manuscript cleanup failed before Ready commit"\n        )\n        return False\n\n'''
          source = source.replace(phase2, strict_cleanup + phase2, 1)

          old_failure = '''            logger.error(f"[NOTION UPGRADE PROPERTIES ERROR] {repo_name} -> {res_props.text}")\n            if appended_block_ids:\n                _rollback_notion_manuscript_children(appended_block_ids, repo_name, headers)\n            _mark_pending_retry_or_escalate(page_id, repo_name, "Notion properties commit failed after children saved")\n            return False\n'''
          new_failure = '''            logger.error(f"[NOTION UPGRADE PROPERTIES ERROR] {repo_name} -> {res_props.text}")\n            # 正式manuscriptは保持する。次回retryの既存稿guardでre-appendを防ぎ、\n            # properties commitだけを安全に再試行できるようにする。\n            _mark_pending_retry_or_escalate(page_id, repo_name, "Notion properties commit failed after children saved")\n            return False\n'''
          if old_failure not in source:
              raise SystemExit("properties failure block not found")
          source = source.replace(old_failure, new_failure, 1)

          old_cleanup_marker = "        # Ready commit後の旧Review原稿整理はbest-effort。ここでread不能でも、\n"
          cleanup_start = source.find(old_cleanup_marker)
          if cleanup_start == -1:
              raise SystemExit("post-commit cleanup marker not found")
          return_pos = source.find("        return True", cleanup_start)
          if return_pos == -1:
              raise SystemExit("return after post-commit cleanup not found")
          source = source[:cleanup_start] + source[return_pos:]

          old_doc = '''    Phase 1成功後にPhase 2（properties）が失敗した場合（= 本文だけ追加されて\n    しまいステータスがReady/Deep Diveに更新されない不整合状態）は、\n    (1) 今回追加したchildren blockをbest-effortでrollback（archive）し、\n    (2) ページをPending Retryへ更新し、次回get_pending_retry_items()から\n        自動的に復元・再試行されるようにする。\n    rollbackが失敗した場合に備え、Phase 1の冒頭で「既にmanuscript child\n'''
          new_doc = '''    Phase 1成功後、旧Review manuscriptをすべて削除できた場合に限って\n    Phase 2（properties）でReadyをcommitする。cleanup失敗はfail-closedで\n    Pending Retryへ送り、Ready状態で複数稿が残ることを禁止する。\n    Phase 2が失敗した場合も正式manuscriptは保持し、次回retryでは既存稿guardに\n    よってre-appendせずproperties commitを再試行する。Phase 1の冒頭で「既にmanuscript child\n'''
          if old_doc in source:
              source = source.replace(old_doc, new_doc, 1)

          path.write_text(source, encoding="utf-8")
          PY
      - name: GREEN focused regression
        run: python -m unittest tests.test_review_ready_single_manuscript -v
      - name: Syntax check
        run: python -m py_compile pipeline.py tests/test_review_ready_single_manuscript.py
      - name: Commit implementation and regression test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py tests/test_review_ready_single_manuscript.py
          git commit -m 'fix: make Review cleanup mandatory before Ready commit'
          git push origin HEAD:fix/review-ready-single-manuscript-20261012
