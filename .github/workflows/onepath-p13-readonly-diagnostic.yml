# Read-only diagnostic of the repaired P13 implementation after observed HTTP 429.
name: AIIF OnePath - P13 Read-only Failure Diagnostic
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: onepath-p13-readonly-diagnostic
  cancel-in-progress: false
jobs:
  probe-p13-readonly:
    if: >-
      ${{ github.repository == 'trendhub-ab/ai-intelligence-factory' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'issues' &&
          github.event.action == 'opened' &&
          github.actor == 'trendhub-ab' &&
          github.event.issue.user.login == 'trendhub-ab' &&
          github.event.issue.title == 'AIIF OLD: P13 READONLY DIAGNOSTIC' &&
          github.event.issue.body == 'OWNER_GO_P13_REPAIRED_READONLY_DIAGNOSTIC_45598412302' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: legacy
      - uses: actions/checkout@v4
        with:
          repository: trendhub-ab/ai-intelligence-factory-next
          ref: 0a20749c370b3fd1fbd601f479c2b703775d6858
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: next-p1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact code and offline diagnostic contract
        run: |
          set -euo pipefail
          test "$(git -C next-p1 rev-parse HEAD)" = "0a20749c370b3fd1fbd601f479c2b703775d6858"
          cd legacy
          python -B -m unittest tests.test_run_onepath_notion_readonly_diagnostic -v
      - name: Validate repaired read-only scan without exposing content
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          PYTHONPATH=next-p1/src python -B legacy/run_onepath_notion_readonly_diagnostic.py
