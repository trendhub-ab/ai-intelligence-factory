name: X Discovery Apify Smoke

on:
  push:
    branches:
      - feature/x-discovery-ingestion
    paths:
      - '.github/workflows/x-discovery-apify-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apify-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR_ID: simple.actor~x-profile-posts
      APIFY_INPUT_JSON: '{"handles":["OpenAI","AnthropicAI","GoogleDeepMind","huggingface","ylecun"],"outputFormat":"posts","maxPosts":5,"onlyPostsNewerThan":"3 days","includeRaw":false}'
      APIFY_MAX_CHARGE_USD: '0.05'
      MAX_RECORDS: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate live-run guardrails
        run: |
          python - <<'PY'
          import json
          import os

          if not os.getenv('APIFY_TOKEN', '').strip():
              raise SystemExit('APIFY_TOKEN repository secret is required; refusing live run')
          if os.environ.get('APIFY_ACTOR_ID') != 'simple.actor~x-profile-posts':
              raise SystemExit('unexpected Actor ID; refusing live run')
          max_records = int(os.environ['MAX_RECORDS'])
          max_charge = float(os.environ['APIFY_MAX_CHARGE_USD'])
          if not 1 <= max_records <= 25:
              raise SystemExit('one-shot smoke max_records must be between 1 and 25')
          if not 0 < max_charge <= 0.05:
              raise SystemExit('one-shot smoke max_charge_usd must be > 0 and <= 0.05')
          actor_input = json.loads(os.environ['APIFY_INPUT_JSON'])
          if not isinstance(actor_input, dict) or len(actor_input.get('handles', [])) != 5:
              raise SystemExit('one-shot smoke must contain exactly five handles')
          print('One-shot live guardrails OK; official X API remains unused.')
          PY
      - name: Run isolated Apify smoke ingestion
        run: |
          python -m x_discovery.runner \
            --provider apify \
            --output-dir /tmp/x-discovery-apify \
            --max-records "$MAX_RECORDS"
      - name: Verify no Factory or Evidence writes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/x-discovery-apify')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['provider'] == 'apify'
          assert manifest['factory_write'] is False
          assert manifest['evidence_promoted'] is False
          assert manifest['x_official_api_calls'] == 0
          assert manifest['external_provider_calls'] == 1
          print(json.dumps(manifest, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-discovery-apify-smoke-${{ github.run_number }}
          path: /tmp/x-discovery-apify/
          if-no-files-found: error
          retention-days: 7
