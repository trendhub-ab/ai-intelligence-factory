name: Run244 Documentation Reconciliation
on:
  push:
    branches:
      - run244-pipeline-modularization-next
    paths:
      - run244_documentation_reconciliation.py
      - .github/workflows/run244-inventory.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply fail-closed documentation reconciliation
        run: python run244_documentation_reconciliation.py
      - name: Validate documentation freshness
        run: python documentation_freshness_guard.py
      - name: Validate whitespace
        run: git diff --check
      - name: Commit canonical documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md AI_Intelligence_Factory_最終仕様書.md
          git diff --cached --quiet && exit 0
          git commit -m 'Run244: update canonical documentation'
          git push origin HEAD:run244-pipeline-modularization-next
