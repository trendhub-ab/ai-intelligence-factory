name: Editorial Engine v3 — P4 Pinned C-only Quality Proof

# Branch-specific manual revision of a workflow already registered on main.
# Use "Run workflow" with branch feature/editorial-engine-v3-p4-pinned-live-proof.
# This experiment NEVER runs on push, PR, schedules, or automated ChatOps.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter RUN_V3_P4_C_ONLY exactly; 3 cases, 3 logical model calls after 17:00 JST'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  p4-c-only:
    name: P3 Editorial Engine — isolated bounded C-only trial
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/editorial-engine-v3-p4-pinned-live-proof' && github.actor == 'trendhub-ab' && inputs.confirm == 'RUN_V3_P4_C_ONLY' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ai-intelligence-gemini-budget
      cancel-in-progress: false
    steps:
      - name: Checkout immutable GREEN P3 runtime — not moving P4 branch or Production
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 03b3c237442c4c2b335440d363796c0def175c20
          persist-credentials: false

      - name: Set up bounded isolated Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install focused offline runner and bounded Gemini client
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check 'google-genai>=1.56.0,<2.0.0'

      - name: Offline P3 tests, frozen A/B, and reader-discovery prompt (no provider calls)
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_editorial_engine_v3_phase0.py \
            tests/test_editorial_engine_v3_phase0_live.py \
            tests/test_editorial_engine_v3_phase0_quality_contract.py \
            tests/test_editorial_engine_v3_phase0_proof.py \
            tests/test_v3_reader_experience_diagnostics.py
          python - <<'PY'
          from experiments.editorial_engine_v3_phase0.cases import READY_CASES
          from experiments.editorial_engine_v3_phase0.prompts import READER_DISCOVERY_SCENE, build_editorial_bundle_prompt
          assert len(READY_CASES) == 3
          assert all(READER_DISCOVERY_SCENE in build_editorial_bundle_prompt(c.case) for c in READY_CASES)
          PY

      - name: Restore immutable reviewed 3-case A/B checkpoint
        uses: actions/download-artifact@v4
        with:
          name: editorial-engine-v3-phase0-checkpoint
          path: phase0_artifacts
          github-token: ${{ github.token }}
          run-id: 39239644474

      - name: Validate old checkpoint source and snapshot frozen A/B (no provider calls)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.editorial_engine_v3_phase0.cases import READY_CASES
          data=json.loads(Path('phase0_artifacts/checkpoint.json').read_text(encoding='utf-8'))
          assert data['selected_model'] == 'gemini-3.8-flash'
          assert len(data['cases']) == 3
          assert [c['case_id'] for c in data['cases']] == [item.case.case_id for item in READY_CASES]
          assert all(c['outputs'].get('A_CURRENT_WRITER') and c['outputs'].get('B_PERSONA_ONLY') for c in data['cases'])
          print('CHECKPOINT_BASELINE_OK: preserved A/B, 3 cases, locked gemini-3.8-flash')
          PY
          python -m experiments.editorial_engine_v3_phase0.proof snapshot-baseline --output-dir phase0_artifacts

      - name: Enforce Gemini API use after 17:00 JST
        run: |
          python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; hour = datetime.now(ZoneInfo("Asia/Tokyo")).hour; assert hour >= 17, "Gemini API is forbidden before 17:00 JST"'

      - name: Run exactly three C-only editorial cases, same model, no Lite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_PHASE0_MODELS: 'gemini-3.8-flash'
          AIIF_PHASE0_CASE_COOLDOWN_SECONDS: '45'
          AIIF_PHASE0_REGENERATE_C_ONLY: 'true'
          AIIF_PHASE0_OUTPUT_DIR: phase0_artifacts
        run: python -m experiments.editorial_engine_v3_phase0.live

      - name: Validate untouched A/B and complete fresh C proof
        if: ${{ always() }}
        env:
          AIIF_PHASE0_MODELS: 'gemini-3.8-flash'
        run: python -m experiments.editorial_engine_v3_phase0.proof verify --output-dir phase0_artifacts

      # This is human-review evidence, never a publishing or merge gate.
      # Files include proof_verdict.json and c_reader_experience_diagnostics.json.
      - name: Upload proof_verdict.json, c_reader_experience_diagnostics.json and blind review
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-engine-v3-p4-pinned-c-only-review
          path: phase0_artifacts
          if-no-files-found: warn
          retention-days: 14
