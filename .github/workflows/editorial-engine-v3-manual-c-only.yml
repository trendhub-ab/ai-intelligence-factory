name: Editorial Engine v3 P1 — Manual C-only Proof

# Independent, default-branch entrypoint. The experimental V3 branch stays Draft/NO-GO.
# This workflow never dispatches from push, schedule, or a pull request.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_V3_P1_C_ONLY exactly; runs only the pinned P1 C refinement'
        required: true
        type: string
      one_off_model:
        description: 'One-off C-only model (default preserves same-model comparison)'
        required: true
        type: choice
        default: gemini-3.8-flash
        options:
          - gemini-3.8-flash
          - gemini-3.6-flash
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  c-only-proof:
    name: Pinned V3 P1 C-only bounded proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_V3_P1_C_ONLY' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ai-intelligence-gemini-budget
      cancel-in-progress: false
    steps:
      - name: Checkout reviewed immutable V3 Phase 0 commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 69103a38abaf68764fd321ac9a5ef35d89b7f6ce
          persist-credentials: false

      - name: Set up bounded test runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install focused V3 test runner and Gemini client
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check 'google-genai>=1.56.0,<2.0.0'

      # Exactly these four focused files exist in the immutable checkout, not in main:
      # tests/test_editorial_engine_v3_phase0.py
      # tests/test_editorial_engine_v3_phase0_live.py
      # tests/test_editorial_engine_v3_phase0_quality_contract.py
      # tests/test_editorial_engine_v3_phase0_proof.py
      - name: Verify reviewed Phase 0 contracts (offline; no API calls)
        shell: bash
        run: |
          files=(tests/test_editorial_engine_v3_phase0*.py)
          test "${#files[@]}" -eq 4
          python -m pytest -q "${files[@]}"

      - name: Restore immutable prior A/B/C checkpoint
        uses: actions/download-artifact@v4
        with:
          name: editorial-engine-v3-phase0-checkpoint
          path: phase0_artifacts
          github-token: ${{ github.token }}
          run-id: 39239644474

      - name: Snapshot original A/B digests (fail closed on invalid baseline)
        run: python -m experiments.editorial_engine_v3_phase0.proof snapshot-baseline --output-dir phase0_artifacts

      - name: Enforce Gemini API use after 17:00 JST
        shell: bash
        run: |
          python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; hour = datetime.now(ZoneInfo("Asia/Tokyo")).hour; assert hour >= 17, "Gemini API is forbidden before 17:00 JST"'

      - name: Prepare explicitly mixed-model C-only checkpoint (one-off exception)
        if: ${{ inputs.one_off_model == 'gemini-3.6-flash' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('phase0_artifacts/checkpoint.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          assert state['selected_model'] == 'gemini-3.8-flash', 'unexpected baseline model'
          assert len(state['cases']) == 3, 'unexpected case count'
          state['baseline_selected_model'] = state['selected_model']
          state['comparison_model_exception'] = 'ONE_OFF_MIXED_MODEL_C_3_6_FLASH'
          state['selected_model'] = 'gemini-3.6-flash'
          state.pop('c_refinement_fingerprint', None)
          state.pop('c_completed_case_ids', None)
          state.pop('c_refinement_provider_calls_total', None)
          state.pop('c_refinement_provider_attempts_total', None)
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
          print('One-off mixed-model exception: A/B baseline 3.8 Flash; C-only 3.6 Flash')
          PY

      - name: Run exactly three C-only Editorial Engine cases (A/B preserved)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_PHASE0_MODELS: ${{ inputs.one_off_model }}
          AIIF_PHASE0_CASE_COOLDOWN_SECONDS: '45'
          AIIF_PHASE0_REGENERATE_C_ONLY: 'true'
          AIIF_PHASE0_OUTPUT_DIR: phase0_artifacts
        run: python -m experiments.editorial_engine_v3_phase0.live

      - name: Verify byte-identical A/B and exact C-only proof
        if: ${{ always() }}
        env:
          AIIF_PHASE0_MODELS: ${{ inputs.one_off_model }}
        run: python -m experiments.editorial_engine_v3_phase0.proof verify --output-dir phase0_artifacts

      - name: Upload checkpoint, blind evaluation, and structural verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-engine-v3-p1-checkpoint-${{ inputs.one_off_model }}
          path: phase0_artifacts
          if-no-files-found: warn
          retention-days: 7
