name: Current-policy Ready Recovery [ONE-SHOT]

# Run282: recover at most one historical Ready manuscript under the checked-out
# Publication Contract. This workflow is intentionally separate from normal ONE-SHOT:
# it performs no fresh acquisition, no Screening, no Product Review, no public release,
# and no private note draft/VM fan-out. After recovery it only reconciles Note Ready DB.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RECOVER_ONE_READY to recover at most one stale Ready row'
        required: true
        default: ''
        type: string

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-one-current-policy-ready:
    if: ${{ inputs.confirm == 'RECOVER_ONE_READY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recovery safety contract
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "RECOVER_ONE_READY"
          echo 'Run282/284/285/286 recovery confirmed: max candidates=1, max deep-dive requests=4, max reader-only repair=1, draft/VM=false.'

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install locked production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zero-API Run282/284/285/286 recovery contract tests
        run: |
          python -m unittest tests.test_run282_current_policy_ready_recovery -v
          python -m unittest tests.test_run284_reader_recovery_precision -v
          python -m unittest tests.test_run285_operational_accounting -v
          python -m unittest tests.test_run286_notion_consistency_precision -v
          python run280_publication_dependency_guard.py

      - name: Recover one stale Ready on its original Notion page
        run: python production_pipeline.py
        env:
          TZ: 'Asia/Tokyo'
          AIIF_ONE_SHOT_MODE: 'current_policy_ready_recovery'
          CURRENT_POLICY_READY_RECOVERY_LIMIT: '1'
          CURRENT_POLICY_READY_RECOVERY_REQUEST_BUDGET: '4'
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: '4'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: '0'
          ENABLE_REVENUE_PRODUCT_PHASE2: ${{ vars.ENABLE_REVENUE_PRODUCT_PHASE2 || 'true' }}
          TRACKING_ELIGIBILITY_MIN_SCORE: '55'
          TRACKING_REVIEW_DAYS: '14'
          PRODUCT_REVIEW_MAX_PER_RUN: '0'
          LEGACY_BOOTSTRAP_MAX_PER_RUN: '0'
          DEFERRED_DEEP_DIVE_MAX_PER_RUN: '0'
          ENABLE_SUBSCRIBER_TECH_SYNC: 'false'
          ENABLE_DECISION_MONTHLY_DIGEST: 'false'
          ARTICLE_PUBLICATION_MODE: 'free'
          ENABLE_SUBSCRIPTION_ATTRIBUTION: 'true'
          SUBSCRIPTION_LANDING_URL: ${{ vars.SUBSCRIPTION_LANDING_URL }}
          SUBSCRIPTION_CAMPAIGN_ID: 'ai_intelligence_factory_subscription'
          SUBSCRIPTION_ATTRIBUTION_DIR: 'subscription_attribution/articles'
          SUBSCRIPTION_ATTRIBUTION_GITHUB_DIR: 'subscription_attribution/articles'
          EYECATCH_MIN_DECISION_SCORE: '60'
          TOP_N_FOR_DEEP_DIVE: '1'
          ENABLE_PUBLICATION_RELIABILITY_SLOT: 'false'
          ENABLE_DETERMINISTIC_PUBLICATION_RESCUE: 'true'
          NOTION_SAVE_THRESHOLD_SCORE: '60'
          ENABLE_PROFIT_PRIORITY: 'true'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: 'main'
          EYECATCH_GITHUB_BRANCH: 'main'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_38_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          GEMINI_SCREENING_MODEL_CANDIDATES: 'gemini-3.5-flash-lite,gemini-3.1-flash-lite'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.7-flash,gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_PENDING_RETRY_REQUEST_BUDGET: '0'
          MAX_EVIDENCE_DOCUMENTS: '3'
          VERIFICATION_CONTEXT_MAX_CHARS: '180000'

      - name: Reconcile and verify current-policy Ready — no private draft fan-out
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import note_ready_sync as sync

          payload = {
              'filter': {
                  'property': sync.SOURCE_ARTICLE_STATUS,
                  'select': {'equals': sync.SOURCE_READY},
              }
          }
          for attempt in (1, 2):
              rows = sync._query_db(sync.SOURCE_DATA_SOURCE_ID, sync.SOURCE_DATABASE_ID, payload=payload)
              print(f'RUN286_NOTION_CONSISTENCY_PROBE attempt={attempt} ready_rows={len(rows)}')
              time.sleep(2)
          PY
          python note_ready_sync.py | tee /tmp/run282-note-ready.txt
          python - <<'PY'
          import ast
          from pathlib import Path

          lines = [line.strip() for line in Path('/tmp/run282-note-ready.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          payload = None
          for line in reversed(lines):
              if not line.startswith('{'):
                  continue
              try:
                  candidate = ast.literal_eval(line)
              except (SyntaxError, ValueError):
                  continue
              if isinstance(candidate, dict) and 'source_ready' in candidate:
                  payload = candidate
                  break
          if payload is None:
              raise SystemExit('Run282 verification failed: Note Ready result payload was not found')
          current_ready = int(payload.get('source_ready') or 0)
          if current_ready < 1:
              raise SystemExit('Run282 verification failed: current-policy source_ready stayed 0')
          print(f'RUN282_CURRENT_POLICY_READY_VERIFIED={current_ready}')
          PY
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'

      - name: Save recovery audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-policy-ready-recovery-${{ github.run_number }}
          path: |
            article_audit/
            review_candidates/
            quality_failures/
            gate_history/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record cost and publication boundary
        if: always()
        run: |
          {
            echo '### Run282/284/285/286 Current-policy Ready Recovery'
            echo '- stale Ready candidates regenerated: at most `1`'
            echo '- deep-dive/model request hard cap: `4`'
            echo '- reader-only model repair: at most `1`, only with Evidence SUFFICIENT + safe decision scope'
            echo '- Run285 evidence/accounting audit: observational, adds `0` model/fetch calls'
            echo '- Run286 live-status confirmation: fail-closed before model generation'
            echo '- Run286 Notion reconciliation probes: read-only; final Note Ready sync runs after two 2-second consistency intervals'
            echo '- fresh acquisition / screening / Product Review: `false`'
            echo '- Note Ready reconciliation: `true`'
            echo '- successful workflow requires current-policy `source_ready >= 1`'
            echo '- private note draft / VM / browser: `false`'
            echo '- public note publication: `false` (human-only)'
            echo '- Daily schedule changed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
