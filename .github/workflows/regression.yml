name: Synthetic Regression Suite

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'observed_history/**'
      - 'source_roi_history/**'
      - 'subscription_attribution/**'
      - 'eyecatch_images/**'
      - 'deferred_deep_dive/**'
      - '.runtime/**'
  workflow_dispatch:
    inputs:
      suite:
        description: "Run Synthetic Regression Suite"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - core
          - full

permissions:
  contents: read

concurrency:
  group: ai-intelligence-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Synthetic Regression (${{ github.event.inputs.suite || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run production safety tests
        run: python -m unittest discover -s tests -v

      - name: Run harness self-test
        run: python regression_suite.py --self-test

      - name: Run synthetic regression suite
        run: python regression_suite.py --bootstrap --${{ github.event.inputs.suite || 'smoke' }}

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ github.event.inputs.suite || 'smoke' }}-${{ github.run_number }}
          path: regression_suite_runs/
          if-no-files-found: warn
          retention-days: 30
