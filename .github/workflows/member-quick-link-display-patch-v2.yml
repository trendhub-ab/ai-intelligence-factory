name: Member Quick Link Display Patch V2

on:
  push:
    branches:
      - ops/member-home-host-migration-proof
    paths:
      - .github/workflows/member-quick-link-display-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ops/member-home-host-migration-proof
          fetch-depth: 0

      - name: Apply bounded quick-link title map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("member_presentation_sync.py")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "_MEMBER_PRESENTATION_TITLE_OVERRIDES = {",
              "    \"github:mintplex-labs/anything-llm\": \"AnythingLLM\",",
              "}",
              "",
          ])
          new = "\n".join([
              "_MEMBER_PRESENTATION_TITLE_OVERRIDES = {",
              "    \"github:langgenius/dify\": \"Dify\",",
              "    \"github:mintplex-labs/anything-llm\": \"AnythingLLM\",",
              "    \"github:browser-use/browser-use\": \"browser-use\",",
              "    \"github:comfyanonymous/comfyui\": \"ComfyUI\",",
              "    \"github:cline/cline\": \"Cline\",",
              "}",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit("title override anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m compileall -q member_presentation_sync.py tests/test_member_presentation_display_names.py
          git diff --check

      - name: Commit bounded fix
        shell: bash
        run: |
          git config user.name "TrendHub"
          git config user.email "trendhub.biz@gmail.com"
          git add member_presentation_sync.py
          git commit -m "fix: normalize member quick-link display names"
          git push origin HEAD:ops/member-home-host-migration-proof
