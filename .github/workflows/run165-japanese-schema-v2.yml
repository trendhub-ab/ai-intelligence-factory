name: Run165 Japanese Internal Schema V2

on:
  push:
    branches: [run165-japanese-internal-schema]

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: contains(github.event.head_commit.message, 'RUN165 V2')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run165-japanese-internal-schema
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply deterministic code migration
        run: python run165_japanese_schema_migration.py
      - name: Compile
        run: python -m compileall -q pipeline.py decision_intelligence.py evidence_ledger.py
      - name: Full unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Synthetic smoke
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: smoke
        run: python pipeline.py
      - name: Commit migrated production code
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py decision_intelligence.py evidence_ledger.py tests/test_run161_internal_db_japanese_display_contract.py
          git commit -m 'Run165: Japanese physical internal Notion schema contract'
          git push origin HEAD:run165-japanese-internal-schema
