name: Run164 Category Audit Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'RUN164 CATEGORY AUDIT 200')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit assessed category distribution
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: 'true'
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          import decision_intelligence as d
          rows=d.query_technology_records(max_records=5000)
          c=Counter()
          total=0
          for p in rows:
              props=p.get('properties') or {}
              state=d._select_value(props.get(d.TECH_PROP_ASSESSMENT_STATE,{}))
              if state!='ASSESSED':
                  continue
              cat=d._select_value(props.get(d.TECH_PROP_CATEGORY,{})) or 'OTHER'
              c[cat]+=1; total+=1
          out={'total':total,'categories':[{'category':k,'count':v,'ratio_pct':round(v*100/total,1) if total else 0} for k,v in sorted(c.items(), key=lambda x:(-x[1],x[0]))]}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
