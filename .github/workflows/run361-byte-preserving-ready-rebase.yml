name: Run361 Byte-Preserving Ready Rebase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run inventories exact safe candidates; apply appends identical body with current caption'
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      confirm:
        description: 'For apply only, type REBASE_IDENTICAL_BODY'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: run361-byte-preserving-ready-rebase
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for exact pre-PR policy proof
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: pip install requests

      - name: Zero-API Run360 and Run361 regression tests
        run: |
          python -m unittest tests.test_run208_reader_value_repair -v
          python -m unittest tests.test_run284_reader_recovery_precision -v
          python -m unittest tests.test_run360_retry_owner_orthogonality -v
          python -m unittest tests.test_run361_byte_preserving_ready_rebase -v
          python -m unittest tests.test_product_review_provider_lock -v
          python -m unittest tests.test_comment_write_contract -v

      - name: Fail closed on invalid apply confirmation
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'REBASE_IDENTICAL_BODY' }}
        run: |
          echo '::error::apply requires exact confirmation REBASE_IDENTICAL_BODY'
          exit 1

      - name: Audit or apply exact byte-preserving Ready rebase
        env:
          AIIF_READY_REBASE_MODE: ${{ inputs.mode }}
          AIIF_READY_REBASE_CONFIRM: ${{ inputs.confirm }}
          AIIF_READY_REBASE_MAX: '40'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run361_byte_preserving_ready_rebase.py

      - name: Reconcile note Ready DB after safe apply
        if: ${{ inputs.mode == 'apply' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python note_ready_sync.py

      - name: Upload private recovery audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run361-ready-rebase-${{ github.run_id }}
          path: gate_history/run361_stale_ready_rebase_report.json
          if-no-files-found: warn
          retention-days: 14
