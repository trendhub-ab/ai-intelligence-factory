name: Run246 Repository Cleanup Reconciliation

on:
  push:
    branches:
      - run246-repository-garbage-cleanup

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run246-repository-garbage-cleanup
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=8,<9'
      - name: Reconcile canonical documentation and historical baseline assertion
        run: python run246_repository_cleanup_reconcile.py
      - name: Falsify repository hygiene
        run: |
          python -m unittest tests.test_run200_repository_layout -v
          python -m unittest tests.test_run201_repository_garbage_cleanup -v
          python -m unittest tests.test_run246_repository_hygiene -v
          python repository_falsification_guard.py
      - name: Documentation freshness
        run: python documentation_freshness_guard.py
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Diff safety
        run: git diff --check
      - name: Commit reconciled permanent files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AI_Intelligence_Factory_最終仕様書.md tests/test_run200_repository_layout.py
          git diff --cached --quiet && exit 0
          git commit -m 'Run246: reconcile repository organization baseline'
          git push origin HEAD:run246-repository-garbage-cleanup
