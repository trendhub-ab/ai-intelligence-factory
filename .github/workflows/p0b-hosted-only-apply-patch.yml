name: P0-B Hosted-Only Apply Patch

on:
  push:
    branches:
      - p0b-hosted-only-implementation
    paths:
      - '.github/workflows/p0b-hosted-only-apply-patch.yml'
      - '.github/patches/task1_storage_neutral.py'

permissions:
  contents: write

jobs:
  apply-hosted-contract-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: p0b-hosted-only-implementation

      - name: Apply hosted-only contract cleanup
        run: python .github/patches/task1_storage_neutral.py

      - name: Commit migrated contracts
        run: |
          set -euo pipefail
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add member_customer_surface_contract.py tests/test_run273_reader_draft_autoflow.py
          git diff --cached --check
          git commit -m 'test: finish hosted-only contract migration'
          git push origin HEAD:p0b-hosted-only-implementation
