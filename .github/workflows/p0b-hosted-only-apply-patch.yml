name: P0-B Hosted-Only Apply Patch

on:
  push:
    branches:
      - p0b-hosted-only-implementation
    paths:
      - '.github/workflows/p0b-hosted-only-apply-patch.yml'
      - '.github/patches/task1_storage_neutral.py'

permissions:
  contents: write

jobs:
  apply-task3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: p0b-hosted-only-implementation

      - name: Apply exact Task 3 patch
        run: python .github/patches/task1_storage_neutral.py

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add note_delivery_runtime.py tests/test_note_delivery_ledger.py
          git diff --cached --check
          git commit -m 'fix: complete hosted ledger runtime migration'
          git push origin HEAD:p0b-hosted-only-implementation
