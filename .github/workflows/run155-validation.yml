name: Run155 Validation

on:
  push:
    branches:
      - feature/run155-ai-relevance-precision

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
      NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
      NOTION_API_VERSION: "2026-03-11"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run155 focused tests
        run: python -m unittest tests.test_run155_ai_relevance_precision -v
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Synthetic harness self-test
        run: python regression_suite.py --self-test
      - name: Synthetic smoke
        run: python regression_suite.py --bootstrap --smoke
      - name: Live 100-record launch-gate audit — zero Gemini
        run: |
          set -euo pipefail
          mkdir -p run155_validation
          python - <<'PY' | tee run155_validation/live_gate.json
          import json
          import os
          import inventory_bootstrap as ib
          import paid_db_launch_readiness as lr

          client = ib.NotionClient(os.environ["NOTION_DECISION_INTELLIGENCE_API_KEY"])
          records = [ib.normalize_technology_page(x) for x in client.query_data_source(os.environ["NOTION_TECH_DATA_SOURCE_ID"])]
          sellable = [r for r in records if ib.is_sellable(r)]
          visible = ib.subscriber_visible_count(client, os.environ["NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID"])
          quality = lr.evaluate_launch_quality(sellable)

          by_name = {r.name: r for r in sellable}
          checks = {}
          expected_true = [
              "THUDM/CogVideo",
              "openai/whisper",
              "vllm-project/vllm",
              "langgenius/dify",
              "The Model's Tell: Measuring Context-Leakage Attack Signals with Behavior Gauges",
              "Steering the Flow: Inverting Face Recognition Models via Gradient-Guided Flow Matching",
          ]
          for name in expected_true:
              if name in by_name:
                  checks[name] = lr.is_ai_relevant(by_name[name])
          if "dioxuslabs/taffy" in by_name:
              checks["dioxuslabs/taffy"] = lr.is_ai_relevant(by_name["dioxuslabs/taffy"])

          report = {
              "zero_gemini_calls": True,
              "sellable": len(sellable),
              "subscriber_visible_complete": visible,
              "quality": quality,
              "checks": checks,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))

          assert len(sellable) == 100, report
          assert visible == 100, report
          for name in expected_true:
              if name in checks:
                  assert checks[name] is True, (name, report)
          if "dioxuslabs/taffy" in checks:
              assert checks["dioxuslabs/taffy"] is False, report
          assert quality["ready"] is True, report
          PY
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run155-validation-${{ github.run_number }}
          path: |
            run155_validation/
            regression_suite_runs/
          if-no-files-found: warn
          retention-days: 30
