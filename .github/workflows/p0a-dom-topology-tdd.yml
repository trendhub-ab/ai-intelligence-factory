name: P0-A DOM Topology TDD

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-dom-topology-tdd.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'
      - name: Install locked test environment
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
      - name: Run topology contract
        run: python -m pytest -q tests/test_p0a_dom_topology_diagnostics.py
