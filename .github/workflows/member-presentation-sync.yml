name: Member Presentation Sync

on:
  workflow_dispatch:
  workflow_run:
    # The presentation DB is derived from the Subscriber Technology/Decision Brief bridge.
    # Run only after that bridge has finished so we never race a source update.
    workflows:
      - Subscriber Decision Brief Sync
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'provision_member_presentation_db.py'
      - 'member_presentation_sync.py'
      - 'member_presentation_body_sync.py'
      - 'member_ux_guard.py'
      - 'member_ux_body_fast.py'
      - 'member_human_language_ux.py'
      - 'member_human_language_ux_v2.py'
      - 'run212_member_review_copy.py'
      - 'run213_member_topic_specificity.py'
      - 'run214_member_action_specificity.py'
      - 'run215_member_action_final_dedup.py'
      - 'run219_member_human_language_ui.py'
      - 'run225_stock_lifecycle.py'
      - 'run225_member_lifecycle_ui.py'
      - 'tests/test_run158_member_presentation_sync.py'
      - 'tests/test_run166_member_page_body.py'
      - 'tests/test_run169_member_ux_guard.py'
      - 'tests/test_run169_1_member_body_fast.py'
      - 'tests/test_run170_member_human_language_ux.py'
      - 'tests/test_run170_1_member_copy_role_separation.py'
      - 'tests/test_run211_member_sync_ordering.py'
      - 'tests/test_run212_member_review_copy.py'
      - 'tests/test_run213_member_topic_specificity.py'
      - 'tests/test_run214_member_action_specificity.py'
      - 'tests/test_run215_member_action_final_dedup.py'
      - 'tests/test_run219_member_human_language_ui.py'
      - 'tests/test_run220_member_db_canonical_cutover.py'
      - 'tests/test_run221_member_db_host_isolation.py'
      - 'tests/test_run225_stock_lifecycle.py'
      - 'tests/test_run225_member_lifecycle_ui.py'
      - '.github/workflows/member-presentation-sync.yml'

# Transitive Daily contract: Subscriber Decision Brief Sync directly follows both
# Daily Intelligence & Content Pipeline and Daily Intelligence & Content Pipeline [ONE-SHOT].
# This workflow intentionally follows that bridge instead of listening to either source directly.
# This workflow and Subscriber Decision Brief write the same member product through
# NOTION_DECISION_INTELLIGENCE_API_KEY. Keep a single cross-workflow writer lock so
# source->brief->presentation writes cannot overlap or leave stale member rows.
concurrency:
  group: member-derived-notion-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Member UX unit tests
        run: |
          python -m unittest tests/test_run158_member_presentation_sync.py
          python -m unittest tests/test_run166_member_page_body.py
          python -m unittest tests/test_run169_member_ux_guard.py
          python -m unittest tests/test_run169_1_member_body_fast.py
          python -m unittest tests/test_run170_member_human_language_ux.py
          python -m unittest tests/test_run170_1_member_copy_role_separation.py
          python -m unittest tests/test_run211_member_sync_ordering.py
          python -m unittest tests/test_run212_member_review_copy.py
          python -m unittest tests/test_run213_member_topic_specificity.py
          python -m unittest tests/test_run214_member_action_specificity.py
          python -m unittest tests/test_run215_member_action_final_dedup.py
          python -m unittest tests/test_run219_member_human_language_ui.py
          python -m unittest tests/test_run220_member_db_canonical_cutover.py
          python -m unittest tests/test_run221_member_db_host_isolation.py
          python -m unittest tests/test_run225_stock_lifecycle.py
          python -m unittest tests/test_run225_member_lifecycle_ui.py

      - name: Resolve canonical member DB
        run: python provision_member_presentation_db.py
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          MEMBER_PRESENTATION_DB_TITLE: 'AI・技術一覧｜判断DB'
          MEMBER_PRESENTATION_CANONICAL_DATABASE_ID: 'b2787ee0-5b58-4ca7-b4eb-774f60237f1f'
          MEMBER_PRESENTATION_CANONICAL_DATA_SOURCE_ID: '7e4ceaa7-7bdf-4c4b-bf78-c2cccac44404'
          MEMBER_PRESENTATION_API_HOST_PAGE_ID: '3c5479ff-dca9-8178-867c-d9249a3ff5c8'
          MEMBER_PRESENTATION_ALLOW_CREATE: 'false'

      - name: Sync clean member DB with lifecycle-aware human-language member UI
        run: python run219_member_human_language_ui.py presentation
        env:
          TZ: 'Asia/Tokyo'
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          DI_PRODUCT_TIMEZONE: 'Asia/Tokyo'
          MEMBER_HOME_MAX: '3'
          MEMBER_HOME_DIVERSITY_TOLERANCE: '3'
          STOCK_FRESH_DAYS: '30'
          STOCK_ARCHIVE_DAYS: '90'

      - name: Sync readable member page bodies in plain Japanese
        run: python run219_member_human_language_ui.py body
        env:
          TZ: 'Asia/Tokyo'
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
