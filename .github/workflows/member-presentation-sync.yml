name: Member Presentation Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily Intelligence & Content Pipeline']
    types: [completed]
  push:
    paths:
      - 'member_presentation_sync.py'
      - 'tests/test_run158_member_presentation_sync.py'
      - '.github/workflows/member-presentation-sync.yml'

concurrency:
  group: member-presentation-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Member UX unit tests
        run: python -m unittest tests/test_run158_member_presentation_sync.py

      - name: Probe Notion presentation access
        run: |
          python - <<'PY'
          import os, requests
          headers = {
              'Authorization': f"Bearer {os.environ['NOTION_DECISION_INTELLIGENCE_API_KEY']}",
              'Notion-Version': '2026-03-11',
          }
          targets = {
              'member_home': 'https://api.notion.com/v1/pages/3c5479ff-dca9-8103-bff0-f2d5f408d35f',
              'continuation_page': 'https://api.notion.com/v1/pages/3cb479ff-dca9-8196-a397-faae03a090ec',
              'new_member_database': 'https://api.notion.com/v1/databases/7160e83d3a4f41a18bf661df92423bda',
          }
          for name, url in targets.items():
              r = requests.get(url, headers=headers, timeout=15)
              print(f'{name}={r.status_code}')
          PY
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}

      - name: Sync clean member DB
        run: python member_presentation_sync.py
        env:
          TZ: 'Asia/Tokyo'
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_MEMBER_PRESENTATION_DATABASE_ID: '7160e83d3a4f41a18bf661df92423bda'
          NOTION_MEMBER_PRESENTATION_DATA_SOURCE_ID: 'ba993457-49f3-491a-9f58-b0a690b45558'
          DI_PRODUCT_TIMEZONE: 'Asia/Tokyo'
          MEMBER_HOME_MAX: '8'
          MEMBER_HOME_DIVERSITY_TOLERANCE: '3'
