name: Member Presentation Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily Intelligence & Content Pipeline']
    types: [completed]
  push:
    paths:
      - 'member_presentation_sync.py'
      - 'tests/test_run158_member_presentation_sync.py'
      - '.github/workflows/member-presentation-sync.yml'

concurrency:
  group: member-presentation-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Member UX unit tests
        run: python -m unittest tests/test_run158_member_presentation_sync.py

      - name: Probe subscriber database parent
        run: |
          python - <<'PY'
          import os, requests
          headers = {
              'Authorization': f"Bearer {os.environ['NOTION_DECISION_INTELLIGENCE_API_KEY']}",
              'Notion-Version': '2026-03-11',
          }
          dbid = os.environ['NOTION_SUBSCRIBER_TECH_DATABASE_ID']
          r = requests.get(f'https://api.notion.com/v1/databases/{dbid}', headers=headers, timeout=15)
          print(f'subscriber_database={r.status_code}')
          if r.ok:
              parent = r.json().get('parent') or {}
              print(f"subscriber_parent_type={parent.get('type')}")
              parent_id = parent.get('page_id') or parent.get('database_id') or parent.get('workspace')
              print(f'subscriber_parent_id={parent_id}')
              if parent.get('page_id'):
                  p = requests.get(f"https://api.notion.com/v1/pages/{parent['page_id']}", headers=headers, timeout=15)
                  print(f'subscriber_parent_page={p.status_code}')
          PY
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}

      - name: Sync clean member DB
        continue-on-error: true
        run: python member_presentation_sync.py
        env:
          TZ: 'Asia/Tokyo'
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_MEMBER_PRESENTATION_DATABASE_ID: '7160e83d3a4f41a18bf661df92423bda'
          NOTION_MEMBER_PRESENTATION_DATA_SOURCE_ID: 'ba993457-49f3-491a-9f58-b0a690b45558'
          DI_PRODUCT_TIMEZONE: 'Asia/Tokyo'
          MEMBER_HOME_MAX: '8'
          MEMBER_HOME_DIVERSITY_TOLERANCE: '3'
