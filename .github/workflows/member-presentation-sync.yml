name: Member Presentation Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily Intelligence & Content Pipeline']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'provision_member_presentation_db.py'
      - 'member_presentation_sync.py'
      - 'member_presentation_body_sync.py'
      - 'member_ux_guard.py'
      - 'member_ux_body_fast.py'
      - 'member_human_language_ux.py'
      - 'external_reviews/**'
      - 'tests/test_run158_member_presentation_sync.py'
      - 'tests/test_run166_member_page_body.py'
      - 'tests/test_run169_member_ux_guard.py'
      - 'tests/test_run169_1_member_body_fast.py'
      - 'tests/test_run170_member_human_language_ux.py'
      - '.github/workflows/member-presentation-sync.yml'

concurrency:
  group: member-presentation-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Member UX unit tests
        run: |
          python -m unittest tests/test_run158_member_presentation_sync.py
          python -m unittest tests/test_run166_member_page_body.py
          python -m unittest tests/test_run169_member_ux_guard.py
          python -m unittest tests/test_run169_1_member_body_fast.py
          python -m unittest tests/test_run170_member_human_language_ux.py

      - name: Resolve clean member DB
        run: python provision_member_presentation_db.py
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          MEMBER_PRESENTATION_DB_TITLE: 'AI・技術一覧｜判断DB'

      - name: Sync clean member DB with human-language UX guard
        run: python member_human_language_ux.py presentation
        env:
          TZ: 'Asia/Tokyo'
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          DI_PRODUCT_TIMEZONE: 'Asia/Tokyo'
          MEMBER_HOME_MAX: '3'
          MEMBER_HOME_DIVERSITY_TOLERANCE: '3'

      - name: Sync readable member page bodies in reader order
        run: python member_human_language_ux.py body
        env:
          TZ: 'Asia/Tokyo'
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
