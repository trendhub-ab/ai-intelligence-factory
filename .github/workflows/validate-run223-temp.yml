name: Validate Run223 Technical Claim Precision

on:
  push:
    branches:
      - run223-technical-claim-precision
    paths:
      - '.github/workflows/validate-run223-temp.yml'

permissions:
  contents: write

jobs:
  validate-and-sync-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run223-technical-claim-precision
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update canonical specification for Run223
        run: python run223_sync_spec_temp.py

      - name: Compile changed production modules
        run: python -m py_compile run223_technical_claim_precision.py production_pipeline.py publication_contract.py

      - name: Run Run223 regressions
        run: python -m unittest tests.test_run223_technical_claim_precision -v

      - name: Run adjacent semantic and publication regressions
        run: |
          if [ -f tests/test_run175_semantic_fact_precision.py ]; then python -m unittest tests.test_run175_semantic_fact_precision -v; fi
          if [ -f tests/test_publication_contract.py ]; then python -m unittest tests.test_publication_contract -v; fi
          if [ -f tests/test_run194_publication_contract.py ]; then python -m unittest tests.test_run194_publication_contract -v; fi
          if [ -f tests/test_run222_note_presentation_integrity.py ]; then python -m unittest tests.test_run222_note_presentation_integrity -v; fi

      - name: Run full zero-API unittest regression
        env:
          SYNTHETIC_REGRESSION_MODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit canonical spec update
        run: |
          set -euo pipefail
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo 'canonical spec already current'
            exit 0
          fi
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run223: update canonical production specification'
          git push origin HEAD:run223-technical-claim-precision
