name: Validate Run223 Technical Claim Precision

on:
  push:
    branches:
      - run223-technical-claim-precision
    paths:
      - '.github/workflows/validate-run223-temp.yml'

permissions:
  contents: write

jobs:
  validate-and-sync-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run223-technical-claim-precision
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production CI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install-deps chromium

      - name: Update canonical specification and finalize Run223 boundary guards
        run: python run223_sync_spec_temp.py

      - name: Compile changed production modules
        run: python -m py_compile run223_technical_claim_precision.py production_pipeline.py publication_contract.py note_ready_sync.py

      - name: Run Run223 regressions
        run: python -m unittest tests.test_run223_technical_claim_precision -v

      - name: Run adjacent semantic, publication and note queue regressions
        run: |
          python -m unittest tests.test_run175_semantic_fact_precision -v
          python -m unittest tests.test_run194_publication_contract -v
          python -m unittest tests.test_run197_note_ready_policy_reconciliation -v
          python -m unittest tests.test_run222_note_presentation_integrity -v
          python -m unittest tests.test_note_ready_sync -v

      - name: Run repository-wide falsification guard
        run: python repository_falsification_guard.py

      - name: Run full zero-API unittest regression
        env:
          SYNTHETIC_REGRESSION_MODE: '1'
        run: python -m unittest discover -s tests -v

      - name: Run synthetic smoke through current production stack
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python production_pipeline.py

      - name: Commit validated Run223 source and canonical spec update
        run: |
          set -euo pipefail
          if git diff --quiet -- run223_technical_claim_precision.py AI_Intelligence_Factory_最終仕様書.md; then
            echo 'Run223 source and canonical spec already current'
            exit 0
          fi
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add run223_technical_claim_precision.py AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run223: finalize technical claim guards and canonical specification'
          git push origin HEAD:run223-technical-claim-precision
