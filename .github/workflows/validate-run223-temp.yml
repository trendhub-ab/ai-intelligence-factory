name: Validate Run223 Technical Claim Precision

on:
  push:
    branches:
      - run223-technical-claim-precision
    paths:
      - '.github/workflows/validate-run223-temp.yml'

permissions:
  contents: write

jobs:
  validate-and-sync-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run223-technical-claim-precision
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update canonical specification for Run223
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AI_Intelligence_Factory_最終仕様書.md')
          text = path.read_text(encoding='utf-8')

          baseline = 'Article Technical Claim Precision Baseline: **Run223 — operation/API scope, performance modality, first-party date and typo precision**  \n'
          if baseline not in text:
              anchor = 'Repository Organization Baseline: **Run201 — repository garbage cleanup without intended runtime behavior change**  \n'
              if anchor not in text:
                  raise SystemExit('canonical spec baseline anchor not found')
              text = text.replace(anchor, baseline + anchor, 1)

          runtime_line = '- `run223_technical_claim_precision.py`\n'
          if runtime_line not in text:
              anchor = '- `run175_semantic_fact_precision.py`\n'
              if anchor not in text:
                  raise SystemExit('canonical spec runtime anchor not found')
              text = text.replace(anchor, anchor + runtime_line, 1)

          section = '''### 4.1 Technical Claim Precision — Run223

`run223_technical_claim_precision.py`は、初回note実機全文監査で露呈した技術Claimの狭い精度欠陥をzero-modelで防ぐ。

- 同名パラメータでもメソッドごとに値・意味が異なる場合、1つの設定値へ丸めない。
- 一部/特定/lossyなBreaking Changeを「全面禁止」「すべて廃止」へ一般化しない。
- x倍・%改善・レイテンシ等が期待値/ベンチマーク/測定例なら、主体・モダリティ・条件を保持し、workload/環境依存の留保を落とさない。
- 一次情報の`公開・更新`日はfirst-party本文/明示metadataだけを使い、収集日・分析日・発見元投稿日を代用しない。確認不能なら推測せず省略する。
- `によるな処理`等の既知の明白な日本語助詞崩れをPublication前に局所blockする。
- Evidence閾値、Decision Score、Gemini request budgetは変更しない。
- Run223はPublication Contract fingerprint対象であり、policy変更後の旧Ready原稿は現行policyで再構築・再stampされるまでfail-closedとする。

詳細: `docs/reference/RUN223_TECHNICAL_CLAIM_PRECISION.md`

'''
          if '### 4.1 Technical Claim Precision — Run223' not in text:
              anchor = '## 5. Production runtime layer\n'
              if anchor not in text:
                  raise SystemExit('canonical spec section anchor not found')
              text = text.replace(anchor, section + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile changed production modules
        run: |
          python -m py_compile run223_technical_claim_precision.py production_pipeline.py publication_contract.py

      - name: Run Run223 regressions
        run: python -m unittest tests.test_run223_technical_claim_precision -v

      - name: Run adjacent semantic and publication regressions
        run: |
          if [ -f tests/test_run175_semantic_fact_precision.py ]; then python -m unittest tests.test_run175_semantic_fact_precision -v; fi
          if [ -f tests/test_publication_contract.py ]; then python -m unittest tests.test_publication_contract -v; fi
          if [ -f tests/test_run194_publication_contract.py ]; then python -m unittest tests.test_run194_publication_contract -v; fi
          if [ -f tests/test_run222_note_presentation_integrity.py ]; then python -m unittest tests.test_run222_note_presentation_integrity -v; fi

      - name: Run full zero-API unittest regression
        env:
          SYNTHETIC_REGRESSION_MODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit canonical spec update
        run: |
          set -euo pipefail
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo 'canonical spec already current'
            exit 0
          fi
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run223: update canonical production specification'
          git push origin HEAD:run223-technical-claim-precision
