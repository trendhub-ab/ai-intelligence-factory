name: Run164 Audit Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'RUN164 AUDIT NONAI 180')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Read-only non-AI audit
        env:
          TZ: Asia/Tokyo
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          import inventory_bootstrap as ib
          import paid_db_launch_readiness as launch

          token=os.environ['NOTION_DECISION_INTELLIGENCE_API_KEY']
          tech_ds=os.environ.get('NOTION_TECH_DATA_SOURCE_ID') or os.environ['NOTION_TECH_DATABASE_ID']
          client=ib.NotionClient(token)
          records=[ib.normalize_technology_page(x) for x in client.query_data_source(tech_ds)]
          sellable=[r for r in records if ib.is_sellable(r)]
          non_ai=[]
          for r in sellable:
              if launch.is_ai_relevant(r):
                  continue
              text=launch._ai_relevance_text(r)
              negatives=[p for p in launch.AI_NEGATIVE_PATTERNS if re.search(p,text,re.I)]
              positives=[p for p in launch.AI_RELEVANCE_PATTERNS if re.search(p,text,re.I)]
              non_ai.append({
                  'page_id':r.page_id,
                  'canonical_entity_id':r.canonical_entity_id,
                  'name':r.name,
                  'category':r.category,
                  'primary_url':r.primary_url,
                  'source':list(r.source),
                  'source_summary':r.source_summary,
                  'short_rationale':r.short_rationale,
                  'negative_patterns':negatives,
                  'positive_patterns':positives,
              })
          out={
              'sellable_count':len(sellable),
              'ai_relevant_count':len(sellable)-len(non_ai),
              'ai_relevant_ratio':round((len(sellable)-len(non_ai))/len(sellable),4) if sellable else 0,
              'non_ai_count':len(non_ai),
              'non_ai':non_ai,
              'zero_gemini_calls':True,
          }
          Path('inventory_bootstrap_artifacts').mkdir(exist_ok=True)
          Path('inventory_bootstrap_artifacts/run164_non_ai_audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run164-non-ai-audit-${{ github.run_id }}
          path: inventory_bootstrap_artifacts/
          if-no-files-found: error
          retention-days: 30
