name: TEMP Apply Single Canonical Delivery Patch

on:
  push:
    branches:
      - fix/notion-single-canonical-manuscript
    paths:
      - '.github/workflows/tmp-apply-single-canonical-delivery-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'trendhub-ab' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/notion-single-canonical-manuscript
          fetch-depth: 0
      - name: Apply exact minimal source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('note_ready_sync.py')
          text = path.read_text(encoding='utf-8')
          old = '''    return current[-1] if current else ""\n'''
          new = '''    if len(current) != 1:\n        return ""\n    return current[0]\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one delivery return site, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- note_ready_sync.py
      - name: Commit exact patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add note_ready_sync.py
          git commit -m 'fix: fail closed on multiple Ready manuscripts'
          git push origin HEAD:fix/notion-single-canonical-manuscript
