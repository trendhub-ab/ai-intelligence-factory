name: Run256 Full Pytest Diagnostic

on:
  push:
    branches:
      - run256-concrete-decision-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=8,<9'
      - name: Run full pytest and capture exact failure
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q tests > run256-full-pytest.log 2>&1
          status=$?
          echo "$status" > run256-full-pytest.status
          tail -n 300 run256-full-pytest.log
          exit "$status"
      - name: Upload full pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run256-full-pytest-diagnostic
          path: |
            run256-full-pytest.log
            run256-full-pytest.status
          retention-days: 1
