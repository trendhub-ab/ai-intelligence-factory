name: Validate Intelligence Pipeline (Read Only)

on:
  workflow_dispatch:

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-pipeline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v6

      - name: Python環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安全性ユニットテスト
        run: python -m unittest discover -s tests -v
        env:
          GEMINI_API_KEY: test-key
          GH_PAT: test-token

      - name: 新規ソース品質検証（Notion READ ONLY）
        run: python pipeline_validation.py
        env:
          TZ: 'Asia/Tokyo'
          NEW_SOURCE_TEST_MODE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2026-03-11"
          PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
          NOTION_SAVE_THRESHOLD_SCORE: "60"
          GEMINI_PERSISTENT_DAILY_COUNTER: "true"
          GEMINI_PERSISTENT_COUNTER_PATH: ".runtime/gemini_daily_usage.json"
          GEMINI_COUNTER_BRANCH: "main"
          # 2026-08-16確認: Flash Lite=500 RPD / Flash=20 RPD。
          # 下記は実RPDではなく、余裕を残すPipeline側のSafety Cap（450/18）。
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_36_FLASH_DAILY_BUDGET: "18"
          GEMINI_37_FLASH_DAILY_BUDGET: "18"
          GEMINI_35_FLASH_DAILY_BUDGET: "18"
          GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: "gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash"
          GEMINI_QUOTA_TIMEZONE: "America/Los_Angeles"
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: "10"
