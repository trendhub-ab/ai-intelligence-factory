name: Run242 Docs Bootstrap

on:
  push:
    branches:
      - run242-notion-deferred-modularization

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run242-notion-deferred-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reconcile docs
        run: python run242_docs_reconcile.py
      - name: Validate docs
        run: |
          python documentation_freshness_guard.py
          git diff --check
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run242: update canonical documentation'
          git push origin HEAD:run242-notion-deferred-modularization
