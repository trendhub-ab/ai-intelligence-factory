name: P0-B Offline Verification

on:
  pull_request:
    paths:
      - 'note_delivery_ledger.py'
      - 'note_delivery_runtime.py'
      - 'note_draft_automation.py'
      - 'note_publication_reconcile.py'
      - 'run190_note_persistent_cloud.py'
      - 'run194_note_persistent_cloud.py'
      - 'run199_note_vm_preflight.py'
      - 'run298_genrec_inplace_refresh.py'
      - '.github/workflows/note-create-draft.yml'
      - '.github/workflows/p0b-offline-verification.yml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      NOTION_API_KEY: ''
      NOTION_DECISION_INTELLIGENCE_API_KEY: ''
      NOTE_STORAGE_STATE_B64: ''
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright

      - name: Full repository pytest
        run: python -m pytest tests -q

      - name: Repository guards
        run: |
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
          git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Prove no production credentials are available
        run: |
          python - <<'PY'
          import os
          names = [
              'GEMINI_API_KEY', 'GOOGLE_API_KEY', 'NOTION_API_KEY',
              'NOTION_DECISION_INTELLIGENCE_API_KEY', 'NOTE_STORAGE_STATE_B64',
              'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID',
          ]
          assert all(not os.environ.get(name) for name in names)
          print('P0-B offline verification: no production/model credentials present')
          PY
