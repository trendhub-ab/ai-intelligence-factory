# AIIF V1 is retired. This check verifies retirement, not historical V1 runtime quality.
# No Gemini, Apify, Notion, note, cloud runners, or production setup is invoked.
name: P0-B Offline Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout shutdown branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify V1 retirement is fail-closed
        run: python v1_retirement_contract_guard.py
      - name: Provider-free v0.4 note bridge tests
        run: |
          python -m pip install requests
          python -m unittest tests.test_run_v04_note_single_draft_bridge -v
