name: P0-B Offline Verification

on:
  pull_request:
    paths:
      - 'note_delivery_ledger.py'
      - 'note_delivery_ledger_preflight.sh'
      - 'note_delivery_runtime.py'
      - 'note_delivery_creation_recovery.py'
      - 'note_draft_automation.py'
      - 'note_publication_reconcile.py'
      - 'run190_note_persistent_cloud.py'
      - 'run194_note_persistent_cloud.py'
      - 'run199_note_vm_preflight.py'
      - '.github/workflows/note-create-draft.yml'
      - '.github/workflows/p0b-offline-verification.yml'
      - 'tests/**'

permissions:
  contents: write

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prove workflow references no repository secrets
        run: |
          if grep -Eq '\$\{\{[[:space:]]*secrets\.' .github/workflows/p0b-offline-verification.yml; then
            echo '::error::Offline verification workflow must not reference repository secrets.'
            exit 1
          fi

      - name: Apply strict single-canonical Ready patch
        if: github.head_ref == 'fix/notion-single-canonical-manuscript'
        run: |
          python tools/apply_single_canonical_ready_patch.py
          python -m py_compile pipeline.py
          git diff --check
          if ! git diff --quiet -- pipeline.py; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pipeline.py
            git commit -m "fix: require single canonical manuscript before Ready"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright

      - name: Focused canonical persistence tests
        run: |
          python -m pytest \
            tests/test_ready_single_canonical_persistence.py \
            tests/test_notion_persistence.py \
            tests/test_run194_publication_contract.py \
            tests/test_note_ready_sync.py \
            tests/test_single_canonical_manuscript_contract.py -q

      - name: Full repository pytest
        run: python -m pytest tests -q

      - name: Repository guards
        run: |
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
          git diff --check origin/${{ github.base_ref }}...HEAD
