name: X Bounded Defense Factory One Screening

on:
  workflow_dispatch:

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  one-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Defense Factory with exactly one screening request
        env:
          AIIF_ONE_SHOT_MODE: x_saved_candidate_validation
          AIIF_X_SAVED_CANDIDATE_PATH: x_discovery/fixtures/defense_factory_boundary_20260911.json
          AIIF_X_SCREENING_EXECUTE: 'true'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GEMINI_COUNTER_BRANCH: 'main'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_DAILY_REQUEST_BUDGET: '1'
          GEMINI_SCREENING_RETRY_BUDGET: '0'
          GEMINI_SCREENING_MODEL_CANDIDATES: 'gemini-3.5-flash-lite'
          GEMINI_SCREENING_CALL_TIMEOUT_SECONDS: '60'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          TZ: Asia/Tokyo
        run: python production_pipeline.py
