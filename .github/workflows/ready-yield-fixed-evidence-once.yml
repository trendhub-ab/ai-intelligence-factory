name: Fixed Evidence Ready Yield Experiment

# One explicitly authorized experiment on this named same-repository branch.
# Explicit transition from draft to ready triggers this once. Synchronize/reopen do not send API calls.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.head_ref == 'experiment/ready-yield-fixed-evidence-20260924' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SYNTHETIC_REGRESSION_MODE: 'true'
      GEMINI_API_KEY: test-key
      GEMINI_PERSISTENT_DAILY_COUNTER: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
      - name: Gate reachability regression (zero API)
        run: python -m pytest -q tests/test_gate_reachability_audit.py
      - name: Fixed Evidence sufficiency and import preflight (zero API)
        run: python experiments/ready_yield_fixed_evidence.py --phase preflight --out-dir experiment-results/preflight
      - uses: actions/upload-artifact@v7
        with:
          name: ready-yield-preflight
          path: experiment-results/preflight/
          if-no-files-found: error
          retention-days: 14

  initial:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [gemini-3.6-flash, gemini-3.5-flash]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SYNTHETIC_REGRESSION_MODE: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
      GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GEMINI_COUNTER_BRANCH: runtime-state
      GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
      - name: Verify Gemini and counter credentials without exposing values
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$GH_PAT"
      - name: Generate eight drafts using pinned Evidence
        run: python experiments/ready_yield_fixed_evidence.py --phase initial --model ${{ matrix.model }} --out-dir experiment-results/${{ matrix.model }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ready-yield-initial-${{ matrix.model }}
          path: experiment-results/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 14

  feedback:
    needs: initial
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SYNTHETIC_REGRESSION_MODE: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
      GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GEMINI_COUNTER_BRANCH: runtime-state
      GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: ready-yield-initial-*
          path: experiment-results/input
      - name: Regenerate at most eight drafts using actual Gate reasons
        run: python experiments/ready_yield_fixed_evidence.py --phase feedback --in-dir experiment-results/input --out-dir experiment-results/feedback
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ready-yield-feedback
          path: experiment-results/feedback/
          if-no-files-found: warn
          retention-days: 14
