name: Gemini Technology Comment Shadow Judge Only

on:
  workflow_dispatch:
    inputs:
      authorize_google_api:
        description: 'Type AUTHORIZE_GOOGLE_API to explicitly authorize this Google/Gemini API call'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  semantic-judge-replay:
    if: ${{ inputs.authorize_google_api == 'AUTHORIZE_GOOGLE_API' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked Production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prove replay fixture has zero write authority
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('tests/fixtures/technology_comment_shadow_groq_rerun.json').read_text(encoding='utf-8'))
          assert report['candidate_id'] == 'TECH-SHADOW-SYNTH-001'
          assert report['persist_allowed'] is False
          assert report['business_writes'] == 0
          assert report['automatic_promotion_allowed'] is False
          assert report['fixture_provenance'].startswith('Synthetic Groq challenger')
          print('REPLAY_FIXTURE_AUTHORITY=ZERO')
      - name: Blind semantic Fact and quality audit with Gemini 3.7
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_GEMINI_SHADOW_JUDGE_MODEL: 'gemini-3.7-flash'
          AIIF_TECH_COMMENT_SHADOW_FIXTURE: tests/fixtures/technology_comment_shadow_live.json
          AIIF_TECH_COMMENT_SHADOW_REPORT: tests/fixtures/technology_comment_shadow_groq_rerun.json
          AIIF_TECH_COMMENT_SEMANTIC_REPORT: technology-comment-shadow-semantic-37.json
        run: python gemini_technology_comment_shadow_judge.py
      - name: Verify semantic judge is veto-only
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('technology-comment-shadow-semantic-37.json').read_text(encoding='utf-8'))
          assert report['persist_allowed'] is False
          assert report['business_writes'] == 0
          assert report['automatic_promotion_allowed'] is False
          print('SEMANTIC_JUDGE_MUTATION_AUTHORITY=ZERO')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology-comment-shadow-semantic-37
          path: technology-comment-shadow-semantic-37.json
          if-no-files-found: warn
          retention-days: 7
