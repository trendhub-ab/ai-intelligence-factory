name: Create note Draft

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE_NOTE_DRAFT (draft only; no public release)'
        required: true
        type: string
      sync_id:
        description: 'Optional Content Intelligence sync ID; blank selects the next eligible Ready article'
        required: false
        type: string
      prepare_only:
        description: 'Validate/select source article only; do not start the cloud Chrome VM'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_start_vm: ${{ steps.decision.outputs.should_start_vm }}
      status: ${{ steps.decision.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zero-browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Zero-VM preflight regression tests
        run: |
          python -m unittest tests.test_run194_note_current_contract -v
          python -m unittest tests.test_run199_note_vm_preflight -v

      - name: Validate publish-safe candidate before any VM start
        env:
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/note_draft_preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          requested="$(python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          print(str(((event.get('inputs') or {}).get('sync_id') or '')).strip())
          PY
          )"
          NOTE_DRAFT_CONFIRM='${{ inputs.confirm }}' NOTE_TARGET_SYNC_ID="$requested" python run199_note_vm_preflight.py

      - name: Export VM decision
        id: decision
        env:
          RESULT_FILE: ${{ runner.temp }}/note_draft_preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          should_start = 'true' if result.get('should_start_vm') is True else 'false'
          status = str(result.get('status') or 'unknown').strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'should_start_vm={should_start}\n')
              fh.write(f'status={status}\n')
          PY

      - name: Summarize preflight result
        env:
          RESULT_FILE: ${{ runner.temp }}/note_draft_preflight.json
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### note draft zero-VM preflight\n')
              fh.write(f'- status: `{result.get("status", "unknown")}`\n')
              fh.write(f'- VM required: `{result.get("should_start_vm") is True}`\n')
              fh.write(f'- prepare-only mode: `{os.environ.get("PREPARE_ONLY", "false").strip().lower()}`\n')
              fh.write(f'- zero Gemini calls: `{result.get("zero_gemini_calls") is True}`\n')
              if result.get('status') == 'no_eligible_ready':
                  fh.write('- No publish-safe Ready article exists, so the Chrome VM was not started.\n')
          PY

  start-cloud-vm:
    if: ${{ inputs.prepare_only == false && needs.preflight.outputs.should_start_vm == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable or secret: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            if ! gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet; then
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
              if [ "$state" != "RUNNING" ]; then
                echo "::error::Persistent note VM did not reach RUNNING after concurrent-safe start"
                exit 1
              fi
            fi
          fi
          echo "Persistent note VM is running; waiting for its registered GitHub runner."

      - name: Wait for exactly one registered note runner to become online
        run: |
          set -euo pipefail
          online=false
          for _ in $(seq 1 60); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status == "online") | select(any(.labels[]?; .name == "aiif-note-cloud"))] | length' \
              2>/dev/null || true)"
            count="${count:-0}"
            if [ "$count" -eq 1 ] 2>/dev/null; then
              online=true
              break
            fi
            if [ "$count" -gt 1 ] 2>/dev/null; then
              echo "::error::Multiple online aiif-note-cloud runners would violate single-writer delivery"
              exit 1
            fi
            sleep 5
          done
          if [ "$online" != "true" ]; then
            echo "::error::Persistent note VM is running but exactly one registered aiif-note-cloud runner did not become online"
            exit 1
          fi
          echo "Exactly one registered aiif-note-cloud runner is online."

  create-draft:
    if: ${{ inputs.prepare_only == false && needs.preflight.outputs.should_start_vm == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install lightweight private-preflight dependency
        run: python -m pip install requests

      - name: Revalidate and pin exact candidate on private worker
        env:
          RESULT_FILE: ${{ runner.temp }}/note_worker_preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          requested="$(python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          print(str(((event.get('inputs') or {}).get('sync_id') or '')).strip())
          PY
          )"
          NOTE_DRAFT_CONFIRM='${{ inputs.confirm }}' NOTE_TARGET_SYNC_ID="$requested" NOTE_DRAFT_RESULT_FILE="$RESULT_FILE" python run199_note_vm_preflight.py

      - name: Export private-worker candidate decision
        id: worker
        env:
          RESULT_FILE: ${{ runner.temp }}/note_worker_preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          selected = str(result.get('selected_sync_id') or '').strip()
          should_continue = result.get('should_start_vm') is True and bool(selected)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'should_continue={"true" if should_continue else "false"}\n')
              fh.write(f'status={str(result.get("status") or "unknown").strip()}\n')
          PY

      - name: Read durable ledger authority before heavy browser setup
        if: ${{ steps.worker.outputs.should_continue == 'true' }}
        env:
          WORKER_RESULT_FILE: ${{ runner.temp }}/note_worker_preflight.json
          LEDGER_RESULT_FILE: ${{ runner.temp }}/note_ledger_preflight.json
        run: |
          set -euo pipefail
          selected="$(python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['WORKER_RESULT_FILE']).read_text(encoding='utf-8'))
          print(str(result.get('selected_sync_id') or '').strip())
          PY
          )"
          test -n "$selected" || { echo '::error::private worker did not pin an exact candidate'; exit 1; }
          NOTE_TARGET_SYNC_ID="$selected" NOTE_TARGET_IDENTITY='trendhub_biz' NOTE_DELIVERY_LEDGER_PATH='~/.aiif-note/delivery-ledger-v1.sqlite3' NOTE_DRAFT_RESULT_FILE="$LEDGER_RESULT_FILE" bash note_delivery_ledger_preflight.sh

      - name: Export durable ledger decision
        id: ledger
        if: ${{ steps.worker.outputs.should_continue == 'true' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/note_ledger_preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          should_run = 'true' if result.get('should_run_delivery') is True else 'false'
          status = str(result.get('status') or 'unknown').strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'should_run_delivery={should_run}\n')
              fh.write(f'status={status}\n')
          PY

      - name: Summarize durable ledger gate
        if: ${{ steps.worker.outputs.should_continue == 'true' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/note_ledger_preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### private durable-ledger preflight\n')
              fh.write(f'- status: `{result.get("status", "unknown")}`\n')
              fh.write(f'- delivery worker required: `{result.get("should_run_delivery") is True}`\n')
              fh.write(f'- zero Gemini calls: `{result.get("zero_gemini_calls") is True}`\n')
              if result.get('status') == 'ledger_blocked_ambiguous':
                  fh.write('- Existing ambiguous delivery remains fail-closed; heavy browser setup and note mutation are skipped.\n')
          PY

      - name: Install persistent Chrome automation dependencies
        if: ${{ steps.ledger.outputs.should_run_delivery == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright pytest
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || {
            echo '::error::Google Chrome is not installed on the persistent note VM.'
            exit 1
          }
          command -v xvfb-run >/dev/null 2>&1 || {
            echo '::error::xvfb-run is not installed on the persistent note VM.'
            exit 1
          }

      - name: Zero-Gemini note draft tests
        if: ${{ steps.ledger.outputs.should_run_delivery == 'true' }}
        run: |
          python -m unittest tests.test_note_draft_automation -v
          python -m unittest tests.test_run185_note_ready_legacy_skip -v
          python -m unittest tests.test_run186_note_header_image_resilience -v
          python -m unittest tests.test_run187_note_editor_readiness -v
          python -m unittest tests.test_run188_note_header_upload_fallback -v
          python -m unittest tests.test_run189_note_editor_route_gate -v
          python -m unittest tests.test_run190_note_persistent_cloud -v
          python -m unittest tests.test_run191_note_crop_dialog_resilience -v
          python -m unittest tests.test_run193_note_official_header_upload -v
          python -m unittest tests.test_run194_publication_contract -v
          python -m unittest tests.test_run194_note_current_contract -v
          python -m unittest tests.test_run199_note_vm_preflight -v
          python -m pytest \
            tests/test_note_delivery_ledger.py \
            tests/test_note_delivery_runtime.py \
            tests/test_note_delivery_human_edit_guard.py \
            tests/test_run295_note_eyecatch_persistence.py \
            tests/test_p0b_eyecatch_callback_forwarding.py \
            tests/test_p0b_production_installation.py -q

      - name: Create one private note draft or reconcile the worker-pinned article
        if: ${{ steps.ledger.outputs.should_run_delivery == 'true' }}
        env:
          WORKER_RESULT_FILE: ${{ runner.temp }}/note_worker_preflight.json
          NOTE_DRAFT_CONFIRM: ${{ inputs.confirm }}
          NOTE_TARGET_IDENTITY: 'trendhub_biz'
          NOTE_DELIVERY_LEDGER_PATH: '~/.aiif-note/delivery-ledger-v1.sqlite3'
          NOTE_PREPARE_ONLY: 'false'
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/note_draft_result.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          selected="$(python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['WORKER_RESULT_FILE']).read_text(encoding='utf-8'))
          print(str(result.get('selected_sync_id') or '').strip())
          PY
          )"
          test -n "$selected" || { echo '::error::private worker target missing'; exit 1; }
          NOTE_TARGET_SYNC_ID="$selected" xvfb-run -a python run194_note_persistent_cloud.py

      - name: Summarize result without exposing private delivery identity
        if: ${{ steps.ledger.outputs.should_run_delivery == 'true' && success() }}
        env:
          RESULT_FILE: ${{ runner.temp }}/note_draft_result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          status = result.get('status', 'unknown')
          notified = 'yes' if result.get('telegram_notified') else 'no'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### note private-draft durable delivery\n')
              fh.write(f'- status: `{status}`\n')
              fh.write(f'- zero Gemini calls: `{result.get("zero_gemini_calls") is True}`\n')
              fh.write(f'- automatic publication: `{result.get("public_release") is True}`\n')
              fh.write(f'- Telegram notice: `{notified}`\n')
              if status == 'queue_confirmed':
                  fh.write('- The private draft binding and queue projection were durably confirmed. Review note manually before release.\n')
              elif status in {'creation_unknown', 'verification_blocked', 'manual_reconciliation_required'}:
                  fh.write('- Delivery is fail-closed and requires reconciliation; no automatic second draft is allowed.\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && inputs.prepare_only == false && needs.preflight.outputs.should_start_vm == 'true' && needs.start-cloud-vm.result != 'skipped' }}
    needs: [preflight, start-cloud-vm, create-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Defer VM stop while another note draft run is active
        id: siblings
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT is required to determine whether another note draft run is active"
            exit 1
          fi
          active="$(gh run list --workflow note-create-draft.yml --limit 100 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\")] | length")"
          if [ "${active:-0}" -gt 0 ]; then
            echo "keep_online=true" >> "$GITHUB_OUTPUT"
            echo "Another note draft run is active; keeping the persistent VM online."
          else
            echo "keep_online=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud with OIDC
        if: ${{ steps.siblings.outputs.keep_online != 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ steps.siblings.outputs.keep_online != 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Stop persistent note Chrome VM
        if: ${{ steps.siblings.outputs.keep_online != 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo "Persistent note VM stop check completed."
