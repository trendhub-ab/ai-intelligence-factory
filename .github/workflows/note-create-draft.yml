name: Create note Draft

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE_NOTE_DRAFT (draft only; no public release)'
        required: true
        type: string
      sync_id:
        description: 'Optional Content Intelligence sync ID; blank selects the next eligible Ready article'
        required: false
        type: string
      prepare_only:
        description: 'Validate/select source article only; do not start the cloud Chrome VM'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: note-draft-create
  cancel-in-progress: false

jobs:
  prepare-only:
    if: ${{ inputs.prepare_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zero-browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate and select Ready article only
        env:
          NOTE_DRAFT_CONFIRM: ${{ inputs.confirm }}
          NOTE_TARGET_SYNC_ID: ${{ inputs.sync_id }}
          NOTE_PREPARE_ONLY: 'true'
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/note_draft_result.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run185_note_ready_legacy_skip.py

      - name: Summarize prepare-only result
        if: success()
        env:
          RESULT_FILE: ${{ runner.temp }}/note_draft_result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### note draft prepare-only\n')
              fh.write(f'- status: `{result.get("status", "unknown")}`\n')
              fh.write(f'- zero Gemini calls: `{result.get("zero_gemini_calls") is True}`\n')
          PY

  start-cloud-vm:
    if: ${{ inputs.prepare_only == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo "Persistent note VM is running; waiting for its registered GitHub runner."

  create-draft:
    if: ${{ inputs.prepare_only == false }}
    needs: start-cloud-vm
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install persistent Chrome automation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || {
            echo '::error::Google Chrome is not installed on the persistent note VM.'
            exit 1
          }
          command -v xvfb-run >/dev/null 2>&1 || {
            echo '::error::xvfb-run is not installed on the persistent note VM.'
            exit 1
          }

      - name: Zero-Gemini note draft tests
        run: |
          python -m unittest tests.test_note_draft_automation -v
          python -m unittest tests.test_run185_note_ready_legacy_skip -v
          python -m unittest tests.test_run186_note_header_image_resilience -v
          python -m unittest tests.test_run187_note_editor_readiness -v
          python -m unittest tests.test_run188_note_header_upload_fallback -v
          python -m unittest tests.test_run189_note_editor_route_gate -v
          python -m unittest tests.test_run190_note_persistent_cloud -v

      - name: Create one private note draft in persistent Chrome
        env:
          NOTE_DRAFT_CONFIRM: ${{ inputs.confirm }}
          NOTE_TARGET_SYNC_ID: ${{ inputs.sync_id }}
          NOTE_PREPARE_ONLY: 'false'
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/note_draft_result.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python run190_note_persistent_cloud.py

      - name: Summarize result without exposing the draft URL
        if: success()
        env:
          RESULT_FILE: ${{ runner.temp }}/note_draft_result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          status = result.get('status', 'unknown')
          notified = 'yes' if result.get('telegram_notified') else 'no'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### note draft automation — persistent cloud Chrome\n')
              fh.write(f'- status: `{status}`\n')
              fh.write(f'- zero Gemini calls: `{result.get("zero_gemini_calls") is True}`\n')
              fh.write(f'- Telegram draft-link notice: `{notified}`\n')
              if status == 'draft_created':
                  fh.write('- Open note on your phone and review the newest draft before releasing it.\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && inputs.prepare_only == false }}
    needs: [start-cloud-vm, create-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Stop persistent note Chrome VM
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo "Persistent note VM stop check completed."
