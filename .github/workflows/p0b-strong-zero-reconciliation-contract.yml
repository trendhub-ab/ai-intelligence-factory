name: P0-B Strong-Zero Reconciliation Contract [OPS]

on:
  push:
    branches:
      - ops/p0b-hosted-b01-recovery-20261006
    paths:
      - '.github/workflows/p0b-strong-zero-reconciliation-contract.yml'
      - '.github/workflows/p0b-strong-zero-reconciliation-live.yml'
      - 'run_p0b_strong_zero_reconciliation.py'
      - 'tests/test_p0b_strong_zero_reconciliation.py'
      - 'tests/test_p0b_strong_zero_reconciliation_live_workflow.py'
      - 'note_delivery_ledger.py'
      - 'note_delivery_gcs.py'
      - 'note_delivery_runtime.py'

permissions:
  contents: read

concurrency:
  group: p0b-strong-zero-reconciliation-contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: pip install -q pytest requests
      - name: Run strong-zero recovery contract tests
        run: >-
          python -m pytest -q
          tests/test_p0b_strong_zero_reconciliation.py
          tests/test_p0b_strong_zero_reconciliation_live_workflow.py
