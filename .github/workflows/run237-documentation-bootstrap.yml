name: Run237 Documentation Bootstrap

on:
  push:
    branches:
      - run237-product-delivery-maintenance-modularization
    paths:
      - .github/workflows/run237-documentation-bootstrap.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run237-product-delivery-maintenance-modularization
          fetch-depth: 0
      - name: Reconcile canonical documentation
        run: python run237_documentation_reconciliation.py
      - name: Verify canonical documentation guard
        run: python documentation_freshness_guard.py
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit reconciled docs
        shell: bash
        run: |
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md README.md; then
            echo "Expected Run237 documentation diff was not produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Intelligence_Factory_最終仕様書.md README.md
          git commit -m "Run237: reconcile canonical modularization documentation"
          git push origin HEAD:run237-product-delivery-maintenance-modularization
