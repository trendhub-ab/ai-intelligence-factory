name: TEMP Pace Notion Manuscript Audit

on:
  push:
    branches:
      - fix/notion-single-canonical-manuscript
    paths:
      - '.github/workflows/tmp-pace-notion-manuscript-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'trendhub-ab' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/notion-single-canonical-manuscript
          fetch-depth: 0
      - name: Pace direct block reads under Notion rate limit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('audit_notion_manuscripts.py')
          text = path.read_text(encoding='utf-8')
          old = '''        data = _read_json("GET", url)\n'''
          new = '''        # Notion documents an average request-rate limit; keep this exhaustive\n        # audit deliberately below it instead of bursting until 429.\n        time.sleep(0.38)\n        data = _read_json("GET", url)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one block GET site, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit paced audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_notion_manuscripts.py
          git commit -m 'audit: pace exhaustive Notion block reads'
          git push origin HEAD:fix/notion-single-canonical-manuscript
