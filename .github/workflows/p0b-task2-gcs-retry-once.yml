name: P0-B Task 2 GCS Retry Authority TDD [IMPL ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task2-gcs-retry-once.yml'

permissions:
  contents: write

jobs:
  task2-gcs-tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright google-cloud-storage
      - name: Add Task 2 GCS tests first
        run: python .github/tdd/p0b_task2_add_tests.py
      - name: Verify Task 2 GCS tests are RED for missing dedicated API
        run: |
          set +e
          python -m pytest -q tests/test_note_delivery_gcs.py -k 'reconciled_retry or retry_authority or concurrent' > /tmp/task2-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/task2-red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Expected RED before GCS production implementation, but tests passed.'
            exit 1
          fi
          grep -q 'authorize_reconciled_retry' /tmp/task2-red.log
      - name: Implement minimal GCS generation-CAS retry authority
        run: python .github/tdd/p0b_task2_add_prod.py
      - name: Verify Task 2 GCS and ledger parity GREEN
        run: python -m pytest -q tests/test_note_delivery_gcs.py tests/test_note_delivery_ledger.py
      - name: Verify focused P0-B suite GREEN
        run: >-
          python -m pytest -q
          tests/test_note_delivery_strong_zero.py
          tests/test_note_delivery_ledger.py
          tests/test_note_delivery_gcs.py
          tests/test_note_delivery_runtime.py
          tests/test_p0b_strong_zero_reconciliation.py
          tests/test_p0b_strong_zero_reconciliation_live_workflow.py
      - name: Remove transient Task 2 TDD scaffolding before repository-wide validation
        run: |
          rm .github/tdd/p0b_task2_add_tests.py
          rm .github/tdd/p0b_task2_add_prod.py
          rm .github/workflows/p0b-task2-gcs-retry-once.yml
      - name: Verify full repository and guards before commit
        run: |
          set -euo pipefail
          python -m pytest tests -q
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
          git diff --check
      - name: Commit Task 2 only after all GREEN checks
        run: |
          set -euo pipefail
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add note_delivery_gcs.py tests/test_note_delivery_gcs.py
          git add -u .github/tdd/p0b_task2_add_tests.py .github/tdd/p0b_task2_add_prod.py .github/workflows/p0b-task2-gcs-retry-once.yml
          git commit -m 'feat: authorize strong-zero retry with GCS generation CAS'
          git push origin HEAD:impl/p0b-strong-zero-retry-authority
