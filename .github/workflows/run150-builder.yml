name: Run150 Builder

on:
  push:
    branches:
      - fix/run150-dual-eyecatch-architecture
    paths:
      - .github/workflows/run150-builder.yml

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/run150-dual-eyecatch-architecture
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Run150 integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pipeline.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from PIL import Image, ImageDraw, ImageFont\n'
          import_line = (
              'from editorial_eyecatch import (\n'
              '    NOTE_EYECATCH_OUTPUT_DIR, generate_note_editorial_eyecatch, infer_editorial_category,\n'
              ')\n'
          )
          if import_line not in text:
              count = text.count(import_anchor)
              if count != 1:
                  raise SystemExit(f'Run150 import anchor count={count}, expected 1')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          anchor = '''        eyecatch_url = ""
          if persist_results:
          '''
          replacement = '''        # Run150: note acquisition and paid-DB decision support are different visual jobs.
          # The public note image is an editorial/curiosity surface with no internal score card.
          # The existing Decision Card below remains Notion-facing and preserves paid-product utility.
          note_eyecatch_path = ""
          try:
              note_output_dir = NOTE_EYECATCH_OUTPUT_DIR if persist_results else os.path.join(REGEN_TEST_OUTPUT_DIR, "eyecatch")
              os.makedirs(note_output_dir, exist_ok=True)
              note_eyecatch_filename = f"{_sanitize_filename(source)}__{_sanitize_filename(name)}__note.png"
              note_eyecatch_path = os.path.join(note_output_dir, note_eyecatch_filename)
              editorial_category = infer_editorial_category(
                  parsed.get("title_text", ""),
                  parsed.get("what_text", "") or parsed.get("source_summary_text", ""),
                  source,
              )
              generate_note_editorial_eyecatch(
                  parsed.get("title_text", "") or name,
                  parsed.get("what_text", "") or parsed.get("source_summary_text", ""),
                  note_eyecatch_path,
                  category=editorial_category,
              )
              logger.info(
                  "[NOTE EDITORIAL EYECATCH] %s -> %s category=%s",
                  name, note_eyecatch_path, editorial_category,
              )
          except Exception as e:
              note_eyecatch_path = ""
              logger.warning("[NOTE EDITORIAL EYECATCH SKIP] %s: %s", name, e)

          eyecatch_url = ""
          if persist_results:
          '''
          if replacement not in text:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'Run150 eyecatch anchor count={count}, expected 1')
              text = text.replace(anchor, replacement, 1)

          old_audit = 'eyecatch_path=eyecatch_path if \'eyecatch_path\' in locals() else "",'
          new_audit = 'eyecatch_path=note_eyecatch_path if note_eyecatch_path else "",'
          old_count = text.count(old_audit)
          if old_count:
              if old_count < 2:
                  raise SystemExit(f'Run150 expected at least 2 audit eyecatch bindings, got {old_count}')
              text = text.replace(old_audit, new_audit)

          old_log = 'logger.info(f"[REGEN TEST] eyecatch生成・GitHub uploadをスキップ: {name}")'
          new_log = 'logger.info(f"[REGEN TEST] Notion Decision Card/GitHub uploadをスキップ（note Editorial EyecatchはArtifactへ生成済み）: {name}")'
          if old_log in text:
              text = text.replace(old_log, new_log, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile
        run: python -m py_compile pipeline.py editorial_eyecatch.py

      - name: Run Run150 focused tests
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
        run: python -m unittest -v tests.test_run150_dual_eyecatch

      - name: Run existing eyecatch tests
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
        run: |
          python -m unittest discover -s tests -p 'test_*eyecatch*.py' -v

      - name: Run full unittest
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run synthetic smoke
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python pipeline.py

      - name: Commit integration patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py editorial_eyecatch.py tests/test_run150_dual_eyecatch.py
          if git diff --cached --quiet; then
            echo 'No Run150 integration changes to commit.'
            exit 0
          fi
          git commit -m 'Run150: add dual eyecatch architecture'
          git push origin HEAD:fix/run150-dual-eyecatch-architecture
