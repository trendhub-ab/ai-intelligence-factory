name: Run150 Builder

on:
  push:
    branches:
      - fix/run150-dual-eyecatch-architecture
    paths:
      - .github/workflows/run150-builder.yml

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/run150-dual-eyecatch-architecture
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Run150 integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pipeline.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from PIL import Image, ImageDraw, ImageFont\n'
          import_line = (
              'from editorial_eyecatch import (\n'
              '    NOTE_EYECATCH_OUTPUT_DIR, generate_note_editorial_eyecatch, infer_editorial_category,\n'
              ')\n'
          )
          if import_line not in text:
              count = text.count(import_anchor)
              if count != 1:
                  raise SystemExit(f'Run150 import anchor count={count}, expected 1')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          anchor = '        eyecatch_url = ""\n        if persist_results:\n'
          replacement = (
              '        # Run150: note acquisition and paid-DB decision support are different visual jobs.\n'
              '        # The public note image is an editorial/curiosity surface with no internal score card.\n'
              '        # The existing Decision Card below remains Notion-facing and preserves paid-product utility.\n'
              '        note_eyecatch_path = ""\n'
              '        try:\n'
              '            note_output_dir = NOTE_EYECATCH_OUTPUT_DIR if persist_results else os.path.join(REGEN_TEST_OUTPUT_DIR, "eyecatch")\n'
              '            os.makedirs(note_output_dir, exist_ok=True)\n'
              '            note_eyecatch_filename = f"{_sanitize_filename(source)}__{_sanitize_filename(name)}__note.png"\n'
              '            note_eyecatch_path = os.path.join(note_output_dir, note_eyecatch_filename)\n'
              '            editorial_category = infer_editorial_category(\n'
              '                parsed.get("title_text", ""),\n'
              '                parsed.get("what_text", "") or parsed.get("source_summary_text", ""),\n'
              '                source,\n'
              '            )\n'
              '            generate_note_editorial_eyecatch(\n'
              '                parsed.get("title_text", "") or name,\n'
              '                parsed.get("what_text", "") or parsed.get("source_summary_text", ""),\n'
              '                note_eyecatch_path,\n'
              '                category=editorial_category,\n'
              '            )\n'
              '            logger.info(\n'
              '                "[NOTE EDITORIAL EYECATCH] %s -> %s category=%s",\n'
              '                name, note_eyecatch_path, editorial_category,\n'
              '            )\n'
              '        except Exception as e:\n'
              '            note_eyecatch_path = ""\n'
              '            logger.warning("[NOTE EDITORIAL EYECATCH SKIP] %s: %s", name, e)\n'
              '\n'
              '        eyecatch_url = ""\n'
              '        if persist_results:\n'
          )
          if replacement not in text:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'Run150 eyecatch anchor count={count}, expected 1')
              text = text.replace(anchor, replacement, 1)

          old_audit = 'eyecatch_path=eyecatch_path if \'eyecatch_path\' in locals() else "",'
          new_audit = 'eyecatch_path=note_eyecatch_path if note_eyecatch_path else "",'
          old_count = text.count(old_audit)
          if old_count:
              if old_count < 2:
                  raise SystemExit(f'Run150 expected at least 2 audit eyecatch bindings, got {old_count}')
              text = text.replace(old_audit, new_audit)

          old_log = 'logger.info(f"[REGEN TEST] eyecatch生成・GitHub uploadをスキップ: {name}")'
          new_log = 'logger.info(f"[REGEN TEST] Notion Decision Card/GitHub uploadをスキップ（note Editorial EyecatchはArtifactへ生成済み）: {name}")'
          if old_log in text:
              text = text.replace(old_log, new_log, 1)

          path.write_text(text, encoding='utf-8')

          editorial_path = Path('editorial_eyecatch.py')
          editorial = editorial_path.read_text(encoding='utf-8')

          # Public category describes the topic, never the discovery/source channel.
          source_based = '    text = f"{title}\\n{summary}\\n{source}".lower()\n'
          topic_only = (
              '    # Source is intentionally ignored: the public eyecatch category describes the topic, not discovery origin.\n'
              '    text = f"{title}\\n{summary}".lower()\n'
          )
          if source_based in editorial:
              editorial = editorial.replace(source_based, topic_only, 1)

          # Prefer a natural, balanced Japanese two-line break before falling back to character wrapping.
          old_fit = '''def _fit_headline(draw: ImageDraw.ImageDraw, text: str, max_width: int = 760, max_lines: int = 3):
              for size in range(82, 49, -2):
                  font = _jp_font(size, bold=True)
                  lines = _wrap_chars(draw, text, font, max_width, max_lines)
                  if lines and len(lines) <= max_lines and all(_text_width(draw, line, font) <= max_width for line in lines):
                      return font, lines
              font = _jp_font(48, bold=True)
              return font, _wrap_chars(draw, text, font, max_width, max_lines)
          '''
          # Dedent the literal above because YAML heredoc indentation is not part of the Python string intent.
          import textwrap
          old_fit = textwrap.dedent(old_fit)
          new_fit = textwrap.dedent('''
          def balanced_headline_lines(text: str) -> list[str]:
              """Choose a reader-natural two-line break for short/medium Japanese headlines.

              Typography must not split conjugations merely to fill width. Prefer punctuation/particles
              near the visual midpoint, with balanced line length as a secondary criterion.
              """
              value = (text or "").strip()
              if len(value) < 8:
                  return [value] if value else []
              preferred_after = set("がはをにでとへも、。！？!?：:")
              midpoint = len(value) / 2.0
              candidates = []
              for index in range(3, len(value) - 2):
                  left, right = value[:index], value[index:]
                  if not left.strip() or not right.strip():
                      continue
                  boundary_bonus = 0 if left[-1] in preferred_after else 4
                  balance = abs(len(left) - len(right))
                  center_distance = abs(index - midpoint)
                  candidates.append((boundary_bonus + balance + center_distance * 0.35, index, left, right))
              if not candidates:
                  return [value]
              _, _, left, right = min(candidates, key=lambda row: row[0])
              return [left, right]


          def _fit_headline(draw: ImageDraw.ImageDraw, text: str, max_width: int = 760, max_lines: int = 3):
              preferred = balanced_headline_lines(text)
              if 1 <= len(preferred) <= 2:
                  for size in range(82, 49, -2):
                      font = _jp_font(size, bold=True)
                      if all(_text_width(draw, line, font) <= max_width for line in preferred):
                          return font, preferred
              for size in range(76, 47, -2):
                  font = _jp_font(size, bold=True)
                  lines = _wrap_chars(draw, text, font, max_width, max_lines)
                  if lines and len(lines) <= max_lines and all(_text_width(draw, line, font) <= max_width for line in lines):
                      return font, lines
              font = _jp_font(46, bold=True)
              return font, _wrap_chars(draw, text, font, max_width, max_lines)
          ''')
          if 'def balanced_headline_lines(' not in editorial:
              if old_fit not in editorial:
                  raise SystemExit('Run150 headline-fit anchor not found')
              editorial = editorial.replace(old_fit, new_fit, 1)

          editorial_path.write_text(editorial, encoding='utf-8')
          PY

      - name: Compile
        run: python -m py_compile pipeline.py editorial_eyecatch.py

      - name: Render selected-style preview
        run: |
          python - <<'PY'
          import os
          from editorial_eyecatch import generate_note_editorial_eyecatch
          os.makedirs('run150_preview', exist_ok=True)
          generate_note_editorial_eyecatch(
              'AIに“同僚”ができ始めた。',
              'エージェント同士が、勝手に仕事を分担する時代へ。',
              'run150_preview/run150_editorial_preview.png',
              category='AI AGENTS',
              date_label='2026.08',
          )
          PY

      - name: Upload visual preview
        uses: actions/upload-artifact@v7
        with:
          name: run150-eyecatch-preview
          path: run150_preview/
          if-no-files-found: error
          retention-days: 7

      - name: Run Run150 focused tests
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
        run: python -m unittest -v tests.test_run150_dual_eyecatch

      - name: Run existing eyecatch tests
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
        run: python -m unittest discover -s tests -p 'test_*eyecatch*.py' -v

      - name: Run full unittest
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run synthetic smoke
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: 'smoke'
        run: python pipeline.py

      - name: Commit integration patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py editorial_eyecatch.py tests/test_run150_dual_eyecatch.py
          if git diff --cached --quiet; then
            echo 'No Run150 integration changes to commit.'
            exit 0
          fi
          git commit -m 'Run150: add dual eyecatch architecture'
          git push origin HEAD:fix/run150-dual-eyecatch-architecture
