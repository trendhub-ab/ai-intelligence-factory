name: X Discovery Offline

on:
  push:
    branches:
      - feature/x-discovery-ingestion
    paths:
      - 'x_discovery/**'
      - 'tests/test_x_discovery*.py'
      - 'README_X_DISCOVERY.md'
      - '.github/workflows/x-discovery-offline.yml'
      - '.github/workflows/x-discovery-apify-smoke.yml'
      - '.github/workflows/x-discovery-stage2-smoke.yml'
  pull_request:
    paths:
      - 'x_discovery/**'
      - 'tests/test_x_discovery*.py'
      - 'README_X_DISCOVERY.md'
      - '.github/workflows/x-discovery-offline.yml'
      - '.github/workflows/x-discovery-apify-smoke.yml'
      - '.github/workflows/x-discovery-stage2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_x_discovery*.py' -v
      - name: Fixture ingestion
        run: python -m x_discovery.runner --provider fixture --output-dir /tmp/x-discovery --max-records 20
      - name: Factory dry-run adapter
        run: |
          python -m x_discovery.factory_adapter \
            --queue /tmp/x-discovery/primary_resolution_queue.json \
            --output /tmp/x-discovery/factory_adapter_preview.json
      - name: Verify isolation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/x-discovery')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          adapter = json.loads((root / 'factory_adapter_preview.json').read_text(encoding='utf-8'))
          assert manifest['factory_write'] is False
          assert manifest['evidence_promoted'] is False
          assert manifest['evidence_status'] == 'discovery_only'
          assert manifest['x_official_api_calls'] == 0
          assert manifest['external_provider_calls'] == 0
          assert manifest['tco_resolution_calls'] == 0
          assert (root / 'discovery_candidates.json').exists()
          assert (root / 'primary_resolution_queue.json').exists()
          assert adapter['mode'] == 'dry_run'
          assert adapter['factory_write'] is False
          assert adapter['screening_executed'] is False
          assert adapter['evidence_promoted'] is False
          assert adapter['evidence_status'] == 'discovery_only'
          assert adapter['source_item_count'] == manifest['primary_resolution_queue_count']
          assert adapter['accepted_count'] == 2
          assert adapter['rejected_count'] == 0
          for item in adapter['items']:
              assert item['factory_write'] is False
              assert item['is_evidence'] is False
              assert item['screening_executed'] is False
              assert item['evidence_promoted'] is False
          print(json.dumps({'manifest': manifest, 'factory_adapter': adapter}, ensure_ascii=False, sort_keys=True))
          PY
