name: P0-A DOM observer TDD

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-dom-observer-tdd.yml'
      - 'run291_note_private_draft_audit.py'
      - 'run292_note_rendered_body_audit.py'
      - 'tests/test_run292_note_rendered_body_audit.py'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'
      - run: pip install requests
      - name: Run P0-A DOM observer contract tests
        run: python -m unittest tests.test_run292_note_rendered_body_audit -v
