name: Run301 GenRec Summary Restore [ONE-SHOT]

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run301-genrec-summary-restore.yml'
      - 'run296_editorial_format_v2.py'
      - 'run301_genrec_summary_restore.py'
      - 'tests/test_run296_editorial_format_v2.py'
      - 'tests/test_run301_genrec_summary_restore.py'
      - 'AI_Intelligence_Factory_Run296_仕様追補.md'

permissions:
  contents: read

concurrency:
  group: run301-genrec-summary-restore
  cancel-in-progress: false

jobs:
  rebase-and-preflight:
    if: contains(github.event.head_commit.message, 'Run301: restore GenRec summary in place')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      should_start_vm: ${{ steps.ready.outputs.should_start_vm }}
      policy_sha: ${{ steps.policy.outputs.policy_sha }}
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic preflight dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Falsify corrected Run296 and Run301 boundaries before writes
        run: |
          python -m unittest tests.test_run296_editorial_format_v2 -v
          python -m unittest tests.test_run301_genrec_summary_restore -v
          python -m unittest tests.test_run297_298_genrec_refresh -v
          python -m unittest tests.test_run300_genrec_final_body_repair -v

      - name: Require Publication Contract advancement from defective Run296 policy
        id: policy
        run: |
          python - <<'PY'
          import os
          import publication_contract as c
          old = 'ba997928381a755d5a04bdcee7ea75f45e7cd336a430f16a412a9878a41dc96f'
          pre = 'b1b4d1e9d5e52788dc16396480ca0b7097701dc9354d91fd299394296fd1cd45'
          actual = c.policy_sha256()
          if actual in {old, pre} or len(actual) != 64:
              raise SystemExit(f'Run301 Publication Contract did not advance safely: {actual}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'policy_sha={actual}\n')
          print('RUN301_POLICY_ADVANCED=true')
          print('RUN301_POLICY_PREFIX=' + actual[:12])
          PY

      - name: Rebase exact Netflix GenRec from preserved pre-Run296 evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: GITHUB_REF_NAME=run297-assets python run297_genrec_run296_rebase.py

      - name: Re-sync Note Ready without touching human posting state
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python note_ready_sync.py

      - name: Require corrected Ready manuscript and exact private queue state
        id: ready
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          python - <<'PY'
          import os
          import run298_genrec_inplace_refresh as r298
          import run301_genrec_summary_restore as r301
          r298._ensure_private_queue_state()
          article, _ = r298._expected_current_article()
          if article.get('sync_id') != r298.TARGET_SYNC_ID:
              raise SystemExit('Run301 target drift')
          r301._require_corrected_manuscript(str(article.get('manuscript') or ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('should_start_vm=true\n')
          print('RUN301_NOTE_READY_EXACT=true')
          print('RUN301_POSTING_STATE_PREPARING=true')
          print('RUN301_NEW_DRAFT=false')
          print('RUN301_PUBLIC_RELEASE=false')
          print('RUN301_MODEL_CALLS=0')
          PY

  start-cloud-vm:
    if: ${{ needs.rebase-and-preflight.outputs.should_start_vm == 'true' }}
    needs: rebase-and-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  restore-and-audit:
    if: ${{ needs.rebase-and-preflight.outputs.should_start_vm == 'true' }}
    needs: [rebase-and-preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install exact browser and image dependencies
        run: |
          pip install requests playwright Pillow
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1
          command -v xvfb-run >/dev/null 2>&1
      - name: Re-run exact repair safety tests on VM
        run: |
          python -m unittest tests.test_run296_editorial_format_v2 -v
          python -m unittest tests.test_run301_genrec_summary_restore -v
          python -m unittest tests.test_run300_genrec_final_body_repair -v
      - name: Restore summary in same private draft and perform actual-note audit
        env:
          RUN301_RESULT_FILE: ${{ runner.temp }}/run301-result.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: xvfb-run -a python run301_genrec_summary_restore.py
      - name: Require complete Run301 final contract
        env:
          RESULT_FILE: ${{ runner.temp }}/run301-result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          required_true = [
              'same_private_draft_route','summary_present_once','summary_order_valid',
              'what_label_absent','header_untouched_during_run301','header_persistent',
              'title_match','new_intro_present','old_intro_absent','what_row_absent',
              'new_cta_heading_present','new_cta_body_present','cta_link_label_present',
              'sources_before_cta','eyecatch_present','quality_state_ready',
              'posting_state_preparing','zero_gemini_calls','manuscript_summary_contract'
          ]
          failed = [k for k in required_true if r.get(k) is not True]
          exact_values = {
              'source_eyecatch_width': 1280,
              'source_eyecatch_height': 670,
              'new_intro_count': 1,
              'old_intro_count': 0,
              'removed_summary_label_count': 0,
              'cta_heading_count': 1,
              'cta_link_label_count': 1,
              'sources_heading_count': 1,
              'body_h1_count': 0,
          }
          for key, expected in exact_values.items():
              if r.get(key) != expected: failed.append(key)
          if r.get('duplicate_title_prefix') is not False: failed.append('duplicate_title_prefix')
          if r.get('duplicate_draft_created') is not False: failed.append('duplicate_draft_created')
          if r.get('public_release') is not False: failed.append('public_release')
          if r.get('daily_restarted') is not False: failed.append('daily_restarted')
          ratio = float(r.get('visible_length_ratio', 0.0))
          if not 0.82 <= ratio <= 1.15: failed.append('visible_length_ratio')
          if failed:
              raise SystemExit('Run301 final contract failed: ' + ','.join(failed))
          print('RUN301_FINAL_ACTUAL_NOTE_AUDIT=PASS')
          print('RUN301_SUMMARY_RESTORED=true')
          print('RUN301_SOURCE_EYECATCH=1280x670')
          print('RUN301_PUBLIC_RELEASE=false')
          PY
      - name: Summarize non-content proof only
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/run301-result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RESULT_FILE'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run301 — Netflix GenRec summary restoration\n')
              if not path.exists():
                  fh.write('- result: `FAIL-CLOSED`\n')
                  raise SystemExit(0)
              r = json.loads(path.read_text(encoding='utf-8'))
              for key in [
                  'status','same_private_draft_route','editor_route_hash','summary_present_before',
                  'summary_present_once','summary_order_valid','what_label_absent',
                  'source_eyecatch_width','source_eyecatch_height','header_untouched_during_run301',
                  'header_persistent','selection_coverage','pre_save_visible_length_ratio',
                  'visible_length_ratio','title_match','new_intro_present','old_intro_absent',
                  'what_row_absent','new_cta_heading_present','new_cta_body_present',
                  'cta_link_label_present','sources_before_cta','duplicate_title_prefix',
                  'new_intro_count','old_intro_count','removed_summary_label_count',
                  'cta_heading_count','cta_link_label_count','sources_heading_count','body_h1_count',
                  'eyecatch_present','eyecatch_proof_mode','quality_state_ready','posting_state_preparing',
                  'zero_gemini_calls','duplicate_draft_created','public_release','daily_restarted'
              ]:
                  if key in r: fh.write(f'- {key}: `{r[key]}`\n')
              fh.write('- unpublished body / draft URL / image URL exposed: `false`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [rebase-and-preflight, start-cloud-vm, restore-and-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
