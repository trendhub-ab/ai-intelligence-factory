name: Run269 Live Acquisition Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'business_source_acquisition.py'
      - 'source_normalization.py'
      - 'run269_live_acquisition_smoke.py'
      - '.github/workflows/run269-live-acquisition-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run269-live-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-acquisition-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install network-only dependency
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install 'requests>=2.32.4,<3.0.0'

      - name: Compile live smoke surface
        run: python -m py_compile business_source_acquisition.py source_normalization.py run269_live_acquisition_smoke.py

      - name: Run live acquisition smoke
        run: |
          python run269_live_acquisition_smoke.py \
            --report run269-live-acquisition-report.json \
            --hn-limit 20 \
            --require-all-vendors

      - name: Upload live acquisition report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run269-live-acquisition-${{ github.run_number }}
          path: run269-live-acquisition-report.json
          if-no-files-found: error
          retention-days: 14
