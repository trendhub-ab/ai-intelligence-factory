name: Run160 Backfill Current Editorial Eyecatches

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  backfill:
    if: "github.event.head_commit.message == 'chore: retry Run103 Editorial eyecatch backfill'"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Daily 103 audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/run103
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9713517688/zip > /tmp/run103.zip
          unzip -q /tmp/run103.zip -d /tmp/run103

      - name: Verify and replace three already-published legacy cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import struct

          def verify_editorial_png(path: Path) -> None:
              data = path.read_bytes()[:33]
              if len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit(f'Run160 backfill fail-closed: invalid PNG header {path}')
              width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
              if (width, height) != (1280, 670) or bit_depth != 8 or color_type not in (2, 6):
                  raise SystemExit(
                      f'Run160 backfill fail-closed: unexpected PNG {path.name} '
                      f'size={(width, height)} bit_depth={bit_depth} color_type={color_type}'
                  )

          src = Path('/tmp/run103/article_audit/eyecatch')
          mapping = {
              'HackerNews__GLM-5_3_is_now_open-weight__note.png': 'eyecatch_images/GLM-5_3_is_now_open-weight.png',
              'HackerNews__Our_decision_on_Cursor_following_its_acquisition_by_SpaceX__note.png': 'eyecatch_images/Our_decision_on_Cursor_following_its_acquisition_by_SpaceX.png',
              'ArXiv__Sophistication_in_GenAI_Use_Field_Evidence_from_a_Large_Firm__note.png': 'eyecatch_images/Sophistication_in_GenAI_Use_Field_Evidence_from_a_Large_Firm.png',
          }
          for source_name, dest_name in mapping.items():
              source = src / source_name
              dest = Path(dest_name)
              if not source.is_file():
                  raise SystemExit(f'Run160 backfill fail-closed: missing Editorial source {source}')
              verify_editorial_png(source)
              if not dest.is_file():
                  raise SystemExit(f'Run160 backfill fail-closed: expected published destination missing {dest}')
              shutil.copyfile(source, dest)
              print(f'REPLACED {dest} <- {source_name}')
          PY

      - name: Verify binary replacements differ from legacy blobs
        run: |
          if git diff --exit-code --quiet -- eyecatch_images; then
            echo 'Run160 backfill fail-closed: no image changes detected'
            exit 1
          fi
          git status --short -- eyecatch_images

      - name: Commit images and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/run160-backfill-current-eyecatches.yml
          git add eyecatch_images/GLM-5_3_is_now_open-weight.png \
                  eyecatch_images/Our_decision_on_Cursor_following_its_acquisition_by_SpaceX.png \
                  eyecatch_images/Sophistication_in_GenAI_Use_Field_Evidence_from_a_Large_Firm.png
          git commit -m 'Run160: backfill current Editorial eyecatches'
          git push origin HEAD:main
