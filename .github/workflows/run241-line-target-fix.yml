name: Run241 Line Target Fix

on:
  push:
    branches:
      - run241-batched-pipeline-modularization

permissions:
  contents: write

jobs:
  fix-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run241-batched-pipeline-modularization
      - name: Reconcile exact postimage line target
        run: |
          sed -i 's/line_count != 11499/line_count != 11497/g; s/expected 11499-line postimage/expected 11497-line postimage/g' run241_batched_modularization_migration.py
          sed -i 's/LessEqual(len(src.splitlines()),11499)/LessEqual(len(src.splitlines()),11497)/g' tests/test_run241_batched_integration.py
      - name: Compile migration and check diff
        run: |
          python -m py_compile run241_batched_modularization_migration.py tests/test_run241_batched_integration.py
          git diff --check
      - name: Commit correction when needed
        run: |
          if git diff --quiet; then
            echo 'Exact Run241 line target already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run241_batched_modularization_migration.py tests/test_run241_batched_integration.py
          git commit -m 'Run241: reconcile exact batched postimage line target'
          git push origin HEAD:run241-batched-pipeline-modularization
