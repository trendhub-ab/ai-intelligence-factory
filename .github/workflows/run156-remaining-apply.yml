name: Run156 Remaining Apply

on:
  push:
    branches: [feature/run156-paid-db-decision-density]
    paths:
      - .github/workflows/run156-remaining-apply.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply 68 validated decision-grade reviews
        env:
          TZ: Asia/Tokyo
          GEMINI_API_KEY: forbidden-run156
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: 'true'
          ENABLE_JAPANESE_DISPLAY_LABEL: 'true'
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_SUBSCRIBER_TECH_SYNC: 'true'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
        run: |
          python run156_decision_review_import.py apply \
            --input external_reviews/run156_remaining68.json \
            --confirm CONFIRM_RUN156_DECISION_REVIEW \
            --audit-path run156_artifacts/remaining68_apply.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('run156_artifacts/remaining68_apply.json').read_text(encoding='utf-8'))
          b = r['product_review']
          assert r['zero_gemini_calls'] is True, r
          assert r['density_gate'] == 'passed', r
          assert r['input_count'] == 68 and r['saved'] == 68, r
          assert b['created'] == 0, b
          assert b['before_assessed'] == 100 and b['after_assessed'] == 100, b
          assert r['internal_context_updated'] == 68, r
          assert r['subscriber_context_updated'] == 68, r
          assert r['subscriber_context_missing'] == 0, r
          print(json.dumps({
              'inventory_before': b['before_assessed'],
              'inventory_after': b['after_assessed'],
              'updated_existing': r['saved'],
              'created': b['created'],
              'internal_context_updated': r['internal_context_updated'],
              'subscriber_context_updated': r['subscriber_context_updated'],
              'subscriber_context_missing': r['subscriber_context_missing'],
              'zero_gemini_calls': r['zero_gemini_calls'],
          }, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run156-remaining-apply-${{ github.run_id }}
          path: run156_artifacts/
          retention-days: 30
