name: V3 Free Writer One-Shot Experiment
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter RUN_FREE_WRITER_ONCE; one Gemini call, no retries'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  free-writer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_FREE_WRITER_ONCE' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.2' 'google-genai>=1.56.0,<2.0.0'
      - name: Validate existing offline contracts
        run: |\n          python -m compileall -q experiments/editorial_engine_v3_phase0/free_writer_one_shot.py\n          python -c 'from experiments.editorial_engine_v3_phase0.free_writer_one_shot import build_prompt, check_article; assert "arxiv.org" in build_prompt(); assert check_article("# test " + "text " * 150 + "https://arxiv.org/abs/2610.20588v1") == []'
      - name: Generate free-form article once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_FREE_WRITER_CONFIRM: FREE_WRITER_ONCE
        run: python -m experiments.editorial_engine_v3_phase0.free_writer_one_shot
      - name: Upload readable article and review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: free-writer-human-review
          path: free_writer_review/
          if-no-files-found: warn
          retention-days: 7
