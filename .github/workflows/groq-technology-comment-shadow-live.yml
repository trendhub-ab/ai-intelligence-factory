name: Groq Technology Comment Shadow Live

on:
  workflow_dispatch:
  push:
    branches:
      - safety/comment-contract-shadow-guard
    paths:
      - '.github/workflows/groq-technology-comment-shadow-live.yml'
      - 'groq_technology_comment_shadow_live.py'
      - 'gemini_technology_comment_shadow_judge.py'
      - 'technology_comment_shadow.py'
      - 'tests/fixtures/technology_comment_shadow_live.json'

permissions:
  contents: read

# The workflow contains one Gemini audit call, so share the Production Gemini budget lock.
concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  one-call-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prove Shadow contract offline first
        run: python -m unittest tests/test_technology_comment_shadow.py -v
      - name: Call Groq once with synthetic evidence only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AIIF_TECH_COMMENT_SHADOW_FIXTURE: tests/fixtures/technology_comment_shadow_live.json
          AIIF_TECH_COMMENT_SHADOW_REPORT: technology-comment-shadow-live.json
        run: python groq_technology_comment_shadow_live.py
      - name: Verify no production authority escaped from Groq report
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('technology-comment-shadow-live.json').read_text(encoding='utf-8'))
          assert report['persist_allowed'] is False
          assert report['business_writes'] == 0
          assert report['automatic_promotion_allowed'] is False
          assert report['comparison']['persist_allowed'] is False
          assert report['comparison']['business_writes'] == 0
          assert report['comparison']['automatic_promotion_allowed'] is False
          print('SHADOW_MUTATION_AUTHORITY=ZERO')
      - name: Install locked Production dependencies for Gemini judge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Blind semantic Fact and quality audit with Gemini
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_GEMINI_SHADOW_JUDGE_MODEL: 'gemini-3.8-flash'
          AIIF_TECH_COMMENT_SHADOW_FIXTURE: tests/fixtures/technology_comment_shadow_live.json
          AIIF_TECH_COMMENT_SHADOW_REPORT: technology-comment-shadow-live.json
          AIIF_TECH_COMMENT_SEMANTIC_REPORT: technology-comment-shadow-semantic.json
        run: python gemini_technology_comment_shadow_judge.py
      - name: Verify semantic judge has veto-only authority
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('technology-comment-shadow-semantic.json').read_text(encoding='utf-8'))
          assert report['persist_allowed'] is False
          assert report['business_writes'] == 0
          assert report['automatic_promotion_allowed'] is False
          print('SEMANTIC_JUDGE_MUTATION_AUTHORITY=ZERO')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology-comment-shadow-synthetic
          path: |
            technology-comment-shadow-live.json
            technology-comment-shadow-semantic.json
          if-no-files-found: warn
          retention-days: 7
