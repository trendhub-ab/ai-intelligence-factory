name: V3 P5 full five-stage Production integration — offline focused ONE SHOT
on:
  push:
    branches: [feature/v3-p5-one-shot-full-editorial-20261024]
    paths: ['.github/workflows/v3-p5-full-editorial-focused-once-20261024.yml']
permissions:
  contents: read
jobs:
  focused:
    if: >-
      ${{ github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'verify(v3-p5): offline five-stage Production writer targeted tests 2026-10-24' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 3be2c595c1611d2355996fa63c6b55c1adf03d8a
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - name: Install provider-free test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'google-genai>=1.56.0,<2.0.0'
      - name: Check revised 5-stage production handoff and P5 source
        run: |
          python -m py_compile local_skills/v3_p5_contract.py local_skills/v3_p5_prompts.py local_skills/v3_p5_one_shot.py
          python -m pytest -q tests/test_v3_p5_production_adapter.py
