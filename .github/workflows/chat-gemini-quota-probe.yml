name: Chat Gemini Quota Probe

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/chat-triggers/gemini-quota-probe.txt'

permissions:
  contents: read

# Real Article / Daily / Inventoryと同じGemini予算ロックを共有する。
concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve probe model
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          trigger='.github/chat-triggers/gemini-quota-probe.txt'
          model="$(awk -F= '$1 == "model" {sub(/^[^=]*=/, ""); print; exit}' "$trigger" | tr -d '\r')"
          if [ -z "$model" ]; then
            echo 'model=<exact Gemini model id> is required.' >&2
            exit 1
          fi
          case "$model" in
            gemini-3.6-flash|gemini-3.7-flash|gemini-3.5-flash|gemini-3.5-flash-lite|gemini-3.1-flash-lite)
              ;;
            *)
              echo "Unsupported probe model: $model" >&2
              exit 1
              ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Probe model: $model"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show repository-local counter snapshot
        shell: bash
        run: |
          if [ -f .runtime/gemini_daily_usage.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.runtime/gemini_daily_usage.json').read_text(encoding='utf-8'))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          else
            echo 'No repository-local Gemini counter file found.'
          fi

      - name: Probe selected Gemini model once
        env:
          PROBE_MODEL: ${{ steps.probe.outputs.model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_PERSISTENT_COUNTER_PATH: '.runtime/gemini_daily_usage.json'
          GEMINI_COUNTER_BRANCH: 'main'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
        shell: bash
        run: |
          set +e
          mkdir -p quota_probe_artifacts
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          model = os.environ['PROBE_MODEL']
          result = {
              'schema_version': 1,
              'model': model,
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'request_count': 1,
              'status': 'unknown',
              'counter_path': '.runtime/gemini_daily_usage.json',
          }
          exit_code = 1

          try:
              import pipeline
              response = pipeline._generate_via_chat(
                  model,
                  'Reply with exactly OK.',
                  config={'max_output_tokens': 2, 'temperature': 0},
                  request_kind='other',
                  request_context='chat_gemini_quota_probe',
                  request_origin='new',
              )
              result['status'] = 'available'
              result['provider_response_received'] = True
              text = getattr(response, 'text', None)
              if text:
                  result['response_preview'] = str(text)[:40]
              exit_code = 0
          except Exception as exc:
              message = str(exc)
              lowered = message.lower()
              result['error_type'] = type(exc).__name__
              result['error_summary'] = message[:1200]
              if '429' in lowered or 'resource_exhausted' in lowered or 'rate limit' in lowered:
                  result['status'] = 'rate_limited'
                  result['provider_response_received'] = False
                  exit_code = 2
              elif 'budget' in lowered or 'daily' in lowered or 'exhaust' in lowered:
                  result['status'] = 'local_budget_blocked'
                  result['provider_response_received'] = False
                  exit_code = 3
              else:
                  result['status'] = 'error'
                  result['provider_response_received'] = False
                  exit_code = 1

          path = Path('quota_probe_artifacts/quota_probe.json')
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"## Gemini Quota Probe\n\n- Model: `{model}`\n- Status: **{result['status']}**\n- Request count: 1\n")
          sys.exit(exit_code)
          PY
          code=$?
          exit "$code"

      - name: Upload quota probe artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemini-quota-probe-${{ steps.probe.outputs.model }}-${{ github.run_number }}
          path: quota_probe_artifacts/
          if-no-files-found: warn
          retention-days: 14
