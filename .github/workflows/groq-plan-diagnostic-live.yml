name: Groq Plan Strict Diagnostic Live
on:
  workflow_dispatch:
  push:
    branches: ['dev/hybrid-groq-gemini']
    paths:
      - '.runtime/groq_plan_diagnostic_trigger.txt'
permissions:
  contents: write
concurrency:
  group: ai-intelligence-groq-plan-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only required validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema
      - name: Build exact B0049 Decision Plan fixture and preflight
        shell: python
        run: |
          import json
          from ai_provider import GenerationRequest, GroqProvider
          from groq_two_pass_article import build_plan_fixture
          from groq_validation import schema_validator
          fixture=build_plan_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'groq-plan-diagnostic-fixture.json',
          )
          provider=GroqProvider(
              lambda _: None,
              validate_schema=schema_validator(fixture['schema']),
              token_budget=7000,
              model=fixture['model'],
          )
          payload,estimate=provider.prepare(GenerationRequest(
              fixture['prompt'],fixture['max_output_tokens'],fixture['schema'],fixture['reasoning_effort']
          ))
          assert estimate <= 7000
          assert payload['response_format']['json_schema']['strict'] is True
          assert payload['reasoning_format']=='hidden'
          assert payload['response_format']['json_schema']['schema']['properties']['decision']['type']=='string'
          print(json.dumps({
              'candidate_id':fixture['candidate_id'],
              'model':fixture['model'],
              'estimate':estimate,
              'reasoning_format':payload['reasoning_format'],
              'strict':True,
              'gemini_calls':0,
              'business_writes':0,
          },ensure_ascii=False))
      - name: One live Groq call with in-memory failed-generation diagnosis
        env:
          AIIF_GROQ_EXPERIMENT: groq-plan-structural-diagnostic-${{ github.run_id }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LEDGER_GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          from groq_plan_diagnostic import run_probe
          report=run_probe('groq-plan-diagnostic-fixture.json','groq-plan-diagnostic-report.json')
          print(json.dumps({
              'status':report['status'],
              'http_status':report.get('http_status'),
              'provider_diagnostic':report.get('provider_diagnostic'),
              'generation_schema_diagnostic':report.get('generation_schema_diagnostic'),
              'business_writes':report['business_writes'],
              'gemini_calls':report['gemini_calls'],
          },ensure_ascii=False))
      - name: Require sanitized structural diagnosis or valid success
        shell: python
        run: |
          import json
          report=json.load(open('groq-plan-diagnostic-report.json',encoding='utf-8'))
          assert report['business_writes']==0
          assert report['gemini_calls']==0
          assert report['provider_calls']==1
          assert report['model']=='openai/gpt-oss-120b'
          assert report['raw_failed_generation_persisted'] is False
          def all_keys(value):
              if isinstance(value,dict):
                  for key,child in value.items():
                      yield key
                      yield from all_keys(child)
              elif isinstance(value,list):
                  for child in value:
                      yield from all_keys(child)
          assert 'failed_generation' not in set(all_keys(report))
          serialized=json.dumps(report,ensure_ascii=False)
          for forbidden in ('GROQ_API_KEY','Authorization: Bearer','api_key=gsk_','gsk_'):
              assert forbidden not in serialized
          if report['status']=='HTTP_ERROR':
              assert report['http_status']==400
              assert report['provider_diagnostic'].get('code')=='json_validate_failed'
              structural=report['generation_schema_diagnostic']
              assert structural['present'] is True
              print(json.dumps({'terminal':'STRUCTURAL_DIAGNOSTIC','structural':structural,'business_writes':0,'gemini_calls':0},ensure_ascii=False))
          else:
              assert report['status']=='SUCCESS'
              assert report.get('ledger_reconciled') is True
              print(json.dumps({'terminal':'GROQ_PLAN_SUCCESS','actual_tokens':report.get('actual_tokens'),'business_writes':0,'gemini_calls':0},ensure_ascii=False))
      - name: Upload sanitized diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groq-plan-strict-diagnostic-B0049
          path: |
            groq-plan-diagnostic-fixture.json
            groq-plan-diagnostic-report.json
          if-no-files-found: warn
          retention-days: 7
