name: Audit remaining note private drafts read-only

on:
  push:
    branches:
      - audit/note-private-draft-inventory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: note-private-draft-inventory-read-only
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install unit-test runtime dependency
        run: pip install requests
      - name: Run read-only inventory contract tests
        run: python -m unittest tests.test_run296_note_private_draft_inventory -v

  start-cloud-vm:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable: ${name}"
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  inventory:
    needs: [contract, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install read-only browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run read-only contract tests on note VM
        run: python -m unittest tests.test_run296_note_private_draft_inventory -v
      - name: Inventory remaining unpublished drafts without mutation
        env:
          NOTE_INVENTORY_CONFIRM: 'AUDIT_ALL_NOTE_DRAFTS'
          NOTE_INVENTORY_RESULT_FILE: ${{ runner.temp }}/run296-inventory.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: xvfb-run -a python run296_note_private_draft_inventory.py
      - name: Summarize safe classification only
        if: ${{ always() }}
        env:
          RESULT_FILE: ${{ runner.temp }}/run296-inventory.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RESULT_FILE'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Remaining note draft inventory (read-only)\n')
              if not p.exists():
                  fh.write('- result: `FAIL-CLOSED`\n')
                  fh.write('- private content exposed: `false`\n')
                  raise SystemExit(0)
              data = json.loads(p.read_text(encoding='utf-8'))
              fh.write(f'- status: `{data.get("status")}`\n')
              fh.write(f'- read_only: `{data.get("read_only") is True}`\n')
              fh.write(f'- zero_gemini_calls: `{data.get("zero_gemini_calls") is True}`\n')
              fh.write(f'- draft_mutation: `{data.get("draft_mutation") is True}`\n')
              fh.write(f'- public_release: `{data.get("public_release") is True}`\n')
              fh.write(f'- total_remaining_drafts: `{data.get("total")}`\n')
              for key in ('KEEP', 'REPAIR', 'DISCARD_CANDIDATE'):
                  fh.write(f'- {key}: `{(data.get("counts") or {}).get(key, 0)}`\n')
              fh.write('- private title/body/draft URL/draft ID exposed: `false`\n')
              fh.write('\n| position | class | body chars | eyecatch | AIIF tracked | reasons |\n')
              fh.write('|---:|---|---:|---|---|---|\n')
              for row in data.get('records') or []:
                  reasons = ', '.join(row.get('reasons') or [])
                  fh.write(f'| {row.get("position")} | {row.get("classification")} | {row.get("body_chars")} | {row.get("eyecatch_present")} | {row.get("current_aiif_linked")} | {reasons} |\n')
          PY
      - name: Upload safe inventory result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run296-safe-note-draft-inventory
          path: ${{ runner.temp }}/run296-inventory.json
          if-no-files-found: ignore
          retention-days: 1

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [start-cloud-vm, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
          GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
