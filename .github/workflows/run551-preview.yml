name: Run551 Visual Preview

on:
  push:
    branches:
      - autopilot/run551-eyecatch-editorial-v2-20261012
    paths:
      - .github/workflows/run551-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Diagnose Japanese font resolution
        run: |
          printf '%s\n' '--- expected Noto paths ---'
          for f in \
            /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc \
            /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; do
            if [ -f "$f" ]; then echo "FOUND $f"; else echo "MISSING $f"; fi
          done
          printf '%s\n' '--- Pillow selected font ---'
          python - <<'PY'
          import editorial_eyecatch as ee
          font = ee._jp_font(40, bold=True)
          print('font_type=', type(font).__name__)
          print('font_path=', getattr(font, 'path', None))
          print('font_name=', getattr(font, 'getname', lambda: None)())
          PY
      - name: Render production Run551 preview
        run: |
          python - <<'PY'
          import run551_eyecatch_editorial_v2 as r551
          validated = {
              'eyecatch_title': 'GPT-6 Astraが示す ロボット制御の衝撃',
              'title_lines': ['GPT-6 Astraが示す', 'ロボット制御の衝撃'],
          }
          r551._render_editorial_v2(
              'GPT-6 Astraが示す ロボット制御の衝撃',
              'AIが考えるだけでなく、判断して動かす段階へ。ロボット制御に起きる変化を読み解く。',
              'run551-preview.png',
              validated,
              category='ROBOTICS',
              date_label='2026.10',
              highlight_text='ロボット制御の衝撃',
          )
          print('preview=run551-preview.png')
          PY
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: run551-visual-preview
          path: run551-preview.png
          if-no-files-found: error
          retention-days: 1
