name: P0-A Stable Draft Identity TDD

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - 'tests/test_p0a_stable_draft_identity.py'
      - 'run291_note_private_draft_audit.py'
      - 'note_publication_reconcile.py'
      - '.github/workflows/p0a-stable-id-tdd.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest requests playwright
      - name: Run stable identity contract
        run: python -m pytest -q tests/test_p0a_stable_draft_identity.py
