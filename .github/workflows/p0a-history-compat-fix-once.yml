name: P0-A History Compatibility Refactor Once

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-history-compat-fix-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/p0-a-note-lossless-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal compatibility refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Restore ONLY the pure existing-edit-route validator in Run291.
          p = Path('run291_note_private_draft_audit.py')
          s = p.read_text(encoding='utf-8')
          if 'from urllib.parse import urlparse\n' not in s:
              s = s.replace('from typing import Any\n', 'from typing import Any\nfrom urllib.parse import urlparse\n', 1)
          marker = '_READER_FIRST_LABELS = ("どんな内容？", "なぜ重要？", "結論は？", "元情報")\n'
          if '_EDIT_PATH = re.compile' not in s:
              s = s.replace(marker, '_EDIT_PATH = re.compile(r"^/notes/[^/?#]+/edit/?$", re.I)\n' + marker, 1)
          anchor = '\ndef _destination_row(sync_id: str) -> dict[str, Any]:\n'
          if 'def _is_note_edit_url' not in s:
              validator = '''\ndef _is_note_edit_url(value: str) -> bool:\n    """Validate one existing private note edit route; never performs discovery."""\n    try:\n        parsed = urlparse(str(value or ""))\n    except Exception:\n        return False\n    host = (parsed.hostname or "").lower()\n    if parsed.scheme != "https" or host not in {"note.com", "editor.note.com"}:\n        return False\n    return bool(_EDIT_PATH.fullmatch(parsed.path or ""))\n\n'''
              if anchor not in s:
                  raise SystemExit('Run291 destination anchor missing')
              s = s.replace(anchor, validator + anchor, 1)
          if '_recent_private_edit_urls' in s or '_copy_history_rows' in s:
              raise SystemExit('History discovery unexpectedly present in Run291')
          p.write_text(s, encoding='utf-8')

          # 2) Move persistent Chrome History discovery to Run190, which owns the profile.
          p = Path('run190_note_persistent_cloud.py')
          s = p.read_text(encoding='utf-8')
          for imp in ('import shutil\n', 'import sqlite3\n'):
              if imp not in s:
                  s = s.replace('import os\n', 'import os\n' + imp, 1)
          if 'MAX_HISTORY_CANDIDATES = 24\n' not in s:
              s = s.replace('DEFAULT_PROFILE_DIR = Path.home() / ".aiif-note" / "chrome-profile"\n', 'DEFAULT_PROFILE_DIR = Path.home() / ".aiif-note" / "chrome-profile"\nMAX_HISTORY_CANDIDATES = 24\n', 1)
          history_anchor = '\ndef _launch_persistent_context(playwright: Any) -> Any:\n'
          if 'def _recent_private_edit_urls' not in s:
              funcs = '''\ndef _copy_history_rows(history_path: Path) -> list[tuple[str, int]]:\n    """Read a copy of Chrome History so a live profile is never locked or mutated."""\n    temp_dir = Path(tempfile.mkdtemp(prefix="run190-history-"))\n    copy_path = temp_dir / "History"\n    try:\n        shutil.copy2(history_path, copy_path)\n        conn = sqlite3.connect(str(copy_path))\n        try:\n            rows = conn.execute(\n                "SELECT url, last_visit_time FROM urls "\n                "WHERE url LIKE 'https://%note.com/notes/%/edit%' "\n                "ORDER BY last_visit_time DESC LIMIT 80"\n            ).fetchall()\n        finally:\n            conn.close()\n        return [(str(url or ""), int(last_visit or 0)) for url, last_visit in rows]\n    except (OSError, sqlite3.Error):\n        return []\n    finally:\n        shutil.rmtree(temp_dir, ignore_errors=True)\n\n\ndef _recent_private_edit_urls(profile_dir: Path) -> list[str]:\n    """Return recent existing note edit routes for legacy in-place repair flows only."""\n    weighted: list[tuple[int, str]] = []\n    try:\n        history_files = [p for p in profile_dir.rglob("History") if p.is_file()]\n    except OSError:\n        history_files = []\n    for history in history_files[:12]:\n        for url, last_visit in _copy_history_rows(history):\n            parsed = urlparse(url)\n            host = (parsed.hostname or "").lower()\n            path = (parsed.path or "").rstrip("/")\n            if (\n                parsed.scheme == "https"\n                and host in {"note.com", "editor.note.com"}\n                and path.startswith("/notes/")\n                and path.endswith("/edit")\n                and path.count("/") == 3\n            ):\n                weighted.append((last_visit, url))\n    weighted.sort(key=lambda item: item[0], reverse=True)\n    seen: set[str] = set()\n    result: list[str] = []\n    for _, url in weighted:\n        if url in seen:\n            continue\n        seen.add(url)\n        result.append(url)\n        if len(result) >= MAX_HISTORY_CANDIDATES:\n            break\n    return result\n\n'''
              if history_anchor not in s:
                  raise SystemExit('Run190 launch anchor missing')
              s = s.replace(history_anchor, funcs + history_anchor, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Legacy Run298 uses Run190's persistent-profile History utility.
          p = Path('run298_genrec_inplace_refresh.py')
          s = p.read_text(encoding='utf-8')
          old = 'candidates = audit_base._recent_private_edit_urls(cloud._profile_dir())'
          new = 'candidates = cloud._recent_private_edit_urls(cloud._profile_dir())'
          if old not in s and new not in s:
              raise SystemExit('Run298 history call anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Tests: keep Run291 route validator coverage, move History coverage to Run190.
          p = Path('tests/test_run291_private_draft_audit.py')
          s = p.read_text(encoding='utf-8')
          if 'import run190_note_persistent_cloud as cloud\n' not in s:
              s = s.replace('import run291_note_private_draft_audit as audit\n', 'import run190_note_persistent_cloud as cloud\nimport run291_note_private_draft_audit as audit\n', 1)
          s = s.replace('result = audit._recent_private_edit_urls(profile)', 'result = cloud._recent_private_edit_urls(profile)', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_run297_298_genrec_refresh.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('patch.object(r298.audit_base, "_recent_private_edit_urls", return_value=[stale, target])', 'patch.object(r298.cloud, "_recent_private_edit_urls", return_value=[stale, target])')
          s = s.replace('patch.object(r298.audit_base, "_recent_private_edit_urls", return_value=[first, second])', 'patch.object(r298.cloud, "_recent_private_edit_urls", return_value=[first, second])')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile run291_note_private_draft_audit.py run190_note_persistent_cloud.py run298_genrec_inplace_refresh.py tests/test_run291_private_draft_audit.py tests/test_run297_298_genrec_refresh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run291_note_private_draft_audit.py run190_note_persistent_cloud.py run298_genrec_inplace_refresh.py tests/test_run291_private_draft_audit.py tests/test_run297_298_genrec_refresh.py
          git commit -m 'refactor: isolate Chrome History from Run291 audit'
          git push origin HEAD:design/p0-a-note-lossless-contract
