name: Run236 One-Shot Evidence Context Patch

on:
  push:
    branches:
      - run236-evidence-context-modularization
    paths:
      - .github/workflows/run236-one-shot-pipeline-patch.yml
      - tests/_run236_patch_pipeline.py

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/run236-evidence-context-modularization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: run236-evidence-context-modularization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Apply guarded migration
        run: python tests/_run236_patch_pipeline.py

      - name: Compile changed Python surfaces
        run: python -m py_compile pipeline.py evidence_context.py tests/test_run236_evidence_context_module.py

      - name: Run Run236 behavioral contract
        run: python -m unittest tests/test_run236_evidence_context_module.py -v

      - name: Verify patch shape
        run: git diff --check

      - name: Commit migrated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py AI_Intelligence_Factory_最終仕様書.md
          if git diff --cached --quiet; then
            echo "Run236 patch produced no staged changes"
            exit 1
          fi
          git commit -m "Run236: move evidence context logic out of pipeline"
          git push origin HEAD:run236-evidence-context-modularization
