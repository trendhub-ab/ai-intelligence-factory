name: Daily Intelligence & Content Pipeline

on:
  schedule:
    # 毎日 午前9時（JST）に自動起動（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v6

      - name: Python環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 最小限の依存ライブラリのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 通常Pipelineを実行
        run: |
          python pipeline.py
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2026-03-11"
          # Decision Intelligence product side-path. OFF by default until TEST DBs are provisioned.
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: "20"
          # Revenue Product Phase 2: article discovery and paid Decision Intelligence are separated.
          ENABLE_REVENUE_PRODUCT_PHASE2: ${{ vars.ENABLE_REVENUE_PRODUCT_PHASE2 || 'true' }}
          TRACKING_ELIGIBILITY_MIN_SCORE: "55"
          TRACKING_REVIEW_DAYS: "14"
          PRODUCT_REVIEW_MAX_PER_RUN: "2"
          LEGACY_BOOTSTRAP_MAX_PER_RUN: "1"
          GEMINI_PRODUCT_REVIEW_PER_RUN_REQUEST_BUDGET: "3"
          DEFERRED_DEEP_DIVE_MAX_PER_RUN: "1"
          DEFERRED_DEEP_DIVE_MAX_QUEUE: "20"
          DEFERRED_DEEP_DIVE_STATE_PATH: "deferred_deep_dive/deferred_queue.json"
          DEFERRED_DEEP_DIVE_GITHUB_DIR: "deferred_deep_dive"
          DEFERRED_FLASH_TTL_DAYS: "2"
          DEFERRED_TREND_TTL_DAYS: "14"
          DEFERRED_EVERGREEN_TTL_DAYS: "60"
          # Subscriber/Monthly destinations are separate sanitized product DBs and stay OFF until provisioned.
          ENABLE_SUBSCRIBER_TECH_SYNC: ${{ vars.ENABLE_SUBSCRIBER_TECH_SYNC || 'false' }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          ENABLE_DECISION_MONTHLY_DIGEST: ${{ vars.ENABLE_DECISION_MONTHLY_DIGEST || 'false' }}
          NOTION_MONTHLY_DATABASE_ID: ${{ secrets.NOTION_MONTHLY_DATABASE_ID }}
          NOTION_MONTHLY_DATA_SOURCE_ID: ${{ secrets.NOTION_MONTHLY_DATA_SOURCE_ID }}
          DI_MEANINGFUL_SCORE_DELTA: "5"
          DI_STATUS_HYSTERESIS_SCORE_DELTA: "3"
          DI_RISK_TEXT_SIMILARITY_THRESHOLD: "0.82"
          DI_PRODUCT_TIMEZONE: "Asia/Tokyo"
          ARTICLE_PUBLICATION_MODE: "free"
          ENABLE_SUBSCRIPTION_ATTRIBUTION: "true"
          SUBSCRIPTION_LANDING_URL: ${{ vars.SUBSCRIPTION_LANDING_URL }}
          SUBSCRIPTION_CAMPAIGN_ID: "ai_intelligence_factory_subscription"
          SUBSCRIPTION_ATTRIBUTION_DIR: "subscription_attribution/articles"
          SUBSCRIPTION_ATTRIBUTION_GITHUB_DIR: "subscription_attribution/articles"
          EYECATCH_MIN_DECISION_SCORE: "60"
          PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
          TOP_N_FOR_DEEP_DIVE: "3"
          # Free Article Delivery Reliability: keep Fact safety, improve publishable yield.
          ENABLE_PUBLICATION_RELIABILITY_SLOT: "true"
          PUBLICATION_RELIABILITY_SLOTS: "1"
          PUBLICATION_RELIABILITY_MIN_DECISION_SCORE: "65"
          PUBLICATION_RELIABILITY_MIN_ADVANTAGE: "8"
          ENABLE_DETERMINISTIC_PUBLICATION_RESCUE: "true"
          NOTION_SAVE_THRESHOLD_SCORE: "60"
          GITHUB_FETCH_LIMIT: "50"
          HN_FETCH_LIMIT: "50"
          ARXIV_FETCH_LIMIT: "50"
          PRODUCTHUNT_FETCH_LIMIT: "50"
          PRODUCTHUNT_LOOKBACK_HOURS: "72"
          MAX_SCREENING_CANDIDATES: "200"
          ENABLE_PROFIT_PRIORITY: "true"
          DEEP_DIVE_DECISION_WEIGHT: "0.65"
          DEEP_DIVE_COMMERCIAL_WEIGHT: "0.35"
          EVERGREEN_PORTFOLIO_MIN: "1"
          EVERGREEN_PRIORITY_TOLERANCE: "8"
          ENABLE_PORTFOLIO_BALANCE: "true"
          PORTFOLIO_MIN_DISTINCT_TOPICS: "2"
          PORTFOLIO_TOPIC_PRIORITY_TOLERANCE: "6"
          ENABLE_SOURCE_ROI_LEARNING: "true"
          SOURCE_ROI_HISTORY_RUNS: "30"
          SOURCE_ROI_RECENCY_DECAY: "0.93"
          SOURCE_ROI_MIN_SCREENED: "50"
          SOURCE_ROI_MIN_DEEP_DIVE_ATTEMPTS: "2"
          SOURCE_ROI_MIN_MATURE_SOURCES: "2"
          SOURCE_ROI_MIN_FETCH_PER_SOURCE: "25"
          SOURCE_ROI_EXPLORATION_WEIGHT: "0.15"
          SOURCE_ROI_STOCK_WEIGHT: "0.35"
          SOURCE_ROI_READY_WEIGHT: "0.45"
          SOURCE_ROI_EFFICIENCY_WEIGHT: "0.20"
          SOURCE_ROI_MAX_FETCH_PER_SOURCE: "75"
          SOURCE_ROI_STATE_PATH: "source_roi_history/source_roi_state.json"
          SOURCE_ROI_GITHUB_DIR: "source_roi_history"
          SCREENING_BATCH_SIZE: "25"
          SCREENING_RECOVERY_BATCH_SIZE: "10"
          SCREENING_BATCH_MAX_OUTPUT_TOKENS: "5000"
          SCREENING_BATCH_PACING_SECONDS: "10"
          ENABLE_GLOBAL_CALIBRATION: "true"
          GLOBAL_CALIBRATION_MIN_RAW_SCORE: "55"
          GLOBAL_CALIBRATION_BATCH_SIZE: "50"
          GLOBAL_CALIBRATION_MAX_OUTPUT_TOKENS: "4000"
          ENABLE_OBSERVED_HISTORY: "true"
          OBSERVED_HISTORY_DIR: "observed_history"
          STALE_THRESHOLD_DAYS: "10"
          GEMINI_SCREENING_CALL_TIMEOUT_SECONDS: "60"
          GEMINI_DEEP_DIVE_CALL_TIMEOUT_SECONDS: "120"
          GEMINI_DEEP_DIVE_CALL_PACING_SECONDS: "20"
          GEMINI_PERSISTENT_DAILY_COUNTER: "true"
          GEMINI_COUNTER_BRANCH: "main"
          EYECATCH_GITHUB_BRANCH: "main"
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_36_FLASH_DAILY_BUDGET: "18"
          GEMINI_37_FLASH_DAILY_BUDGET: "18"
          GEMINI_35_FLASH_DAILY_BUDGET: "18"
          GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: "gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash"
          GEMINI_QUOTA_TIMEZONE: "America/Los_Angeles"
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: "12"
          GEMINI_PENDING_RETRY_REQUEST_BUDGET: "2"
          MAX_EVIDENCE_DOCUMENTS: "3"
          VERIFICATION_CONTEXT_MAX_CHARS: "180000"

      # 未公開記事・Gate履歴はRepositoryへcommitせず、アクセス制限されたArtifactとしてのみ保持する。
      - name: 月次ダイジェストをPrivate Artifactとして保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-digest-${{ github.run_number }}
          path: monthly_digests/
          if-no-files-found: ignore
          retention-days: 90

      - name: Gate履歴・内部レビュー候補を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-gate-review-${{ github.run_number }}
          path: |
            review_candidates/
            quality_failures/
            gate_history/
            regression_cases_pending/
            article_audit/
          if-no-files-found: warn
          retention-days: 14
