name: Daily Intelligence & Content Pipeline

on:
  schedule:
    # 毎日 午前9時（JST）に自動起動（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行ボタンの有効化

# 手動実行と定期実行が重なって永続カウンタを競合更新しないよう、同一リポジトリでは直列化。
concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  # アイキャッチ、月次ダイジェスト、Observed履歴をContents APIで保存する。
  contents: write

jobs:
  run-pipeline:
    # workflow_dispatchで別ブランチを選んだ場合は、本番データへ書き込まない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # Screening + Deep Dive retryを含む無人運転の上限。API側は別途120秒watchdogあり

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v6

      - name: Python環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 最小限の依存ライブラリのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 一次情報収集・Notion原稿自動生成パイプライン実行
        run: |
          python pipeline.py
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2026-03-11"
          # 自動生成記事は無料公開。NotionのSubscription Visibilityには
          # 「Free Article」選択肢を事前に追加すること（本文は自動投稿しない）。
          ARTICLE_PUBLICATION_MODE: "free"
          EYECATCH_MIN_DECISION_SCORE: "60"
          PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
          TOP_N_FOR_DEEP_DIVE: "3"
          NOTION_SAVE_THRESHOLD_SCORE: "60"
          # Batch Screening / Observed Intelligence。1候補1callではなく、25候補を1callで採点する。
          GITHUB_FETCH_LIMIT: "50"
          HN_FETCH_LIMIT: "50"
          ARXIV_FETCH_LIMIT: "50"
          PRODUCTHUNT_FETCH_LIMIT: "50"
          MAX_SCREENING_CANDIDATES: "200"
          SCREENING_BATCH_SIZE: "25"
          SCREENING_BATCH_PACING_SECONDS: "4"
          ENABLE_GLOBAL_CALIBRATION: "true"
          GLOBAL_CALIBRATION_MIN_RAW_SCORE: "55"
          GLOBAL_CALIBRATION_BATCH_SIZE: "50"
          ENABLE_OBSERVED_HISTORY: "true"
          OBSERVED_HISTORY_DIR: "observed_history"
          OBSERVED_HISTORY_GITHUB_DIR: "observed_history"
          STALE_THRESHOLD_DAYS: "10"
          GEMINI_DEEP_DIVE_CALL_TIMEOUT_SECONDS: "120"
          # Google Free Tier保護用の「複数Run共有・モデル別」Safety Cap。
          # GoogleのRPDリセット境界に合わせ、America/Los_Angelesの日付でカウントする。
          GEMINI_PERSISTENT_DAILY_COUNTER: "true"
          GEMINI_PERSISTENT_COUNTER_PATH: ".runtime/gemini_daily_usage.json"
          GEMINI_COUNTER_BRANCH: "main"
          EYECATCH_GITHUB_BRANCH: "main"
          # 2026-08-16確認: Flash Lite=500 RPD / Flash=20 RPD。
          # 下記は実RPDではなく、余裕を残すPipeline側のSafety Cap（450/18）。
          # 利用量0のfallbackモデルも削除せず維持する。
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_36_FLASH_DAILY_BUDGET: "18"
          GEMINI_37_FLASH_DAILY_BUDGET: "18"
          GEMINI_35_FLASH_DAILY_BUDGET: "18"
          GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: "gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash"
          GEMINI_QUOTA_TIMEZONE: "America/Los_Angeles"
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: "10"
          # 月末ダイジェスト関連（任意設定・未設定時は既定値を使用）。
          # 専用cronは設けず、この日次ジョブが月末日に実行された回のみ
          # 内部判定で自動的にダイジェスト生成が走る（pipeline.py参照）。
          # MONTHLY_DIGEST_OUTPUT_DIR: "monthly_digests"
          # MONTHLY_DIGEST_GITHUB_DIR: "monthly_digests"
          # MONTHLY_DIGEST_MAX_ITEMS: "500"
