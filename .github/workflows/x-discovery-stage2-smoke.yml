name: X Discovery Stage2 Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR_ID: simple.actor~x-profile-posts
      APIFY_MAX_CHARGE_USD: '0.05'
      MAX_RECORDS: '100'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prove zero-Gemini and zero-production-write boundary
        run: |
          python - <<'PY'
          import os

          forbidden = (
              'GEMINI_API_KEY',
              'GOOGLE_API_KEY',
              'NOTION_API_KEY',
              'NOTION_DECISION_INTELLIGENCE_API_KEY',
              'TELEGRAM_BOT_TOKEN',
          )
          present = [name for name in forbidden if os.getenv(name)]
          if present:
              raise SystemExit('forbidden production/model credentials exposed: ' + ','.join(present))
          print('Zero-Gemini boundary OK; only isolated X/Apify discovery is authorized.')
          PY
      - name: Build fixed Stage2 Actor input
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          watchlist = json.loads(Path('x_discovery/watchlists/ai_core_20.json').read_text(encoding='utf-8'))
          handles = [row['handle'] for row in watchlist['accounts']]
          if len(handles) != 20 or len(set(handle.lower() for handle in handles)) != 20:
              raise SystemExit('Stage2 watchlist must contain exactly 20 unique handles')
          payload = {
              'handles': handles,
              'outputFormat': 'profile',
              'maxPosts': 5,
              'onlyPostsNewerThan': '12 hours',
              'includeRaw': False,
              'isolateProfiles': True,
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('APIFY_INPUT_JSON=' + json.dumps(payload, separators=(',', ':')) + '\n')
          print(json.dumps({'handles': len(handles), 'window': '12 hours', 'outputFormat': 'profile', 'isolated': True, 'resolve_tco': True, 'factory_adapter': 'dry_run'}))
          PY
      - name: Validate Stage2 guardrails
        run: |
          python - <<'PY'
          import json
          import os

          if not os.getenv('APIFY_TOKEN', '').strip():
              raise SystemExit('APIFY_TOKEN repository secret is required; refusing live run')
          if os.environ.get('APIFY_ACTOR_ID') != 'simple.actor~x-profile-posts':
              raise SystemExit('unexpected Actor ID; refusing live run')
          if float(os.environ['APIFY_MAX_CHARGE_USD']) > 0.05:
              raise SystemExit('Stage2 total requested charge budget must be <= $0.05')
          if int(os.environ['MAX_RECORDS']) != 100:
              raise SystemExit('Stage2 max records must be exactly 100')
          payload = json.loads(os.environ['APIFY_INPUT_JSON'])
          if payload.get('outputFormat') != 'profile' or payload.get('isolateProfiles') is not True:
              raise SystemExit('Stage2 must use isolated profile output')
          if payload.get('onlyPostsNewerThan') != '12 hours':
              raise SystemExit('Stage2 must use a 12-hour polling window')
          if payload.get('maxPosts') != 5:
              raise SystemExit('Stage2 must request all five visible posts')
          if len(payload.get('handles', [])) != 20:
              raise SystemExit('Stage2 must contain exactly 20 handles')
          print('Stage2 live guardrails OK; Factory writes remain disabled.')
          PY
      - name: Run isolated Stage2 ingestion
        run: |
          python -m x_discovery.runner \
            --provider apify \
            --output-dir /tmp/x-discovery-stage2 \
            --max-records "$MAX_RECORDS" \
            --resolve-tco
      - name: Exercise Factory handoff boundary in dry-run mode
        run: |
          python -m x_discovery.factory_adapter \
            --queue /tmp/x-discovery-stage2/primary_resolution_queue.json \
            --output /tmp/x-discovery-stage2/factory_adapter_preview.json
      - name: Verify isolation, transport, and handoff contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/x-discovery-stage2')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          adapter = json.loads((root / 'factory_adapter_preview.json').read_text(encoding='utf-8'))
          assert manifest['provider'] == 'apify'
          assert manifest['requested_profile_count'] == 20
          assert manifest['factory_write'] is False
          assert manifest['evidence_promoted'] is False
          assert manifest['evidence_status'] == 'discovery_only'
          assert manifest['x_official_api_calls'] == 0
          assert manifest['external_provider_calls'] == 20
          assert manifest['tco_resolution_enabled'] is True
          assert adapter['mode'] == 'dry_run'
          assert adapter['source_platform'] == 'x'
          assert adapter['source_role'] == 'discovery_signal'
          assert adapter['factory_write'] is False
          assert adapter['screening_executed'] is False
          assert adapter['evidence_promoted'] is False
          assert adapter['evidence_status'] == 'discovery_only'
          assert adapter['source_item_count'] == manifest['primary_resolution_queue_count']
          assert adapter['accepted_count'] + adapter['rejected_count'] == adapter['source_item_count']
          for item in adapter['items']:
              assert item['factory_write'] is False
              assert item['is_evidence'] is False
              assert item['screening_executed'] is False
              assert item['evidence_promoted'] is False
          assert (root / 'provider_diagnostics.json').exists()
          assert (root / 'provider_raw_items.json').exists()
          assert (root / 'primary_resolution_queue.json').exists()
          print(json.dumps({'manifest': manifest, 'factory_adapter': adapter}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload Stage2 diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-discovery-stage2-smoke-${{ github.run_number }}
          path: /tmp/x-discovery-stage2/
          if-no-files-found: error
          retention-days: 7
