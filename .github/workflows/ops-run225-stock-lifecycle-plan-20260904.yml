name: Ops Run225 Stock Lifecycle Apply

on:
  push:
    branches:
      - ops-run225-stock-lifecycle-20260904
    paths:
      - '.github/workflows/ops-run225-stock-lifecycle-plan-20260904.yml'

permissions:
  contents: read

concurrency:
  group: aiif-stock-lifecycle
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal dependency
        run: python -m pip install requests
      - name: Apply validated lifecycle labels
        run: python stock_lifecycle_reconcile.py --apply
        env: &lifecycle_env
          TZ: 'Asia/Tokyo'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          STOCK_FRESH_DAYS: '30'
          STOCK_ARCHIVE_DAYS: '90'
          STOCK_LIFECYCLE_MAX_RECORDS: '5000'
          STOCK_LIFECYCLE_NOTION_PACING_SECONDS: '0.34'
      - name: Read-back verification plan
        run: python stock_lifecycle_reconcile.py
        env: *lifecycle_env
      - name: Safety assertion
        run: echo 'ZERO_GEMINI_CALLS=true PUBLIC_RELEASE=false RECORD_DELETION=false ONLY_UPDATE_STATE_CHANGED=true'
