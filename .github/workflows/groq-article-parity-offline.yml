name: Groq Article Parity Offline
on:
  push:
    branches: ['dev/groq-provider-foundation']
    paths:
      - 'ai_provider.py'
      - 'groq_rate_policy.py'
      - 'groq_validation.py'
      - 'groq_remote_budget.py'
      - 'groq_article_parity.py'
      - 'groq_prompt_compiler.py'
      - 'tests/test_groq_article_parity.py'
      - 'tests/test_groq_budget_reconciliation.py'
      - 'tests/test_ai_provider.py'
      - 'tests/fixtures/groq/article_parity_B0049_input.json'
      - '.github/workflows/groq-article-parity-offline.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'ai_provider.py'
      - 'groq_rate_policy.py'
      - 'groq_validation.py'
      - 'groq_remote_budget.py'
      - 'groq_article_parity.py'
      - 'groq_prompt_compiler.py'
      - 'tests/test_groq_article_parity.py'
      - 'tests/test_groq_budget_reconciliation.py'
      - 'tests/test_ai_provider.py'
      - 'tests/fixtures/groq/article_parity_B0049_input.json'
      - '.github/workflows/groq-article-parity-offline.yml'
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove provider routing prompt gate and budget reconciliation without network
        run: |
          python -m unittest tests.test_ai_provider -v
          python -m unittest tests.test_groq_budget_reconciliation -v
          python -m unittest tests.test_groq_article_parity -v
      - name: Install runtime dependencies for real prompt preflight
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema
      - name: Build current Production prompt and prove selected Free Plan lane fits
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          AIIF_GROQ_LIVE: 'false'
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          import re
          import pipeline
          import production_pipeline
          from ai_provider import GenerationRequest, GroqProvider
          from groq_article_parity import build_production_article_fixture
          from groq_prompt_compiler import MAX_COMPILED_PROMPT_BYTES
          from groq_rate_policy import policy_for_model
          from run283_numeric_evidence_equivalence import install as install_run283
          from run284_reader_recovery_precision import install as install_run284
          from reader_quality_precision import install as install_reader_quality_precision
          production_pipeline.install_runtime_layers(pipeline)
          production_pipeline.install_run349_score_narrative_negation_precision(pipeline)
          install_run283(pipeline)
          install_reader_quality_precision(pipeline)
          install_run284(pipeline)
          fixture = build_production_article_fixture(
              pipeline,
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'groq-article-production-prompt.json',
          )
          policy = policy_for_model(fixture['model'])
          provider = GroqProvider(lambda _: None, token_budget=policy.safe_tpm, model=fixture['model'])
          payload, estimate = provider.prepare(GenerationRequest(
              fixture['prompt'], fixture['max_output_tokens'], None, fixture['reasoning_effort']
          ))
          assert payload.get('compound_custom', {}).get('tools', {}).get('enabled_tools') == []
          assert 'tool_choice' not in payload
          assert payload.get('citation_options') == 'disabled'
          assert fixture['rate_policy'] == policy.name
          prompt = fixture['prompt']
          payload_bytes = len(json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8'))
          prompt_bytes = len(prompt.encode('utf-8'))
          canonical_bytes = int(fixture['provenance']['canonical_prompt_bytes'])
          compiled_bytes = int(fixture['provenance']['compiled_prompt_bytes'])
          assert compiled_bytes == prompt_bytes
          assert compiled_bytes <= MAX_COMPILED_PROMPT_BYTES
          assert compiled_bytes < canonical_bytes
          max_request_json_bytes = 24 * 1024
          assert payload_bytes <= max_request_json_bytes, (payload_bytes, max_request_json_bytes)
          reduction_pct = round((1 - compiled_bytes / canonical_bytes) * 100, 1)
          headings = list(re.finditer(r'(?m)^【([^】]+)】\s*$', prompt))
          sections = []
          for i, match in enumerate(headings):
              end = headings[i + 1].start() if i + 1 < len(headings) else len(prompt)
              text = prompt[match.start():end]
              sections.append({'heading': match.group(1), 'chars': len(text), 'bytes': len(text.encode('utf-8'))})
          sections.sort(key=lambda row: row['bytes'], reverse=True)
          print(json.dumps({
              'free_plan_preflight': 'PASS',
              'model': fixture['model'],
              'rate_policy': policy.name,
              'safe_tpm': policy.safe_tpm,
              'reserved_estimate': estimate,
              'headroom': policy.safe_tpm - estimate,
              'max_output_tokens': fixture['max_output_tokens'],
              'canonical_prompt_utf8_bytes': canonical_bytes,
              'compiled_prompt_utf8_bytes': compiled_bytes,
              'compiler_reduction_pct': reduction_pct,
              'request_json_utf8_bytes': payload_bytes,
              'request_json_guard_bytes': max_request_json_bytes,
              'transport_compiler': fixture['provenance']['transport_compiler'],
              'top_prompt_sections': sections[:12],
              'external_tools': 'disabled_via_compound_custom',
              'business_writes': 0,
              'live_provider': False,
          }, ensure_ascii=False))
      - name: Assert live provider remains disabled in offline CI
        run: test -z "${GROQ_API_KEY:-}"

  reevaluate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema
      - name: Download saved v4 Groq result without a new provider call
        uses: actions/download-artifact@v4
        with:
          name: groq-article-parity-B0049
          path: prior-artifact
          repository: trendhub-ab/ai-intelligence-factory
          run-id: 34659160334
          github-token: ${{ github.token }}
      - name: Re-evaluate saved v4 with current Production polish and all four gates
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          AIIF_GROQ_LIVE: 'false'
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          from pathlib import Path
          import note_manuscript
          import pipeline
          import production_pipeline
          from groq_article_parity import evaluate_groq_article_output
          from source_normalization import install as install_source_normalization
          from run268_business_source_strategy import install as install_run268
          from run269_business_source_precision import install as install_run269
          from run283_numeric_evidence_equivalence import install as install_run283
          from run284_reader_recovery_precision import install as install_run284
          from run287_publication_date_provenance import install as install_run287
          from reader_quality_precision import install as install_reader_quality_precision

          install_source_normalization(pipeline)
          production_pipeline.install_runtime_layers(pipeline)
          production_pipeline.install_run349_score_narrative_negation_precision(pipeline)
          install_run283(pipeline)
          install_run268(pipeline)
          install_run269(pipeline)
          install_reader_quality_precision(pipeline)
          install_run284(pipeline)
          install_run287(note_manuscript, pipeline)

          candidates = list(Path('prior-artifact').rglob('groq-article-result.json'))
          assert len(candidates) == 1, candidates
          evaluation = evaluate_groq_article_output(
              pipeline,
              str(candidates[0]),
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'groq-article-v4-reevaluation.json',
          )
          assert evaluation['provider_calls'] == 1
          assert evaluation['business_writes'] == 0
          assert evaluation['persist_results'] is False
          assert evaluation['parsed']
          assert evaluation['article_chars'] > 0
          print(json.dumps({
              'candidate_id': evaluation['candidate_id'],
              'model': evaluation['model'],
              'provider_calls_from_saved_report': evaluation['provider_calls'],
              'new_provider_calls': 0,
              'evidence_state': evaluation['evidence_state'],
              'evidence_sufficient': evaluation['evidence_sufficient'],
              'fact_ok': evaluation['fact_ok'],
              'fact_failures': evaluation['fact_failures'],
              'editorial_ok': evaluation['editorial_ok'],
              'editorial_warnings': evaluation['editorial_warnings'],
              'publication_state': evaluation['publication_state'],
              'publication_issues': evaluation['publication_issues'],
              'human_appeal_state': evaluation['human_appeal_state'],
              'human_appeal_issues': evaluation['human_appeal_issues'],
              'gate_disposition': evaluation['gate_disposition'],
              'quality_validated': evaluation['quality_validated'],
              'decision_score': evaluation['decision_score'],
              'article_chars': evaluation['article_chars'],
              'business_writes': evaluation['business_writes'],
          }, ensure_ascii=False))
      - name: Assert no live provider credential exists
        run: test -z "${GROQ_API_KEY:-}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groq-article-parity-v4-reevaluation
          path: groq-article-v4-reevaluation.json
          if-no-files-found: error
          retention-days: 30
