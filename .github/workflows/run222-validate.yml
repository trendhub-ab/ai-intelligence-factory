name: Run222 Note Presentation Validation

on:
  push:
    branches:
      - run222-note-presentation-integrity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run222-note-presentation-integrity
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: pip install requests

      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            run222_note_presentation_integrity.py \
            production_pipeline.py \
            run194_note_persistent_cloud.py \
            publication_contract.py

      - name: Run zero-API regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_run222_note_presentation_integrity -v
          python -m unittest tests.test_note_draft_automation -v
          python -m unittest tests.test_run194_publication_contract -v
          python -m unittest tests.test_run194_note_current_contract -v
          python -m unittest tests.test_run199_note_vm_preflight -v
          python -m unittest tests.test_note_ready_sync -v
          python -m unittest tests.test_run194_note_ready_workflow -v
          python -m unittest tests.test_run197_note_ready_policy_reconciliation -v

      - name: Patch canonical specification for Run222
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AI_Intelligence_Factory_最終仕様書.md')
          text = path.read_text(encoding='utf-8')

          anchor = '古い契約、hash不一致、asset不足を無理に復活させない。Notion保存時に改行等が1文字でも欠落したReady本文も投稿対象にせずFail-Closedする。'
          addition = '''古い契約、hash不一致、asset不足を無理に復活させない。Notion保存時に改行等が1文字でも欠落したReady本文も投稿対象にせずFail-Closedする。\n\n### 6.1 note footer / presentation integrity — Run222\n\n初回の実note private-draft E2Eで、CTAがSources / Evidenceより前に置かれること、note title fieldと本文H1が重複すること、単一`#`が本文に生表示されることを確認した。Run222以降の公開表示契約は以下。\n\n1. 記事本文・結論の後に`Sources / Evidence`、権利/出典注記、免責を置く。\n2. `AI Decision Intelligence` CTAはそれら信頼情報の**後**、記事の最終Actionとして置く。\n3. note editorではstored Ready manuscriptをPublication Contractでbyte-exact検証した**後だけ**presentation transformを適用する。\n4. note title fieldと同一の先頭H1は本文から除去する。\n5. 残存する本文H1はcode fence外だけH2へ縮退し、raw Markdown `#`を表示しない。\n6. historical pre-Run222 Ready原稿もstored manuscript自体を書換えず、editor presentationでCTA順序を補正できる。\n7. Evidence / Decision / score / source URL / article factは変更しない。\n8. Gemini/model call 0、public release action 0を維持する。\n\n詳細: `docs/reference/RUN222_NOTE_PRESENTATION_INTEGRITY.md`。'''
          if '### 6.1 note footer / presentation integrity — Run222' not in text:
              if anchor not in text:
                  raise SystemExit('Run222 canonical section-6 anchor not found')
              text = text.replace(anchor, addition, 1)

          stack_anchor = '- `run199_note_vm_preflight.py`\n'
          if '- `run222_note_presentation_integrity.py`' not in text:
              if stack_anchor not in text:
                  raise SystemExit('Run222 note stack anchor not found')
              text = text.replace(stack_anchor, stack_anchor + '- `run222_note_presentation_integrity.py`\n', 1)

          freshness_anchor = '- 会員向け主要画面を説明のない空表へ退行させない。'
          freshness_line = '- Run222ではSources/Evidence + 免責をCTAより前に維持し、note title重複H1/raw `#`生表示を再発させない。'
          if freshness_line not in text:
              if freshness_anchor not in text:
                  raise SystemExit('Run222 freshness anchor not found')
              text = text.replace(freshness_anchor, freshness_anchor + '\n' + freshness_line, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit canonical spec if changed
        run: |
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo 'Canonical spec already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run222: update canonical note presentation contract'
          git push origin HEAD:run222-note-presentation-integrity
