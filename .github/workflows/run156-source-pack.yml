name: Run156 Source Pack

on:
  push:
    branches:
      - feature/run156-paid-db-decision-density
    paths:
      - run156_targets.json
      - .github/workflows/run156-source-pack.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Collect official GitHub evidence for exact 74 targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, time, urllib.error, urllib.request

          targets = json.load(open('run156_targets.json', encoding='utf-8'))['targets']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ai-intelligence-factory-run156',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode('utf-8')), None
              except Exception as e:
                  return None, f'{type(e).__name__}: {e}'

          out=[]
          for i,t in enumerate(targets,1):
              repo=t['name']
              meta, meta_err=get_json(f'https://api.github.com/repos/{repo}')
              readme, readme_err=get_json(f'https://api.github.com/repos/{repo}/readme')
              text=''
              readme_url=''
              if isinstance(readme,dict):
                  readme_url=readme.get('html_url') or ''
                  content=readme.get('content') or ''
                  if content:
                      try: text=base64.b64decode(content).decode('utf-8','replace')
                      except Exception as e: readme_err=f'decode: {e}'
              # Decision review needs substance, not the entire repo. Keep first 30k chars.
              text=text[:30000]
              row=dict(t)
              row.update({
                  'resolved_full_name': (meta or {}).get('full_name',''),
                  'description': (meta or {}).get('description') or '',
                  'homepage': (meta or {}).get('homepage') or '',
                  'language': (meta or {}).get('language') or '',
                  'topics': (meta or {}).get('topics') or [],
                  'archived': bool((meta or {}).get('archived',False)),
                  'pushed_at': (meta or {}).get('pushed_at') or '',
                  'updated_at': (meta or {}).get('updated_at') or '',
                  'default_branch': (meta or {}).get('default_branch') or '',
                  'readme_url': readme_url,
                  'readme': text,
                  'meta_error': meta_err,
                  'readme_error': readme_err,
              })
              out.append(row)
              print(f'[{i:02d}/{len(targets)}] {repo}: readme_chars={len(text)} meta_err={meta_err} readme_err={readme_err}')
              time.sleep(0.15)

          pathlib.Path('run156_artifacts').mkdir(exist_ok=True)
          json.dump({'schema_version':1,'zero_gemini_calls':True,'count':len(out),'records':out},open('run156_artifacts/primary_sources.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          failures=[r['name'] for r in out if not r['readme']]
          json.dump({'count':len(out),'readme_ok':len(out)-len(failures),'readme_missing':failures,'zero_gemini_calls':True},open('run156_artifacts/source_summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          if len(failures) > 8:
              raise SystemExit(f'too many missing README sources: {len(failures)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run156-primary-sources-${{ github.run_id }}
          path: run156_artifacts/
          retention-days: 14
