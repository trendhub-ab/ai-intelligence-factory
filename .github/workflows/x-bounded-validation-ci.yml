name: X Bounded Validation CI

on:
  pull_request:
    paths:
      - 'production_pipeline.py'
      - 'x_discovery/bounded_factory_validation.py'
      - 'x_discovery/bounded_calibration_validation.py'
      - 'x_discovery/fixtures/defense_factory_boundary_20260911.json'
      - 'x_discovery/fixtures/defense_factory_screening_result_20260911.json'
      - 'tests/test_x_bounded_factory_validation.py'
      - 'tests/test_x_bounded_calibration_validation.py'
      - '.github/workflows/x-bounded-validation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GEMINI_API_KEY: ''
      NOTION_API_KEY: ''
      GH_PAT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bounded validation files
        run: >-
          python -m py_compile
          production_pipeline.py
          x_discovery/bounded_factory_validation.py
          x_discovery/bounded_calibration_validation.py
          tests/test_x_bounded_factory_validation.py
          tests/test_x_bounded_calibration_validation.py
      - name: Run bounded validation unit contracts
        run: >-
          python -m unittest
          tests.test_x_bounded_factory_validation
          tests.test_x_bounded_calibration_validation
