name: X Bounded Validation CI

on:
  pull_request:
    paths:
      - 'production_pipeline.py'
      - 'x_discovery/bounded_factory_validation.py'
      - 'tests/test_x_bounded_factory_validation.py'
      - '.github/workflows/x-bounded-validation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bounded validation files
        run: python -m py_compile production_pipeline.py x_discovery/bounded_factory_validation.py tests/test_x_bounded_factory_validation.py
      - name: Run bounded validation unit contract
        run: python -m unittest tests.test_x_bounded_factory_validation
