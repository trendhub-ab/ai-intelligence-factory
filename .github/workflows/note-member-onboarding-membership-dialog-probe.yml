name: Probe membership description edit route

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROBE_MEMBERSHIP_DESCRIPTION_EDIT_ROUTE_AI_DECISION_INTELLIGENCE_READONLY'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: note-membership-description-edit-route-probe
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.run_attempt == 1 &&
       github.event.issue.number == 71 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'trendhub-ab' &&
       github.actor == 'trendhub-ab' &&
       github.event.comment.body == '/aiif note membership description-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify Run320 history and exact Run332 zero-click probe
        run: python -m unittest tests.test_run320_member_onboarding_membership_dialog_probe tests.test_run332_membership_description_edit_route_probe -v
      - name: Validate exact read-only authorization
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            [ "$CONFIRM" = 'PROBE_MEMBERSHIP_DESCRIPTION_EDIT_ROUTE_AI_DECISION_INTELLIGENCE_READONLY' ] || exit 1
          else
            [ "$COMMENT" = '/aiif note membership description-probe' ] || exit 1
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  probe:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact Run332 regression
        run: python -m unittest tests.test_run332_membership_description_edit_route_probe -v
      - name: Probe membership description edit route with zero clicks
        env:
          NOTE_MEMBERSHIP_DESCRIPTION_ROUTE_PROBE_CONFIRM: PROBE_MEMBERSHIP_DESCRIPTION_EDIT_ROUTE_AI_DECISION_INTELLIGENCE_READONLY
          NOTE_MEMBERSHIP_DESCRIPTION_ROUTE_PROBE_RESULT_FILE: ${{ runner.temp }}/run332-membership-description-route.json
          NOTE_MEMBERSHIP_DESCRIPTION_ROUTE_PROBE_SCREENSHOT_FILE: ${{ runner.temp }}/run332-membership-description-route.png
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run332_membership_description_edit_route_probe.py
      - name: Enforce zero-click no-mutation contract
        env:
          RESULT_FILE: ${{ runner.temp }}/run332-membership-description-route.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if r.get('status') != 'membership_description_edit_route_probed_no_mutation':
              raise SystemExit(f'Run332 unexpected status: {r.get("status")!r}')
          if r.get('clicks_performed') != 0 or r.get('field_filled') is not False or r.get('save_clicked') is not False:
              raise SystemExit('Run332 zero-click/zero-fill/zero-save contract failed')
          if r.get('membership_mutation') is not False or r.get('public_mutation') is not False:
              raise SystemExit('Run332 no-mutation contract failed')
          if r.get('zero_gemini_calls') is not True or r.get('notion_writes') != 0:
              raise SystemExit('Run332 zero-model/zero-Notion contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run332 membership description edit-route probe\n')
              fh.write(f'- membership: `{r.get("membership_name")}`\n')
              fh.write(f'- audited edit href: `{r.get("audited_edit_href")}`\n')
              fh.write(f'- destination: `{r.get("url_after_direct_navigation")}`\n')
              fh.write(f'- description candidates: `{len(r.get("description_candidates") or [])}`\n')
              fh.write(f'- save candidates: `{len(r.get("save_candidates") or [])}`\n')
              fh.write('- clicks: `0`\n')
              fh.write('- fills: `0`\n')
              fh.write('- saves: `0`\n')
              fh.write('- Gemini calls: `0`\n')
              fh.write('- Notion writes: `0`\n')
          PY
      - name: Preserve Run332 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run332-membership-description-edit-route-probe
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/run332-membership-description-route.json
            ${{ runner.temp }}/run332-membership-description-route.png

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
