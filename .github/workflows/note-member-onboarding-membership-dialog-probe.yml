name: Probe exact onboarding membership dialog

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROBE_MEMBER_ONBOARDING_MEMBERSHIP_DIALOG_N284E428C80F4_SHAAAB9E57B'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: note-member-onboarding-membership-dialog-probe-n284e428c80f4
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.run_attempt == 1 &&
       github.event.issue.number == 71 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'trendhub-ab' &&
       github.actor == 'trendhub-ab' &&
       github.event.comment.body == '/aiif note onboarding membership-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify exact membership-dialog probe
        run: python -m unittest tests.test_run320_member_onboarding_membership_dialog_probe -v
      - name: Validate exact probe authorization
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            [ "$CONFIRM" = 'PROBE_MEMBER_ONBOARDING_MEMBERSHIP_DIALOG_N284E428C80F4_SHAAAB9E57B' ] || exit 1
          else
            [ "$COMMENT" = '/aiif note onboarding membership-probe' ] || exit 1
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  probe:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact membership-dialog regression
        run: python -m unittest tests.test_run320_member_onboarding_membership_dialog_probe -v
      - name: Probe exact membership dialog without mutation
        env:
          NOTE_MEMBER_ONBOARDING_MEMBERSHIP_DIALOG_PROBE_CONFIRM: PROBE_MEMBER_ONBOARDING_MEMBERSHIP_DIALOG_N284E428C80F4_SHAAAB9E57B
          NOTE_MEMBER_ONBOARDING_MEMBERSHIP_DIALOG_PROBE_RESULT_FILE: ${{ runner.temp }}/run320-member-onboarding-membership-dialog-probe.json
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run320_member_onboarding_membership_dialog_probe.py
      - name: Summarize membership-dialog probe
        env:
          RESULT_FILE: ${{ runner.temp }}/run320-member-onboarding-membership-dialog-probe.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if r.get('status') != 'probe_complete_no_membership_mutation':
              raise SystemExit('Run320 membership-dialog probe did not complete')
          if r.get('membership_selection_clicked') is not False or r.get('final_confirm_clicked') is not False:
              raise SystemExit('Run320 no-mutation contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run320 exact membership-dialog probe\n')
              fh.write(f'- target: `{r.get("target_note_id")}`\n')
              fh.write(f'- source title: `{r.get("source_title")}`\n')
              fh.write(f'- source body sha: `{r.get("source_body_sha256")}`\n')
              fh.write(f'- dialog count: `{len(r.get("surface_dialogs") or [])}`\n')
              fh.write(f'- membership mentions: `{len(r.get("membership_mentions") or [])}`\n')
              fh.write(f'- confirm candidates: `{len(r.get("confirm_candidates") or [])}`\n')
              fh.write('- membership selection clicked: `false`\n')
              fh.write('- final confirm clicked: `false`\n')
              fh.write('- public mutation: `false`\n')
              fh.write('- zero Gemini calls: `true`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
