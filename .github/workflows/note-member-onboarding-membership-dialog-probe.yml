name: Update exact membership description

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPDATE_MEMBERSHIP_DESCRIPTION_AI_DECISION_INTELLIGENCE_RUN334_EXACT'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: note-membership-description-exact-update
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.run_attempt == 1 &&
       github.event.issue.number == 71 &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'trendhub-ab' &&
       github.actor == 'trendhub-ab' &&
       github.event.comment.body == '/aiif note membership description-update')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify Run320/332/333 history and exact Run334 repair
        run: python -m unittest tests.test_run320_member_onboarding_membership_dialog_probe tests.test_run332_membership_description_edit_route_probe tests.test_run333_membership_description_exact_update tests.test_run334_membership_snapshot_locator_evaluate -v
      - name: Validate exact mutation authorization
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            [ "$CONFIRM" = 'UPDATE_MEMBERSHIP_DESCRIPTION_AI_DECISION_INTELLIGENCE_RUN334_EXACT' ] || exit 1
          else
            [ "$COMMENT" = '/aiif note membership description-update' ] || exit 1
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  update:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact Run333/334 regression
        run: python -m unittest tests.test_run333_membership_description_exact_update tests.test_run334_membership_snapshot_locator_evaluate -v
      - name: Update exact membership description through Run334 snapshot repair
        env:
          NOTE_MEMBERSHIP_DESCRIPTION_RUN334_CONFIRM: UPDATE_MEMBERSHIP_DESCRIPTION_AI_DECISION_INTELLIGENCE_RUN334_EXACT
          NOTE_MEMBERSHIP_DESCRIPTION_RUN334_RESULT_FILE: ${{ runner.temp }}/run334-membership-description-update.json
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run334_membership_description_exact_update.py
      - name: Enforce exact Run334 postconditions
        env:
          RESULT_FILE: ${{ runner.temp }}/run334-membership-description-update.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          status = r.get('status')
          if status not in {'updated_and_verified_exact_description_only', 'already_current_verified_no_mutation'}:
              raise SystemExit(f'Run334 unexpected status: {status!r}')
          if r.get('run334_snapshot_repair') is not True:
              raise SystemExit('Run334 snapshot repair marker missing')
          if r.get('other_plan_settings_unchanged') is not True:
              raise SystemExit('Run334 unrelated plan-setting invariance failed')
          if r.get('legacy_reference_present') is not False:
              raise SystemExit('Run334 legacy reference still present')
          if r.get('zero_gemini_calls') is not True or r.get('notion_writes') != 0:
              raise SystemExit('Run334 zero-model/zero-Notion contract failed')
          if status == 'updated_and_verified_exact_description_only':
              if r.get('description_mutation') is not True or r.get('save_clicks') != 1:
                  raise SystemExit('Run334 exact mutation/save contract failed')
          else:
              if r.get('description_mutation') is not False or r.get('save_clicks') != 0:
                  raise SystemExit('Run334 idempotent no-op contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run334 exact membership description update\n')
              fh.write(f'- status: `{status}`\n')
              fh.write(f'- description chars: `{r.get("description_chars")}` / 140\n')
              fh.write(f'- save clicks: `{r.get("save_clicks")}`\n')
              fh.write('- snapshot transport repaired: `true`\n')
              fh.write('- unrelated plan settings changed: `false`\n')
              fh.write('- legacy onboarding reference present: `false`\n')
              fh.write('- Gemini calls: `0`\n')
              fh.write('- Notion writes: `0`\n')
          PY
      - name: Preserve Run334 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run334-membership-description-exact-update
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/run334-membership-description-update.json

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
