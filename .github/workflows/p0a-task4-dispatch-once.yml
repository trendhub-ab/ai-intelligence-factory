name: P0-A Task4 read-only audit dispatch once

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-task4-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact existing private draft audit once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"design/p0-a-note-lossless-contract","inputs":{"confirm":"AUDIT_NOTE_DRAFT","sync_id":"3e9479ffdca9811385c7d1a8ffcb3d4a"}}'
          code="$(curl -sS -o /tmp/dispatch-body -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/note-private-draft-audit.yml/dispatches" \
            -d "${payload}")"
          if [ "${code}" != "204" ]; then
            echo "::error::workflow_dispatch failed with HTTP ${code}"
            exit 1
          fi
          echo 'P0-A Task4 read-only audit dispatch accepted.'
