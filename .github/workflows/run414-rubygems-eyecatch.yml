name: Run414 one-off RubyGems eyecatch
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: read
  issues: read
concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false
jobs:
  run414:
    if: >-
      github.run_attempt == 1 && github.event.issue.number == 71 &&
      github.event.issue.pull_request == null && github.actor == 'trendhub-ab' &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.event.comment.body == '/aiif run414 ruby-gems-eyecatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded eyecatch dependencies
        run: pip install requests pillow
      - name: Generate and attach exact RubyGems eyecatch
        env:
          RUN414_CONFIRM: RUN414_ONEOFF_RUBYGEMS_EYECATCH
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
        run: python run414_rubygems_eyecatch.py
      - name: Dispatch Ready sync with private-draft fan-out
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run note-ready-sync.yml --ref main -f create_private_draft=true
