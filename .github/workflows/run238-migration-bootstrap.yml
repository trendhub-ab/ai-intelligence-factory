name: Run238 Guarded Migration Bootstrap

on:
  push:
    branches:
      - run238-deep-dive-portfolio-modularization
    paths:
      - .github/workflows/run238-migration-bootstrap.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Run238 branch
        uses: actions/checkout@v6
        with:
          ref: run238-deep-dive-portfolio-modularization
          fetch-depth: 0

      - name: Apply fail-closed Run238 migration
        run: python run238_deep_dive_portfolio_migration.py

      - name: Compile migrated ownership surface
        run: python -m py_compile pipeline.py deep_dive_portfolio.py run238_deep_dive_portfolio_migration.py

      - name: Falsify dependency-free Run238 contract
        run: python -m unittest tests.test_run238_deep_dive_portfolio_module -v

      - name: Reject whitespace damage
        run: git diff --check

      - name: Commit migrated pipeline only
        shell: bash
        run: |
          if git diff --quiet -- pipeline.py; then
            echo "Expected pipeline.py migration produced no diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py
          git commit -m "Run238: extract Deep Dive portfolio shaping from pipeline"
          git push origin HEAD:run238-deep-dive-portfolio-modularization
