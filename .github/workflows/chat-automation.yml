name: Chat Automation Runner

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/chat-triggers/synthetic-full.txt'
      - '.github/chat-triggers/real-article-fixed.txt'
      - '.github/chat-triggers/real-article-fresh.txt'
      - '.github/chat-triggers/inventory-plan.txt'
      - '.github/chat-triggers/inventory-apply.txt'

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve requested mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          echo "$changed"

          mode=""
          select_mode() {
            local candidate="$1"
            local path="$2"
            if echo "$changed" | grep -Fxq "$path"; then
              if [ -n "$mode" ]; then
                echo 'Multiple chat trigger files changed in one commit; refusing to run.' >&2
                exit 1
              fi
              mode="$candidate"
            fi
          }

          select_mode 'synthetic-full' '.github/chat-triggers/synthetic-full.txt'
          select_mode 'real-article-fixed' '.github/chat-triggers/real-article-fixed.txt'
          select_mode 'real-article-fresh' '.github/chat-triggers/real-article-fresh.txt'
          select_mode 'inventory-plan' '.github/chat-triggers/inventory-plan.txt'
          select_mode 'inventory-apply' '.github/chat-triggers/inventory-apply.txt'

          if [ -z "$mode" ]; then
            echo 'No supported chat trigger detected; refusing to run.' >&2
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $mode"

      - name: Guard Inventory Bootstrap to main
        if: startsWith(steps.mode.outputs.mode, 'inventory-')
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Subscriber Inventory Bootstrap is main-only; refusing to run on a branch.' >&2
            exit 1
          fi

      - name: Parse Inventory Bootstrap request
        id: inventory
        if: startsWith(steps.mode.outputs.mode, 'inventory-')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.mode }}" = 'inventory-plan' ]; then
            trigger='.github/chat-triggers/inventory-plan.txt'
          else
            trigger='.github/chat-triggers/inventory-apply.txt'
          fi

          read_key() {
            awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$trigger" | tr -d '\r'
          }
          with_default() {
            local value="$1"
            local fallback="$2"
            if [ -z "$value" ]; then printf '%s' "$fallback"; else printf '%s' "$value"; fi
          }
          require_integer() {
            case "$2" in
              ''|*[!0-9]*) echo "$1 must be an integer" >&2; exit 1 ;;
            esac
          }

          target_inventory="$(with_default "$(read_key target_inventory)" '30')"
          min_sellable="$(with_default "$(read_key min_sellable)" '24')"
          max_reviews="$(with_default "$(read_key max_reviews)" '4')"
          product_request_budget="$(with_default "$(read_key product_request_budget)" '6')"
          max_source_share="$(with_default "$(read_key max_source_share)" '0.60')"
          confirm="$(read_key confirm)"

          require_integer target_inventory "$target_inventory"
          require_integer min_sellable "$min_sellable"
          require_integer max_reviews "$max_reviews"
          require_integer product_request_budget "$product_request_budget"
          if ! [[ "$max_source_share" =~ ^0\.[0-9]+$|^1(\.0+)?$ ]]; then
            echo 'max_source_share must be a decimal between 0 and 1.' >&2
            exit 1
          fi

          if [ "${{ steps.mode.outputs.mode }}" = 'inventory-apply' ] && [ "$confirm" != 'CONFIRM_BOOTSTRAP' ]; then
            echo 'inventory-apply requires confirm=CONFIRM_BOOTSTRAP; refusing to run.' >&2
            exit 1
          fi

          {
            echo "target_inventory=$target_inventory"
            echo "min_sellable=$min_sellable"
            echo "max_reviews=$max_reviews"
            echo "product_request_budget=$product_request_budget"
            echo "max_source_share=$max_source_share"
            echo "confirm=$confirm"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install article rendering fonts
        if: steps.mode.outputs.mode == 'real-article-fixed' || steps.mode.outputs.mode == 'real-article-fresh'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato

      - name: Production safety unit tests
        run: python -m unittest discover -s tests -v

      - name: Synthetic harness self-test
        if: steps.mode.outputs.mode == 'synthetic-full'
        run: python regression_suite.py --self-test

      - name: Synthetic Regression Suite full
        if: steps.mode.outputs.mode == 'synthetic-full'
        run: python regression_suite.py --bootstrap --full

      - name: Real Article Regression fixed
        if: steps.mode.outputs.mode == 'real-article-fixed'
        run: python pipeline.py
        env:
          REGEN_TEST_MODE: 'true'
          REGEN_TEST_ARTICLE_SET: 'fixed'
          REGEN_TEST_LIMIT: '3'
          REGEN_FRESH_FETCH_PER_SOURCE: '12'
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: 'main'
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_SCREENING_MODEL_CANDIDATES: 'gemini-3.5-flash-lite,gemini-3.1-flash-lite'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          VERIFICATION_CONTEXT_MAX_CHARS: '180000'

      - name: Real Article Regression fresh
        if: steps.mode.outputs.mode == 'real-article-fresh'
        run: python pipeline.py
        env:
          REGEN_TEST_MODE: 'true'
          REGEN_TEST_ARTICLE_SET: 'fresh'
          REGEN_TEST_LIMIT: '3'
          REGEN_FRESH_FETCH_PER_SOURCE: '12'
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: 'main'
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_SCREENING_MODEL_CANDIDATES: 'gemini-3.5-flash-lite,gemini-3.1-flash-lite'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          VERIFICATION_CONTEXT_MAX_CHARS: '180000'

      - name: Subscriber Inventory Bootstrap plan
        if: steps.mode.outputs.mode == 'inventory-plan'
        env:
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          TZ: Asia/Tokyo
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: '20'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_PERSISTENT_COUNTER_PATH: '.runtime/gemini_daily_usage.json'
          GEMINI_COUNTER_BRANCH: 'main'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
        run: |
          python inventory_bootstrap.py plan \
            --target '${{ steps.inventory.outputs.target_inventory }}' \
            --min-sellable '${{ steps.inventory.outputs.min_sellable }}'

      - name: Subscriber Inventory Bootstrap apply
        if: steps.mode.outputs.mode == 'inventory-apply'
        env:
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          TZ: Asia/Tokyo
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: '20'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_PERSISTENT_COUNTER_PATH: '.runtime/gemini_daily_usage.json'
          GEMINI_COUNTER_BRANCH: 'main'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
        run: |
          python inventory_bootstrap.py apply \
            --target '${{ steps.inventory.outputs.target_inventory }}' \
            --min-sellable '${{ steps.inventory.outputs.min_sellable }}' \
            --max-reviews '${{ steps.inventory.outputs.max_reviews }}' \
            --product-request-budget '${{ steps.inventory.outputs.product_request_budget }}' \
            --max-source-share '${{ steps.inventory.outputs.max_source_share }}' \
            --confirm '${{ steps.inventory.outputs.confirm }}'

      - name: Upload synthetic reports
        if: always() && steps.mode.outputs.mode == 'synthetic-full'
        uses: actions/upload-artifact@v7
        with:
          name: chat-synthetic-full-${{ github.run_number }}
          path: regression_suite_runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload real article outputs
        if: always() && (steps.mode.outputs.mode == 'real-article-fixed' || steps.mode.outputs.mode == 'real-article-fresh')
        uses: actions/upload-artifact@v7
        with:
          name: chat-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: |
            regen_test_outputs/
            gate_history/
          if-no-files-found: error
          retention-days: 14

      - name: Upload inventory bootstrap audit artifacts
        if: always() && startsWith(steps.mode.outputs.mode, 'inventory-')
        uses: actions/upload-artifact@v7
        with:
          name: chat-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: inventory_bootstrap_artifacts/
          if-no-files-found: warn
          retention-days: 30
