name: P0-B Trusted Paste GREEN [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  targeted-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: design/p0-b-durable-delivery-ledger
      - name: Verify fixed head
        run: test "$(git rev-parse HEAD)" = "7361affdb59d96d0f33dc8bf0630dea0c8bc76c8"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests pytest
      - name: Verify GREEN
        run: python -m pytest tests/test_p0a_trusted_clipboard_paste.py -q
