name: P0-B Source Ready Delivery-State Census [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Read-only classify current Ready delivery states
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, json
          import note_ready_sync as nrs
          import eyecatch_publication_contract as eye

          pages = nrs._query_db(
              nrs.SOURCE_DATA_SOURCE_ID,
              nrs.SOURCE_DATABASE_ID,
              payload={'filter': {'property': nrs.SOURCE_ARTICLE_STATUS, 'select': {'equals': nrs.SOURCE_READY}}},
          )
          counts = collections.Counter()
          current = 0
          skipped = 0
          for page in pages:
              state = nrs._source_state(page)
              if not state:
                  skipped += 1
                  continue
              sid = str(state.get('sync_id') or '')
              if not nrs._source_has_current_ready_manuscript(sid):
                  skipped += 1
                  continue
              image = str(state.get('eyecatch_url') or '')
              title = str(state.get('title') or '')
              if not image or not eye.current_asset_url(image, title):
                  skipped += 1
                  continue
              current += 1
              counts[nrs.classify_exact_delivery_state(sid)] += 1

          safe = {
              'current_ready_count': current,
              'delivery_state_counts': dict(sorted(counts.items())),
              'skipped_noncurrent_or_incomplete': skipped,
              'zero_gemini_calls': True,
              'zero_openai_calls': True,
              'note_mutation': False,
              'public_release': False,
              'private_identifiers_exposed': 0,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Current Ready delivery-state census\n')
              fh.write(f"- result: `{json.dumps(safe, ensure_ascii=False, sort_keys=True)}`\n")
          PY
