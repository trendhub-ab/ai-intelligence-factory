name: P0 C-1 Network Admin Readiness Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Reconfirm stopped-state prerequisites read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1ready"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          gcloud compute routers list --project "$GCP_PROJECT_ID" --format=json > "$tmp/routers.json"
          ROOT="$tmp" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          inst=json.loads((root/'instance.json').read_text())
          routers=json.loads((root/'routers.json').read_text())
          nics=inst.get('networkInterfaces') or []
          nic=nics[0] if nics else {}
          meta={str(x.get('key')):str(x.get('value')) for x in (inst.get('metadata',{}).get('items') or [])}
          safe={
            'status':'c1_network_admin_handoff_ready',
            'vm_running':str(inst.get('status') or '').upper()=='RUNNING',
            'external_access_config_count':len(nic.get('accessConfigs') or []),
            'cloud_router_count_visible':len(routers if isinstance(routers,list) else []),
            'project_ssh_keys_blocked':meta.get('block-project-ssh-keys','').lower()=='true',
            'os_login_enabled':meta.get('enable-oslogin','').lower()=='true',
            'serial_port_enabled':meta.get('serial-port-enable','').lower()=='true',
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 network-admin handoff readiness\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if safe['vm_running']:
              raise SystemExit('fail-closed: VM unexpectedly running')
          PY
