name: P0-B Exact ArXiv Ready Reconciliation [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact zero-model Ready reconciliation
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh workflow run note-ready-sync.yml \
            --repo trendhub-ab/ai-intelligence-factory \
            --ref main \
            -f create_private_draft=false \
            -f target_sync_id='' \
            -f target_source_url='https://arxiv.org/abs/2610.03574'
          echo 'Dispatched exact zero-model Ready reconciliation for canonical ArXiv source URL.'
