name: P0 C-1 Access Config and NAT Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0-c1-access-config-audit-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read-only access-config, NAT and permission census
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1nat"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          gcloud compute routers list --project "$GCP_PROJECT_ID" --format=json > "$tmp/routers.json" 2>/dev/null || echo '[]' > "$tmp/routers.json"
          token="$(gcloud auth print-access-token)"
          body='{"permissions":["compute.instances.deleteAccessConfig","compute.instances.setMetadata","compute.instances.setTags","compute.instances.start","compute.instances.stop"]}'
          code="$(curl -sS -o "$tmp/perms.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "$body" \
            "https://compute.googleapis.com/compute/v1/projects/${GCP_PROJECT_ID}/zones/${GCP_NOTE_VM_ZONE}/instances/${GCP_NOTE_VM_NAME}/testIamPermissions")"
          [ "$code" = "200" ] || echo '{"permissions":[]}' > "$tmp/perms.json"
          ROOT="$tmp" PROJECT="$GCP_PROJECT_ID" python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          inst=json.loads((root/'instance.json').read_text())
          routers=json.loads((root/'routers.json').read_text())
          perms=json.loads((root/'perms.json').read_text())
          nics=inst.get('networkInterfaces') or []
          access_configs=[a for n in nics for a in (n.get('accessConfigs') or [])]
          network=str((nics[0].get('network') if nics else '') or '').rsplit('/',1)[-1]
          subnetwork=str((nics[0].get('subnetwork') if nics else '') or '').rsplit('/',1)[-1]
          nat_total=0
          nat_on_network=0
          nat_covers_subnet=0
          for r in routers if isinstance(routers,list) else []:
              name=r.get('name'); region=str(r.get('region') or '').rsplit('/',1)[-1]
              rnet=str(r.get('network') or '').rsplit('/',1)[-1]
              if not name or not region: continue
              cp=subprocess.run(['gcloud','compute','routers','nats','list','--router',name,'--router-region',region,'--project',os.environ['PROJECT'],'--format=json'],capture_output=True,text=True)
              if cp.returncode!=0: continue
              try: nats=json.loads(cp.stdout or '[]')
              except Exception: nats=[]
              if not isinstance(nats,list): continue
              nat_total += len(nats)
              if rnet!=network: continue
              nat_on_network += len(nats)
              for nat in nats:
                  mode=str(nat.get('sourceSubnetworkIpRangesToNat') or '')
                  if mode.startswith('ALL_SUBNETWORKS'):
                      nat_covers_subnet += 1
                      continue
                  for s in (nat.get('subnetworks') or []):
                      sname=str(s.get('name') or '').rsplit('/',1)[-1]
                      if sname==subnetwork:
                          nat_covers_subnet += 1
                          break
          allowed=set(perms.get('permissions') or [])
          safe={
            'status':'c1_access_config_nat_audit_complete',
            'vm_status':str(inst.get('status') or ''),
            'access_config_count':len(access_configs),
            'startup_external_ip_possible':bool(access_configs),
            'nat_total_count':nat_total,
            'nat_on_vm_network_count':nat_on_network,
            'nat_covering_vm_subnet_count':nat_covers_subnet,
            'can_delete_access_config':'compute.instances.deleteAccessConfig' in allowed,
            'can_set_metadata':'compute.instances.setMetadata' in allowed,
            'can_set_tags':'compute.instances.setTags' in allowed,
            'can_start':'compute.instances.start' in allowed,
            'can_stop':'compute.instances.stop' in allowed,
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 access config / NAT audit\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          PY
