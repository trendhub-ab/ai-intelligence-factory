name: P0-B Visual-Repairable Fresh Ready Census [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - name: Read-only visual-repairable current Ready census
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, json
          import eyecatch_publication_contract as eye
          import note_ready_sync as nrs

          pages = nrs._query_db(
              nrs.SOURCE_DATA_SOURCE_ID,
              nrs.SOURCE_DATABASE_ID,
              payload={'filter': {'property': nrs.SOURCE_ARTICLE_STATUS, 'select': {'equals': nrs.SOURCE_READY}}},
          )
          counts = collections.Counter()
          total_ready = len(pages)
          valid_source = 0
          strict_current = 0
          for page in pages:
              state = nrs._source_state(page)
              if not state:
                  counts['invalid_source_state'] += 1
                  continue
              valid_source += 1
              sid = str(state.get('sync_id') or '')
              if not nrs._source_has_current_ready_manuscript(sid):
                  counts['noncurrent_manuscript'] += 1
                  continue
              strict_current += 1
              title = str(state.get('title') or '')
              image = str(state.get('eyecatch_url') or '')
              delivery = nrs.classify_exact_delivery_state(sid)
              if image and eye.current_asset_url(image, title):
                  counts[f'current_asset__{delivery}'] += 1
              else:
                  counts[f'needs_visual_repair__{delivery}'] += 1

          safe = {
              'source_ready_rows': total_ready,
              'valid_source_rows': valid_source,
              'strict_current_manuscript_rows': strict_current,
              'classification_counts': dict(sorted(counts.items())),
              'zero_gemini_calls': True,
              'zero_openai_calls': True,
              'notion_write': False,
              'note_mutation': False,
              'public_release': False,
              'private_identifiers_exposed': 0,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### P0-B visual-repairable fresh Ready census\n')
              fh.write(f"- result: `{json.dumps(safe, ensure_ascii=False, sort_keys=True)}`\n")
          PY
