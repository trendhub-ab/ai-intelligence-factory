name: P0 C-1 Access Config Stability Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Sample stopped-state access config repeatedly read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1stable"; mkdir -p "$tmp"
          : > "$tmp/samples.tsv"
          for i in 1 2 3 4 5; do
            gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance-${i}.json"
            python3 - "$tmp/instance-${i}.json" <<'PY' >> "$tmp/samples.tsv"
          import json,sys
          inst=json.load(open(sys.argv[1]))
          nics=inst.get('networkInterfaces') or []
          nic=nics[0] if nics else {}
          running=str(inst.get('status') or '').upper()=='RUNNING'
          print(f"{int(running)}\t{len(nic.get('accessConfigs') or [])}")
          PY
            sleep 2
          done
          ROOT="$tmp" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for line in (Path(os.environ['ROOT'])/'samples.tsv').read_text().splitlines():
              a,b=line.split('\t'); rows.append((int(a),int(b)))
          running=[x[0] for x in rows]; counts=[x[1] for x in rows]
          safe={
            'status':'c1_access_config_stability_audit_complete',
            'sample_count':len(rows),
            'vm_running_in_any_sample':any(running),
            'access_config_counts':counts,
            'access_config_count_stable':len(set(counts))==1,
            'stable_access_config_count':counts[0] if counts and len(set(counts))==1 else None,
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 access-config stability audit\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if safe['vm_running_in_any_sample']:
              raise SystemExit('fail-closed: VM unexpectedly running')
          PY
