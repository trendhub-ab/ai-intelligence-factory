name: P0-B Zero-Model Ready Reconciliation [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch zero-model Ready reconciliation without private draft
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh workflow run note-ready-sync.yml \
            --repo trendhub-ab/ai-intelligence-factory \
            --ref main \
            -f create_private_draft=false
          echo 'Dispatched zero-model Ready reconciliation with private draft disabled.'
