name: P0-B Immutable Snapshot Recovery Census [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

concurrency:
  group: p0b-creation-unknown-manual-recovery
  cancel-in-progress: false

env:
  P0B_HEAD: 9bcfc9ed2de8293989bc895da0ff6baf5ded72b8

jobs:
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.P0B_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install requests pytest
          python -m pytest tests/test_p0b_creation_unknown_recovery_audit.py tests/test_note_delivery_ledger.py -q

  start-cloud-vm:
    needs: contract-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  readonly-census:
    needs: [contract-check, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.P0B_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install requests playwright pillow
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1
          command -v xvfb-run >/dev/null 2>&1
      - name: Compare recent private drafts to immutable ambiguous snapshots read-only
        env:
          NOTE_DELIVERY_LEDGER_PATH: '~/.aiif-note/delivery-ledger-v1.sqlite3'
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: |
          set -euo pipefail
          xvfb-run -a python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, sqlite3, unicodedata
          from pathlib import Path

          import note_delivery_creation_recovery as recovery
          import run187_note_editor_readiness as readiness
          import run190_note_persistent_cloud as cloud
          import run291_note_private_draft_audit as draft_audit
          from note_delivery_ledger import DeliveryState, SQLiteDeliveryLedger

          ledger_path = Path(os.environ['NOTE_DELIVERY_LEDGER_PATH']).expanduser().resolve()
          conn = sqlite3.connect(f'file:{ledger_path.as_posix()}?mode=ro', uri=True, timeout=5.0)
          conn.row_factory = sqlite3.Row
          try:
              conn.execute('PRAGMA query_only=ON')
              rows = conn.execute(
                  'SELECT * FROM deliveries WHERE state=? AND stable_draft_id IS NULL ORDER BY updated_at ASC LIMIT 16',
                  (DeliveryState.CREATION_UNKNOWN.value,),
              ).fetchall()
          finally:
              conn.close()
          records = [SQLiteDeliveryLedger._row_to_record(row) for row in rows]
          matches = {record.operation_key: set() for record in records}
          routes = cloud._recent_private_edit_urls(cloud._profile_dir())
          inspected = 0
          canonical_supported = 0

          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              context = cloud._launch_persistent_context(playwright)
              page = context.new_page()
              page.set_default_timeout(30000)
              seeded = False
              try:
                  for index, private_url in enumerate(routes[:32]):
                      try:
                          page.goto(private_url, wait_until='domcontentloaded', timeout=60000)
                          page.wait_for_timeout(900)
                          if draft_audit.note_base._looks_logged_out(page) and not seeded:
                              seeded = bool(cloud._seed_note_state(context, page))
                              if seeded:
                                  page.goto(private_url, wait_until='domcontentloaded', timeout=60000)
                                  page.wait_for_timeout(900)
                          if draft_audit.note_base._looks_logged_out(page):
                              continue
                          if not readiness._is_editor_url(str(page.url or '')):
                              continue
                          inspected += 1
                          title = unicodedata.normalize('NFC', draft_audit._title_value(page)).strip()
                          title_digest = hashlib.sha256(title.encode('utf-8')).hexdigest()
                          try:
                              canonical = recovery._current_canonical_sha256(page)
                          except recovery.CreationRecoveryAuditError:
                              continue
                          canonical_supported += 1
                          for record in records:
                              if (
                                  title_digest == record.snapshot.title_digest
                                  and canonical == record.snapshot.canonical_document_sha256
                              ):
                                  matches[record.operation_key].add(index)
                      except Exception:
                          continue
              finally:
                  context.close()

          counts = [len(value) for value in matches.values()]
          safe = {
              'status': 'immutable_snapshot_census_complete',
              'creation_unknown_count': len(records),
              'recent_private_route_count': min(len(routes), 32),
              'editor_routes_inspected': inspected,
              'canonical_supported_routes': canonical_supported,
              'records_with_any_exact_match': sum(1 for n in counts if n > 0),
              'records_with_unique_exact_match': sum(1 for n in counts if n == 1),
              'records_with_multiple_exact_matches': sum(1 for n in counts if n > 1),
              'total_exact_route_matches': sum(counts),
              'read_only': True,
              'zero_gemini_calls': True,
              'zero_openai_calls': True,
              'ledger_mutation': False,
              'notion_write': False,
              'note_mutation': False,
              'public_release': False,
              'private_identifiers_exposed': 0,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### P0-B immutable snapshot recovery census\n')
              fh.write(f'- result: `{json.dumps(safe, ensure_ascii=False, sort_keys=True)}`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [contract-check, start-cloud-vm, readonly-census]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
