name: P0-B Daily Ready-Only Dispatch [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exactly one Daily ready-only
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh workflow run daily-one-shot.yml \
            --repo trendhub-ab/ai-intelligence-factory \
            --ref design/p0-b-durable-delivery-ledger \
            -f mode=full \
            -f editorial_style=classic \
            -f excluded_models='' \
            -f canary_source='' \
            -f exact_target='' \
            -f e2e_prepare_only=false \
            -f p0b_ready_only=true \
            -f confirm=RUN_ONCE
          echo 'Dispatched exactly one Daily full run in P0-B ready-only mode.'
