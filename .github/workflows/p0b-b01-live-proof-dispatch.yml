name: P0 C-1 Guest SSH Hardening and Reboot Proof [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0-c1-access-config-audit-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  start-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start VM for bounded hardening
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          [ "$state" = "RUNNING" ] || gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet

  harden-guest:
    needs: start-first
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 10
    steps:
      - name: Disable and mask inbound SSH socket/service
        shell: bash
        run: |
          set -euo pipefail
          before=false
          if ss -ltn 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)(22)$'; then before=true; fi
          for unit in ssh.socket ssh.service sshd.service; do
            sudo systemctl disable --now "$unit" >/dev/null 2>&1 || true
            sudo systemctl mask "$unit" >/dev/null 2>&1 || true
          done
          sudo systemctl daemon-reload
          sleep 1
          after=false
          if ss -ltn 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)(22)$'; then after=true; fi
          socket_active=false
          systemctl is-active --quiet ssh.socket && socket_active=true || true
          socket_masked=false
          [ "$(systemctl is-enabled ssh.socket 2>/dev/null || true)" = "masked" ] && socket_masked=true || true
          printf '{"status":"guest_ssh_hardened","tcp22_before":%s,"tcp22_after":%s,"ssh_socket_active":%s,"ssh_socket_masked":%s,"private_identifiers_exposed":0}\n' "$before" "$after" "$socket_active" "$socket_masked"
          if [ "$after" = true ] || [ "$socket_active" = true ]; then
            echo 'Guest SSH boundary remains open' >&2
            exit 1
          fi

  stop-first:
    if: ${{ always() && needs.start-first.result == 'success' }}
    needs: [start-first, harden-guest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop VM after hardening
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          [ "$state" != "RUNNING" ] || gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet

  start-proof:
    if: ${{ needs.harden-guest.result == 'success' && needs.stop-first.result == 'success' }}
    needs: [harden-guest, stop-first]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start VM for cold-boot persistence proof
        run: |
          set -euo pipefail
          gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet

  verify-after-reboot:
    needs: start-proof
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 10
    steps:
      - name: Verify TCP22 remains closed after reboot
        shell: bash
        run: |
          set -euo pipefail
          listener=false
          if ss -ltn 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)(22)$'; then listener=true; fi
          socket_active=false
          systemctl is-active --quiet ssh.socket && socket_active=true || true
          socket_state="$(systemctl is-enabled ssh.socket 2>/dev/null || true)"
          printf '{"status":"guest_ssh_reboot_proof","tcp22_listening":%s,"ssh_socket_active":%s,"ssh_socket_state":"%s","private_identifiers_exposed":0}\n' "$listener" "$socket_active" "$socket_state"
          if [ "$listener" = true ] || [ "$socket_active" = true ]; then
            echo 'TCP22 reopened after reboot' >&2
            exit 1
          fi

  stop-proof:
    if: ${{ always() && needs.start-proof.result == 'success' }}
    needs: [start-proof, verify-after-reboot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop VM after persistence proof
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          [ "$state" != "RUNNING" ] || gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet

  verify-cloud:
    if: ${{ always() && needs.stop-proof.result == 'success' }}
    needs: stop-proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify cloud-side credential boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1final"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          ROOT="$tmp" python3 - <<'PY'
          import json,os
          from pathlib import Path
          inst=json.loads((Path(os.environ['ROOT'])/'instance.json').read_text())
          meta={str(x.get('key')):str(x.get('value')) for x in (inst.get('metadata',{}).get('items') or [])}
          access=sum(len(n.get('accessConfigs') or []) for n in (inst.get('networkInterfaces') or []))
          safe={
            'status':'c1_cloud_credential_boundary_verified',
            'vm_status':str(inst.get('status') or ''),
            'access_config_count':access,
            'project_ssh_keys_blocked':meta.get('block-project-ssh-keys','').lower()=='true',
            'os_login_enabled':meta.get('enable-oslogin','').lower()=='true',
            'serial_port_enabled':meta.get('serial-port-enable','').lower()=='true',
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          ok=(safe['vm_status']=='TERMINATED' and safe['project_ssh_keys_blocked'] and not safe['os_login_enabled'] and not safe['serial_port_enabled'])
          if not ok: raise SystemExit(1)
          PY
