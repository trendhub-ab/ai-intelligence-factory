name: P0-B Trusted Paste GREEN [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

env:
  TARGET_BRANCH: design/p0-b-durable-delivery-ledger
  EXPECTED_SHA: e5070b0a7d491425b8613d0422f81861c7bf74a4

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - name: Verify fixed head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest requests
      - name: Trusted-paste test
        run: python -m pytest tests/test_p0a_trusted_clipboard_paste.py -q
