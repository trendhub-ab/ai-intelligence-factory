name: P0 C-1 Disable World SSH [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Discover exactly one world SSH rule fail-closed
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1disable"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/target.json"
          gcloud compute instances list --project "$GCP_PROJECT_ID" --format=json > "$tmp/instances.json"
          gcloud compute firewall-rules list --project "$GCP_PROJECT_ID" --format=json > "$tmp/fw.json"
          ROOT="$tmp" python3 - <<'PY'
          import ipaddress,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          target=json.loads((root/'target.json').read_text())
          instances=json.loads((root/'instances.json').read_text())
          rules=json.loads((root/'fw.json').read_text())
          if not isinstance(instances,list): instances=[]
          if not isinstance(rules,list): rules=[]
          if str(target.get('status') or '').upper()=='RUNNING':
              raise SystemExit('fail-closed: target VM running')
          if len(instances)!=1:
              raise SystemExit('fail-closed: project VM count changed')
          meta={str(x.get('key')):str(x.get('value')) for x in (target.get('metadata',{}).get('items') or [])}
          if meta.get('block-project-ssh-keys','').lower()!='true':
              raise SystemExit('fail-closed: project SSH keys not blocked')
          if meta.get('enable-oslogin','').lower()=='true':
              raise SystemExit('fail-closed: OS Login enabled')
          if meta.get('serial-port-enable','').lower()=='true':
              raise SystemExit('fail-closed: serial console enabled')
          def ssh_allow(rule):
              if str(rule.get('direction','INGRESS')).upper()!='INGRESS' or rule.get('disabled'):
                  return False
              for a in rule.get('allowed') or []:
                  if str(a.get('IPProtocol','')).lower()!='tcp': continue
                  ports=a.get('ports') or []
                  if not ports: return True
                  for p in ports:
                      p=str(p)
                      if p=='22': return True
                      if '-' in p:
                          lo,hi=p.split('-',1)
                          if lo.isdigit() and hi.isdigit() and int(lo)<=22<=int(hi): return True
              return False
          def vm_network(vm):
              nics=vm.get('networkInterfaces') or []
              return nics[0].get('network') if nics else None
          def applies(rule,vm):
              rn=rule.get('network'); vn=vm_network(vm)
              if rn and vn and rn!=vn: return False
              tt=set(rule.get('targetTags') or []); vt=set((vm.get('tags') or {}).get('items') or [])
              tsa=set(rule.get('targetServiceAccounts') or []); vsa=set(x.get('email') for x in (vm.get('serviceAccounts') or []) if x.get('email'))
              if tt and not (tt & vt): return False
              if tsa and not (tsa & vsa): return False
              return True
          def is_world(rule):
              ranges=list(rule.get('sourceRanges') or [])
              st=list(rule.get('sourceTags') or [])
              ssa=list(rule.get('sourceServiceAccounts') or [])
              if not ranges and not st and not ssa: return True
              for raw in ranges:
                  try: n=ipaddress.ip_network(str(raw),strict=False)
                  except ValueError: continue
                  if str(n) in ('0.0.0.0/0','::/0'): return True
              return False
          candidates=[r for r in rules if ssh_allow(r) and applies(r,target) and is_world(r)]
          if len(candidates)!=1:
              raise SystemExit(f'fail-closed: expected 1 world SSH rule, got {len(candidates)}')
          rule=candidates[0]
          name=str(rule.get('name') or '')
          if not name:
              raise SystemExit('fail-closed: world SSH rule name missing')
          (root/'rule-name.txt').write_text(name)
          print(json.dumps({'status':'c1_world_ssh_disable_preflight_pass','project_vm_count':len(instances),'world_ssh_candidate_count':1,'target_vm_running':False,'read_only_preflight':True,'private_identifiers_exposed':0},sort_keys=True))
          PY
      - name: Disable exactly one world SSH rule
        shell: bash
        run: |
          set -euo pipefail
          rule="$(cat "${RUNNER_TEMP}/c1disable/rule-name.txt")"
          gcloud compute firewall-rules update "$rule" --project "$GCP_PROJECT_ID" --disabled --quiet >/dev/null
      - name: Verify world SSH disabled and private SSH retained
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1verify"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/target.json"
          gcloud compute firewall-rules list --project "$GCP_PROJECT_ID" --format=json > "$tmp/fw.json"
          ROOT="$tmp" python3 - <<'PY'
          import ipaddress,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          target=json.loads((root/'target.json').read_text())
          rules=json.loads((root/'fw.json').read_text())
          if not isinstance(rules,list): rules=[]
          def ssh_allow(rule):
              if str(rule.get('direction','INGRESS')).upper()!='INGRESS' or rule.get('disabled'):
                  return False
              for a in rule.get('allowed') or []:
                  if str(a.get('IPProtocol','')).lower()!='tcp': continue
                  ports=a.get('ports') or []
                  if not ports: return True
                  for p in ports:
                      p=str(p)
                      if p=='22': return True
                      if '-' in p:
                          lo,hi=p.split('-',1)
                          if lo.isdigit() and hi.isdigit() and int(lo)<=22<=int(hi): return True
              return False
          def vm_network(vm):
              nics=vm.get('networkInterfaces') or []
              return nics[0].get('network') if nics else None
          def applies(rule,vm):
              rn=rule.get('network'); vn=vm_network(vm)
              if rn and vn and rn!=vn: return False
              tt=set(rule.get('targetTags') or []); vt=set((vm.get('tags') or {}).get('items') or [])
              tsa=set(rule.get('targetServiceAccounts') or []); vsa=set(x.get('email') for x in (vm.get('serviceAccounts') or []) if x.get('email'))
              if tt and not (tt & vt): return False
              if tsa and not (tsa & vsa): return False
              return True
          rfc1918=[ipaddress.ip_network('10.0.0.0/8'),ipaddress.ip_network('172.16.0.0/12'),ipaddress.ip_network('192.168.0.0/16')]
          def cat(rule):
              ranges=list(rule.get('sourceRanges') or [])
              st=list(rule.get('sourceTags') or [])
              ssa=list(rule.get('sourceServiceAccounts') or [])
              if not ranges and not st and not ssa: return 'world'
              nets=[]
              for raw in ranges:
                  try: nets.append(ipaddress.ip_network(str(raw),strict=False))
                  except ValueError: return 'unknown'
              if any(str(n) in ('0.0.0.0/0','::/0') for n in nets): return 'world'
              if nets and all(n.version==4 and any(n.subnet_of(p) for p in rfc1918) for n in nets): return 'private'
              if (st or ssa) and not nets: return 'private'
              return 'other'
          active=[r for r in rules if ssh_allow(r) and applies(r,target)]
          cats=[cat(r) for r in active]
          safe={
            'status':'c1_world_ssh_disable_verify_complete',
            'target_vm_running':str(target.get('status') or '').upper()=='RUNNING',
            'active_ssh_rule_count':len(active),
            'active_world_ssh_rule_count':cats.count('world'),
            'active_private_ssh_rule_count':cats.count('private'),
            'active_other_ssh_rule_count':cats.count('other'),
            'readback_ok':cats.count('world')==0 and cats.count('private')==1 and cats.count('other')==0,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 world SSH disable\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if safe['target_vm_running'] or not safe['readback_ok']:
              raise SystemExit('fail-closed: post-change boundary verification failed')
          PY
