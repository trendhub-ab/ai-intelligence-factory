name: P0-B Trusted Paste RED [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  targeted-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: design/p0-b-durable-delivery-ledger
      - name: Verify test-only head
        run: test "$(git rev-parse HEAD)" = "045fceee70e345c201820d21fa920b61cef05b06"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Verify RED
        run: python -m pytest tests/test_p0a_trusted_clipboard_paste.py -q
