name: P0 C-1 SSH Blast Radius Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Classify SSH blast radius read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1blast"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/target.json"
          gcloud compute instances list --project "$GCP_PROJECT_ID" --format=json > "$tmp/instances.json"
          gcloud compute firewall-rules list --project "$GCP_PROJECT_ID" --format=json > "$tmp/fw.json"
          ROOT="$tmp" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          target=json.loads((root/'target.json').read_text())
          instances=json.loads((root/'instances.json').read_text())
          rules=json.loads((root/'fw.json').read_text())
          if not isinstance(instances,list): instances=[]
          if not isinstance(rules,list): rules=[]
          target_nics=target.get('networkInterfaces') or []
          target_network=(target_nics[0].get('network') if target_nics else None)

          def ssh_allow(rule):
              if str(rule.get('direction','INGRESS')).upper()!='INGRESS' or rule.get('disabled'):
                  return False
              for a in rule.get('allowed') or []:
                  if str(a.get('IPProtocol','')).lower()!='tcp':
                      continue
                  ports=a.get('ports') or []
                  if not ports:
                      return True
                  for p in ports:
                      p=str(p)
                      if p=='22': return True
                      if '-' in p:
                          lo,hi=p.split('-',1)
                          if lo.isdigit() and hi.isdigit() and int(lo)<=22<=int(hi): return True
              return False

          def vm_network(vm):
              nics=vm.get('networkInterfaces') or []
              return nics[0].get('network') if nics else None

          def vm_tags(vm):
              return set((vm.get('tags') or {}).get('items') or [])

          def vm_sas(vm):
              return set(x.get('email') for x in (vm.get('serviceAccounts') or []) if x.get('email'))

          def applies(rule, vm):
              rn=rule.get('network')
              vn=vm_network(vm)
              if rn and vn and rn != vn:
                  return False
              tt=set(rule.get('targetTags') or [])
              tsa=set(rule.get('targetServiceAccounts') or [])
              if tt and not (tt & vm_tags(vm)): return False
              if tsa and not (tsa & vm_sas(vm)): return False
              return True

          ssh_rules=[r for r in rules if ssh_allow(r)]
          untargeted=[r for r in ssh_rules if not (r.get('targetTags') or []) and not (r.get('targetServiceAccounts') or [])]
          def sources(rule): return set(rule.get('sourceRanges') or [])
          def is_world(rule):
              s=sources(rule); return '0.0.0.0/0' in s or '::/0' in s
          def is_iap(rule): return '35.235.240.0/20' in sources(rule)

          same_network=[vm for vm in instances if vm_network(vm)==target_network]
          world_impacted=set()
          iap_impacted=set()
          other_ssh_impacted=set()
          for idx,vm in enumerate(instances):
              for r in ssh_rules:
                  if not applies(r,vm):
                      continue
                  if is_world(r): world_impacted.add(idx)
                  elif is_iap(r): iap_impacted.add(idx)
                  else: other_ssh_impacted.add(idx)

          target_applicable=[r for r in ssh_rules if applies(r,target)]
          target_world=sum(1 for r in target_applicable if is_world(r))
          target_iap=sum(1 for r in target_applicable if is_iap(r))
          target_other=sum(1 for r in target_applicable if not is_world(r) and not is_iap(r))
          target_meta={str(x.get('key')):str(x.get('value')) for x in (target.get('metadata',{}).get('items') or [])}
          target_nic=target_nics[0] if target_nics else {}
          safe={
            'status':'c1_ssh_blast_radius_audit_complete',
            'project_vm_count':len(instances),
            'same_network_vm_count':len(same_network),
            'running_vm_count':sum(1 for vm in instances if str(vm.get('status') or '').upper()=='RUNNING'),
            'vm_with_external_access_config_count':sum(1 for vm in instances if any((n.get('accessConfigs') or []) for n in (vm.get('networkInterfaces') or []))),
            'ssh_allow_rule_count':len(ssh_rules),
            'ssh_untargeted_rule_count':len(untargeted),
            'world_ssh_untargeted_rule_count':sum(1 for r in untargeted if is_world(r)),
            'iap_ssh_untargeted_rule_count':sum(1 for r in untargeted if is_iap(r)),
            'other_ssh_untargeted_rule_count':sum(1 for r in untargeted if not is_world(r) and not is_iap(r)),
            'world_ssh_impacted_vm_count':len(world_impacted),
            'iap_ssh_impacted_vm_count':len(iap_impacted),
            'other_ssh_impacted_vm_count':len(other_ssh_impacted),
            'target_vm_running':str(target.get('status') or '').upper()=='RUNNING',
            'target_external_access_config_count':len(target_nic.get('accessConfigs') or []),
            'target_applicable_ssh_rule_count':len(target_applicable),
            'target_world_ssh_rule_count':target_world,
            'target_iap_ssh_rule_count':target_iap,
            'target_other_ssh_rule_count':target_other,
            'project_ssh_keys_blocked':target_meta.get('block-project-ssh-keys','').lower()=='true',
            'os_login_enabled':target_meta.get('enable-oslogin','').lower()=='true',
            'serial_port_enabled':target_meta.get('serial-port-enable','').lower()=='true',
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 SSH blast-radius audit\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if safe['target_vm_running']:
              raise SystemExit('fail-closed: target VM unexpectedly running')
          PY
