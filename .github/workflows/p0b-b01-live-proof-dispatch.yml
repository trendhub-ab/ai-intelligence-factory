name: P0 C-1 Access Config Change Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Audit access-config change evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1access"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          log_ok=true
          if ! gcloud logging read 'resource.type="gce_instance" AND protoPayload.methodName:"deleteAccessConfig"' \
              --project "$GCP_PROJECT_ID" --freshness=1d --limit=20 --format=json > "$tmp/logs.json" 2>"$tmp/logerr.txt"; then
            log_ok=false
            printf '[]' > "$tmp/logs.json"
          fi
          ROOT="$tmp" LOG_OK="$log_ok" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          inst=json.loads((root/'instance.json').read_text())
          try: logs=json.loads((root/'logs.json').read_text())
          except Exception: logs=[]
          if not isinstance(logs,list): logs=[]
          nics=inst.get('networkInterfaces') or []
          nic=nics[0] if nics else {}
          timestamps=sorted(str(x.get('timestamp') or '') for x in logs if x.get('timestamp'))
          safe={
            'status':'c1_access_config_change_audit_complete',
            'vm_running':str(inst.get('status') or '').upper()=='RUNNING',
            'external_access_config_count':len(nic.get('accessConfigs') or []),
            'audit_log_query_ok':os.environ['LOG_OK'].lower()=='true',
            'delete_access_config_event_count':len(logs),
            'delete_access_config_event_timestamp_present':bool(timestamps),
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 access-config change audit\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if safe['vm_running']:
              raise SystemExit('fail-closed: VM unexpectedly running')
          PY
