name: P0-B Trusted Paste RED [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

env:
  TARGET_BRANCH: design/p0-b-durable-delivery-ledger
  EXPECTED_SHA: ef451650fb3cc8e6f72eb4d01adeb2dbb0460108

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - name: Verify test-only head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest requests
      - name: Expected RED trusted-paste test
        run: python -m pytest tests/test_p0a_trusted_clipboard_paste.py -q
