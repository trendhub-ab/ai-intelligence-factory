name: P0-B B01 Read-Only Canonical Diagnostic [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

env:
  TARGET_BRANCH: design/p0-b-durable-delivery-ledger
  EXPECTED_SHA: f001d81ae7e9cb3ff043301ce091747a84f1a12f

jobs:
  start-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start note VM
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
          VM: ${{ vars.GCP_NOTE_VM_NAME }}
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$VM" --project "$PROJECT" --zone "$ZONE" --format='value(status)')"
          [ "$state" = RUNNING ] || gcloud compute instances start "$VM" --project "$PROJECT" --zone "$ZONE" --quiet

  diagnose:
    needs: start-vm
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - name: Verify reviewed head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests playwright
      - name: Read-only diagnose latest ambiguous B01 draft
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
          NOTE_CHROME_CHANNEL: chrome
          NOTE_CHROME_HEADLESS: 'false'
        run: |
          set -euo pipefail
          xvfb-run -a python - <<'PY'
          import json
          import os
          import shutil
          import sqlite3
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          import note_draft_automation as base
          import run187_note_editor_readiness as run187
          import run190_note_persistent_cloud as cloud
          import run194_note_current_contract as current
          import run291_note_private_draft_audit as run291
          import run292_note_rendered_body_audit as run292
          from playwright.sync_api import sync_playwright

          ledger = Path('~/.aiif-note/delivery-ledger-v1.sqlite3').expanduser()
          if not ledger.is_file():
              raise SystemExit('durable ledger unavailable')

          conn = sqlite3.connect(f'file:{ledger}?mode=ro', uri=True)
          try:
              row = conn.execute(
                  "SELECT d.snapshot_json, e.created_at "
                  "FROM delivery_events e JOIN deliveries d ON d.record_id=e.record_id "
                  "WHERE e.new_state='CREATION_UNKNOWN' AND e.category='creation_result_ambiguous' "
                  "ORDER BY e.event_id DESC LIMIT 1"
              ).fetchone()
          finally:
              conn.close()
          if row is None:
              raise SystemExit('no ambiguous delivery event available')
          snapshot = json.loads(row[0])
          sid = str(snapshot.get('sync_id') or '').strip().lower()
          if len(sid) != 32:
              raise SystemExit('ambiguous delivery has invalid private identity')
          event_at = datetime.fromisoformat(str(row[1]).replace('Z', '+00:00'))
          event_age = (datetime.now(timezone.utc) - event_at).total_seconds()
          if event_age < 0 or event_age > 7200:
              raise SystemExit('latest ambiguous delivery is outside diagnostic window')

          current.install()
          article = base._prepare_article(sid)
          title = str(article.get('title') or '').strip()
          manuscript = base._body_manuscript_for_note(title, str(article.get('manuscript') or ''))
          if not title or not manuscript:
              raise SystemExit('prepared diagnostic article is incomplete')

          original_profile = cloud._profile_dir()
          history_urls = cloud._recent_private_edit_urls(original_profile)
          temp_root = Path(tempfile.mkdtemp(prefix='p0b-readonly-profile-'))
          copied_profile = temp_root / 'profile'
          try:
              shutil.copytree(
                  original_profile,
                  copied_profile,
                  dirs_exist_ok=True,
                  ignore=shutil.ignore_patterns('Cache', 'Code Cache', 'GPUCache', 'Singleton*'),
              )
              os.environ[cloud.PROFILE_ENV] = str(copied_profile)
              matches = 0
              metrics = None
              with sync_playwright() as playwright:
                  context = cloud._launch_persistent_context(playwright)
                  page = context.new_page()
                  page.set_default_timeout(30000)
                  try:
                      for url in history_urls:
                          try:
                              page.goto(url, wait_until='domcontentloaded', timeout=60000)
                              page.wait_for_timeout(800)
                          except Exception:
                              continue
                          if base._looks_logged_out(page) or not run187._is_editor_url(str(page.url or '')):
                              continue
                          try:
                              persisted_title = run291._title_value(page)
                          except Exception:
                              continue
                          if persisted_title != title:
                              continue
                          matches += 1
                          if matches == 1:
                              metrics = run292._observe_dom_current_page(page, title, manuscript)
                          if matches > 1:
                              metrics = None
                              break
                  finally:
                      context.close()
          finally:
              shutil.rmtree(temp_root, ignore_errors=True)

          safe = {
              'diagnostic_mode': 'read_only_copied_profile',
              'zero_gemini_calls': True,
              'zero_openai_calls': True,
              'draft_mutation': False,
              'public_release': False,
              'latest_ambiguous_event_recent': True,
              'history_candidate_count': len(history_urls),
              'exact_title_match_count': matches,
          }
          allowed = (
              'observation_diagnostic_code', 'canonical_match', 'mismatch_category', 'mismatch_path',
              'expected_canonical_node_count', 'actual_canonical_node_count',
              'expected_node_counts', 'actual_node_counts', 'unsupported_expected_node_count',
              'unsupported_actual_node_count', 'dom_diagnostic_category', 'unknown_dom_tags',
              'unknown_dom_tag_counts', 'dom_tag_counts', 'dom_parent_child_tag_counts',
              'snapshot_element_node_count', 'snapshot_text_node_count', 'snapshot_total_node_count',
          )
          if matches == 1 and metrics is not None:
              safe['private_draft_found'] = True
              for key in allowed:
                  if key in metrics:
                      safe[key] = metrics[key]
          elif matches == 0:
              safe['private_draft_found'] = False
              safe['diagnostic_category'] = 'no_exact_private_draft_match_in_recent_history'
          else:
              safe['private_draft_found'] = False
              safe['diagnostic_category'] = 'ambiguous_multiple_private_draft_title_matches'

          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### P0-B B01 read-only canonical diagnostic\n')
              for key, value in safe.items():
                  fh.write(f'- {key}: `{json.dumps(value, ensure_ascii=False, sort_keys=True)}`\n')
          PY

  stop-vm:
    if: ${{ always() && needs.start-vm.result == 'success' }}
    needs: [start-vm, diagnose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop note VM
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
          VM: ${{ vars.GCP_NOTE_VM_NAME }}
        run: |
          state="$(gcloud compute instances describe "$VM" --project "$PROJECT" --zone "$ZONE" --format='value(status)' 2>/dev/null || true)"
          [ "$state" != RUNNING ] || gcloud compute instances stop "$VM" --project "$PROJECT" --zone "$ZONE" --quiet
