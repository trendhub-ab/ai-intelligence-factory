name: P0 C-1 External IP Type Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Classify external IPv4 without exposing address
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1ip"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/target.json"
          addresses_ok=true
          if ! gcloud compute addresses list --project "$GCP_PROJECT_ID" --format=json > "$tmp/addresses.json" 2>"$tmp/addresses.err"; then
            addresses_ok=false
            printf '[]' > "$tmp/addresses.json"
          fi
          ROOT="$tmp" ADDRESSES_OK="$addresses_ok" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          target=json.loads((root/'target.json').read_text())
          addresses=json.loads((root/'addresses.json').read_text())
          if not isinstance(addresses,list): addresses=[]
          nics=target.get('networkInterfaces') or []
          if len(nics)!=1:
              raise SystemExit('fail-closed: expected exactly one NIC')
          access=nics[0].get('accessConfigs') or []
          if len(access)!=1:
              raise SystemExit('fail-closed: expected exactly one IPv4 access config')
          ac=access[0]
          nat=str(ac.get('natIP') or '').strip()
          running=str(target.get('status') or '').upper()=='RUNNING'
          matches=[a for a in addresses if nat and str(a.get('address') or '').strip()==nat]
          if not nat and not running:
              classification='ephemeral_unassigned_while_stopped'
          elif len(matches)==1:
              classification='reserved_static'
          elif nat and len(matches)==0 and os.environ['ADDRESSES_OK'].lower()=='true':
              classification='ephemeral_assigned'
          else:
              classification='unknown'
          safe={
            'status':'c1_external_ip_type_audit_complete',
            'target_vm_running':running,
            'access_config_count':1,
            'current_nat_ip_present':bool(nat),
            'address_inventory_query_ok':os.environ['ADDRESSES_OK'].lower()=='true',
            'reserved_address_match_count':len(matches),
            'external_ip_classification':classification,
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 external IPv4 classification\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if running or classification=='unknown' or len(matches)>1:
              raise SystemExit('fail-closed: external IPv4 classification unresolved')
          PY
