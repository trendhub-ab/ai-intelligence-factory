name: P0 C-2 Retention Backup Audit [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0b-b01-live-proof-20261005]
    paths: [.github/workflows/p0b-b01-live-proof-dispatch.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify retention and backup boundary read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c2audit"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          disk="$(python3 - "$tmp/instance.json" <<'PY'
          import json,sys
          inst=json.load(open(sys.argv[1])); disks=inst.get('disks') or []
          src=str((disks[0] if disks else {}).get('source') or '')
          print(src.rsplit('/',1)[-1] if src else '')
          PY
          )"
          test -n "$disk"
          gcloud compute disks describe "$disk" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/disk.json"
          gcloud compute snapshots list --project "$GCP_PROJECT_ID" --format=json > "$tmp/snapshots.json"
          python3 - "$tmp/disk.json" <<'PY' > "$tmp/policies.tsv"
          import json,sys
          disk=json.load(open(sys.argv[1]))
          for url in disk.get('resourcePolicies') or []:
              parts=str(url).split('/')
              try:
                  i=parts.index('regions'); region=parts[i+1]; name=parts[-1]
                  print(region+'\t'+name)
              except Exception: pass
          PY
          : > "$tmp/policies.jsonl"
          while IFS=$'\t' read -r region policy; do
            [ -n "$region" ] && [ -n "$policy" ] || continue
            gcloud compute resource-policies describe "$policy" --project "$GCP_PROJECT_ID" --region "$region" --format=json >> "$tmp/policies.jsonl"
            printf '\n' >> "$tmp/policies.jsonl"
          done < "$tmp/policies.tsv"
          ROOT="$tmp" DISK_NAME="$disk" python3 - <<'PY'
          import json,os,datetime
          from pathlib import Path
          root=Path(os.environ['ROOT']); disk_name=os.environ['DISK_NAME']
          inst=json.loads((root/'instance.json').read_text()); disk=json.loads((root/'disk.json').read_text()); snaps=json.loads((root/'snapshots.json').read_text())
          policies=[]
          for line in (root/'policies.jsonl').read_text().splitlines():
              line=line.strip()
              if not line: continue
              try: policies.append(json.loads(line))
              except Exception: pass
          attached=inst.get('disks') or []
          auto_delete=bool((attached[0] if attached else {}).get('autoDelete'))
          disk_snaps=[s for s in (snaps if isinstance(snaps,list) else []) if str(s.get('sourceDisk') or '').rsplit('/',1)[-1]==disk_name]
          newest=None
          for s in disk_snaps:
              ts=str(s.get('creationTimestamp') or '')
              if not ts: continue
              try:
                  dt=datetime.datetime.fromisoformat(ts.replace('Z','+00:00')).astimezone(datetime.timezone.utc)
                  newest=dt if newest is None or dt>newest else newest
              except Exception: pass
          age_h=None
          if newest: age_h=round((datetime.datetime.now(datetime.timezone.utc)-newest).total_seconds()/3600,2)
          daily=False; retention14=False; keep_on_delete=False
          for p in policies:
              sp=p.get('snapshotSchedulePolicy') or {}
              sch=sp.get('schedule') or {}
              daily_cfg=sch.get('dailySchedule') or {}
              if int(daily_cfg.get('daysInCycle') or 0)==1: daily=True
              ret=sp.get('retentionPolicy') or {}
              if int(ret.get('maxRetentionDays') or 0)==14: retention14=True
              if str(ret.get('onSourceDiskDelete') or '').upper()=='KEEP_AUTO_SNAPSHOTS': keep_on_delete=True
          safe={
            'status':'c2_retention_backup_closed',
            'boot_disk_auto_delete':auto_delete,
            'snapshot_schedule_count':len(policies),
            'daily_snapshot_schedule_present':daily,
            'retention_14_days_present':retention14,
            'keep_snapshots_on_source_delete':keep_on_delete,
            'snapshot_count_for_disk':len(disk_snaps),
            'newest_snapshot_age_hours':age_h,
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          ok=(not auto_delete and len(policies)>=1 and daily and retention14 and keep_on_delete and len(disk_snaps)>=1 and age_h is not None and age_h<=48)
          if not ok: safe['status']='c2_retention_backup_open'
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-2 retention backup audit\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          if not ok: raise SystemExit(1)
          PY
