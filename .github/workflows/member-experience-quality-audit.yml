name: Member Experience Quality Audit [READ ONLY]

# Explicit manual-only zero-Gemini customer-experience audit; no Notion changes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type READ_ONLY_MEMBER_EXPERIENCE to scan the canonical paid-member DB'
        type: string
        required: true
        default: ''

permissions:
  contents: read

# Never observe the paid DB halfway through subscriber/member writes.
concurrency:
  group: member-derived-notion-writes
  cancel-in-progress: false

jobs:
  read-only-audit:
    if: ${{ inputs.confirm == 'READ_ONLY_MEMBER_EXPERIENCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_MEMBER_PRESENTATION_DATABASE_ID: b2787ee0-5b58-4ca7-b4eb-774f60237f1f
      NOTION_MEMBER_PRESENTATION_DATA_SOURCE_ID: 7e4ceaa7-7bdf-4c4b-bf78-c2cccac44404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - name: Install local read dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Verify deterministic copy and member audit offline
        run: |
          python -m unittest -q tests.test_member_offer_copy tests.test_member_experience_quality_audit tests.test_member_reader_quality_policy tests.test_run307_use_decision_member_surface
      - name: Canonical read-only audit (public output contains aggregates only)
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -n "${NOTION_DECISION_INTELLIGENCE_API_KEY:-}"
          umask 077
          REPORT="$(mktemp "$RUNNER_TEMP/member-experience-XXXXXX.json")"
          trap 'rm -f "$REPORT"' EXIT
          python member_experience_quality_audit.py --read-only > "$REPORT"
          python - "$REPORT" <<'PY'
          import json
          import sys
          from pathlib import Path

          # This repository is PUBLIC. The raw audit includes paid-member
          # page names and IDs. Never print, attach or upload that file.
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["read_only"] and result["gemini_provider_calls"] == 0
          summary = {
              "status": result["status"],
              "read_only": True,
              "gemini_provider_calls": 0,
              "page_count": result["page_count"],
              "review_date": result["review_date"],
              "counts": result["counts"],
          }
          print("READ_ONLY_MEMBER_EXPERIENCE_AGGREGATE", json.dumps(summary, sort_keys=True))
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write("### Member audit: aggregate-only results\\n\\n")
              handle.write(f"Scanned: {result['page_count']} records\\n\\n")
              for key, value in result["counts"].items():
                  handle.write(f"- {key}: {value}\\n")
              if result["counts"]["same_label_unclassified"]:
                  handle.write("\\nManual-like blocks require private review. No sync is authorized.\\n")
          PY

      # SECURITY: This is a public GitHub repository. Actions artifacts and
      # logs are visible publicly; intentionally do not upload the unredacted
      # per-page audit report. Affected page names/IDs may only be inspected
      # in a private, locally controlled run with authorized credentials.
