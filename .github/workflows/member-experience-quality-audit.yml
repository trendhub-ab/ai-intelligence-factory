name: Member Experience Quality Audit [READ ONLY]

# Explicit manual-only zero-Gemini customer-experience audit; no Notion changes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type READ_ONLY_MEMBER_EXPERIENCE to scan the canonical paid-member DB'
        type: string
        required: true
        default: ''

permissions:
  contents: read

# Never observe the paid DB halfway through subscriber/member writes.
concurrency:
  group: member-derived-notion-writes
  cancel-in-progress: false

jobs:
  read-only-audit:
    if: ${{ inputs.confirm == 'READ_ONLY_MEMBER_EXPERIENCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ''
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_MEMBER_PRESENTATION_DATABASE_ID: b2787ee0-5b58-4ca7-b4eb-774f60237f1f
      NOTION_MEMBER_PRESENTATION_DATA_SOURCE_ID: 7e4ceaa7-7bdf-4c4b-bf78-c2cccac44404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - name: Install local read dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Verify deterministic copy and member audit offline
        run: |
          python -m unittest -q tests.test_member_offer_copy tests.test_member_experience_quality_audit tests.test_run307_use_decision_member_surface
      - name: Canonical Notion reads only (zero Gemini)
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -n "${NOTION_DECISION_INTELLIGENCE_API_KEY:-}"
          mkdir -p article_audit
          python member_experience_quality_audit.py --read-only > article_audit/member_experience_quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("article_audit/member_experience_quality.json").read_text())
          assert result["read_only"] and result["gemini_provider_calls"] == 0
          print("READ_ONLY_MEMBER_EXPERIENCE", result["page_count"], result["counts"])
          PY
      - name: Save private audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: member-experience-readonly-${{ github.run_number }}
          path: article_audit/member_experience_quality.json
          if-no-files-found: warn
          retention-days: 14
