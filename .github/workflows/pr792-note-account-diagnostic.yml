name: PR792 focused Run190 TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused-run190:
    if: github.event.pull_request.head.ref == 'fix/note-audit-account-diagnostics-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: pip install requests pillow
      - name: Run focused Run190 tests
        run: python -m unittest tests.test_run190_note_persistent_cloud -v
