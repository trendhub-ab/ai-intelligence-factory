name: Member Monthly Brief Access Check

on:
  push:
    branches:
      - ops/member-monthly-brief-health-once-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - run: python -m pip install requests
      - name: Read monthly brief page
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
        run: |
          test -z "${GEMINI_API_KEY:-}"
          python - <<'PY'
          import json, os, requests
          page="3d0479ff-dca9-81de-b614-fef528d2f32c"
          headers={
              "Authorization":f"Bearer {os.environ['NOTION_DECISION_INTELLIGENCE_API_KEY']}",
              "Content-Type":"application/json",
              "Notion-Version":os.environ.get("NOTION_API_VERSION","2026-03-11"),
          }
          r=requests.get(f"https://api.notion.com/v1/pages/{page}",headers=headers,timeout=10)
          body={}
          try:
              body=r.json()
          except Exception:
              pass
          print(json.dumps({"status":r.status_code,"object":body.get("object"),"code":body.get("code")},sort_keys=True))
          raise SystemExit(0 if r.status_code==200 else 1)
          PY
