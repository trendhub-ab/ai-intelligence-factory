name: Member Monthly Brief Access Check

on:
  push:
    branches:
      - ops/member-monthly-brief-health-once-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - run: python -m pip install requests
      - name: Read monthly brief page
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
        run: |
          test -z "${GEMINI_API_KEY:-}"
          python ops_member_monthly_brief_health.py
