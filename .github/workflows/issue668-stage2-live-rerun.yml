name: Issue 668 Stage 2 Live RERUN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue668-stage2-live-rerun.yml'

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  verified-apply:
    if: github.actor == 'trendhub-ab'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Re-run Issue 668 Stage 2 contract tests
        run: |
          python -m pytest -q tests/test_issue668_verified_rereview_apply.py tests/test_issue668_verified_rereview_dryrun.py tests/test_product_review_503_fallback_policy.py tests/test_gemini_provider_resilience.py

      - name: Execute bounded verified apply exactly once
        run: python member_verified_rereview_apply.py --queue-limit 5 --stale-days 30 --max-reviews 2 --request-budget 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECHNOLOGY_DATABASE_ID: ${{ secrets.NOTION_TECHNOLOGY_DATABASE_ID }}
          NOTION_TECHNOLOGY_DATA_SOURCE_ID: ${{ secrets.NOTION_TECHNOLOGY_DATA_SOURCE_ID }}
          NOTION_DECISION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_DECISION_HISTORY_DATABASE_ID }}
          NOTION_DECISION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_DECISION_HISTORY_DATA_SOURCE_ID }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: 'true'
          EVIDENCE_LEDGER_REQUIRED: 'true'
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_COUNTER_BRANCH: main
          AIIF_RUNTIME_STATE_BRANCH: main
          GEMINI_QUOTA_TIMEZONE: Asia/Tokyo
