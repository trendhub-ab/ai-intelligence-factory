name: Member Quick Link Fast RED

on:
  push:
    branches:
      - ops/member-home-host-migration-proof
    paths:
      - .github/workflows/member-quick-link-red-fast.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Execute title-contract slice without external dependencies
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('member_presentation_sync.py').read_text(encoding='utf-8'))
          keep = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  names = [t.id for t in node.targets if isinstance(t, ast.Name)]
                  if '_MEMBER_PRESENTATION_TITLE_OVERRIDES' in names:
                      keep.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name == '_member_presentation_title':
                  keep.append(node)
          ns = {}
          exec(compile(ast.Module(body=keep, type_ignores=[]), '<title-contract>', 'exec'), ns, ns)
          fn = ns['_member_presentation_title']
          cases = [
              ('github:langgenius/dify', 'langgenius/dify', 'Dify'),
              ('github:mintplex-labs/anything-llm', 'Mintplex-Labs/anything-llm', 'AnythingLLM'),
              ('github:browser-use/browser-use', 'browser-use/browser-use', 'browser-use'),
              ('github:comfyanonymous/comfyui', 'comfyanonymous/ComfyUI', 'ComfyUI'),
              ('github:cline/cline', 'cline/cline', 'Cline'),
          ]
          failures = []
          for sync_id, source, expected in cases:
              actual = fn(sync_id, source)
              if actual != expected:
                  failures.append((sync_id, actual, expected))
          print(f'EXPECTED_RED_FAILURES={len(failures)}')
          for item in failures:
              print('RED', item)
          if len(failures) != 4:
              raise SystemExit(f'expected exactly 4 RED failures, got {len(failures)}')
          raise SystemExit(1)
          PY
