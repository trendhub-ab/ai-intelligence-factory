name: V2-005C Focused TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2_*'
      - 'tests/test_v2_*'
      - '.github/workflows/v2-005c-focused-tdd.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
      - name: Install focused test dependencies
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check
      - name: Run V2-005C focused tests
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for path in \
            tests/test_v2_official_vendor_live.py \
            tests/test_v2_github_live.py \
            tests/test_v2_four_source_live.py \
            tests/test_v2_005_live_proof.py \
            tests/test_v2_005_evidence_pack.py \
            tests/test_v2_shadow_deep_dive_workflow.py; do
            if [[ -f "$path" ]]; then
              tests+=("$path")
            fi
          done
          python -m pytest -q "${tests[@]}"
