name: Repair exact existing SGPS note draft

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR_SGPS_EXISTING_DRAFT'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sgps-existing-note-draft-repair
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_start_vm: ${{ steps.decision.outputs.should_start_vm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install locked test environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prove exact repair contract and current publication gates
        run: python -m unittest tests.test_sgps_existing_draft_repair -v

      - name: Exact-target zero-browser preflight
        env:
          SGPS_DRAFT_REPAIR_CONFIRM: ${{ inputs.confirm }}
          SGPS_DRAFT_REPAIR_PREPARE_ONLY: 'true'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run_sgps_existing_draft_repair.py | tee "${RUNNER_TEMP}/sgps-preflight.json"

      - name: Export VM decision
        id: decision
        env:
          RESULT_FILE: ${{ runner.temp }}/sgps-preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8").splitlines()[-1])
          required = {
              "status": "repair_ready",
              "zero_gemini_calls": True,
              "new_draft_created": False,
              "public_release": False,
              "publication_gates_passed": True,
              "quality_state_preserved": "Ready取消",
              "posting_state_preserved": "投稿準備中",
          }
          for key, expected in required.items():
              if result.get(key) != expected:
                  raise SystemExit(f"unsafe SGPS repair preflight: {key}={result.get(key)!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("should_start_vm=true\n")
          PY

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.should_start_vm == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  repair-existing-draft:
    if: ${{ needs.preflight.outputs.should_start_vm == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install repair dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || {
            echo "::error::Google Chrome is not installed on the persistent note VM."
            exit 1
          }
          command -v xvfb-run >/dev/null 2>&1 || {
            echo "::error::xvfb-run is not installed on the persistent note VM."
            exit 1
          }

      - name: Reprove repair contract on VM
        run: python -m unittest tests.test_sgps_existing_draft_repair -v

      - name: Overwrite exact existing SGPS private draft
        env:
          SGPS_DRAFT_REPAIR_CONFIRM: ${{ inputs.confirm }}
          SGPS_DRAFT_REPAIR_PREPARE_ONLY: 'false'
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: xvfb-run -a python run_sgps_existing_draft_repair.py | tee "${RUNNER_TEMP}/sgps-repair.json"

      - name: Verify safe result
        env:
          RESULT_FILE: ${{ runner.temp }}/sgps-repair.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8").splitlines()[-1])
          required_true = (
              "same_edit_route", "title_match", "body_verified", "eyecatch_preserved",
              "zero_gemini_calls", "publication_gates_passed",
          )
          if result.get("status") != "existing_draft_repaired":
              raise SystemExit("SGPS repair did not complete")
          for key in required_true:
              if result.get(key) is not True:
                  raise SystemExit(f"SGPS repair invariant failed: {key}")
          if result.get("new_draft_created") is not False or result.get("public_release") is not False:
              raise SystemExit("SGPS repair crossed the draft/publication boundary")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### SGPS existing private draft repair\n")
              fh.write("- same edit route: `true`\n")
              fh.write("- title persisted: `true`\n")
              fh.write("- body persisted: `true`\n")
              fh.write("- existing eyecatch preserved: `true`\n")
              fh.write("- new draft created: `false`\n")
              fh.write("- public release: `false`\n")
              fh.write("- Gemini/model calls: `0`\n")
              fh.write(f"- route proof hash: `{result.get('editor_route_hash', '')}`\n")
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, repair-existing-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Stop persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
