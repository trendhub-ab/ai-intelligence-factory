name: Generate VT Code production eyecatch once

on:
  push:
    branches:
      - test/vtcode-production-eyecatch-run-20260927

permissions:
  contents: read

concurrency:
  group: vtcode-production-eyecatch-once
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TARGET_ASSET_BRANCH: asset/vtcode-production-eyecatch-20260927
      GEMINI_PERSISTENT_DAILY_COUNTER: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate current production eyecatch and upload asset pair
        run: |
          set -o pipefail
          python run_vtcode_production_eyecatch_once.py | tee "${RUNNER_TEMP}/vtcode-production-eyecatch.json"
      - name: Verify result
        env:
          RESULT_FILE: ${{ runner.temp }}/vtcode-production-eyecatch.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path(os.environ["RESULT_FILE"]).read_text(encoding="utf-8").splitlines()[-1])
          required={
            "status":"vtcode_production_eyecatch_generated",
            "public_title":"VT Code：AIのコード変更をどう確認する？",
            "size":[1280,670],
            "current_asset":True,
            "asset_branch":"asset/vtcode-production-eyecatch-20260927",
            "public_release":False,
            "note_mutation":False,
          }
          for k,v in required.items():
              if result.get(k)!=v:
                  raise SystemExit(f"unsafe production eyecatch result: {k}={result.get(k)!r}")
          PY
