name: Run164 Finalize 200 Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'RUN164 FINALIZE 200')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Subscriber bridge sync
        env:
          TZ: Asia/Tokyo
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: 'true'
          ENABLE_SUBSCRIBER_TECH_SYNC: 'true'
          ENABLE_JAPANESE_DISPLAY_LABEL: 'true'
        run: |
          mkdir -p run164_finalize_artifacts
          python - <<'PY' | tee run164_finalize_artifacts/subscriber_sync.log
          import json
          import decision_intelligence as d
          print(json.dumps(d.sync_subscriber_technology_db(), ensure_ascii=False, indent=2))
          PY
      - name: Subscriber Decision Brief sync
        env:
          TZ: Asia/Tokyo
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_SUBSCRIBER_DECISION_BRIEF: 'true'
          SUBSCRIBER_DECISION_BRIEF_PACING_SECONDS: '0.35'
        run: python subscriber_decision_brief.py | tee run164_finalize_artifacts/decision_brief.log
      - name: Resolve clean member DB
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          MEMBER_PRESENTATION_DB_TITLE: 'AI・技術一覧｜判断DB'
        run: python provision_member_presentation_db.py | tee run164_finalize_artifacts/member_provision.log
      - name: Sync clean member DB
        env:
          TZ: Asia/Tokyo
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          DI_PRODUCT_TIMEZONE: 'Asia/Tokyo'
          MEMBER_HOME_MAX: '8'
          MEMBER_HOME_DIVERSITY_TOLERANCE: '0'
        run: python member_presentation_sync.py | tee run164_finalize_artifacts/member_sync.log
      - name: Final inventory audit
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: 'true'
        run: |
          python - <<'PY' | tee run164_finalize_artifacts/final_audit.log
          import json
          import decision_intelligence as d
          internal=d.query_technology_records(max_records=5000)
          assessed=0
          eligible=0
          ids=set()
          for p in internal:
              v=d._subscriber_values_from_internal(p)
              eid=v.get('entity_id') or ''
              if v.get('assessment_state')=='ASSESSED': assessed+=1
              if v.get('assessment_state')=='ASSESSED' and v.get('tracking_eligibility') and v.get('tracking_status')!='ARCHIVED':
                  eligible+=1
                  if eid: ids.add(eid)
          subscriber=d._query_external_db(d.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID,d.NOTION_SUBSCRIBER_TECH_DATABASE_ID,max_records=5000)
          subscriber_ids=set()
          for p in subscriber:
              eid=d._rich_text_value((p.get('properties') or {}).get(d.SUB_PROP_ENTITY_ID,{}))
              if eid: subscriber_ids.add(eid)
          out={'zero_gemini_calls':True,'internal_total':len(internal),'internal_assessed':assessed,'subscriber_eligible':eligible,'subscriber_rows':len(subscriber),'subscriber_unique_entities':len(subscriber_ids),'eligible_missing_from_subscriber':len(ids-subscriber_ids)}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if assessed < 200 or len(ids-subscriber_ids) != 0:
              raise SystemExit(1)
          PY
      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run164-finalize-200-${{ github.run_id }}
          path: run164_finalize_artifacts/
          if-no-files-found: error
          retention-days: 30
