name: Run141 Reader Delight Redteam

on:
  push:
    branches:
      - run129-conversational-warmth
    paths:
      - .github/chat-triggers/run141-reader-delight-redteam.txt

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run129-conversational-warmth
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Run141 reader delight red-team
        env:
          GEMINI_API_KEY: test-key
          GH_PAT: test-token
          GEMINI_QUOTA_PROJECT_ID: test-project
          PYTHONPATH: .
        run: python tools/run141_reader_delight_redteam.py
