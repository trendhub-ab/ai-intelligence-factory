name: Temporary note queue generation patcher

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  patch:
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      github.event.comment.body == '/aiif note patch_queue_v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TARGET_BRANCH: fix/note-draft-concurrency-generation-v2
      TARGET_PATH: .github/workflows/note-create-draft.yml
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Replace only the orphaned concurrency generation
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['TARGET_PATH'])
          text = path.read_text(encoding='utf-8')
          old = '  group: note-draft-create\n'
          new = '  group: note-draft-create-v2\n'
          if text.count(old) != 1:
              raise SystemExit(f'refusing patch: expected exactly one old queue group, got {text.count(old)}')
          if new in text:
              raise SystemExit('refusing patch: v2 queue already present')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/note-create-draft.yml' || {
            echo '::error::unexpected file changed'
            exit 1
          }
          grep -F 'group: note-draft-create-v2' "$TARGET_PATH"

      - name: Commit exact one-line repair to branch
        run: |
          set -euo pipefail
          git config user.name 'AIIF Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$TARGET_PATH"
          git diff --cached --check
          test "$(git diff --cached --numstat | wc -l)" -eq 1
          git commit -m 'fix: rotate note draft concurrency generation'
          git push origin "HEAD:${TARGET_BRANCH}"
