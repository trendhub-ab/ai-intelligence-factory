name: Run225 Branch Docs Patch

on:
  push:
    branches:
      - run225-stock-lifecycle-20260904
    paths:
      - 'tools/run225_patch_docs.py'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run225-stock-lifecycle-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch canonical documentation deterministically
        run: python tools/run225_patch_docs.py
      - name: Commit canonical documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_Intelligence_Factory_最終仕様書.md README.md
          if git diff --cached --quiet; then
            echo 'No documentation changes needed.'
            exit 0
          fi
          git commit -m 'Run225: update canonical stock lifecycle specification'
          git push origin HEAD:run225-stock-lifecycle-20260904
