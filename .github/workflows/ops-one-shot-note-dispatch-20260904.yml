name: Ops Inspect manuscript persistence source 2026-09-04

on:
  push:
    branches:
      - ops-note-draft-dispatch-20260904
    paths:
      - '.github/workflows/ops-one-shot-note-dispatch-20260904.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Show manuscript persistence code
        run: |
          set -euo pipefail
          echo '=== symbol locations ==='
          grep -nE 'def build_notion_manuscript_children|def _notion_page_manuscript_blocks|def _notion_code_caption|def upgrade_notion_page_with_report|MANUSCRIPT_CAPTION_READY|rich_text.*2000|\[:2000\]' pipeline.py | head -120 || true
          for sym in build_notion_manuscript_children _notion_page_manuscript_blocks upgrade_notion_page_with_report; do
            line=$(grep -n "def ${sym}" pipeline.py | head -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              start=$((line-25)); [ "$start" -lt 1 ] && start=1
              end=$((line+150))
              echo "=== ${sym} lines ${start}-${end} ==="
              sed -n "${start},${end}p" pipeline.py
            fi
          done
