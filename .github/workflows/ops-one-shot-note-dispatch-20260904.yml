name: Ops One-shot note Draft Dispatch 2026-09-04

on:
  push:
    branches:
      - ops-note-draft-dispatch-20260904
    paths:
      - '.github/workflows/ops-one-shot-note-dispatch-20260904.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Create note Draft workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run note-create-draft.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm=CREATE_NOTE_DRAFT \
            -f sync_id= \
            -f prepare_only=false
          echo 'Dispatched note-create-draft.yml on main with prepare_only=false.'
