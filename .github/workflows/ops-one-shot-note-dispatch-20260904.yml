name: Ops Dispatch real private note Draft 2026-09-04

on:
  push:
    branches:
      - ops-note-draft-dispatch-20260904
    paths:
      - '.github/workflows/ops-one-shot-note-dispatch-20260904.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Create note Draft workflow on main for repaired Polars article
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run note-create-draft.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm=CREATE_NOTE_DRAFT \
            -f sync_id=3d0479ffdca9811aad6fc525655c21ff \
            -f prepare_only=false
          echo 'Dispatched one private note draft for Polars current Ready article.'
