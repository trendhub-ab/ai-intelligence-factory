name: Ops Validate note byte-contract fix 2026-09-04

on:
  push:
    branches:
      - ops-note-draft-dispatch-20260904
    paths:
      - '.github/workflows/ops-one-shot-note-dispatch-20260904.yml'

permissions:
  contents: write

jobs:
  validate-and-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-note-manuscript-byte-contract-20260904
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run publication and note queue regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_run194_publication_contract -v
          python -m unittest tests.test_note_ready_sync -v
          python -m unittest tests.test_run194_note_ready_workflow -v
          python -m unittest tests.test_run197_note_ready_policy_reconciliation -v
          python -m unittest tests.test_run194_note_current_contract -v
          python -m unittest tests.test_run199_note_vm_preflight -v
      - name: Verify lossless segmentation directly
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import publication_contract as contract
          import run194_publication_contract as run194

          body = ('A' * 1899) + '\n' + ('B' * 1765)
          def builder(text, caption='AIIF_MANUSCRIPT:READY'):
              return [{
                  'object': 'block', 'type': 'code',
                  'code': {
                      'rich_text': [{'type':'text','text':{'content': text.replace('\n','')}}],
                      'language':'markdown',
                      'caption':[{'type':'text','text':{'content':caption}}],
                  },
              }]
          module = SimpleNamespace(
              build_notion_manuscript_children=builder,
              _notion_page_manuscript_blocks=lambda *_: [],
              _notion_code_caption=lambda *_: '',
              _notion_page_has_manuscript_child=lambda *_: False,
              MANUSCRIPT_CAPTION_READY='AIIF_MANUSCRIPT:READY',
              NOTION_BLOCK_LIMIT=1900,
          )
          def upgrade(page_id, repo_name, repo_url, score, score_breakdown_text, what_text,
                      why_important_text, why_not_important_text, action_text, spdx_id,
                      clean_manuscript, **kwargs):
              return True
          module.upgrade_notion_page_with_report = upgrade
          run194.install(module)
          child = module.build_notion_manuscript_children(body)[0]
          persisted = ''.join(x['text']['content'] for x in child['code']['rich_text'])
          caption = child['code']['caption'][0]['text']['content']
          assert persisted == body
          assert contract.is_current_ready_block(persisted, caption)
          print('LOSSLESS_ROUNDTRIP', True)
          print('CURRENT_POLICY_SHA256', contract.policy_sha256())
          PY
      - name: Update canonical specification in same change set
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('AI_Intelligence_Factory_最終仕様書.md')
          text = path.read_text(encoding='utf-8')
          old = '''- manuscript caption SHAと本文bytesが一致\n- 必須eyecatch assetが存在\n- historical paid-area control marker等を含まない\n\n古い契約、hash不一致、asset不足を無理に復活させない。'''
          new = '''- manuscript caption SHAと本文bytesが一致\n- Notion `rich_text` 分割はtransport上の都合に限定し、全segmentを連結したbytesが生成時manuscriptと完全一致する\n- captionの`manuscript_sha256`は分割前だけでなく、読み戻した永続化本文でも一致しなければならない\n- 必須eyecatch assetが存在\n- historical paid-area control marker等を含まない\n\n古い契約、hash不一致、asset不足を無理に復活させない。Notion保存時に改行等が1文字でも欠落したReady本文も投稿対象にせずFail-Closedする。'''
          if old not in text:
              raise SystemExit('canonical specification target text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo '::error::Canonical specification was not changed.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Document byte-exact note publication contract'
          git push origin HEAD:fix-note-manuscript-byte-contract-20260904
