name: Ops One-shot note Ready Sync 2026-09-04

on:
  push:
    branches:
      - ops-note-draft-dispatch-20260904
    paths:
      - '.github/workflows/ops-one-shot-note-dispatch-20260904.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Note Ready Article Sync workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run note-ready-sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Dispatched note-ready-sync.yml on main.'
