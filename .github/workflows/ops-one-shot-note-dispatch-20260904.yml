name: Ops Inspect safe chunking 2026-09-04

on:
  push:
    branches:
      - ops-note-draft-dispatch-20260904
    paths:
      - '.github/workflows/ops-one-shot-note-dispatch-20260904.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Show safe_chunk_text implementation and usages
        run: |
          set -euo pipefail
          line=$(grep -n '^def safe_chunk_text' pipeline.py | head -1 | cut -d: -f1)
          start=$((line-20)); [ "$start" -lt 1 ] && start=1
          end=$((line+100))
          echo "SAFE_CHUNK_LINE=$line"
          sed -n "${start},${end}p" pipeline.py
          echo '=== usages ==='
          grep -R -n 'safe_chunk_text(' --exclude-dir=.git . | head -80
