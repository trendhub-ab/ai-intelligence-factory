name: Japanese Display Label Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Add display-label columns
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
        run: |
          set -euo pipefail
          mkdir -p japanese_display_label_artifacts
          printf 'run_id=%s\n' "${{ github.run_id }}" > japanese_display_label_artifacts/request.txt
          python migrate_japanese_display_label.py 2>&1 | tee japanese_display_label_artifacts/run.log

      - name: Upload Japanese display-label migration artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japanese-display-label-migration-${{ github.run_number }}
          path: japanese_display_label_artifacts/
          if-no-files-found: error
          retention-days: 30
