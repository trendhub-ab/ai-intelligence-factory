name: Repository-wide Falsification Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-falsification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsify-all-tracked-surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Compile tracked Python contracts
        run: python -m compileall -q *.py tests

      - name: Scan repository-wide executable, workflow, provenance and secret surfaces
        run: python repository_falsification_guard.py

      - name: Enforce Run257 workflow reference integrity inside required check
        run: |
          python workflow_reference_guard.py
          python -m unittest tests.test_workflow_reference_guard -v

      - name: Enforce Run262 canonical Run261 documentation contract
        run: |
          python run262_documentation_contract_guard.py
          python -m unittest tests.test_run262_documentation_contract_guard -v

      - name: Enforce Run267 current canonical documentation contract
        run: |
          python run267_documentation_contract_guard.py
          python -m unittest tests.test_run267_documentation_contract_guard -v

      - name: Enforce Run268 business/source strategy contract
        run: |
          python run268_business_source_strategy_guard.py
          python -m unittest tests.test_run268_business_source_strategy_guard -v
          python -m unittest tests.test_run268_business_source_strategy -v

      - name: Enforce Run263 Integration hermeticity and stability
        run: |
          python integration_stability_guard.py
          python -m unittest tests.test_integration_stability_guard -v

      - name: Falsify repository organization and runtime safety contracts
        run: |
          python -m unittest tests.test_run200_repository_layout -v
          python -m unittest tests.test_run201_repository_garbage_cleanup -v
          python -m unittest tests.test_run246_repository_hygiene -v
          python -m unittest tests.test_run202_chatops_control -v
          python -m unittest tests.test_run203_runtime_state_channel -v
          python -m unittest tests.test_run204_gemini_transient_recovery -v
          python -m unittest tests.test_run206_pending_retry_fast_lane -v
          python -m unittest tests.test_run260_gemini_model_routing -v
          python -m unittest tests.test_run261_live_routing_fanout -v
          python -m unittest tests.test_run231_pipeline_slim -v
          python -m unittest tests.test_run231_stage2_repository_contract -v
          python -m unittest tests.test_run233_ci_collection_integrity -v
          python -m unittest tests.test_run235_source_normalization_module -v
          python -m unittest tests.test_run235_stage3b_source_normalization_migration -v
          python -m unittest tests.test_run236_evidence_context_module -v
          python -m unittest tests.test_run237_product_delivery_maintenance_module -v
          python -m unittest tests.test_run238_deep_dive_portfolio_module -v
          python -m unittest tests.test_run239_reader_experience_module -v
          python -m unittest tests.test_run240_editorial_naturalness_module -v
          python -m unittest tests.test_run241_batched_modules -v
          python -m unittest tests.test_run242_notional_source_deferred_modules -v
          python -m unittest tests.test_run243_content_generation_protocol_module -v
          python -m unittest tests.test_run244_decision_product_protocol_module -v
          python -m unittest tests.test_run245_fact_validation_modules -v

      - name: Falsify Note Ready policy-change reconciliation contract
        run: |
          python -m unittest \
            tests.test_run197_note_ready_policy_reconciliation.Run197NoteReadyPolicyReconciliationTests.test_every_publication_policy_file_triggers_main_queue_reconciliation \
            tests.test_run197_note_ready_policy_reconciliation.Run197NoteReadyPolicyReconciliationTests.test_policy_change_reconciliation_remains_zero_model_and_never_opens_note_browser \
            -v
