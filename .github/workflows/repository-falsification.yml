name: Repository-wide Falsification Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-falsification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsify-all-tracked-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile guard and production infrastructure contracts
        run: python -m py_compile repository_falsification_guard.py publication_contract.py run203_runtime_state_channel.py gemini_transient_recovery.py pending_retry_validation.py run202_chatops_control.py production_pipeline.py runtime_layers.py legacy_eyecatch_renderer.py run231_performance_telemetry.py

      - name: Scan repository-wide executable, workflow, provenance and secret surfaces
        run: python repository_falsification_guard.py

      - name: Falsify repository organization and runtime safety contracts
        run: |
          python -m unittest tests.test_run200_repository_layout -v
          python -m unittest tests.test_run201_repository_garbage_cleanup -v
          python -m unittest tests.test_run202_chatops_control -v
          python -m unittest tests.test_run203_runtime_state_channel -v
          python -m unittest tests.test_run204_gemini_transient_recovery -v
          python -m unittest tests.test_run206_pending_retry_fast_lane -v
          python -m unittest tests.test_run231_pipeline_slim -v
          python -m unittest tests.test_run231_stage2_repository_contract -v
          python -m unittest tests.test_run233_ci_collection_integrity -v

      - name: Falsify Note Ready policy-change reconciliation contract
        run: |
          python -m unittest \
            tests.test_run197_note_ready_policy_reconciliation.Run197NoteReadyPolicyReconciliationTests.test_every_publication_policy_file_triggers_main_queue_reconciliation \
            tests.test_run197_note_ready_policy_reconciliation.Run197NoteReadyPolicyReconciliationTests.test_policy_change_reconciliation_remains_zero_model_and_never_opens_note_browser \
            -v
