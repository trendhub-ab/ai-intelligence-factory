name: P0-B Task 6 Read-Only Live Preflight [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-readonly-preflight.yml'

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      NOTE_DELIVERY_LEDGER_BACKEND: gcs
      NOTE_DELIVERY_LEDGER_PREFIX: delivery/v1
      NOTE_TARGET_IDENTITY: trendhub_biz
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Confirm exact branch and no live marker
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'impl/p0b-strong-zero-retry-authority'
          test ! -e ops/p0b-strong-zero-retry.trigger

      - name: Install read-only preflight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright google-cloud-storage

      - name: Focused retry-authority verification
        run: >-
          python -m pytest -q
          tests/test_note_delivery_strong_zero.py
          tests/test_note_delivery_ledger.py
          tests/test_note_delivery_gcs.py
          tests/test_note_delivery_runtime.py
          tests/test_p0b_strong_zero_reconciliation.py
          tests/test_p0b_strong_zero_retry.py
          tests/test_p0b_strong_zero_retry_live_workflow.py

      - name: Authenticate to private ledger with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Resolve private durable-ledger bucket
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-aiif-note-ledger-v1"
          test -n "$bucket"
          echo "::add-mask::$bucket"
          echo "NOTE_DELIVERY_LEDGER_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Pin exact eligible Ready candidate without model use
        env:
          NOTE_DRAFT_CONFIRM: CREATE_NOTE_DRAFT
          NOTE_TARGET_SYNC_ID: ''
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/p0b-task6-preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          set -euo pipefail
          python run199_note_vm_preflight.py
          selected="$(python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['NOTE_DRAFT_RESULT_FILE']).read_text(encoding='utf-8'))
          if result.get('zero_gemini_calls') is not True:
              raise SystemExit('candidate preflight used model calls')
          if result.get('should_start_vm') is not True:
              raise SystemExit('no exact eligible Ready candidate')
          selected = str(result.get('selected_sync_id') or '').strip().lower()
          if len(selected) != 32:
              raise SystemExit('invalid selected sync identity')
          print(selected)
          PY
          )"
          echo "::add-mask::$selected"
          echo "NOTE_TARGET_SYNC_ID=$selected" >> "$GITHUB_ENV"
          echo 'P0B_TASK6_READY_GATE=one_exact_candidate'

      - name: Read durable state before browser census
        run: |
          python - <<'PY'
          import os
          import note_delivery_runtime as delivery_runtime
          from note_delivery_ledger import DeliveryState
          from note_delivery_strong_zero import parse_strong_zero_evidence_category

          sync_id = str(os.environ.get('NOTE_TARGET_SYNC_ID') or '').strip().lower()
          note_target = str(os.environ.get('NOTE_TARGET_IDENTITY') or '').strip()
          ledger = delivery_runtime.delivery_ledger_from_environment()
          logical_key = delivery_runtime._logical_key_for_identity(sync_id, note_target)
          record = ledger.get_active_by_logical_key(logical_key)
          if record is None:
              raise SystemExit('durable delivery unavailable')
          if record.state != DeliveryState.MANUAL_RECONCILIATION_REQUIRED:
              raise SystemExit('durable state is not MANUAL_RECONCILIATION_REQUIRED')
          if str(record.draft_id or '').strip():
              raise SystemExit('stable draft identity already present')
          parse_strong_zero_evidence_category(str(record.conflict_category or ''))
          print('P0B_TASK6_LEDGER_GATE=manual_no_draft')
          PY

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run fresh authenticated strong-zero census
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          P0B_HOSTED_DRAFT_CENSUS_RESULT_FILE: ${{ runner.temp }}/p0b-task6-census.json
        run: python run_p0b_hosted_private_draft_census.py

      - name: Rebuild immutable snapshot and prove read-only pre-trigger gate
        env:
          CENSUS_RESULT_FILE: ${{ runner.temp }}/p0b-task6-census.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          import note_delivery_runtime as delivery_runtime
          import run194_note_current_contract as current_contract
          import run222_note_presentation_integrity as presentation
          from note_delivery_ledger import DeliveryState
          from note_delivery_strong_zero import parse_strong_zero_evidence_category, validate_strong_zero_census

          sync_id = str(os.environ.get('NOTE_TARGET_SYNC_ID') or '').strip().lower()
          note_target = str(os.environ.get('NOTE_TARGET_IDENTITY') or '').strip()
          census = json.loads(Path(os.environ['CENSUS_RESULT_FILE']).read_text(encoding='utf-8'))
          safe = validate_strong_zero_census(census)

          current_contract.install()
          presentation.install_note(current_contract.base)
          prepared = delivery_runtime.prepare_delivery(current_contract.base, sync_id)
          ledger = delivery_runtime.delivery_ledger_from_environment()
          logical_key = delivery_runtime._logical_key_for_identity(sync_id, note_target)
          record = ledger.get_active_by_logical_key(logical_key)
          if record is None or record.state != DeliveryState.MANUAL_RECONCILIATION_REQUIRED:
              raise SystemExit('durable state changed during preflight')
          if str(record.draft_id or '').strip():
              raise SystemExit('stable draft identity appeared during preflight')
          if prepared.snapshot != record.snapshot:
              raise SystemExit('immutable snapshot mismatch')
          parse_strong_zero_evidence_category(str(record.conflict_category or ''))
          if safe['exact_target_count'] != 0 or safe['suspicious_blank_count'] != 0 or safe['unreadable_count'] != 0:
              raise SystemExit('strong-zero count invariant failed')
          if safe['mutation_count'] != 0 or safe['zero_model_calls'] is not True:
              raise SystemExit('read-only/model invariant failed')
          prepared.eyecatch_path.unlink(missing_ok=True)
          print('P0B_TASK6_PRETRIGGER_GATE=PASS')
          print('P0B_TASK6_CENSUS_DECISION=strong_zero')
          print('P0B_TASK6_MUTATION_COUNT=0')
          print('P0B_TASK6_MODEL_CALLS=0')
          PY

      - name: Cleanup ephemeral files
        if: always()
        run: |
          rm -f \
            "${{ runner.temp }}/p0b-task6-preflight.json" \
            "${{ runner.temp }}/p0b-task6-census.json"
