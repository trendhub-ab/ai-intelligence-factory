name: Run139 Reader Delight Adversarial

on:
  push:
    branches:
      - run129-conversational-warmth
    paths:
      - .github/chat-triggers/run139-reader-delight-adversarial.txt

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run129-conversational-warmth
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run adversarial reader-delight probe
        env:
          GEMINI_API_KEY: test-key
          GH_PAT: test-token
          GEMINI_QUOTA_PROJECT_ID: test-project
        run: python tools/run139_reader_delight_adversarial.py
