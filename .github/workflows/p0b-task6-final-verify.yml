name: P0-B Task 6 Final Verification [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-final-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest google-cloud-storage playwright pillow
      - name: Focused P0-B tests
        run: >-
          python -m pytest -q
          tests/test_note_delivery_strong_zero.py
          tests/test_note_delivery_ledger.py
          tests/test_note_delivery_gcs.py
          tests/test_note_delivery_runtime.py
          tests/test_p0b_strong_zero_reconciliation.py
          tests/test_p0b_strong_zero_retry.py
          tests/test_p0b_strong_zero_retry_live_workflow.py
      - name: Full repository pytest
        run: python -m pytest tests -q
      - name: Repository guards
        run: |
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
          git diff --check

# rerun after dangling probe workflow cleanup
