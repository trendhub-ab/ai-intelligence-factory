name: V2 Provider-Backed Shadow Evidence [ONE REQUEST]

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_V2_SHADOW_DEEP_DIVE'
        type: string
        required: true
        default: ''

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observe:
    if: ${{ inputs.confirm == 'RUN_V2_SHADOW_DEEP_DIVE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require explicit one-request observation confirmation
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = RUN_V2_SHADOW_DEEP_DIVE

      - name: Checkout exact triggering revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install locked dependency set
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check

      - name: Prove V2 provider-backed evidence safety
        run: |
          python -m pytest -q \
            tests/test_v2_005_live_proof.py \
            tests/test_v2_live_shadow_acquisition_budget.py \
            tests/test_v2_shadow_deep_dive.py \
            tests/test_v2_shadow_provider_diagnostics.py \
            tests/test_v2_shadow_provider_http_diagnostics.py \
            tests/test_v2_shadow_deep_dive_workflow.py

      - name: Run bounded provider-backed observation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python v2_005_live_proof.py \
            --output article_audit/v2_shadow_deep_dive.json \
            --run-id "v2-deep-dive-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload diagnostic evidence observation
        uses: actions/upload-artifact@v7
        with:
          name: v2-shadow-deep-dive-${{ github.run_number }}
          path: article_audit/v2_shadow_deep_dive.json
          if-no-files-found: error
          retention-days: 14
