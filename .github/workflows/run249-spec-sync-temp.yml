name: Run249 Canonical Spec Sync TEMP

on:
  push:
    branches:
      - run249-final-publication-surface-gate

permissions:
  contents: write

jobs:
  sync-spec:
    if: github.actor == 'trendhub-ab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run249-final-publication-surface-gate
          fetch-depth: 1
      - name: Patch canonical specification
        run: python run249_spec_sync_temp.py
      - name: Commit canonical specification only
        run: |
          set -euo pipefail
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo 'Canonical spec already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run249: update canonical Production specification'
          git push origin HEAD:run249-final-publication-surface-gate
