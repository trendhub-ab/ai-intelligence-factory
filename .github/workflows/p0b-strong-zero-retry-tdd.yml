name: P0-B Strong-Zero Retry TDD [IMPL]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-strong-zero-retry-tdd.yml'
      - 'member_customer_surface_contract.py'
      - 'note_delivery_*.py'
      - 'run_p0b_*.py'
      - 'tests/test_note_delivery_*.py'
      - 'tests/test_p0b_*.py'
      - 'workflow_reference_guard.py'
      - 'repository_falsification_guard.py'
      - 'integration_stability_guard.py'

permissions:
  contents: read

concurrency:
  group: p0b-strong-zero-retry-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reject secret or live-cloud references in this workflow
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*uses:[[:space:]]+google-github-actions/auth@|\$\{\{[[:space:]]*secrets\.' .github/workflows/p0b-strong-zero-retry-tdd.yml; then
            echo '::error::TDD workflow must remain offline and secret-free.'
            exit 1
          fi
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright google-cloud-storage
      - name: Focused P0-B baseline
        run: >-
          python -m pytest -q
          tests/test_note_delivery_ledger.py
          tests/test_note_delivery_gcs.py
          tests/test_note_delivery_runtime.py
          tests/test_p0b_strong_zero_reconciliation.py
          tests/test_p0b_strong_zero_reconciliation_live_workflow.py
      - name: Full repository pytest
        run: python -m pytest tests -q
      - name: Repository guards
        run: |
          set -euo pipefail
          python workflow_reference_guard.py
          python repository_falsification_guard.py
          python integration_stability_guard.py
