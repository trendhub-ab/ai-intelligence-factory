name: P0-A registry fix once

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-registry-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: design/p0-a-note-lossless-contract
          fetch-depth: 0
      - name: Add P0-A contract modules to infrastructure inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('member_customer_surface_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''    "migrate_japanese_display_label.py",\n    "note_draft_automation.py",\n    "note_eyecatch_persistence.py",\n'''
          new = '''    "migrate_japanese_display_label.py",\n    "note_document_contract.py",\n    "note_document_dom.py",\n    "note_draft_automation.py",\n    "note_eyecatch_persistence.py",\n'''
          if text.count(old) != 1:
              raise SystemExit('fail-closed: expected registry anchor not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- member_customer_surface_contract.py && exit 1 || true
      - name: Commit exact registry classification
        run: |
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add member_customer_surface_contract.py
          git commit -m 'chore: classify note document contract modules'
          git push origin HEAD:design/p0-a-note-lossless-contract
