name: Groq Two Pass Article Live
on:
  workflow_dispatch:
  push:
    branches: ['dev/groq-provider-foundation']
    paths:
      - '.runtime/groq_two_pass_article_trigger.txt'
permissions:
  contents: write
concurrency:
  group: groq-two-pass-article-live
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema

      - name: Build Decision Plan fixture and preflight GPT-OSS Free lane
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          from ai_provider import GenerationRequest, GroqProvider
          from groq_two_pass_article import build_plan_fixture
          from groq_validation import schema_validator
          fixture = build_plan_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'two-pass-plan-fixture.json',
          )
          provider = GroqProvider(
              lambda _: None,
              validate_schema=schema_validator(fixture['schema']),
              token_budget=7000,
              model=fixture['model'],
          )
          payload, estimate = provider.prepare(GenerationRequest(
              fixture['prompt'], fixture['max_output_tokens'], fixture['schema'], fixture['reasoning_effort']
          ))
          assert estimate <= 7000
          sent_schema = payload['response_format']['json_schema']['schema']
          sent_serialized = json.dumps(sent_schema, ensure_ascii=False)
          for unsupported in ('minLength', 'maxLength', 'minItems', 'maxItems'):
              assert unsupported not in sent_serialized
          assert payload['response_format']['json_schema']['strict'] is True
          print(json.dumps({'plan_preflight': 'PASS', 'model': fixture['model'], 'estimate': estimate,
                            'safe_tpm': 7000, 'request_bytes': len(json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')),
                            'strict_schema': True, 'business_writes': 0}, ensure_ascii=False))

      - name: One guarded GPT-OSS Decision Plan call
        env:
          AIIF_ONE_SHOT_MODE: groq_saved_prompt_validation
          AIIF_GROQ_FIXTURE: two-pass-plan-fixture.json
          AIIF_GROQ_REPORT: two-pass-plan-report.json
          AIIF_GROQ_LIVE: 'true'
          AIIF_GROQ_BUDGET_BACKEND: github
          AIIF_GROQ_EXPERIMENT: article-two-pass-B0049-plan-v3-semantic-guard
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LEDGER_GITHUB_TOKEN: ${{ github.token }}
        run: python production_pipeline.py

      - name: Validate Plan then build article-only Writer fixture
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          from ai_provider import GenerationRequest, GroqProvider
          from groq_two_pass_article import build_writer_fixture, load_plan_report
          plan = load_plan_report('two-pass-plan-report.json')
          fixture = build_writer_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'two-pass-plan-report.json',
              'two-pass-writer-fixture.json',
          )
          provider = GroqProvider(lambda _: None, token_budget=60000, model=fixture['model'])
          payload, estimate = provider.prepare(GenerationRequest(
              fixture['prompt'], fixture['max_output_tokens'], None, fixture['reasoning_effort']
          ))
          assert estimate <= 60000
          assert payload.get('compound_custom', {}).get('tools', {}).get('enabled_tools') == []
          print(json.dumps({'plan_validation': 'PASS', 'decision': plan['decision'], 'access_status': plan['access_status'],
                            'writer_model': fixture['model'], 'writer_estimate': estimate, 'writer_safe_tpm': 60000,
                            'writer_request_bytes': len(json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')),
                            'business_writes': 0}, ensure_ascii=False))

      - name: One guarded Compound Mini article-only call
        env:
          AIIF_ONE_SHOT_MODE: groq_saved_prompt_validation
          AIIF_GROQ_FIXTURE: two-pass-writer-fixture.json
          AIIF_GROQ_REPORT: two-pass-writer-report.json
          AIIF_GROQ_LIVE: 'true'
          AIIF_GROQ_BUDGET_BACKEND: github
          AIIF_GROQ_EXPERIMENT: article-two-pass-B0049-writer-v3-cas-guard
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LEDGER_GITHUB_TOKEN: ${{ github.token }}
        run: python production_pipeline.py

      - name: Assemble both passes and evaluate through current Production parser and four gates
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          import note_manuscript
          import pipeline
          import production_pipeline
          from groq_article_parity import evaluate_groq_article_output
          from groq_two_pass_article import assemble_combined_report
          from source_normalization import install as install_source_normalization
          from run268_business_source_strategy import install as install_run268
          from run269_business_source_precision import install as install_run269
          from run283_numeric_evidence_equivalence import install as install_run283
          from run284_reader_recovery_precision import install as install_run284
          from run287_publication_date_provenance import install as install_run287
          from reader_quality_precision import install as install_reader_quality_precision

          combined = assemble_combined_report(
              'two-pass-plan-report.json', 'two-pass-writer-report.json', 'two-pass-combined-report.json'
          )
          assert combined['provider_calls'] == 2
          assert combined['business_writes'] == 0

          install_source_normalization(pipeline)
          production_pipeline.install_runtime_layers(pipeline)
          production_pipeline.install_run349_score_narrative_negation_precision(pipeline)
          install_run283(pipeline)
          install_run268(pipeline)
          install_run269(pipeline)
          install_reader_quality_precision(pipeline)
          install_run284(pipeline)
          install_run287(note_manuscript, pipeline)

          evaluation = evaluate_groq_article_output(
              pipeline,
              'two-pass-combined-report.json',
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'two-pass-evaluation.json',
          )
          assert evaluation['provider_calls'] == 2
          assert evaluation['business_writes'] == 0
          assert evaluation['persist_results'] is False
          assert evaluation['parsed']
          assert evaluation['article_chars'] > 0
          print(json.dumps({
              'candidate_id': evaluation['candidate_id'],
              'model': evaluation['model'],
              'evidence_state': evaluation['evidence_state'],
              'evidence_sufficient': evaluation['evidence_sufficient'],
              'fact_ok': evaluation['fact_ok'],
              'fact_failures': evaluation['fact_failures'],
              'editorial_ok': evaluation['editorial_ok'],
              'editorial_warnings': evaluation['editorial_warnings'],
              'publication_state': evaluation['publication_state'],
              'publication_issues': evaluation['publication_issues'],
              'human_appeal_state': evaluation['human_appeal_state'],
              'human_appeal_issues': evaluation['human_appeal_issues'],
              'gate_disposition': evaluation['gate_disposition'],
              'quality_validated': evaluation['quality_validated'],
              'decision_score': evaluation['decision_score'],
              'article_chars': evaluation['article_chars'],
              'provider_calls': evaluation['provider_calls'],
              'prompt_tokens': evaluation['prompt_tokens'],
              'completion_tokens': evaluation['completion_tokens'],
              'tokens': evaluation['prompt_tokens'] + evaluation['completion_tokens'],
              'business_writes': evaluation['business_writes'],
          }, ensure_ascii=False))

      - name: Upload complete validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groq-two-pass-article-B0049-v3
          path: |
            two-pass-plan-fixture.json
            two-pass-plan-report.json
            two-pass-writer-fixture.json
            two-pass-writer-report.json
            two-pass-combined-report.json
            two-pass-evaluation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Require all quality gates before replacement candidacy
        shell: python
        run: |
          import json
          data = json.load(open('two-pass-evaluation.json', encoding='utf-8'))
          assert data['quality_validated'] is True, data
          assert data['fact_ok'] is True, data['fact_failures']
          assert data['editorial_ok'] is True, data['editorial_warnings']
          assert data['publication_state'] == 'PASS', data['publication_issues']
          assert data['human_appeal_state'] == 'ACCEPTABLE', data['human_appeal_issues']
