name: P0 C-1 Startup Script Classification [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0-c1-access-config-audit-20261005]
    paths: [.github/workflows/p0-c1-startup-preflight.yml]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Classify existing startup script without exposing content
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1class"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          ROOT="$tmp" python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          inst=json.loads((Path(os.environ['ROOT'])/'instance.json').read_text())
          items={str(x.get('key')):str(x.get('value') or '') for x in (inst.get('metadata',{}).get('items') or [])}
          key='startup-script' if 'startup-script' in items else ('startup-script-url' if 'startup-script-url' in items else '')
          val=items.get(key,'')
          low=val.lower()
          safe={
            'status':'c1_startup_script_classified',
            'vm_status':str(inst.get('status') or ''),
            'startup_key_kind':key or 'none',
            'script_length':len(val),
            'script_sha256':hashlib.sha256(val.encode()).hexdigest() if val else '',
            'has_shebang':val.startswith('#!'),
            'contains_explicit_exit':bool(re.search(r'(?m)^\s*exit(?:\s|$)', val)),
            'mentions_github':('github' in low),
            'mentions_actions_runner':('actions-runner' in low or 'actions.runner' in low or 'run.sh' in low or 'svc.sh' in low),
            'mentions_systemctl':('systemctl' in low),
            'mentions_ssh':('ssh' in low),
            'mentions_shutdown':('shutdown' in low or 'poweroff' in low),
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 startup script classification\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          PY
