name: P0 C-1 Startup Hardening Preflight [OPS ONE-SHOT]

on:
  push:
    branches: [ops/p0-c1-access-config-audit-20261005]
    paths: [.github/workflows/p0-c1-startup-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect metadata key occupancy and serial-read permission
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1startup"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/instance.json"
          token="$(gcloud auth print-access-token)"
          body='{"permissions":["compute.instances.getSerialPortOutput","compute.instances.setMetadata","compute.instances.start","compute.instances.stop"]}'
          code="$(curl -sS -o "$tmp/perms.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "$body" \
            "https://compute.googleapis.com/compute/v1/projects/${GCP_PROJECT_ID}/zones/${GCP_NOTE_VM_ZONE}/instances/${GCP_NOTE_VM_NAME}/testIamPermissions")"
          [ "$code" = "200" ] || echo '{"permissions":[]}' > "$tmp/perms.json"
          ROOT="$tmp" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          inst=json.loads((root/'instance.json').read_text())
          perms=set(json.loads((root/'perms.json').read_text()).get('permissions') or [])
          keys={str(x.get('key')) for x in (inst.get('metadata',{}).get('items') or [])}
          startup_keys=sorted(k for k in keys if k in {'startup-script','startup-script-url','windows-startup-script-ps1','windows-startup-script-cmd','windows-startup-script-bat','windows-startup-script-url'})
          safe={
            'status':'c1_startup_hardening_preflight_complete',
            'vm_status':str(inst.get('status') or ''),
            'startup_script_key_count':len(startup_keys),
            'startup_script_key_present':bool(startup_keys),
            'can_get_serial_output':'compute.instances.getSerialPortOutput' in perms,
            'can_set_metadata':'compute.instances.setMetadata' in perms,
            'can_start':'compute.instances.start' in perms,
            'can_stop':'compute.instances.stop' in perms,
            'read_only':True,
            'private_identifiers_exposed':0,
          }
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 startup hardening preflight\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          PY
