name: Local Writer Experiment 2

on:
  push:
    branches:
      - experiment/local-writer-five-article-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-article-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SYNTHETIC_REGRESSION_MODE: "true"
      GEMINI_API_KEY: ""
      GH_PAT: ""
      NOTION_API_KEY: ""
      GEMINI_PERSISTENT_DAILY_COUNTER: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install locked test environment
        run: |
          python -m pip install 'pip==26.2.1'
          pip install -r requirements.txt -c requirements-ci-constraints.txt
          pip install 'pytest==8.4.2' -c requirements-ci-constraints.txt
          python -m pip check
      - name: Run five-article Local Writer probe
        run: python -m pytest -q -s tests/test_local_writer_five_article_experiment.py
