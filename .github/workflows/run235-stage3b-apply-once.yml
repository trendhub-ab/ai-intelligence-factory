name: Run235 Stage3B Apply Once

on:
  push:
    branches:
      - run235-stage3b-source-normalization-dedup
    paths:
      - .github/workflows/run235-stage3b-apply-once.yml

permissions:
  contents: write

jobs:
  apply-stage3b-once:
    if: github.ref_name == 'run235-stage3b-source-normalization-dedup'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: run235-stage3b-source-normalization-dedup
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pipeline.py | awk '{print $1}')" = "9a8e7c429e85612f88240f3cd254857397a60bad67ef39594c5a68ba5f4436cc"
          test "$(wc -l < pipeline.py | tr -d ' ')" = "13423"
          git diff --exit-code

      - name: Apply deterministic Stage3B migration
        shell: bash
        run: |
          set -euo pipefail
          python run235_stage3b_source_normalization_migration.py pipeline.py --write
          python -m py_compile pipeline.py
          test "$(sha256sum pipeline.py | awk '{print $1}')" = "16f28de8b79b7e8e8225004dbbefc790d4f1d56229891bcc37f5c8eb152cdad1"
          test "$(wc -l < pipeline.py | tr -d ' ')" = "13335"
          test "$(git diff --name-only)" = "pipeline.py"

      - name: Commit only the transformed pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pipeline.py
          git diff --cached --name-only | grep -Fx 'pipeline.py'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m "Run235 Stage3B: remove duplicate source normalization bodies"
          git push origin HEAD:run235-stage3b-source-normalization-dedup
