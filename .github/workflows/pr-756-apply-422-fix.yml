name: PR 756 apply exact attribution 422 fix

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-exact-fix:
    if: >-
      github.repository == 'trendhub-ab/ai-intelligence-factory' &&
      github.event.pull_request.number == 756 &&
      github.event.pull_request.head.ref == 'fix/subscription-attribution-runtime-state-sha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace only the mismatched attribution lookup
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          path = Path('pipeline.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)

          funcs = [
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == '_upload_subscription_attribution_to_github'
          ]
          if len(funcs) != 1:
              raise SystemExit(f'expected one attribution upload function, found {len(funcs)}')
          func = funcs[0]
          calls = []
          for node in ast.walk(func):
              if not isinstance(node, ast.Assign) or len(node.targets) != 1:
                  continue
              target = node.targets[0]
              call = node.value
              if not (isinstance(target, ast.Name) and target.id == 'existing' and isinstance(call, ast.Call)):
                  continue
              callee = call.func
              if (
                  isinstance(callee, ast.Attribute)
                  and callee.attr == 'get'
                  and isinstance(callee.value, ast.Name)
                  and callee.value.id == 'requests'
              ):
                  calls.append(call)
          if len(calls) != 1:
              raise SystemExit(f'expected one existing=requests.get call in attribution upload, found {len(calls)}')

          call = calls[0]
          if any(keyword.arg == 'params' for keyword in call.keywords):
              raise SystemExit('attribution lookup already has params; refusing unexpected rewrite')
          call_segment = ast.get_source_segment(text, call)
          func_segment = ast.get_source_segment(text, func)
          if not call_segment or not func_segment:
              raise SystemExit('could not recover exact source segments')
          if 'api_url' not in call_segment:
              raise SystemExit('target lookup is not the expected api_url call')
          if func_segment.count(call_segment) != 1:
              raise SystemExit('target call is not unique inside attribution upload function')
          new_call_segment, substitutions = re.subn(
              r'\btimeout\s*=',
              'params={"ref": EYECATCH_GITHUB_BRANCH}, timeout=',
              call_segment,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit(f'expected one timeout keyword in target call, found {substitutions}')
          new_func_segment = func_segment.replace(call_segment, new_call_segment, 1)
          if text.count(func_segment) != 1:
              raise SystemExit('target function source is not unique; refusing rewrite')
          path.write_text(text.replace(func_segment, new_func_segment, 1), encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "pipeline.py"

      - name: Commit exact fix to PR branch
        shell: bash
        run: |
          if git diff --quiet -- pipeline.py; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py
          git commit -m 'Fix attribution lookup branch for existing files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
