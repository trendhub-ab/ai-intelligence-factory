name: AIIF ChatOps Note Bridge

# Safe, zero-model bridge from the dedicated GitHub control issue to Note workflows.
# Run309/312 and Run314 audits are read-only. Run310 fixed-LP, Run311 profile copy, and Run313 exact-state LP
# reconciliation are explicit, hard-bound maintenance exceptions; ordinary article publication remains human-only.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: aiif-chatops-note-control
  cancel-in-progress: false

jobs:
  authorize-and-dispatch:
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      (github.event.comment.body == '/aiif note sync' ||
       github.event.comment.body == '/aiif note draft' ||
       github.event.comment.body == '/aiif note audit' ||
       github.event.comment.body == '/aiif note lp audit' ||
       github.event.comment.body == '/aiif note lp publish-audit' ||
       github.event.comment.body == '/aiif note lp update' ||
       github.event.comment.body == '/aiif note lp reconcile' ||
       github.event.comment.body == '/aiif note onboarding audit' ||
       github.event.comment.body == '/aiif note profile update')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Re-authorize exact command fail-closed
        id: auth
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            '/aiif note sync') action='sync' ;;
            '/aiif note draft') action='draft' ;;
            '/aiif note audit') action='audit' ;;
            '/aiif note lp audit') action='lp_audit' ;;
            '/aiif note lp publish-audit') action='lp_publish_audit' ;;
            '/aiif note lp update') action='lp_update' ;;
            '/aiif note lp reconcile') action='lp_reconcile' ;;
            '/aiif note onboarding audit') action='onboarding_audit' ;;
            '/aiif note profile update') action='profile_update' ;;
            *) echo '::error::Refusing unknown Note ChatOps command'; exit 1 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Dispatch existing Note workflow exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.auth.outputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            sync)
              workflow='note-ready-sync.yml'
              payload='{"ref":"main"}'
              ;;
            draft)
              workflow='note-create-draft.yml'
              payload='{"ref":"main","inputs":{"confirm":"CREATE_NOTE_DRAFT","sync_id":"","prepare_only":"false"}}'
              ;;
            audit)
              workflow='note-private-draft-audit.yml'
              payload='{"ref":"main","inputs":{"confirm":"AUDIT_NOTE_DRAFT","sync_id":"3bd479ffdca9817f926aeaffbb779c4b"}}'
              ;;
            lp_audit)
              workflow='note-public-lp-audit.yml'
              payload='{"ref":"main","inputs":{"confirm":"AUDIT_PUBLIC_LP","stage":"editor"}}'
              ;;
            lp_publish_audit)
              workflow='note-public-lp-audit.yml'
              payload='{"ref":"main","inputs":{"confirm":"AUDIT_PUBLIC_LP","stage":"publish_settings"}}'
              ;;
            lp_update)
              workflow='note-public-lp-update.yml'
              payload='{"ref":"main","inputs":{"confirm":"UPDATE_PUBLIC_LP_NED673E381EF8"}}'
              ;;
            lp_reconcile)
              workflow='note-public-lp-reconcile.yml'
              payload='{"ref":"main","inputs":{"confirm":"RECONCILE_PUBLIC_LP_NED673E381EF8_SHA3E356937"}}'
              ;;
            onboarding_audit)
              workflow='note-member-onboarding-audit.yml'
              payload='{"ref":"main","inputs":{"confirm":"AUDIT_MEMBER_ONBOARDING_N284E428C80F4","stage":"publish_settings"}}'
              ;;
            profile_update)
              workflow='note-profile-update.yml'
              payload='{"ref":"main","inputs":{"confirm":"UPDATE_NOTE_PROFILE_TRENDHUB_BIZ"}}'
              ;;
            *)
              echo '::error::Refusing unknown action'
              exit 1
              ;;
          esac
          printf '%s' "$payload" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
            --input -

      - name: Record safe dispatch
        env:
          ACTION: ${{ steps.auth.outputs.action }}
        run: |
          {
            echo '### AIIF ChatOps Note Bridge'
            echo '- control issue: `#71`'
            echo "- action: \`$ACTION\`"
            echo '- target branch: `main`'
            echo '- Gemini calls performed by bridge: `0`'
            echo '- Production started: `false`'
            echo '- public note release performed: `false`'
            case "$ACTION" in
              lp_update)
                echo '- explicit maintenance mutation authorized: `fixed LP ned673e381ef8 only`'
                ;;
              lp_reconcile)
                echo '- explicit maintenance mutation authorized: `fixed LP ned673e381ef8 exact audited SHA, two text corrections only`'
                ;;
              profile_update)
                echo '- explicit maintenance mutation authorized: `trendhub_biz profile description only`'
                ;;
              *)
                echo '- explicit maintenance mutation authorized: `false`'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
