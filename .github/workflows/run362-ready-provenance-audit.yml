name: Run362 Ready Provenance Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/run362-provenance-audit.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Compile read-only audit
        run: python -m py_compile run362_ready_provenance_audit.py
      - name: Run provenance audit
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run362_ready_provenance_audit.py
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run362-ready-provenance-${{ github.run_id }}
          path: gate_history/run362_ready_provenance_audit.json
          if-no-files-found: error
          retention-days: 14
