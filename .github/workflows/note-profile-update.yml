name: Update exact note profile biography

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPDATE_NOTE_PROFILE_TRENDHUB_BIZ_RUN330_EXACT_BIOGRAPHY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-profile-update-trendhub-biz
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal preflight dependency
        run: pip install requests
      - name: Falsify Run311 history and exact Run330/331 updater
        run: python -m unittest tests.test_run311_note_profile_update tests.test_run330_note_profile_exact_update tests.test_run331_profile_form_snapshot_scope -v
      - name: Validate exact profile authorization
        id: auth
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != 'UPDATE_NOTE_PROFILE_TRENDHUB_BIZ_RUN330_EXACT_BIOGRAPHY' ]; then
            echo '::error::Run330 refuses any non-exact note profile confirmation token.'
            exit 1
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable: ${name}"
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  update-profile:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1
          command -v xvfb-run >/dev/null 2>&1
      - name: Re-run exact Run330/331 regression
        run: python -m unittest tests.test_run330_note_profile_exact_update tests.test_run331_profile_form_snapshot_scope -v
      - name: Update and verify exact profile biography only
        env:
          NOTE_PROFILE_RUN330_CONFIRM: ${{ inputs.confirm }}
          NOTE_PROFILE_RUN330_RESULT_FILE: ${{ runner.temp }}/run330-note-profile-update.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run330_note_profile_exact_update.py
      - name: Enforce exact Run330 postconditions
        env:
          RESULT_FILE: ${{ runner.temp }}/run330-note-profile-update.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          status = result.get('status')
          if status not in {'updated_and_verified_exact_biography_only', 'already_current_verified_no_mutation'}:
              raise SystemExit(f'Run330 profile update did not reach a verified terminal state: {status!r}')
          if result.get('other_settings_unchanged') is not True:
              raise SystemExit('Run330 unrelated settings invariance failed')
          if result.get('zero_gemini_calls') is not True or result.get('notion_writes') != 0:
              raise SystemExit('Run330 zero-model/zero-Notion contract failed')
          if status == 'updated_and_verified_exact_biography_only':
              if result.get('biography_mutation') is not True or result.get('save_clicks') != 1:
                  raise SystemExit('Run330 exact biography/save mutation contract failed')
              if result.get('product_hunt_removed') is not True:
                  raise SystemExit('Run330 public Product Hunt removal verification failed')
          else:
              if result.get('biography_mutation') is not False or result.get('save_clicks') != 0:
                  raise SystemExit('Run330 idempotent no-op contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run330/331 exact note profile biography update\n')
              fh.write(f'- status: `{status}`\n')
              fh.write(f'- biography mutation: `{result.get("biography_mutation") is True}`\n')
              fh.write(f'- save clicks: `{result.get("save_clicks")}`\n')
              fh.write('- unrelated profile-form settings changed: `false`\n')
              fh.write('- Product Hunt present after verified update: `false`\n')
              fh.write('- Gemini calls: `0`\n')
              fh.write('- Notion writes: `0`\n')
          PY
      - name: Preserve Run330 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run330-note-profile-exact-update
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/run330-note-profile-update.json

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, update-profile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
