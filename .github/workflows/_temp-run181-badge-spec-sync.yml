name: TEMP Run181 Badge Spec Sync

on:
  push:
    branches:
      - run181-badge-taxonomy-icons
    paths:
      - tools/_temp_sync_run181_badge_spec.py
      - .github/workflows/_temp-run181-badge-spec-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run181-badge-taxonomy-icons
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch canonical spec deterministically
        run: python tools/_temp_sync_run181_badge_spec.py
      - name: Commit canonical spec if changed
        run: |
          if git diff --quiet -- AI_Intelligence_Factory_最終仕様書.md; then
            echo "SPEC_ALREADY_CURRENT=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Intelligence_Factory_最終仕様書.md
          git commit -m "Docs: sync canonical Run181 badge contract"
          git push origin HEAD:run181-badge-taxonomy-icons
