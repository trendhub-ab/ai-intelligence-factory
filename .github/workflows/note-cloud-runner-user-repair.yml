name: Repair Note Cloud Runner User Identity

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: note-cloud-runner-user-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.issue.number == 71 && github.event.comment.body == '/aiif repair note-cloud-runner-user' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Validate repair controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable or secret: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Capture original startup script and install bounded repair wrapper
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          elif [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
            [ "$state" = "TERMINATED" ] || { echo '::error::VM did not stop before repair preparation.'; exit 1; }
          fi

          gcloud compute instances describe "$GCP_NOTE_VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
            --format='json(metadata.items)' > /tmp/aiif-repair-metadata.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/aiif-repair-metadata.json', encoding='utf-8'))
          items = ((data.get('metadata') or {}).get('items') or [])
          value = next((str(i.get('value') or '') for i in items if i.get('key') == 'startup-script'), '')
          if not value:
              raise SystemExit('startup-script metadata is missing')
          open('/tmp/aiif-original-startup.sh', 'w', encoding='utf-8').write(value)
          PY
          original_sha="$(sha256sum /tmp/aiif-original-startup.sh | awk '{print $1}')"
          echo "ORIGINAL_STARTUP_SHA=$original_sha" >> "$GITHUB_ENV"

          original_b64="$(base64 -w0 /tmp/aiif-original-startup.sh)"
          cat > /tmp/aiif-user-repair-startup.sh <<EOF
          #!/bin/bash
          set +e
          run_id='$GITHUB_RUN_ID'
          expected_user='trendhub_biz_gmail_com'
          expected_uid='1570601541'
          expected_gid='1570601541'
          expected_home='/home/trendhub_biz_gmail_com'
          svc='actions.runner.trendhub-ab-ai-intelligence-factory.aiif-note-draft.service'
          mark() { echo "AIIF_REPAIR_RUN_ID=\$run_id \$*"; }
          fail() { mark "AIIF_REPAIR_ERROR=\$1"; mark 'AIIF_REPAIR_FACTS_DONE=0'; exit 1; }
          mark 'AIIF_REPAIR_BEGIN=1'

          echo '$original_b64' | base64 -d > /tmp/aiif-original-startup.sh
          chmod 700 /tmp/aiif-original-startup.sh
          bash /tmp/aiif-original-startup.sh
          original_rc=\$?
          mark "AIIF_REPAIR_ORIGINAL_STARTUP_RC=\$original_rc"
          [ "\$original_rc" -eq 0 ] || fail 'original_startup_nonzero'

          svc_user="\$(systemctl show "\$svc" -p User --value 2>/dev/null)"
          workdir="\$(systemctl show "\$svc" -p WorkingDirectory --value 2>/dev/null)"
          [ "\$svc_user" = "\$expected_user" ] || fail 'service_user_mismatch'
          [ "\$workdir" = "\$expected_home/actions-runner" ] || fail 'workdir_mismatch'
          [ -d "\$workdir" ] || fail 'workdir_missing'
          [ -f "\$workdir"/runsvc.sh ] || fail 'runsvc_missing'

          mapfile -t ledgers < <(find /home /opt /srv -maxdepth 6 -type f -path '*/.aiif-note/delivery-ledger-v1.sqlite3' 2>/dev/null)
          [ "\${#ledgers[@]}" -eq 1 ] || fail 'ledger_count_not_one'

          before_workdir="\$(stat -c '%u:%g:%a' "\$workdir")"
          before_runsvc="\$(stat -c '%u:%g:%a' "\$workdir"/runsvc.sh)"
          before_ledger="\$(stat -c '%u:%g:%a' "\${ledgers[0]}")"
          [ "\$before_workdir" = '1570601541:1570601541:755' ] || fail 'unexpected_workdir_metadata'
          [ "\$before_runsvc" = '1570601541:1570601541:755' ] || fail 'unexpected_runsvc_metadata'
          [ "\$before_ledger" = '1570601541:1570601541:600' ] || fail 'unexpected_ledger_metadata'

          passwd_by_name="\$(getent passwd "\$expected_user" || true)"
          if [ -n "\$passwd_by_name" ]; then
            resolved_uid="\$(printf '%s\n' "\$passwd_by_name" | awk -F: '{print \$3}')"
            resolved_gid="\$(printf '%s\n' "\$passwd_by_name" | awk -F: '{print \$4}')"
            resolved_home="\$(printf '%s\n' "\$passwd_by_name" | awk -F: '{print \$6}')"
            [ "\$resolved_uid" = "\$expected_uid" ] || fail 'existing_user_uid_conflict'
            [ "\$resolved_gid" = "\$expected_gid" ] || fail 'existing_user_gid_conflict'
            [ "\$resolved_home" = "\$expected_home" ] || fail 'existing_user_home_conflict'
          else
            [ -z "\$(getent passwd "\$expected_uid" || true)" ] || fail 'uid_already_in_use'
          fi

          group_by_name="\$(getent group "\$expected_user" || true)"
          if [ -n "\$group_by_name" ]; then
            resolved_group_gid="\$(printf '%s\n' "\$group_by_name" | awk -F: '{print \$3}')"
            [ "\$resolved_group_gid" = "\$expected_gid" ] || fail 'existing_group_gid_conflict'
          else
            [ -z "\$(getent group "\$expected_gid" || true)" ] || fail 'gid_already_in_use'
            groupadd --gid "\$expected_gid" "\$expected_user" || fail 'group_create_failed'
          fi

          if [ -z "\$passwd_by_name" ]; then
            useradd --uid "\$expected_uid" --gid "\$expected_gid" --home-dir "\$expected_home" --shell /bin/bash --no-create-home "\$expected_user" || fail 'user_create_failed'
          fi

          repaired_passwd="\$(getent passwd "\$expected_user" || true)"
          [ -n "\$repaired_passwd" ] || fail 'repaired_user_does_not_resolve'
          repaired_uid="\$(printf '%s\n' "\$repaired_passwd" | awk -F: '{print \$3}')"
          repaired_gid="\$(printf '%s\n' "\$repaired_passwd" | awk -F: '{print \$4}')"
          repaired_home="\$(printf '%s\n' "\$repaired_passwd" | awk -F: '{print \$6}')"
          [ "\$repaired_uid" = "\$expected_uid" ] || fail 'repaired_uid_mismatch'
          [ "\$repaired_gid" = "\$expected_gid" ] || fail 'repaired_gid_mismatch'
          [ "\$repaired_home" = "\$expected_home" ] || fail 'repaired_home_mismatch'

          after_workdir="\$(stat -c '%u:%g:%a' "\$workdir")"
          after_runsvc="\$(stat -c '%u:%g:%a' "\$workdir"/runsvc.sh)"
          after_ledger="\$(stat -c '%u:%g:%a' "\${ledgers[0]}")"
          [ "\$after_workdir" = "\$before_workdir" ] || fail 'workdir_metadata_changed'
          [ "\$after_runsvc" = "\$before_runsvc" ] || fail 'runsvc_metadata_changed'
          [ "\$after_ledger" = "\$before_ledger" ] || fail 'ledger_metadata_changed'
          mark 'AIIF_REPAIR_OWNERSHIP_UNCHANGED=yes'
          mark 'AIIF_REPAIR_IDENTITY_RESTORED=yes'

          systemctl daemon-reload
          systemctl reset-failed "\$svc" >/dev/null 2>&1 || true
          systemctl start "\$svc" || fail 'service_start_failed'
          sleep 5
          systemctl is-active --quiet "\$svc" || fail 'service_not_active'
          mark 'AIIF_REPAIR_SERVICE_ACTIVE=yes'
          mark 'AIIF_REPAIR_FACTS_DONE=1'
          exit 0
          EOF
          chmod 600 /tmp/aiif-user-repair-startup.sh
          gcloud compute instances add-metadata "$GCP_NOTE_VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
            --metadata-from-file=startup-script=/tmp/aiif-user-repair-startup.sh --quiet
          echo 'Temporary fail-closed repair wrapper installed; original startup content was not printed.'

      - name: Start VM for bounded identity repair
        run: |
          set -euo pipefail
          gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          echo 'Repair boot started.'

      - name: Allow repair bootstrap to settle
        run: sleep 75

      - name: Validate bounded repair facts from serial output
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          safe="$(mktemp)"
          matched="$(mktemp)"
          gcloud compute instances get-serial-port-output "$GCP_NOTE_VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
            --port=1 --start=0 >"$raw" 2>&1 || true
          sed -E \
              -e 's/(gh[pousr]_[A-Za-z0-9_]{8,})/[REDACTED_GITHUB_TOKEN]/g' \
              -e 's/([Tt][Oo][Kk][Ee][Nn][=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's/([Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]:[[:space:]]*)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's/(credentials[^[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/g' \
            "$raw" >"$safe"
          grep -F "AIIF_REPAIR_RUN_ID=$GITHUB_RUN_ID" "$safe" >"$matched" || true
          echo '### bounded repair facts'
          cat "$matched"
          if grep -Fq "AIIF_REPAIR_RUN_ID=$GITHUB_RUN_ID AIIF_REPAIR_ERROR=" "$matched"; then
            echo '::error::Repair wrapper reported a fail-closed error.'
            exit 1
          fi
          grep -Fq "AIIF_REPAIR_RUN_ID=$GITHUB_RUN_ID AIIF_REPAIR_IDENTITY_RESTORED=yes" "$matched"
          grep -Fq "AIIF_REPAIR_RUN_ID=$GITHUB_RUN_ID AIIF_REPAIR_OWNERSHIP_UNCHANGED=yes" "$matched"
          grep -Fq "AIIF_REPAIR_RUN_ID=$GITHUB_RUN_ID AIIF_REPAIR_SERVICE_ACTIVE=yes" "$matched"
          grep -Fq "AIIF_REPAIR_RUN_ID=$GITHUB_RUN_ID AIIF_REPAIR_FACTS_DONE=1" "$matched"

      - name: Prove repaired runner is online
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.name == "aiif-note-draft") | select(any(.labels[]?; .name == "aiif-note-cloud"))][0].status // ""')"
            if [ "$status" = "online" ]; then
              echo 'AIIF_REPAIR_RUNNER_ONLINE=yes'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Repaired runner did not come online.'
          exit 1

      - name: Stop VM before restoring original startup script
        run: |
          set -euo pipefail
          gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          echo 'VM stopped after repair boot.'

      - name: Prove runner goes offline while VM is stopped
        run: |
          set -euo pipefail
          for _ in $(seq 1 36); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.name == "aiif-note-draft") | select(any(.labels[]?; .name == "aiif-note-cloud"))][0].status // ""')"
            if [ "$status" = "offline" ]; then
              echo 'AIIF_REPAIR_RUNNER_OFFLINE_AFTER_STOP=yes'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Runner did not become offline after VM stop.'
          exit 1

      - name: Restore original startup script exactly before reboot proof
        run: |
          set -euo pipefail
          gcloud compute instances add-metadata "$GCP_NOTE_VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
            --metadata-from-file=startup-script=/tmp/aiif-original-startup.sh --quiet
          restored="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
            --format='json(metadata.items)' \
            | python -c 'import json,sys,hashlib; d=json.load(sys.stdin); items=((d.get("metadata") or {}).get("items") or []); v=next((str(i.get("value") or "") for i in items if i.get("key")=="startup-script"), ""); print(hashlib.sha256(v.encode()).hexdigest())')"
          [ "$restored" = "$ORIGINAL_STARTUP_SHA" ] || { echo '::error::Startup script restoration hash mismatch.'; exit 1; }
          echo 'Original startup script restored exactly by SHA-256.'

      - name: Reboot using only original startup script
        run: |
          set -euo pipefail
          gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          echo 'Original-startup reboot started.'

      - name: Prove repair survives original-startup reboot
        run: |
          set -euo pipefail
          for _ in $(seq 1 42); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.name == "aiif-note-draft") | select(any(.labels[]?; .name == "aiif-note-cloud"))][0].status // ""')"
            if [ "$status" = "online" ]; then
              echo 'AIIF_REPAIR_REBOOT_RUNNER_ONLINE=yes'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Runner did not return online under the original startup script.'
          exit 1

      - name: Final stop after reboot proof
        run: |
          set -euo pipefail
          gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          final_state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          [ "$final_state" = "TERMINATED" ] || { echo '::error::VM is not terminated after reboot proof.'; exit 1; }
          echo 'AIIF_REPAIR_FINAL_VM_STOPPED=yes'

      - name: Always stop VM and restore original startup script
        if: ${{ always() }}
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          elif [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 36); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          final_state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$final_state" = "TERMINATED" ]; then
            echo 'AIIF_REPAIR_FINAL_VM_STOPPED=yes'
          else
            echo '::error::Cleanup could not confirm the VM is terminated.'
            exit 1
          fi

          if [ -s /tmp/aiif-original-startup.sh ] && [ -n "${ORIGINAL_STARTUP_SHA:-}" ]; then
            gcloud compute instances add-metadata "$GCP_NOTE_VM_NAME" \
              --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
              --metadata-from-file=startup-script=/tmp/aiif-original-startup.sh --quiet
            restored="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" \
              --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" \
              --format='json(metadata.items)' \
              | python -c 'import json,sys,hashlib; d=json.load(sys.stdin); items=((d.get("metadata") or {}).get("items") or []); v=next((str(i.get("value") or "") for i in items if i.get("key")=="startup-script"), ""); print(hashlib.sha256(v.encode()).hexdigest())')"
            [ "$restored" = "$ORIGINAL_STARTUP_SHA" ] || { echo '::error::Cleanup startup-script hash mismatch.'; exit 1; }
            echo 'Original startup script restored exactly by SHA-256.'
          else
            echo 'No startup-script backup was captured; no metadata restoration was attempted.'
          fi
