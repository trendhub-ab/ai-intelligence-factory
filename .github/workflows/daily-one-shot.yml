          NOTION_NOTE_READY_DATA_SOURCE_ID: "0b79b64d-4823-4084-be57-8bb11d7d2ce6"
          NOTE_USER_NAME: "trendhub_biz"
        run: |
          set +e
          result="$(python note_publication_reconcile.py 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::note publication reconciliation failed non-fatally: $result"
            exit 0
          fi
          echo "$result"
          {
            echo "### Prior human publication reconciliation"
            echo "$result"
            echo "- publication action remains human-only"
            echo "- model calls: 0"
          } >> "$GITHUB_STEP_SUMMARY"

