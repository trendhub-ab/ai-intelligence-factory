          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: "20"
          ENABLE_REVENUE_PRODUCT_PHASE2: ${{ vars.ENABLE_REVENUE_PRODUCT_PHASE2 || 'true' }}
          TRACKING_ELIGIBILITY_MIN_SCORE: "55"
          TRACKING_REVIEW_DAYS: "14"
