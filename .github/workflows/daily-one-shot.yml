name: Daily Intelligence & Content Pipeline [ONE-SHOT]

# Manual production ONE-SHOT. Future execution times are supplied by an external reservation mechanism.
# Important safety contract:
# - workflow_dispatch only: pipeline self-commits can never start another run.
# - explicit RUN_ONCE confirmation is required.
# - full mode preserves the normal one-shot contract.
# - article_validation mode skips only the separate Product Review pass, saving up to 3 Gemini requests.
# - pending_retry_validation runs only the high-value Pending Retry recovery lane and stops after one success.
# - full/article_validation keep the authoritative production_pipeline.py entrypoint explicit.
# - X discovery is enabled only for full mode; validation modes never receive X/Apify credentials.
# - the same Gemini-budget concurrency group as production prevents overlap.
# - this workflow has no fixed schedule; the legacy normal Daily workflow remains PAUSED.
# - successful ONE-SHOT completion explicitly fans out zero-model downstream workflows with GH_PAT.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = normal; article_validation = article QA; pending_retry_validation = retry one high-value failed article only'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - article_validation
          - pending_retry_validation
          - ready_rescue_validation
          - production_e2e_validation
          - stale_ready_batch_revalidation
          - local_skills_canary_validation
          - local_skills_production_validation
      editorial_style:
        description: 'Article tone: classic = current AIIF; human_narrative = narrative-forward human tone; duo_narrative = フェルン×クレハ'
        required: true
        default: 'classic'
        type: choice
        options:
          - classic
          - human_narrative
          - duo_narrative
      excluded_models:
        description: 'Optional run-scoped Gemini exclusion: empty or one allowlisted model'
        required: false
        default: ''
        type: string
      exact_target:
        description: 'Optional exact existing article name; article_validation only; fail closed on miss'
        required: false
        default: ''
        type: string
      e2e_prepare_only:
        description: 'Production E2E only: select and audit one candidate, then stop before any provider generation request'
        required: true
        default: false
        type: boolean
      confirm:
        description: 'Type RUN_ONCE to execute exactly one production ONE-SHOT'
        required: true
        default: ''
        type: string

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    if: ${{ inputs.confirm == 'RUN_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIIF_RUNTIME_STATE_GITHUB_TOKEN: ${{ github.token }}
      AIIF_EDITORIAL_STYLE: ${{ inputs.editorial_style }}
      AIIF_GEMINI_TEMP_EXCLUDED_MODELS: ${{ inputs.excluded_models }}
      ARTICLE_REVALIDATION_EXACT_TARGET: ${{ inputs.exact_target }}

    steps:
      - name: One-shot safety contract
        run: |
          test "${{ inputs.confirm }}" = "RUN_ONCE"
          case "${{ inputs.mode }}" in
            full|article_validation|pending_retry_validation|ready_rescue_validation|production_e2e_validation|stale_ready_batch_revalidation|local_skills_canary_validation|local_skills_production_validation) ;;
            *) echo "::error::Unknown ONE-SHOT mode"; exit 1 ;;
          esac
          case "${{ inputs.editorial_style }}" in
            classic|human_narrative|duo_narrative) ;;
            *) echo "::error::Unknown editorial style"; exit 1 ;;
          esac
          case "${{ inputs.excluded_models }}" in
            ""|gemini-3.5-flash|gemini-3.6-flash|gemini-3.7-flash|gemini-3.8-flash) ;;
            *) echo "::error::Unknown run-scoped Gemini exclusion"; exit 1 ;;
          esac
          if [ -n "${{ inputs.exact_target }}" ] && [ "${{ inputs.mode }}" != "article_validation" ]; then echo "::error::exact_target is article_validation-only"; exit 1; fi
          if [ "${{ inputs.e2e_prepare_only }}" = "true" ] && [ "${{ inputs.mode }}" != "production_e2e_validation" ]; then echo "::error::e2e_prepare_only is production_e2e_validation-only"; exit 1; fi
          echo "Manual one-shot confirmed. mode=${{ inputs.mode }} editorial_style=${{ inputs.editorial_style }} excluded_models=${{ inputs.excluded_models }}. Automatic triggers are intentionally absent."

      - name: リポジトリのチェックアウト
        if: ${{ inputs.mode != 'local_skills_canary_validation' }}
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Local Skills canary branchをチェックアウト
        if: ${{ inputs.mode == 'local_skills_canary_validation' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Python環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 最小限の依存ライブラリのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zero-API temporary provider exclusion falsification
        run: python -m unittest tests.test_temporary_provider_exclusion -v

      - name: 通常Production entrypointを1回だけ実行
        if: ${{ inputs.mode == 'full' || inputs.mode == 'article_validation' || inputs.mode == 'ready_rescue_validation' || inputs.mode == 'production_e2e_validation' || inputs.mode == 'stale_ready_batch_revalidation' || inputs.mode == 'local_skills_canary_validation' || inputs.mode == 'local_skills_production_validation' }}
        run: python production_pipeline.py
        env:
          TZ: 'Asia/Tokyo'
          AIIF_RUN_MODE: ${{ inputs.mode }}
          AIIF_LOCAL_SKILLS_CANARY: ${{ inputs.mode == 'local_skills_canary_validation' }}
          AIIF_LOCAL_SKILLS_PRODUCTION_VALIDATION: ${{ inputs.mode == 'local_skills_production_validation' }}
          PRODUCTION_E2E_PREPARE_ONLY: ${{ inputs.e2e_prepare_only }}
          AIIF_X_DISCOVERY_ENABLED: ${{ inputs.mode == 'full' }}
          APIFY_TOKEN: ${{ inputs.mode == 'full' && secrets.APIFY_TOKEN || '' }}
          APIFY_ACTOR_ID: "simple.actor~x-profile-posts"
          APIFY_MAX_CHARGE_USD: "0.05"
          X_DISCOVERY_MAX_RECORDS: "100"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2026-03-11"
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
