          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: "2026-03-11"
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          ENABLE_REVENUE_PRODUCT_PHASE2: ${{ vars.ENABLE_REVENUE_PRODUCT_PHASE2 || 'true' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          ENABLE_SUBSCRIBER_TECH_SYNC: ${{ vars.ENABLE_SUBSCRIBER_TECH_SYNC || 'false' }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          TRACKING_REVIEW_DAYS: "14"
          DAILY_PORTFOLIO_REVIEW_MAX: "2"
          DAILY_PORTFOLIO_REQUEST_BUDGET: "3"
          DAILY_PORTFOLIO_SCAN_LIMIT: "12"
          PORTFOLIO_DIVERSITY_TOLERANCE: "8"
          GEMINI_PERSISTENT_DAILY_COUNTER: "true"
          GEMINI_COUNTER_BRANCH: "main"
          GEMINI_QUOTA_TIMEZONE: "America/Los_Angeles"
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: "450"
          GEMINI_36_FLASH_DAILY_BUDGET: "18"
          GEMINI_37_FLASH_DAILY_BUDGET: "18"
          GEMINI_38_FLASH_DAILY_BUDGET: "18"
          GEMINI_35_FLASH_DAILY_BUDGET: "18"
          GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: "gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash,gemini-3.5-flash"

      - name: API-saving mode guard
        if: ${{ inputs.mode != 'full' }}
        run: |
          echo "${{ inputs.mode }} mode: separate Product Review intentionally skipped."

      - name: Resolve current-run delivery causality
        id: delivery
        if: ${{ success() && inputs.mode != 'pending_retry_validation' && inputs.mode != 'production_e2e_validation' && inputs.mode != 'local_skills_canary_validation' && inputs.mode != 'local_skills_production_validation' }}
        run: |
          python run624_delivery_causality.py \
            --gate-history-dir gate_history \
            --github-output "$GITHUB_OUTPUT"

      - name: 月次ダイジェストをPrivate Artifactとして保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-digest-${{ github.run_number }}
          path: monthly_digests/
          if-no-files-found: ignore
          retention-days: 90

      - name: Gate履歴・内部レビュー候補を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-gate-review-${{ github.run_number }}
          path: |
            review_candidates/
            quality_failures/
            gate_history/
            regression_cases_pending/
            article_audit/
            regen_test_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Explicit post-run fan-out with GH_PAT
        if: ${{ success() }}
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DELIVERY_AUDIT_VALID: ${{ steps.delivery.outputs.audit_valid }}
          DELIVERY_READY_COUNT: ${{ steps.delivery.outputs.ready_count }}
          DELIVERY_CREATE_PRIVATE_DRAFT: ${{ steps.delivery.outputs.create_private_draft }}
          DELIVERY_TARGET_SOURCE_URL: ${{ steps.delivery.outputs.target_source_url }}
          DELIVERY_TARGET_SOURCE_URLS_B64: ${{ steps.delivery.outputs.target_source_urls_b64 }}
        run: |
          set -u
          if [ "${VALIDATION_MODE:-}" = "pending_retry_validation" ]; then
            echo "Non-persistent Pending Retry validation: downstream synchronization skipped."
            exit 0
          fi
          if [ "${VALIDATION_MODE:-}" = "local_skills_canary_validation" ]; then
            echo "Local Skills fresh canary is measurement-only: downstream synchronization skipped."
            exit 0
          fi
          if [ "${VALIDATION_MODE:-}" = "local_skills_production_validation" ]; then
            echo "Local Skills Production validation persists the article/Ready state but forbids downstream note synchronization in this stage."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT is required for authoritative ONE-SHOT downstream fan-out"
            exit 1
          fi
          failed=0
          dispatch_all_current_run_ready() {
            local expected_count="$1"
            local create_private_draft="$2"
            local encoded="${DELIVERY_TARGET_SOURCE_URLS_B64:-}"
            if [ "$expected_count" -eq 0 ]; then
              gh workflow run note-ready-sync.yml --ref main -f create_private_draft=false
              return $?
            fi
            if [ "$create_private_draft" != "true" ]; then
              echo "::error::Current-run Ready fan-out is disabled despite Ready output"
              return 1
            fi
            if [ -z "$encoded" ] && [ "$expected_count" -eq 1 ] && [ -n "${DELIVERY_TARGET_SOURCE_URL:-}" ]; then
              echo "Using legacy single-target causality transport for one Ready article."
              local -a target_source_urls=("${DELIVERY_TARGET_SOURCE_URL}")
              gh workflow run note-ready-sync.yml --ref main \
                -f create_private_draft=true \
                -f target_source_url="${target_source_urls[0]}"
              return $?
            fi
            if [ -z "$encoded" ]; then
              echo "::error::Current-run Ready fan-out is missing its complete exact target set"
              return 1
            fi
            local decoded_targets
            if ! decoded_targets="$(TARGETS_B64="$encoded" python - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import urlparse

          raw = os.environ.get("TARGETS_B64", "")
          urls = json.loads(base64.b64decode(raw).decode("utf-8"))
          if not isinstance(urls, list) or not urls:
              raise ValueError("target source URL list is empty or invalid")
          if len(urls) != len(set(urls)):
              raise ValueError("target source URL list contains duplicates")
          for url in urls:
              parsed = urlparse(str(url))
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise ValueError(f"invalid target source URL: {url!r}")
              print(url)
          PY
            )"; then
              echo "::error::Could not decode exact current-run Ready target set"
              return 1
            fi
            local -a target_source_urls=()
            mapfile -t target_source_urls <<< "$decoded_targets"
            if [ "${#target_source_urls[@]}" -ne "$expected_count" ]; then
              echo "::error::Current-run Ready target count mismatch: expected=$expected_count actual=${#target_source_urls[@]}"
              return 1
            fi
            local dispatch_failed=0
            for target_source_url in "${target_source_urls[@]}"; do
              echo "Dispatching note-ready-sync.yml for exact current-run Ready source: $target_source_url"
              if ! gh workflow run note-ready-sync.yml --ref main \
                -f create_private_draft=true \
                -f target_source_url="$target_source_url"; then
                echo "::error::Failed to dispatch note-ready-sync.yml for $target_source_url"
                dispatch_failed=1
              fi
            done
            return "$dispatch_failed"
          }

          if [ "${VALIDATION_MODE:-}" = "ready_rescue_validation" ]; then
            if ! ready_count="$(python - <<'PY'
          import json
          with open("article_audit/ready_rescue_validation.json", encoding="utf-8") as handle:
              result = json.load(handle)
          ready = result["ready"]
          if type(ready) is not int or ready < 0:
              raise ValueError("Ready Rescue audit requires a nonnegative integer ready count")
          print(ready)
          PY
            )"; then
              echo "::error::Ready Rescue audit missing or invalid; downstream fan-out refused"
              exit 1
            fi
            if [ "$ready_count" -eq 0 ]; then
              echo "Ready Rescue produced no Ready article; downstream synchronization skipped."
              exit 0
            fi
            create_private_draft="${DELIVERY_CREATE_PRIVATE_DRAFT:-false}"
            audit_valid="${DELIVERY_AUDIT_VALID:-false}"
            delivery_ready_count="${DELIVERY_READY_COUNT:-0}"
            if [ "$audit_valid" != "true" ] || [ "$create_private_draft" != "true" ] || [ "$delivery_ready_count" -ne "$ready_count" ]; then
              echo "::error::Ready Rescue reported Ready but current-run delivery causality did not preserve the complete exact target set"
              exit 1
            fi
            dispatch_all_current_run_ready "$delivery_ready_count" "$create_private_draft"
            exit $?
          fi
          if [ "${VALIDATION_MODE:-}" = "production_e2e_validation" ]; then
            if ! read -r ready_count sync_id < <(python - <<'PY'
          import json
          with open("article_audit/production_e2e_validation.json", encoding="utf-8") as handle:
              result = json.load(handle)
          ready = result.get("ready")
          sync_id = str(result.get("sync_id") or "").strip()
          if type(ready) is not int or ready not in {0, 1}:
              raise ValueError("Production E2E audit requires ready=0 or 1")
          prepare_only = result.get("prepare_only") is True
          if prepare_only and ready != 0:
              raise ValueError("Production E2E prepare-only must never report Ready")
          if ready == 1 and (len(sync_id) != 32 or any(ch not in "0123456789abcdef" for ch in sync_id.lower())):
              raise ValueError("Production E2E Ready requires an exact 32-hex sync_id")
          print(ready, sync_id)
          PY
            ); then
              echo "::error::Production E2E audit missing or invalid; downstream fan-out refused"
              exit 1
            fi
            if [ "$ready_count" -eq 0 ]; then
              echo "Production E2E produced no Ready article; downstream synchronization skipped."
              exit 0
            fi
            gh workflow run note-ready-sync.yml --ref main \
              -f create_private_draft=true \
              -f target_sync_id="$sync_id"
            exit $?
          fi
          create_private_draft="${DELIVERY_CREATE_PRIVATE_DRAFT:-false}"
          ready_count="${DELIVERY_READY_COUNT:-0}"
          audit_valid="${DELIVERY_AUDIT_VALID:-false}"
          create_private_draft="${create_private_draft:-false}"

          echo "Dispatching note-ready-sync.yml with complete current-run causality: ready_count=${ready_count:-0} create_private_draft=${create_private_draft} audit_valid=${audit_valid:-false}"
          if [ "$audit_valid" != "true" ]; then
            echo "::error::Current-run delivery causality audit is invalid; note draft fan-out refused"
            failed=1
          elif ! dispatch_all_current_run_ready "$ready_count" "$create_private_draft"; then
            failed=1
          fi

          for target in subscriber-decision-brief.yml cross-db-contract-guard.yml; do
            echo "Dispatching ${target} from successful ONE-SHOT via GH_PAT"
            if ! gh workflow run "${target}" --ref main; then
              echo "::error::Failed to dispatch ${target}"
              failed=1
            fi
          done
          {
            echo "### Run624 post-run fan-out"
            echo "- auth: GH_PAT"
            echo "- source: Daily Intelligence & Content Pipeline [ONE-SHOT]"
            echo "- current-run audit valid: ${audit_valid:-false}"
            echo "- current-run Ready count: ${ready_count:-0}"
            echo "- private draft enabled: ${create_private_draft}"
            echo "- private draft current-run targets preserved: ${ready_count:-0}"
            echo "- targets: note-ready-sync.yml, subscriber-decision-brief.yml, cross-db-contract-guard.yml"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
