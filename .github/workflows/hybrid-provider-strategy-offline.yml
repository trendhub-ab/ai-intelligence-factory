name: Hybrid Provider Strategy Offline
on:
  workflow_dispatch:
  push:
    branches: ['dev/hybrid-groq-gemini']
    paths:
      - 'hybrid_provider_strategy.py'
      - 'tests/test_hybrid_provider_strategy.py'
      - '.github/workflows/hybrid-provider-strategy-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run routing regressions
        run: python -m pytest tests/test_hybrid_provider_strategy.py -q
      - name: Prove routing module has no provider SDK or business side effects
        shell: python
        run: |
          import ast, pathlib
          src = pathlib.Path('hybrid_provider_strategy.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          imports=[]
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.append(node.module or '')
          forbidden=('google', 'gemini', 'groq', 'requests', 'urllib', 'notion', 'ai_provider')
          bad=[name for name in imports if any(token in name.lower() for token in forbidden)]
          assert not bad, bad
          for forbidden_text in ('GEMINI_API_KEY', 'GROQ_API_KEY', 'requests.', 'notion'):
              assert forbidden_text not in src
          print({'provider_sdk_imports': bad, 'business_writes': 0})
      - name: Prove default remains Gemini-only and Hybrid does not cross-fallback
        shell: python
        run: |
          from hybrid_provider_strategy import *
          assert resolve_mode({}) == GEMINI_ONLY
          assert route_stage('article_writer', mode=HYBRID_GROQ_GEMINI).provider == 'gemini'
          for stage in ('screening', 'calibration', 'decision_plan'):
              d=route_stage(stage, mode=HYBRID_GROQ_GEMINI)
              assert d.provider == 'groq'
              assert d.allow_cross_provider_fallback is False
          assert_backup_contract()
          print(gemini_call_reduction({'screening': 8, 'calibration': 3, 'decision_plan': 3, 'article_writer': 3}))
      - name: Assert no live credentials
        run: test -z "${GROQ_API_KEY:-}" && test -z "${GEMINI_API_KEY:-}"