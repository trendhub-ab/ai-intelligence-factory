name: Hybrid Provider Strategy Offline
on:
  workflow_dispatch:
  push:
    branches: ['dev/hybrid-groq-gemini']
    paths:
      - 'hybrid_provider_strategy.py'
      - 'hybrid_groq_plan.py'
      - 'hybrid_gemini_writer.py'
      - 'hybrid_one_shot.py'
      - 'hybrid_live_plan_writer.py'
      - 'hybrid_writer_deferred.py'
      - 'hybrid_writer_state_store.py'
      - 'hybrid_writer_runtime.py'
      - 'hybrid_writer_package.py'
      - 'tests/fixtures/groq/two_pass_v3_plan_safe_report.json'
      - 'tests/test_hybrid_writer_package.py'
      - 'tests/test_hybrid_provider_strategy.py'
      - 'tests/test_hybrid_gemini_writer.py'
      - 'tests/test_hybrid_one_shot.py'
      - 'tests/test_hybrid_live_plan_writer.py'
      - 'tests/test_hybrid_writer_deferred.py'
      - 'tests/test_hybrid_writer_state_store.py'
      - 'tests/test_hybrid_writer_runtime.py'
      - '.github/workflows/hybrid-one-shot-live.yml'
      - '.github/workflows/hybrid-live-plan-writer-e2e.yml'
      - '.github/workflows/hybrid-provider-strategy-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Run Hybrid routing, writer, live-plan, deferral, state-store and runtime regressions
        run: python -m pytest tests/test_hybrid_provider_strategy.py tests/test_hybrid_gemini_writer.py tests/test_hybrid_one_shot.py tests/test_hybrid_live_plan_writer.py tests/test_hybrid_writer_deferred.py tests/test_hybrid_writer_state_store.py tests/test_hybrid_writer_runtime.py tests/test_hybrid_writer_package.py -q
      - name: Prove routing modules avoid provider SDK and business persistence
        shell: python
        run: |
          import ast, pathlib
          for path in ('hybrid_provider_strategy.py', 'hybrid_gemini_writer.py', 'hybrid_one_shot.py', 'hybrid_live_plan_writer.py', 'hybrid_writer_deferred.py', 'hybrid_writer_state_store.py', 'hybrid_writer_runtime.py'):
              src = pathlib.Path(path).read_text(encoding='utf-8')
              tree = ast.parse(src)
              imports=[]
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.append(node.module or '')
              forbidden=('google', 'notion_client')
              bad=[name for name in imports if any(token in name.lower() for token in forbidden)]
              assert not bad, (path, bad)
              for forbidden_text in ('GEMINI_API_KEY', 'GROQ_API_KEY', 'create_page(', 'update_page(', 'note.com'):
                  assert forbidden_text not in src, (path, forbidden_text)
          print({'provider_sdk_direct_imports': [], 'business_writes': 0})
      - name: Prove default remains Gemini-only and Hybrid does not cross-fallback
        shell: python
        run: |
          from hybrid_provider_strategy import *
          assert resolve_mode({}) == GEMINI_ONLY
          assert route_stage('article_writer', mode=HYBRID_GROQ_GEMINI).provider == 'gemini'
          for stage in ('screening', 'calibration', 'decision_plan'):
              d=route_stage(stage, mode=HYBRID_GROQ_GEMINI)
              assert d.provider == 'groq'
              assert d.allow_cross_provider_fallback is False
          print({'default':GEMINI_ONLY,'hybrid_no_cross_fallback':True})
      - name: Assert no live credentials
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
