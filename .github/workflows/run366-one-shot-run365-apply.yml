name: Run366 One-Shot Run365 Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/run366-apply-run365.txt'

permissions:
  contents: read

concurrency:
  group: run366-one-shot-run365-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full main history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify one-shot marker and change boundary
        shell: bash
        run: |
          set -euo pipefail
          expected='RUN366_ONE_SHOT_APPLY_7_20260912_b84e5c21'
          actual="$(tr -d '\r\n' < .github/triggers/run366-apply-run365.txt)"
          test "$actual" = "$expected"
          changed="$(git diff --name-only HEAD^1 HEAD | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx '.github/triggers/run366-apply-run365.txt'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/run366-one-shot-run365-apply.yml'
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" = '2'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: pip install requests

      - name: Re-run zero-provider recovery guards
        run: |
          python -m unittest tests.test_run365_historical_ready_rebase -v
          python -m unittest tests.test_run364_historical_ready_rebase -v
          python -m unittest tests.test_run361_byte_preserving_ready_rebase -v
          python -m unittest tests.test_product_review_provider_lock -v
          python -m unittest tests.test_comment_write_contract -v

      - name: Apply exactly seven Run362-v2-proven Ready rows
        env:
          AIIF_RUN365_MODE: apply
          AIIF_RUN365_CONFIRM: REBASE_RUN362_VALID_7
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run365_historical_ready_rebase.py

      - name: Reconcile Note Ready after verified byte-preserving apply
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python note_ready_sync.py

      - name: Upload private apply audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run366-ready-apply-${{ github.run_id }}
          path: gate_history/run365_historical_ready_rebase_report.json
          if-no-files-found: error
          retention-days: 14
