name: V3 Elastic One-Shot C Proof
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter RUN_ELASTIC_ONCE; one Gemini invocation, no retries'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_ELASTIC_ONCE' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable reviewed experiment commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 7d7e86fc48ecb8e59976a4ad6ec43603f7534f2c
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2' 'google-genai>=1.56.0,<2.0.0'
      - name: Validate V3 contract offline
        run: python -m pytest -q tests/test_editorial_engine_v3_phase0_quality_contract.py
      - name: Generate one Elastic article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_ELASTIC_ONE_SHOT_CONFIRM: ELASTIC_ONE_SHOT
        run: python -m experiments.editorial_engine_v3_phase0.elastic_one_shot
      - name: Upload human review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: elastic-one-shot-review
          path: elastic_one_shot/
          if-no-files-found: warn
          retention-days: 7
