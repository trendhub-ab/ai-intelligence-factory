name: Audit existing note Private Draft

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AUDIT_NOTE_DRAFT (read-only; no draft creation or public release)'
        required: true
        type: string
      sync_id:
        description: 'Exact Content Intelligence sync ID already in 投稿準備中'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-private-draft-audit
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_start_vm: ${{ steps.decision.outputs.should_start_vm }}
      selected_sync_id: ${{ steps.decision.outputs.selected_sync_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zero-browser dependency
        run: pip install requests

      - name: Run291/292 zero-VM contract tests
        run: |
          python -m unittest tests.test_run291_private_draft_audit -v
          python -m unittest tests.test_run292_note_rendered_body_audit -v

      - name: Validate exact existing private draft state before VM start
        env:
          NOTE_AUDIT_CONFIRM: ${{ inputs.confirm }}
          NOTE_TARGET_SYNC_ID: ${{ inputs.sync_id }}
          NOTE_AUDIT_PREPARE_ONLY: 'true'
          NOTE_AUDIT_RESULT_FILE: ${{ runner.temp }}/run291-preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: python run291_note_private_draft_audit.py

      - name: Export read-only VM decision
        id: decision
        env:
          RESULT_FILE: ${{ runner.temp }}/run291-preflight.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if result.get('status') != 'audit_ready' or result.get('read_only') is not True:
              raise SystemExit('Run291 preflight did not establish a read-only audit target')
          if result.get('zero_gemini_calls') is not True or result.get('draft_mutation') is not False:
              raise SystemExit('Run291 preflight lost its zero-model/read-only contract')
          selected = str(result.get('sync_id') or '').strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('should_start_vm=true\n')
              fh.write(f'selected_sync_id={selected}\n')
          PY

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.should_start_vm == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo 'Persistent note VM is running for a read-only draft audit.'

  audit-private-draft:
    if: ${{ needs.preflight.outputs.should_start_vm == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install read-only browser audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || {
            echo '::error::Google Chrome is not installed on the persistent note VM.'
            exit 1
          }
          command -v xvfb-run >/dev/null 2>&1 || {
            echo '::error::xvfb-run is not installed on the persistent note VM.'
            exit 1
          }

      - name: Run291/292 read-only regression tests
        run: |
          python -m unittest tests.test_run291_private_draft_audit -v
          python -m unittest tests.test_run292_note_rendered_body_audit -v

      - name: Audit exact existing private draft without mutation
        env:
          NOTE_AUDIT_CONFIRM: ${{ inputs.confirm }}
          NOTE_TARGET_SYNC_ID: ${{ needs.preflight.outputs.selected_sync_id }}
          NOTE_AUDIT_PREPARE_ONLY: 'false'
          NOTE_AUDIT_RESULT_FILE: ${{ runner.temp }}/run292-result.json
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: xvfb-run -a python run292_note_rendered_body_audit.py

      - name: Summarize non-content audit metrics only
        if: ${{ always() }}
        env:
          RESULT_FILE: ${{ runner.temp }}/run292-result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RESULT_FILE'])
          if not path.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write('### Run292 private note draft read-only audit\n')
                  fh.write('- result: `FAIL-CLOSED`\n')
                  fh.write('- safe diagnostic result file: `missing`\n')
                  fh.write('- unpublished content / draft URL exposed: `false`\n')
              raise SystemExit(0)
          result = json.loads(path.read_text(encoding='utf-8'))
          passed = result.get('status') == 'audit_passed'
          safe_keys = [
              'diagnostic_code', 'expectation_mode',
              'title_match', 'eyecatch_present', 'body_h1_count', 'heading_count',
              'paragraph_count', 'list_item_count', 'link_count', 'blockquote_count',
              'body_visible_chars', 'expected_visible_chars', 'legacy_expected_visible_chars',
              'renderer_delta_chars', 'renderer_delta_ratio', 'visible_length_ratio',
              'prefix_match', 'suffix_match', 'exact_visible_match',
              'expected_contained_in_actual', 'actual_contained_in_expected',
              'common_prefix_ratio', 'common_suffix_ratio',
              'sources_present', 'cta_present', 'sources_before_cta',
              'duplicate_title_prefix', 'code_fence_marker_count',
              'title_box', 'body_box', 'history_candidate_count',
              'matched_history_rank', 'editor_route_hash'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run292 private note draft read-only audit\n')
              fh.write(f'- result: `{"PASS" if passed else "FAIL-CLOSED"}`\n')
              fh.write(f'- zero Gemini calls: `{result.get("zero_gemini_calls") is True}`\n')
              fh.write(f'- draft mutation: `{result.get("draft_mutation") is True}`\n')
              fh.write(f'- public release: `{result.get("public_release") is True}`\n')
              fh.write('- unpublished content / draft URL exposed: `false`\n')
              for key in safe_keys:
                  if key in result:
                      fh.write(f'- {key}: `{result.get(key)}`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, audit-private-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - name: Authenticate to Google Cloud with OIDC
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Stop persistent note Chrome VM
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
          echo 'Persistent note VM stop check completed after read-only audit.'
