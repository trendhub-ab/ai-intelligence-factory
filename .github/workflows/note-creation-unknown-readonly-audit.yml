name: P0-B Creation Unknown Read-Only Audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# The same single-writer lock as the private-draft workflow. Do not inspect
# browser/ledger concurrently with an ongoing attempt.
concurrency:
  group: note-draft-create-v2
  cancel-in-progress: false

jobs:
  start-cloud-vm:
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      github.event.comment.body == '/aiif note audit creation_unknown 40a479ffdca981efb47bc5fe5fee1da9'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Validate cloud controller configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_NOTE_VM_ZONE GCP_NOTE_VM_NAME GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GH_TOKEN; do
            test -n "${!name:-}" || { echo "::error::Missing required controller configuration: $name"; exit 1; }
          done
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Start existing persistent note VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
      - name: Require exactly one online note runner
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" --jq '[.runners[] | select(.status == "online") | select(any(.labels[]?; .name == "aiif-note-cloud"))] | length' 2>/dev/null || true)"
            count="${count:-0}"
            [ "$count" -gt 1 ] 2>/dev/null && { echo "::error::Multiple note runners online"; exit 1; }
            [ "$count" -eq 1 ] 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Exactly one online note runner is required"
          exit 1

  read-only-audit:
    needs: start-cloud-vm
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install audit-only dependencies
        run: |
          python -m pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1
          command -v xvfb-run >/dev/null 2>&1
      - name: Audit exactly one prior CREATION_UNKNOWN without any mutation
        env:
          NOTE_RECOVERY_CONFIRM: AUDIT_CREATION_UNKNOWN
          NOTE_TARGET_SYNC_ID: '40a479ffdca981efb47bc5fe5fee1da9'
          NOTE_TARGET_IDENTITY: 'trendhub_biz'
          NOTE_DELIVERY_LEDGER_PATH: '~/.aiif-note/delivery-ledger-v1.sqlite3'
          NOTE_RECOVERY_PREPARE_ONLY: 'false'
          NOTE_RECOVERY_RESULT_FILE: ${{ runner.temp }}/creation_unknown_readonly.json
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          xvfb-run -a python note_delivery_creation_recovery.py
      - name: Summarize sanitized result only
        if: ${{ always() }}
        env:
          RESULT: ${{ runner.temp }}/creation_unknown_readonly.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RESULT"])
          output = {"result": "no_readonly_result"}
          if p.is_file():
              data = json.loads(p.read_text(encoding="utf-8"))
              output = {
                  "status": str(data.get("status") or "unknown"),
                  "read_only": data.get("read_only") is True,
                  "match_count": int(data.get("match_count") or 0),
                  "history_candidate_count": int(data.get("history_candidate_count") or 0),
                  "zero_gemini_calls": data.get("zero_gemini_calls") is True,
                  "draft_mutation": data.get("draft_mutation") is True,
                  "public_release": data.get("public_release") is True,
              }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### P0-B creation-unknown read-only audit\n")
              for key, val in output.items():
                  f.write(f"- {key}: `{val}`\n")
          PY
          # The private result includes a draft identity if one is found. Never upload it.

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [start-cloud-vm, read-only-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop existing note VM after audit
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
