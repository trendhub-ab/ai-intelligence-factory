name: Run160 Scoped Eyecatch Patch

on:
  push:
    branches:
      - fix/run160-public-eyecatch-unification

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message == 'chore: bootstrap Run160 patch workflow'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/run160-public-eyecatch-unification
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply scoped Run160 patch
        run: python run160_apply_patch.py

      - name: Focused eyecatch regression
        run: |
          python -m unittest tests.test_run150_dual_eyecatch tests.test_run160_public_eyecatch_unification

      - name: Full unittest regression
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Synthetic smoke regression
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: smoke
        run: python pipeline.py

      - name: Commit validated patch and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm run160_apply_patch.py .github/workflows/run160-apply-eyecatch-fix.yml
          git add pipeline.py tests/test_run150_dual_eyecatch.py tests/test_run160_public_eyecatch_unification.py
          git commit -m 'Run160: unify public eyecatch on Editorial design'
          git push origin HEAD:fix/run160-public-eyecatch-unification
