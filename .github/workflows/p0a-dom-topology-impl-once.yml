name: P0-A DOM Topology Diagnostics Implement Once

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-dom-topology-impl-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/p0-a-note-lossless-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add content-free parent-child topology counts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('note_document_dom.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "    tag_counts: dict[str, int] = {}\n    element_count = 0\n",
              "    tag_counts: dict[str, int] = {}\n    edge_counts: dict[str, int] = {}\n    element_count = 0\n",
              1,
          )
          s = s.replace(
              "    def walk(node: object) -> None:\n",
              "    def walk(node: object, parent_tag: str = 'root') -> None:\n",
              1,
          )
          s = s.replace(
              "            for child in children:\n                walk(child)\n            return\n",
              "            for child in children:\n                walk(child, 'root')\n            return\n",
              1,
          )
          anchor = "        tag_counts[tag] = tag_counts.get(tag, 0) + 1\n\n        children = node.get('children')\n"
          replacement = "        tag_counts[tag] = tag_counts.get(tag, 0) + 1\n        edge = f'{parent_tag}>{tag}'\n        edge_counts[edge] = edge_counts.get(edge, 0) + 1\n\n        children = node.get('children')\n"
          if anchor not in s:
              raise SystemExit('tag-count anchor missing')
          s = s.replace(anchor, replacement, 1)
          s = s.replace(
              "        for child in children:\n            walk(child)\n\n    walk(snapshot)\n",
              "        for child in children:\n            walk(child, tag)\n\n    walk(snapshot)\n",
              1,
          )
          return_anchor = "        'dom_tag_counts': ordered_counts,\n        'snapshot_element_node_count': element_count,\n"
          return_replacement = "        'dom_tag_counts': ordered_counts,\n        'dom_parent_child_tag_counts': dict(sorted(edge_counts.items())),\n        'snapshot_element_node_count': element_count,\n"
          if return_anchor not in s:
              raise SystemExit('return anchor missing')
          s = s.replace(return_anchor, return_replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile note_document_dom.py
          python -m pip install 'pytest==8.4.2' >/dev/null
          python -m pytest -q tests/test_p0a_dom_topology_diagnostics.py tests/test_note_document_dom.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add note_document_dom.py
          git commit -m 'feat: add content-free note DOM topology diagnostics'
          git push origin HEAD:design/p0-a-note-lossless-contract
