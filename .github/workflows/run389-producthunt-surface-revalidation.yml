name: Run389 Migrated Article Surface Revalidation [MANUAL ONLY]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Safety contract
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/run367-readonly-audit-reader-conflict"
          echo 'Run389: Notion GET only; no Gemini key, no Notion writes, no Note Ready sync, no publication.'

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Zero-model contract tests
        run: |
          python -m pytest tests/test_run389_producthunt_surface_revalidation.py -q
          python -m pytest tests/test_run388_zero_model_full_gate_preflight.py -q

      - name: Revalidate five stored migrated manuscripts read-only
        run: python run389_producthunt_surface_revalidation.py | tee /tmp/run389.txt
        env:
          TZ: 'Asia/Tokyo'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'

      - name: Summary
        if: always()
        run: |
          {
            echo '### Run389 Migrated Article Surface Revalidation'
            echo '- Gemini/provider credentials supplied: `false`'
            echo '- Notion access: `GET only`'
            echo '- Notion writes: `0`'
            echo '- Note Ready sync: `false`'
            echo '- publication: `false`'
            if test -f /tmp/run389.txt; then
              echo '```'
              grep '^RUN389_' /tmp/run389.txt || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run389-surface-revalidation
          path: gate_history/run389_producthunt_surface_revalidation.json
          if-no-files-found: ignore
          retention-days: 14
