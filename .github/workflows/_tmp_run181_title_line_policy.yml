name: TEMP Run181 Title Line Policy

on:
  push:
    branches:
      - run181-two-line-preferred-three-line-fallback
    paths:
      - tools/_tmp_apply_run181_title_line_policy.py
      - .github/workflows/_tmp_run181_title_line_policy.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: run181-two-line-preferred-three-line-fallback
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python tools/_tmp_apply_run181_title_line_policy.py

      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run180_eyecatch_semantic_layout.py run181_eyecatch_visual_balance.py docs/reference/RUN181_EYECATCH_IMPACT_HIERARCHY.md AI_Intelligence_Factory_最終仕様書.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: prefer two-line eyecatches with three-line fallback"
            git push origin HEAD:run181-two-line-preferred-three-line-fallback
          fi
