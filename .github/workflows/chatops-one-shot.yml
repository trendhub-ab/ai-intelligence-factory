name: AIIF ChatOps ONE-SHOT Bridge

# Safe bridge from the dedicated GitHub control issue to reviewed manual workflows.
# This workflow never runs Production directly, never resumes Daily, and never opens note.com.
# Dispatch intentionally uses GH_PAT instead of github.token so downstream events remain chainable.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: aiif-chatops-one-shot-control
  cancel-in-progress: false

jobs:
  authorize-and-dispatch:
    # Defense layer 1: reject every event except an exact command from the repository owner
    # on the dedicated non-PR control issue. Manual re-runs are blocked by run_attempt == 1.
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      (github.event.comment.body == '/aiif run article_validation' ||
       github.event.comment.body == '/aiif run pending_retry_validation' ||
       github.event.comment.body == '/aiif run ready_rescue_validation' ||
       github.event.comment.body == '/aiif run production_e2e_validation' ||
       github.event.comment.body == '/aiif run production_e2e_preflight' ||
       github.event.comment.body == '/aiif run full' ||
       github.event.comment.body == '/aiif run local_skills_canary_validation' ||
       github.event.comment.body == '/aiif run local_skills_canary_github' ||
       github.event.comment.body == '/aiif run local_skills_canary_hackernews' ||
       github.event.comment.body == '/aiif run local_skills_canary_arxiv' ||
       github.event.comment.body == '/aiif run local_skills_canary_officialvendor' ||
       github.event.comment.body == '/aiif run local_skills_production_validation' ||
       github.event.comment.body == '/aiif run x_discovery_stage2' ||
       github.event.comment.body == '/aiif run stale_ready_portfolio_audit' ||
       startsWith(github.event.comment.body, '/aiif run article_validation ') ||
       startsWith(github.event.comment.body, '/aiif eyecatch finalize ') ||
       startsWith(github.event.comment.body, '/aiif note body_resync ') ||
       startsWith(github.event.comment.body, '/aiif note cover_apply '))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main safety contract
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run zero-API ChatOps adversarial tests
        run: python -m unittest tests.test_run202_chatops_control -v

      - name: Re-authorize event fail-closed
        id: auth
        run: python run202_chatops_control.py

      - name: Require successful second authorization
        env:
          AUTHORIZED: ${{ steps.auth.outputs.authorized }}
          MODE: ${{ steps.auth.outputs.mode }}
          TARGET_SYNC_ID: ${{ steps.auth.outputs.target_sync_id }}
        run: |
          set -euo pipefail
          test "$AUTHORIZED" = "true"
          case "$MODE" in
            article_validation|pending_retry_validation|ready_rescue_validation|production_e2e_validation|production_e2e_preflight|full|local_skills_canary_validation|local_skills_canary_github|local_skills_canary_hackernews|local_skills_canary_arxiv|local_skills_canary_officialvendor|local_skills_production_validation|x_discovery_stage2|stale_ready_portfolio_audit) ;;
            article_validation_exact|ready_eyecatch_finalize|ready_note_body_resync|ready_note_cover_apply)
              [[ "$TARGET_SYNC_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::Invalid exact sync_id"; exit 1; }
              ;;
            *) echo "::error::Unexpected ChatOps mode"; exit 1 ;;
          esac

      - name: Dispatch reviewed manual workflow exactly once
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MODE: ${{ steps.auth.outputs.mode }}
          TARGET_SYNC_ID: ${{ steps.auth.outputs.target_sync_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT is required for ChatOps ONE-SHOT dispatch so downstream workflow_run fan-out is not suppressed"
            exit 1
          fi
          case "$MODE" in
            article_validation)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"article_validation","editorial_style":"human_narrative","confirm":"RUN_ONCE"}}'
              ;;
            article_validation_exact)
              target='daily-one-shot.yml'
              payload="$(printf '{"ref":"main","inputs":{"mode":"article_validation","editorial_style":"human_narrative","exact_target":"%s","confirm":"RUN_ONCE"}}' "$TARGET_SYNC_ID")"
              ;;
            pending_retry_validation)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"pending_retry_validation","confirm":"RUN_ONCE"}}'
              ;;
            full)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"full","editorial_style":"human_narrative","confirm":"RUN_ONCE"}}'
              ;;
            local_skills_canary_validation)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"local_skills_canary_validation","confirm":"RUN_ONCE"}}'
              ;;
            local_skills_canary_github|local_skills_canary_hackernews|local_skills_canary_arxiv|local_skills_canary_officialvendor)
              target='daily-one-shot.yml'
              case "$MODE" in
                local_skills_canary_github) source='GitHub' ;;
                local_skills_canary_hackernews) source='HackerNews' ;;
                local_skills_canary_arxiv) source='ArXiv' ;;
                local_skills_canary_officialvendor) source='OfficialVendor' ;;
              esac
              payload="$(printf '{"ref":"main","inputs":{"mode":"local_skills_canary_validation","canary_source":"%s","confirm":"RUN_ONCE"}}' "$source")"
              ;;
            local_skills_production_validation)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"local_skills_production_validation","confirm":"RUN_ONCE"}}'
              ;;
            ready_rescue_validation)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"ready_rescue_validation","confirm":"RUN_ONCE"}}'
              ;;
            production_e2e_validation)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"production_e2e_validation","confirm":"RUN_ONCE"}}'
              ;;
            production_e2e_preflight)
              target='daily-one-shot.yml'
              payload='{"ref":"main","inputs":{"mode":"production_e2e_validation","e2e_prepare_only":"true","confirm":"RUN_ONCE"}}'
              ;;
            x_discovery_stage2)
              target='x-discovery-stage2-smoke.yml'
              payload='{"ref":"main"}'
              ;;
            stale_ready_portfolio_audit)
              target='stale-ready-retirement-audit.yml'
              payload='{"ref":"main"}'
              ;;
            ready_eyecatch_finalize)
              target='ready-eyecatch-finalize-once.yml'
              payload="$(printf '{"ref":"main","inputs":{"sync_id":"%s","confirm":"RUN_ONCE"}}' "$TARGET_SYNC_ID")"
              ;;
            ready_note_body_resync)
              target='ready-note-body-resync-once.yml'
              payload="$(printf '{"ref":"main","inputs":{"sync_id":"%s","confirm":"RUN_ONCE"}}' "$TARGET_SYNC_ID")"
              ;;
            ready_note_cover_apply)
              target='ready-note-cover-apply-once.yml'
              payload="$(printf '{"ref":"main","inputs":{"sync_id":"%s","confirm":"RUN_ONCE"}}' "$TARGET_SYNC_ID")"
              ;;
            *)
              echo "::error::Refusing unknown mode"
              exit 1
              ;;
          esac
          printf '%s' "$payload" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${target}/dispatches" \
            --input -
          echo "DISPATCH_TARGET=$target" >> "$GITHUB_ENV"

      - name: Record safe dispatch
        env:
          MODE: ${{ steps.auth.outputs.mode }}
          TARGET_SYNC_ID: ${{ steps.auth.outputs.target_sync_id }}
        run: |
          {
            echo '### AIIF ChatOps dispatch'
            echo '- control issue: #71'
            echo "- requested mode: \`$MODE\`"
            echo "- target: \`${DISPATCH_TARGET}\` on \`main\`"
            if [ -n "$TARGET_SYNC_ID" ]; then echo "- exact sync_id: \`$TARGET_SYNC_ID\`"; fi
            if [ "$MODE" = 'x_discovery_stage2' ] || [ "$MODE" = 'stale_ready_portfolio_audit' ]; then
              echo '- Gemini/Google model credentials passed: `false`'
              echo '- Factory/Notion writes authorized: `false`'
            else
              echo '- confirmation injected: `RUN_ONCE`'
            fi
            echo '- dispatch auth: `GH_PAT`'
            echo '- Daily schedule changed: `false`'
            echo '- public note release performed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
