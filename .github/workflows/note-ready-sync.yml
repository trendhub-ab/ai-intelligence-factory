name: Note Ready Article Sync

on:
  workflow_dispatch:
    inputs:
      create_private_draft:
        description: 'After Ready sync, dispatch private note draft flow only when an exact publish-safe candidate exists'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'pipeline.py'
      - 'production_pipeline.py'
      - 'runtime_layers.py'
      - 'source_normalization.py'
      - 'evidence_context.py'
      - 'reader_experience_signals.py'
      - 'editorial_naturalness.py'
      - 'candidate_identity.py'
      - 'note_manuscript.py'
      - 'publication_source_contract.py'
      - 'gate_reasoning.py'
      - 'screening_protocol.py'
      - 'notion_payloads.py'
      - 'source_document_parsing.py'
      - 'content_generation_protocol.py'
      - 'evidence_sufficiency.py'
      - 'fact_validation_signals.py'
      - 'source_boundary_validation.py'
      - 'business_source_acquisition.py'
      - 'run269_acquisition_precision.py'
      - 'run269_vendor_current_state.py'
      - 'reader_quality_precision.py'
      - 'run260_gemini_model_routing.py'
      - 'run268_business_source_strategy.py'
      - 'run269_business_source_precision.py'
      - 'editorial_eyecatch.py'
      - 'eyecatch_badge_taxonomy.py'
      - 'decision_intelligence.py'
      - 'comment_write_contract.py'
      - 'evidence_authority.py'
      - 'evidence_ledger.py'
      - 'subscription_attribution.py'
      - 'reader_value_review_bridge.py'
      - 'run208_reader_value_repair.py'
      - 'run172_production_reliability.py'
      - 'run173_operational_yield.py'
      - 'run174_monthly_digest_integrity.py'
      - 'run175_semantic_fact_precision.py'
      - 'run223_technical_claim_precision.py'
      - 'run283_numeric_evidence_equivalence.py'
      - 'run284_reader_recovery_precision.py'
      - 'run287_publication_date_provenance.py'
      - 'run285_operational_accounting.py'
      - 'run224_multiplier_deterministic_rescue.py'
      - 'run227_japanese_surface_integrity.py'
      - 'run176_scope_fidelity.py'
      - 'run177_paid_funnel_alignment.py'
      - 'run226_reader_delight_planning.py'
      - 'run228_reader_rhythm_planning.py'
      - 'run178_eyecatch_editorial_layout_optimizer.py'
      - 'run179_eyecatch_font_refinement.py'
      - 'run180_eyecatch_semantic_layout.py'
      - 'run181_eyecatch_visual_balance.py'
      - 'run182_eyecatch_conclusion_emphasis.py'
      - 'run183_eyecatch_emphasis_scale.py'
      - 'run222_note_presentation_integrity.py'
      - 'run296_editorial_format_v2.py'
      - 'run248_first_real_publish_quality_calibration.py'
      - 'run249_final_publication_surface_gate.py'
      - 'publication_contract.py'
      - 'run194_publication_contract.py'
      - 'run280_publication_dependency_guard.py'
      - 'note_ready_sync.py'
      - 'run199_note_vm_preflight.py'
      - 'tests/test_note_ready_sync.py'
      - 'tests/test_run194_note_ready_workflow.py'
      - 'tests/test_run197_note_ready_policy_reconciliation.py'
      - 'tests/test_run222_note_presentation_integrity.py'
      - 'tests/test_run223_technical_claim_precision.py'
      - 'tests/test_run283_numeric_evidence_equivalence.py'
      - 'tests/test_run284_reader_recovery_precision.py'
      - 'tests/test_run285_operational_accounting.py'
      - 'tests/test_run287_publication_date_provenance.py'
      - 'tests/test_run224_multiplier_deterministic_rescue.py'
      - 'tests/test_run226_reader_delight_planning.py'
      - 'tests/test_run227_japanese_surface_integrity.py'
      - 'tests/test_run228_reader_rhythm_planning.py'
      - 'tests/test_run248_first_real_publish_quality_calibration.py'
      - 'tests/test_run249_final_publication_surface_gate.py'
      - 'tests/test_run280_publication_dependency_guard.py'
      - 'tests/test_run281_publication_causality_source_contract.py'
      - 'tests/test_run296_editorial_format_v2.py'
      - '.github/workflows/note-ready-sync.yml'

permissions:
  contents: read

concurrency:
  group: note-ready-article-sync
  cancel-in-progress: false

jobs:
  sync-note-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: pip install requests

      - name: Zero-API unit tests
        run: |
          python -m unittest tests.test_note_ready_sync -v
          python -m unittest tests.test_run194_note_ready_workflow -v
          python -m unittest tests.test_run197_note_ready_policy_reconciliation -v
          python -m unittest tests.test_run222_note_presentation_integrity -v
          python -m unittest tests.test_run223_technical_claim_precision -v
          python -m unittest tests.test_run283_numeric_evidence_equivalence -v
          python -m unittest tests.test_run284_reader_recovery_precision -v
          python -m unittest tests.test_run285_operational_accounting -v
          python -m unittest tests.test_run287_publication_date_provenance -v
          python -m unittest tests.test_run224_multiplier_deterministic_rescue -v
          python -m unittest tests.test_run227_japanese_surface_integrity -v
          python -m unittest tests.test_run228_reader_rhythm_planning -v
          python -m unittest tests.test_run249_final_publication_surface_gate -v
          python -m unittest tests.test_run273_reader_draft_autoflow -v
          python -m unittest tests.test_run280_publication_dependency_guard -v
          python -m unittest tests.test_run281_publication_causality_source_contract -v
          python -m unittest tests.test_run296_editorial_format_v2 -v

      - name: Sync complete current-policy Ready articles to note posting DB
        run: python note_ready_sync.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'

      - name: Resolve exact private-draft fan-out eligibility
        id: fanout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_private_draft == true }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          python - <<'PY'
          import os
          import run199_note_vm_preflight as preflight
          result = preflight.preflight("")
          eligible = result.get("status") == "eligible_ready" and result.get("should_start_vm") is True
          selected = str(result.get("selected_sync_id") or "").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"eligible={'true' if eligible else 'false'}\n")
              fh.write(f"selected_sync_id={selected}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Run281 draft fan-out causality\n")
              fh.write(f"- exact eligible Ready exists: `{eligible}`\n")
              fh.write(f"- preflight status: `{result.get('status', 'unknown')}`\n")
              if not eligible:
                  fh.write("- Child Create note Draft workflow was not dispatched.\n")
          PY

      - name: Dispatch private note draft flow only for an exact eligible Ready
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_private_draft == true && steps.fanout.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SELECTED_SYNC_ID: ${{ steps.fanout.outputs.selected_sync_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT is required to dispatch the private note draft workflow"
            exit 1
          fi
          if [ -z "${SELECTED_SYNC_ID:-}" ]; then
            echo "::error::Run281 fan-out preflight did not pin an eligible sync_id"
            exit 1
          fi
          gh workflow run note-create-draft.yml --ref main \
            -f confirm=CREATE_NOTE_DRAFT \
            -f sync_id="$SELECTED_SYNC_ID" \
            -f prepare_only=false
          {
            echo "### Run281 private draft fan-out"
            echo "- source: exact publish-safe Ready preflight"
            echo "- target: Create note Draft"
            echo "- candidate: pinned by sync_id before dispatch"
            echo "- target workflow repeats zero-VM preflight as defense in depth"
            echo "- publication: private draft only; public release remains human-only"
          } >> "$GITHUB_STEP_SUMMARY"
