name: Note Ready Article Sync

on:
  workflow_dispatch:
    inputs:
      create_private_draft:
        description: 'After Ready sync, dispatch private note draft flow (preflight prevents VM start when no eligible article exists)'
        required: true
        default: true
        type: boolean
  # Publication-policy changes invalidate previously queued manuscript fingerprints.
  # Reconcile the human-facing queue immediately on main instead of waiting for a
  # later production run. Push reconciliation remains zero-model and never opens note.com.
  # Only explicit workflow_dispatch may chain to the separate private-draft workflow.
  push:
    branches: [main]
    paths:
      - 'pipeline.py'
      - 'production_pipeline.py'
      - 'editorial_eyecatch.py'
      - 'decision_intelligence.py'
      - 'evidence_authority.py'
      - 'evidence_ledger.py'
      - 'subscription_attribution.py'
      - 'reader_value_review_bridge.py'
      - 'run208_reader_value_repair.py'
      - 'run172_production_reliability.py'
      - 'run173_operational_yield.py'
      - 'run174_monthly_digest_integrity.py'
      - 'run175_semantic_fact_precision.py'
      - 'run223_technical_claim_precision.py'
      - 'run224_multiplier_deterministic_rescue.py'
      - 'run227_japanese_surface_integrity.py'
      - 'run176_scope_fidelity.py'
      - 'run177_paid_funnel_alignment.py'
      - 'run226_reader_delight_planning.py'
      - 'run228_reader_rhythm_planning.py'
      - 'run178_eyecatch_editorial_layout_optimizer.py'
      - 'run179_eyecatch_font_refinement.py'
      - 'run180_eyecatch_semantic_layout.py'
      - 'run181_eyecatch_visual_balance.py'
      - 'run182_eyecatch_conclusion_emphasis.py'
      - 'run183_eyecatch_emphasis_scale.py'
      - 'run222_note_presentation_integrity.py'
      - 'run248_first_real_publish_quality_calibration.py'
      - 'run249_final_publication_surface_gate.py'
      - 'publication_contract.py'
      - 'run194_publication_contract.py'
      - 'note_ready_sync.py'
      - 'tests/test_note_ready_sync.py'
      - 'tests/test_run194_note_ready_workflow.py'
      - 'tests/test_run197_note_ready_policy_reconciliation.py'
      - 'tests/test_run222_note_presentation_integrity.py'
      - 'tests/test_run223_technical_claim_precision.py'
      - 'tests/test_run224_multiplier_deterministic_rescue.py'
      - 'tests/test_run226_reader_delight_planning.py'
      - 'tests/test_run227_japanese_surface_integrity.py'
      - 'tests/test_run228_reader_rhythm_planning.py'
      - 'tests/test_run248_first_real_publish_quality_calibration.py'
      - 'tests/test_run249_final_publication_surface_gate.py'
      - '.github/workflows/note-ready-sync.yml'

permissions:
  contents: read

concurrency:
  group: note-ready-article-sync
  cancel-in-progress: false

jobs:
  sync-note-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal dependency
        run: pip install requests

      - name: Zero-API unit tests
        # Keep reconciliation itself intentionally minimal. Visual regression is covered by
        # Integration CI; Run197 proves every publication-policy file triggers queue reconciliation.
        # These tests never open note.com or call Gemini.
        run: |
          python -m unittest tests.test_note_ready_sync -v
          python -m unittest tests.test_run194_note_ready_workflow -v
          python -m unittest tests.test_run197_note_ready_policy_reconciliation -v
          python -m unittest tests.test_run222_note_presentation_integrity -v
          python -m unittest tests.test_run223_technical_claim_precision -v
          python -m unittest tests.test_run224_multiplier_deterministic_rescue -v
          python -m unittest tests.test_run227_japanese_surface_integrity -v
          python -m unittest tests.test_run228_reader_rhythm_planning -v
          python -m unittest tests.test_run249_final_publication_surface_gate -v
          python -m unittest tests.test_run273_reader_draft_autoflow -v

      - name: Sync complete current-policy Ready articles to note posting DB
        run: python note_ready_sync.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'

      - name: Dispatch private note draft flow after explicit Ready sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_private_draft == true }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT is required to dispatch the private note draft workflow"
            exit 1
          fi
          gh workflow run note-create-draft.yml --ref main \
            -f confirm=CREATE_NOTE_DRAFT \
            -f prepare_only=false
          {
            echo "### Run273 private draft fan-out"
            echo "- source: explicit Note Ready workflow_dispatch (ONE-SHOT uses this route)"
            echo "- target: Create note Draft"
            echo "- publication: private draft only; public release remains human-only"
            echo "- cost guard: target performs zero-VM preflight before any cloud Chrome start"
          } >> "$GITHUB_STEP_SUMMARY"
