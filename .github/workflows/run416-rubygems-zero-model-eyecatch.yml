name: Run416 one-off RubyGems zero-model eyecatch
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: read
  issues: read
jobs:
  run416:
    if: >-
      github.run_attempt == 1 && github.event.issue.number == 71 &&
      github.event.issue.pull_request == null && github.actor == 'trendhub-ab' &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.event.comment.body == '/aiif run416 ruby-gems-zero-model-eyecatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - name: Render and attach exact RubyGems eyecatch without model calls
        env:
          RUN416_CONFIRM: RUN416_ONEOFF_RUBYGEMS_ZERO_MODEL_EYECATCH
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
        run: python run416_rubygems_zero_model_eyecatch.py
      - name: Dispatch Ready sync with private-draft fan-out
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run note-ready-sync.yml --ref main -f create_private_draft=true
