name: Stale Ready Retirement Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run read-only audit
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_EVIDENCE_LEDGER_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_LEDGER_DATABASE_ID }}
          NOTION_EVIDENCE_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_LEDGER_DATA_SOURCE_ID }}
        run: python stale_ready_retirement_audit.py
      - name: Run zero-API portfolio audit
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_EVIDENCE_LEDGER_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_LEDGER_DATABASE_ID }}
          NOTION_EVIDENCE_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_LEDGER_DATA_SOURCE_ID }}
        run: python stale_ready_zero_api_portfolio_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: stale-ready-retirement-audit
          path: |
            article_audit/stale_ready_retirement_audit.json
            article_audit/stale_ready_zero_api_portfolio_audit.json\n          article_audit/stale_ready_top_fast_path_preflight.json
          retention-days: 7
