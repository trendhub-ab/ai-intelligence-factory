name: Hybrid Live Fact-Locked Groq Plan + Gemini Writer E2E
on:
  workflow_dispatch:
    inputs:
      google_api_approved:
        description: 'Explicitly approve Google/Gemini API use for this one E2E run'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ai-intelligence-hybrid-live-e2e
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ inputs.google_api_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      AIIF_GOOGLE_API_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema

      - name: Build Fact-Locked Groq categorical fixture
        shell: python
        run: |
          import json
          from hybrid_groq_plan import build_hybrid_plan_fixture
          fx=build_hybrid_plan_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'hybrid-live-plan-fixture.json',
          )
          assert fx['pass']=='decision_judgment_codes'
          assert fx['structured_output_mode']=='json_object_local_strict'
          assert fx['fact_envelope']['fact_ledger_sha256']
          assert fx['business_writes']==0 and fx['persist_results'] is False
          print(json.dumps({'candidate_id':fx['candidate_id'],'groq_live_calls_expected':1,'fact_locked':True,'business_writes':0},ensure_ascii=False))

      - name: One guarded live Groq categorical judgment call
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LEDGER_GITHUB_TOKEN: ${{ github.token }}
          AIIF_GROQ_EXPERIMENT: hybrid-live-B0049-plan-${{ github.run_id }}
        shell: python
        run: |
          import json
          from hybrid_groq_plan_live import run_live
          report=run_live('hybrid-live-plan-fixture.json','hybrid-live-plan-report.json')
          assert report['mode']=='hybrid_groq_judgment_fact_locked'
          assert report['status']=='PLAN_VALIDATED'
          assert report['semantic_plan_validated'] is True
          assert report['business_writes']==0 and report['persist_results'] is False
          print(json.dumps({'candidate_id':report['candidate_id'],'fact_envelope_sha256':report['fact_envelope_sha256'],'status':report['status']},ensure_ascii=False))

      - name: Bind exact Evidence to bounded Gemini Writer fixture
        shell: python
        run: |
          import json
          from hybrid_live_plan_writer import build_live_writer_fixture
          from hybrid_groq_plan import load_hybrid_plan_report
          plan=load_hybrid_plan_report('hybrid-live-plan-report.json')
          fx=build_live_writer_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'hybrid-live-plan-report.json',
              'hybrid-live-writer-fixture.json',
          )
          assert fx['plan_source']=='live_groq_report'
          assert fx['fact_envelope_sha256']==fx['decision_package']['plan_report']['fact_envelope_sha256']
          assert fx['provider_calls_expected']=={'groq_live':1,'gemini_live_max':2}
          assert fx['business_writes']==0 and fx['persist_results'] is False
          assert len(fx['writer_prompt'].encode('utf-8')) < 32000
          print(json.dumps({'candidate_id':fx['candidate_id'],'decision':plan['decision'],'writer_prompt_bytes':len(fx['writer_prompt'].encode('utf-8')),'fact_binding':True},ensure_ascii=False))

      - name: Bounded Gemini Writer or durable PENDING_WRITER then full Production gates
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AIIF_RUNTIME_STATE_BRANCH: runtime-state
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: runtime-state
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_38_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: '2'
          SYNTHETIC_REGRESSION_MODE: 'false'
        shell: python
        run: |
          import json
          from pathlib import Path
          import note_manuscript, pipeline, production_pipeline
          from hybrid_writer_runtime import run_or_defer_writer
          from hybrid_live_plan_writer import evaluate_live_writer_text
          from source_normalization import install as install_source_normalization
          from run268_business_source_strategy import install as install_run268
          from run269_business_source_precision import install as install_run269
          from run283_numeric_evidence_equivalence import install as install_run283
          from run284_reader_recovery_precision import install as install_run284
          from run287_publication_date_provenance import install as install_run287
          from reader_quality_precision import install as install_reader_quality_precision

          install_source_normalization(pipeline)
          production_pipeline.install_runtime_layers(pipeline)
          production_pipeline.install_run349_score_narrative_negation_precision(pipeline)
          install_run283(pipeline); install_run268(pipeline); install_run269(pipeline)
          install_reader_quality_precision(pipeline); install_run284(pipeline); install_run287(note_manuscript,pipeline)

          runtime=run_or_defer_writer(pipeline,'hybrid-live-writer-fixture.json','hybrid-live-writer-report.json','hybrid-live-pending-writer.json')
          terminal={'candidate_id':'B0049','status':runtime['status'],'plan_live_calls':1,'gemini_live_calls':int(runtime.get('provider_calls') or 0),'business_writes':0,'persist_results':False}
          if runtime['status']=='DEFERRED':
              terminal.update({'reason':runtime['reason'],'pending_status':runtime['pending']['status'],'quality_evaluated':False})
          elif runtime['status']=='SUCCESS':
              report=runtime['report']
              ev=evaluate_live_writer_text(pipeline,'tests/fixtures/groq/article_parity_B0049_input.json','hybrid-live-plan-report.json',report['text'],'hybrid-live-evaluation.json',writer_model=report['model'],gemini_live_calls=report['provider_calls'])
              terminal.update({'quality_evaluated':True,'fact_boundary_passed':ev['fact_boundary_passed'],'fact_ok':ev['fact_ok'],'editorial_ok':ev['editorial_ok'],'publication_state':ev['publication_state'],'human_appeal_state':ev['human_appeal_state'],'gate_disposition':ev['gate_disposition'],'quality_validated':ev['quality_validated']})
          else:
              raise RuntimeError('hybrid_live_terminal_state_invalid')
          Path('hybrid-live-terminal.json').write_text(json.dumps(terminal,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(terminal,ensure_ascii=False))

      - name: Upload complete Hybrid E2E evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-live-fact-locked-B0049
          path: |
            hybrid-live-plan-fixture.json
            hybrid-live-plan-report.json
            hybrid-live-writer-fixture.json
            hybrid-live-writer-report.json
            hybrid-live-pending-writer.json
            hybrid-live-evaluation.json
            hybrid-live-terminal.json
          if-no-files-found: warn
          retention-days: 30

      - name: Require safe terminal state without weakening quality gates
        shell: python
        run: |
          import json
          terminal=json.load(open('hybrid-live-terminal.json',encoding='utf-8'))
          assert terminal['business_writes']==0 and terminal['persist_results'] is False
          assert terminal['plan_live_calls']==1
          if terminal['status']=='DEFERRED':
              assert terminal['pending_status']=='PENDING_WRITER'
              assert terminal['quality_evaluated'] is False
          else:
              ev=json.load(open('hybrid-live-evaluation.json',encoding='utf-8'))
              assert terminal['status']=='SUCCESS'
              assert ev['fact_boundary_passed'] is True, ev['fact_boundary_report']
              assert ev['fact_ok'] is True, ev['fact_failures']
              assert ev['editorial_ok'] is True, ev['editorial_warnings']
              assert ev['publication_state']=='PASS', ev['publication_issues']
              assert ev['human_appeal_state']=='ACCEPTABLE', ev['human_appeal_issues']
              assert ev['quality_validated'] is True, ev
