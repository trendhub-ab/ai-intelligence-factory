name: P0-A Draft Preflight Dispatch Once

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-draft-preflight-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch prepare-only draft preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/note-create-draft.yml/dispatches \
            -d '{"ref":"design/p0-a-note-lossless-contract","inputs":{"confirm":"CREATE_NOTE_DRAFT","sync_id":"","prepare_only":"true"}}')"
          test "$code" = "204"
          echo 'prepare-only dispatch accepted'
