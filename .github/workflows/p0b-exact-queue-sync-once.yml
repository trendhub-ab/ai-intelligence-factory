name: P0-B Exact Queue Sync [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-exact-queue-sync-20261004
    paths:
      - .github/workflows/p0b-exact-queue-sync-once.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: '6f2c7b308ae2d49c4f34092dfbd682221d2bf040'
      TARGET_ARTICLE_TITLE: 'Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Verify main has not moved
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$actual" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved; refusing queue sync"
            exit 1
          }

      - name: Resolve exactly one current Ready with current eyecatch
        id: resolve
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          token = os.environ['NOTION_API_KEY'].strip()
          ds = os.environ['NOTION_DATA_SOURCE_ID'].strip()
          title = os.environ['TARGET_ARTICLE_TITLE']
          payload = {'page_size': 10, 'filter': {'and': [
              {'property': '記事名', 'title': {'equals': title}},
              {'property': '記事状態', 'select': {'equals': 'Ready'}},
          ]}}
          req = urllib.request.Request(
              f'https://api.notion.com/v1/data_sources/{ds}/query',
              data=json.dumps(payload).encode(), method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'Notion-Version': os.environ['NOTION_API_VERSION'],
              })
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.load(r).get('results') or []
          if len(rows) != 1:
              raise SystemExit(f'Expected exactly one Ready candidate, got {len(rows)}')
          row = rows[0]
          files = ((row.get('properties') or {}).get('アイキャッチ') or {}).get('files') or []
          if len(files) != 1:
              raise SystemExit('Expected exactly one persisted eyecatch')
          item = files[0]
          url = str(((item.get('external') or {}).get('url')) or ((item.get('file') or {}).get('url')) or '')
          if '__ecv1_' not in url:
              raise SystemExit('Eyecatch is not a current contract asset')
          sync_id = re.sub(r'[^0-9a-fA-F]', '', str(row.get('id') or '')).lower()
          if not re.fullmatch(r'[0-9a-f]{32}', sync_id):
              raise SystemExit('Invalid source identity')
          print(f'::add-mask::{sync_id}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'sync_id={sync_id}\n')
          PY

      - name: Dispatch exact main queue sync with draft fan-out disabled
        env:
          TARGET_SYNC_ID: ${{ steps.resolve.outputs.sync_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::GH_PAT missing'; exit 1; }
          test -n "${TARGET_SYNC_ID:-}" || { echo '::error::target identity missing'; exit 1; }
          gh workflow run note-ready-sync.yml --ref main \
            -f create_private_draft=false \
            -f target_sync_id="$TARGET_SYNC_ID"
          echo 'Exact queue sync dispatched once; private-draft fan-out disabled.'
