name: Temporary Gemini Lane Green Patch

on:
  push:
    branches:
      - fix/gemini-lane-isolation
    paths:
      - .github/workflows/tmp-gemini-lane-green.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemini-lane-isolation
          fetch-depth: 0
      - name: Apply bounded Daily workflow contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/daily-one-shot.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.5-flash,gemini-3.7-flash,gemini-3.8-flash"',
                  'GEMINI_SCREENING_MODEL_CANDIDATES: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"',
              ),
              (
                  '""|gemini-3.1-flash-lite|gemini-3.5-flash|gemini-3.6-flash|gemini-3.7-flash|gemini-3.8-flash)',
                  '""|gemini-3.5-flash-lite|gemini-3.1-flash-lite|gemini-3.5-flash|gemini-3.6-flash|gemini-3.7-flash|gemini-3.8-flash)',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one Daily contract match, got {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused lane contract test
        run: python -m unittest tests.test_gemini_lane_isolation -v
      - name: Commit and push workflow with scoped GITHUB_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily-one-shot.yml
          git diff --cached --check
          git commit -m "fix: keep Screening inside the Lite lane"
          git push origin HEAD:fix/gemini-lane-isolation
