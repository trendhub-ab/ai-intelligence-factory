name: Run376 Pending Retry Validation [ONE-TIME]

# One authorized read-only validation after Run375 Reader-reason hardening.
# Run376 isolates the repair proof on Gemini 3.5 only so scarce 3.8/3.6 quota is preserved.
# No Notion manuscript/status persistence and no Note Ready reconciliation.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/run367-readonly-audit-reader-conflict
    paths:
      - '.github/workflows/run370-pending-retry-validation.yml'

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-one-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Safety contract
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/run367-readonly-audit-reader-conflict"
          echo 'Run376: one Pending Retry candidate, Gemini 3.5 only, 3.6 and 3.8 forbidden, persist=false, max 4 provider attempts.'

      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lato
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Zero-API contract tests
        run: |
          python -m pytest tests/test_run277_article_revalidation.py -q
          python -m pytest tests/test_run370_pending_reader_repair.py -q
          python -m pytest tests/test_run371_explicit_model_order.py -q
          python -m pytest tests/test_run371_transient_503_override.py -q
          python -m pytest tests/test_run371_pending_origin_provider_policy.py -q
          python -m pytest tests/test_run367_readonly_and_reader_interaction.py -q
          python run280_publication_dependency_guard.py

      - name: Validate one persisted Pending Retry candidate
        run: python production_pipeline.py
        env:
          TZ: 'Asia/Tokyo'
          AIIF_ONE_SHOT_MODE: 'pending_retry_validation'
          ARTICLE_REVALIDATION_LIMIT: '1'
          ARTICLE_REVALIDATION_REQUEST_BUDGET: '4'
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: '4'
          GEMINI_PENDING_RETRY_REQUEST_BUDGET: '4'
          GEMINI_TRANSIENT_503_COOLDOWN_THRESHOLD: '1'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.5-flash'
          GEMINI_PENDING_RETRY_EXCLUDED_MODELS: 'gemini-3.6-flash,gemini-3.8-flash'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          ENABLE_JAPANESE_DISPLAY_LABEL: ${{ vars.ENABLE_JAPANESE_DISPLAY_LABEL || 'false' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: '0'
          PRODUCT_REVIEW_MAX_PER_RUN: '0'
          LEGACY_BOOTSTRAP_MAX_PER_RUN: '0'
          DEFERRED_DEEP_DIVE_MAX_PER_RUN: '0'
          ENABLE_SUBSCRIBER_TECH_SYNC: 'false'
          ENABLE_DECISION_MONTHLY_DIGEST: 'false'
          ARTICLE_PUBLICATION_MODE: 'free'
          ENABLE_SUBSCRIPTION_ATTRIBUTION: 'true'
          SUBSCRIPTION_LANDING_URL: ${{ vars.SUBSCRIPTION_LANDING_URL }}
          SUBSCRIPTION_CAMPAIGN_ID: 'ai_intelligence_factory_subscription'
          SUBSCRIPTION_ATTRIBUTION_DIR: 'subscription_attribution/articles'
          SUBSCRIPTION_ATTRIBUTION_GITHUB_DIR: 'subscription_attribution/articles'
          EYECATCH_MIN_DECISION_SCORE: '60'
          TOP_N_FOR_DEEP_DIVE: '1'
          ENABLE_PUBLICATION_RELIABILITY_SLOT: 'false'
          ENABLE_DETERMINISTIC_PUBLICATION_RESCUE: 'true'
          NOTION_SAVE_THRESHOLD_SCORE: '60'
          ENABLE_PROFIT_PRIORITY: 'true'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: 'main'
          EYECATCH_GITHUB_BRANCH: 'main'
          GEMINI_36_FLASH_DAILY_BUDGET: '0'
          GEMINI_38_FLASH_DAILY_BUDGET: '0'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          MAX_EVIDENCE_DOCUMENTS: '3'
          VERIFICATION_CONTEXT_MAX_CHARS: '180000'

      - name: Record boundary
        if: always()
        run: |
          {
            echo '### Run376 pending validation'
            echo '- candidate status: `Pending Retry` only'
            echo '- candidate count: at most `1`'
            echo '- Reader repair: at most `1`, Reader-only + safe Evidence only'
            echo '- Gemini 3.6: `FORBIDDEN`'
            echo '- Gemini 3.8: `PRESERVED / FORBIDDEN FOR THIS RUN`'
            echo '- model: `gemini-3.5-flash` only'
            echo '- provider request budget: at most `4`'
            echo '- persist_results: `false`'
            echo '- Note Ready reconciliation: `false`'
            echo '- note draft/public publication: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
