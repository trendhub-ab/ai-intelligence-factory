name: Groq Writer v6 Live
on:
  workflow_dispatch:
  push:
    branches: ['dev/groq-provider-foundation']
    paths:
      - '.runtime/groq_writer_v6_trigger.txt'
permissions:
  contents: write
concurrency:
  group: groq-writer-v6-live
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema

      - name: Reuse safe Plan and build compact GPT-OSS v6 Writer fixture
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          import shutil
          from groq_two_pass_article import build_writer_fixture, load_plan_report
          from groq_writer_v5_contract import harden_writer_fixture
          from groq_writer_v6_route import route_writer_fixture, preflight_writer_fixture

          shutil.copyfile(
              'tests/fixtures/groq/two_pass_v3_plan_safe_report.json',
              'two-pass-plan-report.json',
          )
          plan = load_plan_report('two-pass-plan-report.json')
          build_writer_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'two-pass-plan-report.json',
              'two-pass-writer-fixture.json',
          )
          harden_writer_fixture('two-pass-writer-fixture.json')
          fixture = route_writer_fixture('two-pass-writer-fixture.json')
          preflight = preflight_writer_fixture('two-pass-writer-fixture.json')
          assert fixture['model'] == 'openai/gpt-oss-120b'
          assert fixture['rate_policy'] == 'gpt_oss_120b'
          assert preflight['reserved_estimate'] <= 7000
          print(json.dumps({
              'plan_evidence': 'v3-sanitized-writer-isolation',
              'plan_decision': plan['decision'],
              'plan_access_status': plan['access_status'],
              **preflight,
              'business_writes': 0,
          }, ensure_ascii=False))

      - name: One guarded GPT-OSS v6 Writer call
        env:
          AIIF_ONE_SHOT_MODE: groq_saved_prompt_validation
          AIIF_GROQ_FIXTURE: two-pass-writer-fixture.json
          AIIF_GROQ_REPORT: two-pass-writer-report.json
          AIIF_GROQ_LIVE: 'true'
          AIIF_GROQ_BUDGET_BACKEND: github
          AIIF_GROQ_EXPERIMENT: article-two-pass-B0049-writer-v6-gpt-oss-compact
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LEDGER_GITHUB_TOKEN: ${{ github.token }}
        run: python production_pipeline.py

      - name: Require v5 zero-API Source Boundary and Reader contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          from groq_writer_v5_contract import validate_writer_report
          result = validate_writer_report('two-pass-writer-report.json')
          provider = result['result']
          print(json.dumps({
              'v6_local_guard': 'PASS',
              'source_boundary': result['v5_source_boundary_validated'],
              'reader_contract': result['v5_reader_contract_validated'],
              'article_chars': result['v5_article_chars'],
              'headings': result['v5_headings'],
              'paragraphs': result['v5_paragraphs'],
              'writer_prompt_tokens': provider['prompt_tokens'],
              'writer_completion_tokens': provider['completion_tokens'],
              'writer_tokens': provider['prompt_tokens'] + provider['completion_tokens'],
              'business_writes': 0,
          }, ensure_ascii=False))

      - name: Assemble saved Plan plus v6 Writer and evaluate current Production gates
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          import note_manuscript
          import pipeline
          import production_pipeline
          from groq_article_parity import evaluate_groq_article_output
          from groq_two_pass_article import assemble_combined_report
          from source_normalization import install as install_source_normalization
          from run268_business_source_strategy import install as install_run268
          from run269_business_source_precision import install as install_run269
          from run283_numeric_evidence_equivalence import install as install_run283
          from run284_reader_recovery_precision import install as install_run284
          from run287_publication_date_provenance import install as install_run287
          from reader_quality_precision import install as install_reader_quality_precision

          combined = assemble_combined_report(
              'two-pass-plan-report.json', 'two-pass-writer-report.json', 'two-pass-combined-report.json'
          )
          assert combined['provider_calls'] == 2
          assert combined['business_writes'] == 0

          install_source_normalization(pipeline)
          production_pipeline.install_runtime_layers(pipeline)
          production_pipeline.install_run349_score_narrative_negation_precision(pipeline)
          install_run283(pipeline)
          install_run268(pipeline)
          install_run269(pipeline)
          install_reader_quality_precision(pipeline)
          install_run284(pipeline)
          install_run287(note_manuscript, pipeline)

          evaluation = evaluate_groq_article_output(
              pipeline,
              'two-pass-combined-report.json',
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'two-pass-evaluation.json',
          )
          assert evaluation['business_writes'] == 0
          assert evaluation['persist_results'] is False
          assert evaluation['parsed']
          print(json.dumps({
              'candidate_id': evaluation['candidate_id'],
              'model': evaluation['model'],
              'evidence_state': evaluation['evidence_state'],
              'evidence_sufficient': evaluation['evidence_sufficient'],
              'fact_ok': evaluation['fact_ok'],
              'fact_failures': evaluation['fact_failures'],
              'editorial_ok': evaluation['editorial_ok'],
              'editorial_warnings': evaluation['editorial_warnings'],
              'publication_state': evaluation['publication_state'],
              'publication_issues': evaluation['publication_issues'],
              'human_appeal_state': evaluation['human_appeal_state'],
              'human_appeal_issues': evaluation['human_appeal_issues'],
              'gate_disposition': evaluation['gate_disposition'],
              'quality_validated': evaluation['quality_validated'],
              'decision_score': evaluation['decision_score'],
              'article_chars': evaluation['article_chars'],
              'evidence_total_tokens': evaluation['prompt_tokens'] + evaluation['completion_tokens'],
              'business_writes': evaluation['business_writes'],
          }, ensure_ascii=False))

      - name: Upload v6 validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groq-writer-v6-B0049
          path: |
            two-pass-plan-report.json
            two-pass-writer-fixture.json
            two-pass-writer-report.json
            two-pass-combined-report.json
            two-pass-evaluation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Require all quality gates before full two-pass retest
        shell: python
        run: |
          import json
          data = json.load(open('two-pass-evaluation.json', encoding='utf-8'))
          assert data['quality_validated'] is True, data
          assert data['fact_ok'] is True, data['fact_failures']
          assert data['editorial_ok'] is True, data['editorial_warnings']
          assert data['publication_state'] == 'PASS', data['publication_issues']
          assert data['human_appeal_state'] == 'ACCEPTABLE', data['human_appeal_issues']
