name: PR note list read-only diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-note-list-readonly-diagnostic
  cancel-in-progress: false

jobs:
  start-cloud-vm:
    if: ${{ github.event.pull_request.head.ref == 'diag/note-official-list-proof-20261015' && github.actor == 'trendhub-ab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "STOPPING" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
              [ "$state" = "TERMINATED" ] && break
            done
          fi
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  probe:
    needs: start-cloud-vm
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 12
    env:
      NOTE_TARGET_SYNC_ID: '3fa479ffdca98194a493cb3a0d2b3a36'
      NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
      NOTE_CHROME_CHANNEL: 'chrome'
      NOTE_CHROME_HEADLESS: 'false'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests playwright
      - name: Prove exact official-list edit button resolves persisted draft ID
        run: |
          xvfb-run -a python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright
          import run187_note_editor_readiness as run187
          import run190_note_persistent_cloud as run190
          import run291_note_private_draft_audit as run291

          article = run291._expected_article(os.environ['NOTE_TARGET_SYNC_ID'])
          draft_id = str(article['draft_id'])
          title = str(article['title'])
          result = {
            'status': 'probe_complete_no_mutation',
            'zero_gemini_calls': True,
            'read_only': True,
            'draft_mutation': False,
            'public_release': False,
            'notion_writes': 0,
          }

          with sync_playwright() as p:
            context = run190._launch_persistent_context(p)
            page = context.new_page()
            page.set_default_timeout(30000)
            try:
              page.goto('https://note.com/', wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(1000)
              run190._assert_expected_note_account(page)
              result['account_proof'] = True

              page.goto(run190.ARTICLE_LIST_URL, wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(1800)
              result['article_list_route_ok'] = str(page.url or '').startswith(run190.ARTICLE_LIST_URL)

              button = page.get_by_role('button', name=f'{title}を編集', exact=True)
              result['exact_edit_button_count'] = button.count()
              if button.count() != 1:
                raise SystemExit('official list did not expose one exact edit button')

              button.click(timeout=10000)
              for _ in range(10):
                if run187._is_editor_url(str(page.url or '')):
                  break
                page.wait_for_timeout(500)

              result['list_click_editor_route_ok'] = bool(run187._is_editor_url(str(page.url or '')))
              try:
                resolved_id = run291.note_lifecycle.draft_identity_from_url(
                  str(page.url or ''), error_type=run291.PrivateDraftAuditError
                )
              except Exception:
                resolved_id = ''
              result['list_click_id_match'] = bool(resolved_id == draft_id)
            finally:
              context.close()

          print('NOTE_LIST_EDIT_ID_DIAGNOSTIC=' + json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [start-cloud-vm, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
