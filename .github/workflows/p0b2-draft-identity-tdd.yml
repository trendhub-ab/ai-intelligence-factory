name: P0-B2 Draft Identity TDD

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - 'tests/test_p0b2_note_draft_identity.py'
      - 'note_draft_automation.py'
      - 'note_ready_sync.py'
      - 'p0b2_note_draft_identity.py'
      - 'run190_note_persistent_cloud.py'
      - 'run194_note_persistent_cloud.py'
      - '.github/workflows/p0b2-draft-identity-tdd.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests playwright
      - name: P0-B2 targeted note regression
        run: |
          python -m unittest tests.test_p0b2_note_draft_identity -v
          python -m unittest tests.test_note_draft_automation -v
          python -m unittest discover -s tests -p 'test_run190*.py' -v
          python -m unittest discover -s tests -p 'test_run194*.py' -v
