name: Hybrid Groq Plan + Gemini Writer ONE-SHOT
on:
  workflow_dispatch:
  push:
    branches: ['dev/hybrid-groq-gemini']
    paths:
      - '.runtime/hybrid_one_shot_trigger.txt'
permissions:
  contents: write
concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      AIIF_RUNTIME_STATE_BRANCH: runtime-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema
      - name: Preflight saved Fact-Locked Groq plan and one-call Gemini 3.8 validation fixture
        shell: python
        run: |
          import json
          from hybrid_one_shot import build_writer_fixture
          from hybrid_groq_plan import load_hybrid_plan_report
          plan=load_hybrid_plan_report('tests/fixtures/groq/two_pass_v3_plan_safe_report.json')
          fx=build_writer_fixture(
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'tests/fixtures/groq/two_pass_v3_plan_safe_report.json',
              'hybrid-writer-fixture.json',
          )
          saved=fx['decision_package']['plan_report']
          assert saved['mode']=='hybrid_groq_judgment_fact_locked'
          assert saved['fact_envelope_sha256']
          assert saved['composed_plan']==plan
          assert plan['decision']=='WATCH' and plan['access_status']=='NOT_CONFIRMED'
          assert sum(plan[k] for k in ('business_impact','technical_impact','urgency','market_impact','reliability'))==80
          assert plan['article_value']==85
          assert fx['business_writes']==0 and fx['persist_results'] is False
          assert len(fx['writer_prompt'].encode('utf-8')) < 32000
          # Validation-only override: skip repeatedly unavailable 3.7 and spend exactly one 3.8 call.
          # This does not change the production/default model order in hybrid_one_shot.py.
          fx['writer_model']='gemini-3.8-flash'
          fx['writer_models']=['gemini-3.8-flash']
          fx['provider_calls_expected']={'groq_live':0,'gemini_live_max':1}
          fx['fallback_contract']='validation-only direct 3.8; no fallback; production/default unchanged'
          with open('hybrid-writer-fixture.json','w',encoding='utf-8') as f:
              json.dump(fx,f,ensure_ascii=False,indent=2)
          print(json.dumps({
              'candidate_id':fx['candidate_id'],
              'plan_provider':'groq(saved fact-locked validated)',
              'decision':plan['decision'],
              'decision_score':80,
              'article_value':plan['article_value'],
              'access_status':plan['access_status'],
              'writer_provider':'gemini',
              'validation_writer_model':fx['writer_model'],
              'writer_prompt_bytes':len(fx['writer_prompt'].encode('utf-8')),
              'groq_live_calls':0,
              'gemini_live_calls_max':1,
              'business_writes':0,
              'production_model_order_changed':False,
          },ensure_ascii=False))
      - name: One Gemini 3.8 writer call and Production gates
        id: writer
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_PROJECT_ID: ${{ vars.GEMINI_QUOTA_PROJECT_ID || secrets.GEMINI_QUOTA_PROJECT_ID }}
          GEMINI_QUOTA_FALLBACK_ID: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_COUNTER_BRANCH: runtime-state
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_38_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_DEEP_DIVE_PER_RUN_REQUEST_BUDGET: '2'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.7-flash,gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash'
          SYNTHETIC_REGRESSION_MODE: 'false'
        shell: python
        run: |
          import json
          import note_manuscript, pipeline, production_pipeline
          from hybrid_one_shot import evaluate_writer_text, run_one_gemini_writer_call
          from source_normalization import install as install_source_normalization
          from run268_business_source_strategy import install as install_run268
          from run269_business_source_precision import install as install_run269
          from run283_numeric_evidence_equivalence import install as install_run283
          from run284_reader_recovery_precision import install as install_run284
          from run287_publication_date_provenance import install as install_run287
          from reader_quality_precision import install as install_reader_quality_precision

          install_source_normalization(pipeline)
          production_pipeline.install_runtime_layers(pipeline)
          production_pipeline.install_run349_score_narrative_negation_precision(pipeline)
          install_run283(pipeline); install_run268(pipeline); install_run269(pipeline)
          install_reader_quality_precision(pipeline); install_run284(pipeline); install_run287(note_manuscript,pipeline)

          report=run_one_gemini_writer_call(
              pipeline,
              'hybrid-writer-fixture.json',
              'hybrid-writer-report.json',
          )
          assert report['provider_calls']==1
          assert report['model']=='gemini-3.8-flash'
          ev=evaluate_writer_text(
              pipeline,
              'tests/fixtures/groq/article_parity_B0049_input.json',
              'tests/fixtures/groq/two_pass_v3_plan_safe_report.json',
              report['text'],
              'hybrid-evaluation.json',
              writer_model=report['model'],
              gemini_live_calls=report['provider_calls'],
          )
          print(json.dumps({
              'status':'SUCCESS',
              'candidate_id':ev['candidate_id'],
              'gemini_live_calls':ev['gemini_live_calls'],
              'model':ev['writer_model'],
              'raw_article_chars':ev['raw_article_chars'],
              'article_chars':ev['article_chars'],
              'decision':ev['decision'],
              'decision_score':ev['decision_score'],
              'evidence_state':ev['evidence_state'],
              'fact_ok':ev['fact_ok'],
              'fact_failures':ev['fact_failures'],
              'editorial_ok':ev['editorial_ok'],
              'editorial_warnings':ev['editorial_warnings'],
              'publication_state':ev['publication_state'],
              'publication_issues':ev['publication_issues'],
              'human_appeal_state':ev['human_appeal_state'],
              'human_appeal_issues':ev['human_appeal_issues'],
              'gate_disposition':ev['gate_disposition'],
              'quality_validated':ev['quality_validated'],
              'business_writes':ev['business_writes'],
          },ensure_ascii=False))
          assert ev['business_writes']==0 and ev['persist_results'] is False
      - name: Upload Hybrid evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-b0049-groq-plan-gemini-writer
          path: |
            hybrid-writer-fixture.json
            hybrid-writer-report.json
            hybrid-evaluation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require full article quality parity
        shell: python
        run: |
          import json
          ev=json.load(open('hybrid-evaluation.json',encoding='utf-8'))
          assert ev['fact_ok'] is True, ev['fact_failures']
          assert ev['editorial_ok'] is True, ev['editorial_warnings']
          assert ev['publication_state']=='PASS', ev['publication_issues']
          assert ev['human_appeal_state']=='ACCEPTABLE', ev['human_appeal_issues']
          assert ev['quality_validated'] is True, ev
          assert ev['business_writes']==0
