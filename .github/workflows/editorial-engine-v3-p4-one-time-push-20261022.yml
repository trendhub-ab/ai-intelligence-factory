name: V3 P4 — User-authorized single push C-only proof 2026-10-22

# Exactly one GitHub-connector-authorized push to create THIS file initiates the
# previously user-approved manual experiment without relying on Android UI.
# No PR, issue comment, workflow_dispatch, schedule or subsequent push can call Gemini.
# SECOND PUSH FOR FIRST-REGISTRATION: if workflow was not indexed on creation,
# Runs #1/#2 failed YAML parsing; #3 reached Gemini but got 503 with zero generated C.
# Run #4 reached Gemini 3.8 Flash but returned 503. User now explicitly approved 3.6 Flash.
# ONE_OFF_MIXED_MODEL_C_3_6_FLASH: run number 5 only, first attempt; others skip.
on:
  push:
    branches:
      - feature/editorial-engine-v3-p4-pinned-live-proof
    paths:
      - '.github/workflows/editorial-engine-v3-p4-one-time-push-20261022.yml'

permissions:
  contents: read
  actions: read

jobs:
  once:
    name: Immutable P3 C-only — 3 canonical cases
    if: >-
      ${{ github.event_name == 'push' && github.run_number == 5 && github.run_attempt == 1 && github.ref == 'refs/heads/feature/editorial-engine-v3-p4-pinned-live-proof' && github.repository == 'trendhub-ab/ai-intelligence-factory' && github.event.head_commit.message == 'fire(v3): user-authorized P4 C-only 3.6 trial 2026-10-23' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ai-intelligence-gemini-budget
      cancel-in-progress: false
    steps:
      - name: Enforce Japan time after 17 before touching Gemini credentials
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          assert datetime.now(ZoneInfo("Asia/Tokyo")).hour >= 17, "Gemini API prohibited before 17:00 JST"
          print("JST time gate PASS")
          PY

      - name: Checkout immutable previously verified P3 runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 03b3c237442c4c2b335440d363796c0def175c20
          persist-credentials: false

      - name: Set up isolated Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'

      - name: Install test tools and Gemini client
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pip install --disable-pip-version-check 'google-genai>=1.56.0,<2.0.0'

      - name: Offline regression tests and P3 discovery invariant
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_editorial_engine_v3_phase0.py \
            tests/test_editorial_engine_v3_phase0_live.py \
            tests/test_editorial_engine_v3_phase0_quality_contract.py \
            tests/test_editorial_engine_v3_phase0_proof.py \
            tests/test_v3_reader_experience_diagnostics.py
          python - <<'PY'
          from experiments.editorial_engine_v3_phase0.cases import READY_CASES
          from experiments.editorial_engine_v3_phase0.prompts import READER_DISCOVERY_SCENE, build_editorial_bundle_prompt
          assert len(READY_CASES) == 3
          assert all(READER_DISCOVERY_SCENE in build_editorial_bundle_prompt(c.case) for c in READY_CASES)
          PY

      - name: Restore immutable prior three-case A/B checkpoint
        uses: actions/download-artifact@v4
        with:
          name: editorial-engine-v3-phase0-checkpoint
          path: phase0_artifacts
          github-token: ${{ github.token }}
          run-id: 39239644474

      - name: Verify baseline model and exact A/B canonical case identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.editorial_engine_v3_phase0.cases import READY_CASES
          data = json.loads(Path('phase0_artifacts/checkpoint.json').read_text(encoding='utf-8'))
          assert data['selected_model'] == 'gemini-3.8-flash'
          assert len(data['cases']) == 3
          assert [c['case_id'] for c in data['cases']] == [item.case.case_id for item in READY_CASES]
          assert all(c['outputs'].get('A_CURRENT_WRITER') and c['outputs'].get('B_PERSONA_ONLY') for c in data['cases'])
          print("A/B BASELINE VALIDATED")
          PY
          python -m experiments.editorial_engine_v3_phase0.proof snapshot-baseline --output-dir phase0_artifacts

      - name: Prepare isolated one-off 3.6 Flash C checkpoint (A/B kept byte-identical)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.editorial_engine_v3_phase0.cases import READY_CASES
          p = Path('phase0_artifacts/checkpoint.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          assert state['selected_model'] == 'gemini-3.8-flash', 'baseline model mismatch'
          assert len(state['cases']) == 3
          assert [c['case_id'] for c in state['cases']] == [x.case.case_id for x in READY_CASES]
          assert all(c['outputs'].get('A_CURRENT_WRITER') and c['outputs'].get('B_PERSONA_ONLY') for c in state['cases'])
          state['baseline_selected_model'] = state['selected_model']
          state['comparison_model_exception'] = 'ONE_OFF_MIXED_MODEL_C_3_6_FLASH'
          state['selected_model'] = 'gemini-3.6-flash'
          for key in ('c_refinement_fingerprint', 'c_completed_case_ids', 'c_refinement_provider_calls_total', 'c_refinement_provider_attempts_total'):
              state.pop(key, None)
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
          print('MIXED_MODEL_TRIAL=3.6 C ONLY; A/B base model 3.8 fixed')
          PY

      - name: Recheck JST before model request (fail closed)
        run: |
          python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; assert datetime.now(ZoneInfo("Asia/Tokyo")).hour >= 17, "No Gemini before 17:00 JST"'

      - name: Perform bounded C-only replay (unchanged A/B, exactly three logical C requests)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIIF_PHASE0_MODELS: 'gemini-3.6-flash'
          AIIF_PHASE0_CASE_COOLDOWN_SECONDS: '45'
          AIIF_PHASE0_REGENERATE_C_ONLY: 'true'
          AIIF_PHASE0_OUTPUT_DIR: phase0_artifacts
        run: python -m experiments.editorial_engine_v3_phase0.live

      - name: Verify complete current proof; failure remains NO-GO
        if: ${{ always() }}
        env:
          AIIF_PHASE0_MODELS: 'gemini-3.6-flash'
        run: python -m experiments.editorial_engine_v3_phase0.proof verify --output-dir phase0_artifacts

      - name: Upload human-review materials regardless of outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-engine-v3-p4-user-authorized-3-6-20261023
          path: phase0_artifacts
          retention-days: 14
          if-no-files-found: warn
