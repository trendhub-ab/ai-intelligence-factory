name: Member Quick Link Display Patch

on:
  push:
    branches:
      - ops/member-home-host-migration-proof
    paths:
      - .github/workflows/member-quick-link-display-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ops/member-home-host-migration-proof
          fetch-depth: 0
      - name: Apply five-item quick-link title map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('member_presentation_sync.py')
          text = path.read_text(encoding='utf-8')
          old = '''_MEMBER_PRESENTATION_TITLE_OVERRIDES = {
    "github:mintplex-labs/anything-llm": "AnythingLLM",
}
'''
          new = '''_MEMBER_PRESENTATION_TITLE_OVERRIDES = {
    "github:langgenius/dify": "Dify",
    "github:mintplex-labs/anything-llm": "AnythingLLM",
    "github:browser-use/browser-use": "browser-use",
    "github:comfyanonymous/comfyui": "ComfyUI",
    "github:cline/cline": "Cline",
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one mapping block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q member_presentation_sync.py tests/test_member_presentation_display_names.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('member_presentation_sync.py').read_text(encoding='utf-8'))
          keep = []
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '_MEMBER_PRESENTATION_TITLE_OVERRIDES' for t in node.targets):
                  keep.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name == '_member_presentation_title':
                  keep.append(node)
          ns = {}
          exec(compile(ast.Module(body=keep, type_ignores=[]), '<title-contract>', 'exec'), ns, ns)
          fn = ns['_member_presentation_title']
          cases = [
              ('github:langgenius/dify', 'langgenius/dify', 'Dify'),
              ('github:mintplex-labs/anything-llm', 'Mintplex-Labs/anything-llm', 'AnythingLLM'),
              ('github:browser-use/browser-use', 'browser-use/browser-use', 'browser-use'),
              ('github:comfyanonymous/comfyui', 'comfyanonymous/ComfyUI', 'ComfyUI'),
              ('github:cline/cline', 'cline/cline', 'Cline'),
              ('github:huggingface/datasets', 'huggingface/datasets', 'huggingface/datasets'),
          ]
          for sync_id, source, expected in cases:
              actual = fn(sync_id, source)
              assert actual == expected, (sync_id, actual, expected)
          print('QUICK_LINK_TITLE_CONTRACT=PASS 6/6')
          PY
          git diff --check
      - name: Commit bounded implementation
        shell: bash
        run: |
          git config user.name "TrendHub"
          git config user.email "trendhub.biz@gmail.com"
          git add member_presentation_sync.py
          git commit -m "fix: normalize member quick-link display names"
          git push origin HEAD:ops/member-home-host-migration-proof
