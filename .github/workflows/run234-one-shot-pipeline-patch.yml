name: Run234 One-Shot Pipeline Patch

on:
  push:
    branches:
      - run231-stage2-pipeline-modularization
    paths:
      - 'tests/_run234_patch_pipeline.py'
      - '.github/workflows/run234-one-shot-pipeline-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run231-stage2-pipeline-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Assert isolated feature branch
        run: test "$GITHUB_REF_NAME" = 'run231-stage2-pipeline-modularization'
      - name: Apply exact guarded pipeline replacement
        run: python tests/_run234_patch_pipeline.py
      - name: Commit patched pipeline only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No pipeline change staged'; exit 1; }
          git commit -m 'Run234: isolate optional legacy eyecatch import'
          git push origin HEAD:run231-stage2-pipeline-modularization
