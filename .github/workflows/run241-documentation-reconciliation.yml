name: Run241 Documentation Reconciliation

on:
  push:
    branches:
      - run241-batched-pipeline-modularization

permissions:
  contents: write

concurrency:
  group: run241-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run241-batched-pipeline-modularization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reconcile canonical docs fail-closed
        run: python run241_documentation_reconciliation.py
      - name: Documentation freshness guard
        run: python documentation_freshness_guard.py
      - name: Whitespace check
        run: git diff --check
      - name: Commit documentation when changed
        run: |
          if git diff --quiet -- README.md AI_Intelligence_Factory_最終仕様書.md; then
            echo 'Run241 documentation already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AI_Intelligence_Factory_最終仕様書.md
          git commit -m 'Run241: reconcile canonical Production documentation'
          git push origin HEAD:run241-batched-pipeline-modularization
