name: P0-A Note LI Paragraph TDD

on:
  push:
    branches:
      - design/p0-a-note-lossless-contract
    paths:
      - '.github/workflows/p0a-li-paragraph-tdd.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: design/p0-a-note-lossless-contract
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'
      - name: Install pytest
        run: python -m pip install 'pytest==8.4.2'
      - name: Run proven li paragraph wrapper contract
        run: python -m pytest -q tests/test_p0a_note_list_paragraph_wrapper.py tests/test_note_document_dom.py tests/test_p0a_dom_topology_diagnostics.py
