name: Run143 Reader Delight Strong Red-Team

on:
  push:
    paths:
      - '.github/chat-triggers/run143-reader-delight-strong-redteam.txt'
      - 'tools/run143_reader_delight_strong_redteam.py'
      - '.github/workflows/run143-reader-delight-strong-redteam.yml'

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run129-conversational-warmth
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Run143 strong red-team
        env:
          GEMINI_API_KEY: test-key
          GH_PAT: test-token
          GEMINI_QUOTA_PROJECT_ID: test-project
          PYTHONPATH: .
        run: python tools/run143_reader_delight_strong_redteam.py
