name: Product Review Apply Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-review-apply-once.yml'

permissions:
  contents: read

concurrency:
  group: ai-intelligence-gemini-budget
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run exactly two Product Reviews
        env:
          TZ: Asia/Tokyo
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}
          EVIDENCE_HEALTH_MAX_CHECKS_PER_RUN: '20'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
          GEMINI_PERSISTENT_DAILY_COUNTER: 'true'
          GEMINI_PERSISTENT_COUNTER_PATH: '.runtime/gemini_daily_usage.json'
          GEMINI_COUNTER_BRANCH: 'main'
          GEMINI_QUOTA_TIMEZONE: 'America/Los_Angeles'
          GEMINI_35_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_31_FLASH_LITE_DAILY_BUDGET: '450'
          GEMINI_36_FLASH_DAILY_BUDGET: '18'
          GEMINI_37_FLASH_DAILY_BUDGET: '18'
          GEMINI_35_FLASH_DAILY_BUDGET: '18'
          GEMINI_DEEP_DIVE_MODEL_CANDIDATES: 'gemini-3.6-flash'
        run: |
          set -euo pipefail
          mkdir -p inventory_bootstrap_artifacts
          python - <<'PY' 2>&1 | tee inventory_bootstrap_artifacts/product_review_apply.log
          import os
          import subprocess
          import sys
          from portfolio_inventory_bootstrap import product_only_environment, detect_unsafe_pipeline_activity

          selected = (
              'arxiv:2608.27364',
              'arxiv:2608.27424',
          )
          env = os.environ.copy()
          env.update(product_only_environment(max_reviews=2, product_request_budget=3))
          env['INVENTORY_BOOTSTRAP_ENTITY_IDS'] = ','.join(selected)
          env['GEMINI_DEEP_DIVE_MODEL_CANDIDATES'] = 'gemini-3.6-flash'

          proc = subprocess.run(
              [sys.executable, 'pipeline.py'],
              env=env,
              capture_output=True,
              text=True,
              timeout=2400,
          )
          combined = (proc.stdout or '') + '\n' + (proc.stderr or '')
          print(combined)
          unsafe = detect_unsafe_pipeline_activity(combined)
          if unsafe:
              raise SystemExit('Unsafe non-Product-Review activity detected: ' + '; '.join(unsafe))
          if proc.returncode != 0:
              raise SystemExit(proc.returncode)
          PY
      - name: Upload Product Review audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-review-apply-${{ github.run_id }}
          path: inventory_bootstrap_artifacts/product_review_apply.log
          if-no-files-found: warn
          retention-days: 14
