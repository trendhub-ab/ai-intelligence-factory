name: P0-B Task 6 UA GREEN [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-ua-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q pytest playwright requests
      - name: Apply minimal standard-Chrome UA fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('note_draft_automation.py')
          text=path.read_text(encoding='utf-8')
          helper='''\n\ndef _standard_chrome_user_agent(browser_version: str) -> str:\n    version = str(browser_version or "").strip()\n    if not re.fullmatch(r"\\d+(?:\\.\\d+){1,3}", version):\n        raise NoteDraftError("Playwright reported an invalid Chromium version")\n    return (\n        "Mozilla/5.0 (X11; Linux x86_64) "\n        "AppleWebKit/537.36 (KHTML, like Gecko) "\n        f"Chrome/{version} Safari/537.36"\n    )\n'''
          anchor='\ndef _create_browser_draft(\n'
          if '_standard_chrome_user_agent' not in text:
              if anchor not in text:
                  raise SystemExit('create browser draft anchor missing')
              text=text.replace(anchor,helper+anchor,1)
          old='''        context = browser.new_context(\n            storage_state=str(storage_path),\n'''
          new='''        context = browser.new_context(\n            user_agent=_standard_chrome_user_agent(browser.version),\n            storage_state=str(storage_path),\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('browser context anchor missing')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Targeted GREEN
        run: python -m pytest -q tests/test_p0b_note_browser_user_agent.py tests/test_note_draft_automation.py
      - run: git diff --check
      - name: Commit production fix
        run: |
          git config user.name 'TrendHub'
          git config user.email 'trendhub.biz@gmail.com'
          git add note_draft_automation.py
          git commit -m 'fix: use standard Chrome identity for note editor'
          git push origin HEAD:impl/p0b-strong-zero-retry-authority
