name: Probe exact onboarding official edit route

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact Run321 confirmation token'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: note-member-onboarding-official-edit-route-probe-n284e428c80f4
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Falsify exact official edit-route probe
        run: python -m unittest tests.test_run321_member_onboarding_official_edit_route_probe -v
      - name: Validate exact probe authorization
        id: auth
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = 'PROBE_MEMBER_ONBOARDING_OFFICIAL_EDIT_ROUTE_N284E428C80F4_SHAAAB9E57B' ] || exit 1
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  start-cloud-vm:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start persistent note Chrome VM
        run: |
          set -euo pipefail
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)')"
          if [ "$state" != "RUNNING" ]; then
            gcloud compute instances start "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi

  probe:
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    needs: [preflight, start-cloud-vm]
    runs-on: [self-hosted, linux, x64, aiif-note-cloud]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install requests playwright
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || exit 1
          command -v xvfb-run >/dev/null 2>&1 || exit 1
      - name: Re-run exact official edit-route regression
        run: python -m unittest tests.test_run321_member_onboarding_official_edit_route_probe -v
      - name: Probe official edit route without public mutation
        env:
          NOTE_MEMBER_ONBOARDING_OFFICIAL_EDIT_ROUTE_PROBE_CONFIRM: ${{ inputs.confirm }}
          NOTE_MEMBER_ONBOARDING_OFFICIAL_EDIT_ROUTE_PROBE_RESULT_FILE: ${{ runner.temp }}/run321-result.json
          NOTE_CHROME_CHANNEL: 'chrome'
          NOTE_CHROME_HEADLESS: 'false'
        run: xvfb-run -a python run321_member_onboarding_official_edit_route_probe.py
      - name: Summarize probe
        env:
          RESULT_FILE: ${{ runner.temp }}/run321-result.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          if r.get('status') != 'probe_complete_no_public_mutation':
              raise SystemExit('Run321 probe did not complete')
          if r.get('final_commit_clicked') is not False or r.get('public_mutation') is not False:
              raise SystemExit('Run321 mutation contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Run321 official edit-route probe\n')
              fh.write(f'- target: `{r.get("target_note_id")}`\n')
              fh.write(f'- routed title: `{r.get("routed_title")}`\n')
              fh.write(f'- routed body sha: `{r.get("routed_body_sha256")}`\n')
              fh.write(f'- version prompt: `{bool(r.get("version_choice", {}).get("prompt_present"))}`\n')
              fh.write(f'- commit candidates: `{len(r.get("candidate_commit_controls") or [])}`\n')
              fh.write('- final commit clicked: `false`\n')
              fh.write('- public mutation: `false`\n')
              fh.write('- zero model calls: `true`\n')
          PY

  stop-cloud-vm:
    if: ${{ always() && needs.start-cloud-vm.result == 'success' }}
    needs: [preflight, start-cloud-vm, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stop persistent note Chrome VM
        run: |
          state="$(gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format='value(status)' 2>/dev/null || true)"
          if [ "$state" = "RUNNING" ]; then
            gcloud compute instances stop "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --quiet
          fi
