name: Groq Qwen Technology Comment Shadow Judge

on:
  workflow_dispatch:
  push:
    branches:
      - safety/comment-contract-shadow-guard
    paths:
      - '.github/workflows/groq-qwen-technology-comment-shadow-judge.yml'
      - 'groq_qwen_technology_comment_shadow_judge.py'
      - 'tests/fixtures/technology_comment_shadow_live.json'
      - 'tests/fixtures/technology_comment_shadow_groq_rerun.json'

permissions:
  contents: read

concurrency:
  group: groq-qwen-technology-comment-shadow-judge
  cancel-in-progress: false

jobs:
  semantic-judge-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prove replay fixture has zero write authority
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('tests/fixtures/technology_comment_shadow_groq_rerun.json').read_text(encoding='utf-8'))
          assert report['candidate_id'] == 'TECH-SHADOW-SYNTH-001'
          assert report['persist_allowed'] is False
          assert report['business_writes'] == 0
          assert report['automatic_promotion_allowed'] is False
          assert report['fixture_provenance'].startswith('Synthetic Groq challenger')
          print('REPLAY_FIXTURE_AUTHORITY=ZERO')
      - name: Blind semantic Fact and quality audit with Qwen 3.6 27B
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AIIF_TECH_COMMENT_SHADOW_FIXTURE: tests/fixtures/technology_comment_shadow_live.json
          AIIF_TECH_COMMENT_SHADOW_REPORT: tests/fixtures/technology_comment_shadow_groq_rerun.json
          AIIF_TECH_COMMENT_QWEN_JUDGE_REPORT: technology-comment-shadow-qwen-judge.json
        run: python groq_qwen_technology_comment_shadow_judge.py
      - name: Verify cross-model judge is veto-only
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('technology-comment-shadow-qwen-judge.json').read_text(encoding='utf-8'))
          assert report['persist_allowed'] is False
          assert report['business_writes'] == 0
          assert report['automatic_promotion_allowed'] is False
          assert report['cross_model_family'] is True
          assert report['generator_model'] == 'openai/gpt-oss-120b'
          assert report['judge_model'] == 'qwen/qwen3.6-27b'
          print('QWEN_JUDGE_MUTATION_AUTHORITY=ZERO')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology-comment-shadow-qwen-judge
          path: technology-comment-shadow-qwen-judge.json
          if-no-files-found: warn
          retention-days: 7
