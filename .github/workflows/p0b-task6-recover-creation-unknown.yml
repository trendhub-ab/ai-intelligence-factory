name: P0-B Task 6 Ambiguous Run Diagnostic [ONE-SHOT]

on:
  push:
    branches:
      - impl/p0b-strong-zero-retry-authority
    paths:
      - '.github/workflows/p0b-task6-recover-creation-unknown.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      NOTE_DELIVERY_LEDGER_BACKEND: gcs
      NOTE_DELIVERY_LEDGER_PREFIX: delivery/v1
      NOTE_TARGET_IDENTITY: trendhub_biz
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install read-only diagnostic dependencies
        run: |
          pip install -r requirements.txt google-cloud-storage playwright
          python -m playwright install chromium
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Bind sole durable record without mutation
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-aiif-note-ledger-v1"
          echo "::add-mask::$bucket"
          export NOTE_DELIVERY_LEDGER_BUCKET="$bucket"
          echo "NOTE_DELIVERY_LEDGER_BUCKET=$bucket" >> "$GITHUB_ENV"
          selected="$(python - <<'PY'
          import json
          import note_delivery_runtime as runtime
          ledger=runtime.delivery_ledger_from_environment()
          rows=[]
          summary={}
          for blob in ledger.bucket.list_blobs(prefix=f"{ledger.prefix}/records/"):
              record,_=ledger._decode_envelope(blob.download_as_text())
              rows.append(record)
              summary[record.state.value]=summary.get(record.state.value,0)+1
          if len(rows)!=1:
              raise SystemExit(f'expected one durable record; count={len(rows)}')
          r=rows[0]
          print(str(r.snapshot.sync_id or '').strip().lower())
          print('P0B_RUN9_DURABLE_STATE='+json.dumps({"state":r.state.value,"draft_id_present":bool(str(r.draft_id or '').strip()),"states":summary,"note_mutation_count":0,"model_calls":0},sort_keys=True),file=__import__('sys').stderr)
          PY
          )"
          echo "::add-mask::$selected"
          echo "NOTE_TARGET_SYNC_ID=$selected" >> "$GITHUB_ENV"
      - name: Fresh private-draft census without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          P0B_HOSTED_DRAFT_CENSUS_RESULT_FILE: ${{ runner.temp }}/census.json
        run: python run_p0b_hosted_private_draft_census.py
      - name: Cleanup
        if: always()
        run: rm -f "${{ runner.temp }}/census.json"
