name: Notion Access Policy Guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - 'NOTION_ACCESS_POLICY.md'
      - 'notion_audit_views.json'

permissions:
  contents: write

jobs:
  notion-access-policy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/current-baseline-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/current-baseline-20260913
          fetch-depth: 0
      - name: Sync 2026-09-13 canonical documentation baseline
        shell: python
        run: |
          from pathlib import Path

          spec_path = Path('AI_Intelligence_Factory_最終仕様書.md')
          spec = spec_path.read_text(encoding='utf-8')
          old_header = """最終更新: 2026-09-10  
Core Reliability Baseline:"""
          new_header = """最終更新: 2026-09-13  
Repository Simplification Baseline: **PR #305 — Gemini-only Production / retired provider-coexistence and fixed-recovery surfaces removed**  
Current Production Provider Contract: **記事生成・判定のProduction provider pathはGemini系のみ。Groq/Qwen provider/shadow共存経路は廃止**  
Current Manual Execution Contract: **ChatOps / ONE-SHOT active modes are `article_validation` / `pending_retry_validation` / `full` only**  
Recovery Status: **固定45件Recoveryは終了。33件未復旧は現行タスクではなく、明示指示なしに再開しない**  
Publication Provenance Contract: **policy SHAはcurrent codeから導出し、policy変更前のReady metadataはstaleとしてfail closedする**  
X Contract: **X logicはPR #305の整理対象外で、独立した現行ロジックとして保持する**  
Core Reliability Baseline:"""
          if old_header not in spec:
              raise SystemExit('canonical spec header marker not found')
          spec = spec.replace(old_header, new_header, 1)

          old_anchor = """Productionコード・テスト・Fail-Closed Guardを、文書整理の都合で弱めたり旧仕様扱いしたりしない。

---

## 1. 事業・商品契約 — Run307 current"""
          new_anchor = """Productionコード・テスト・Fail-Closed Guardを、文書整理の都合で弱めたり旧仕様扱いしたりしない。

### 0.1 2026-09-13 Current Repository Baseline（PR #305）

- Productionの記事生成・判定に使うモデルprovider pathは **Gemini系のみ** とする。Groq/Qwen provider共存・shadow評価経路は現行Productionではない。
- `Qwen` がOfficialVendor、観測対象、記事テーマ、製品名として現れることはある。これは **Production model providerとしてQwenを使用することを意味しない**。
- `current_policy_ready_recovery`、`ready_metadata_rebase`、Run361〜365の固定Recovery／診断surfaceはretiredであり、現行runtimeへ戻さない。
- 旧45件Recovery運用は **33件未復旧のまま終了済み**。未復旧33件は自動的に再開すべきbacklogではなく、明示的な新規判断がない限り再処理しない。
- Recovery期に追加された仕組みでも、商品全体を守る汎用安全機構は現行契約として維持する。対象は **Ready provenance / Publication Contract・Gate / Reader Gate / Evidence safety / rate-limit protection / 日本語破損防止 / Reader Repair競合防止 / 局所修正保護**。
- ChatOps / manual ONE-SHOTのactive modeは **`article_validation` / `pending_retry_validation` / `full` の3つだけ** とする。retired Recovery modeを再追加しない。
- Scheduled Dailyは引き続き **PAUSED**。明示dispatchによるgeneric ONE-SHOTは現行運用として維持する。
- X logicはPR #305のRepository整理とは分離し、現行のX surfaceを変更しない。
- Publication policy fingerprintはfail-closedを維持する。policy対象コード変更後、旧policy SHAを持つReady metadata/captionはcurrent扱いしない。manifestを弱めたり、旧Readyを無検証で再署名したりしない。

### 0.2 Run番号資料・履歴資料のAuthority

- 本書にcurrent authorityとして明記された契約と、`main` の現行コード・テスト・GitHub ActionsをProduction判断の基準とする。
- 個別のRun追補、過去の検証記録、Recovery報告、`docs/archive/`、Git履歴は **設計根拠・監査証跡** であり、それだけを理由に終了済み機能を復活させない。
- `docs/reference/` は現行領域別契約を保持できるが、本書またはcurrent `main` と矛盾した場合は `main` → 本書の順で優先し、文書側を修正する。
- 今後「最新仕様」を別ファイルへ増殖させない。Factory全体のcanonical current specificationは **本ファイル1つ** とする。

---

## 1. 事業・商品契約 — Run307 current"""
          if old_anchor not in spec:
              raise SystemExit('canonical spec authority anchor not found')
          spec = spec.replace(old_anchor, new_anchor, 1)
          spec_path.write_text(spec, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          marker = "## Production baseline\n\n"
          insertion = """## Production baseline

- **Current repository simplification baseline:** PR #305 — Gemini-only Production; retired provider-coexistence and fixed-recovery surfaces removed
- **Current Production provider contract:** Gemini-only provider path. Qwen references under OfficialVendor/product/topic coverage are observation targets, not Production model routing
- **Current recovery status:** fixed 45-item Recovery is closed with 33 items unrecovered; it is historical state and must not resume automatically
- **Current ChatOps modes:** `article_validation` / `pending_retry_validation` / `full` only
- **Current publication provenance contract:** current policy SHA is code-derived; older Ready policy metadata becomes stale by design after policy changes
- **Current X contract:** X logic remains separate and unchanged by PR #305
"""
          if marker not in readme:
              raise SystemExit('README baseline marker not found')
          readme = readme.replace(marker, insertion, 1)
          branch_policy = "New development must start from `main`. Historical/archive branches are reference-only and must not be used as a development base.\n"
          branch_policy_new = branch_policy + "\nHistorical Run supplements, recovery reports and archived validation notes are reference/audit evidence, not competing current specifications. Repository-wide current authority is `main` plus `AI_Intelligence_Factory_最終仕様書.md`; when documentation conflicts, update the documentation rather than reviving retired runtime behavior.\n"
          if branch_policy not in readme:
              raise SystemExit('README branch-policy marker not found')
          readme = readme.replace(branch_policy, branch_policy_new, 1)
          readme_path.write_text(readme, encoding='utf-8')
      - name: Restore workflows, verify, and commit docs only
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/notion-access-policy-guard.yml
          rm -f .github/workflows/docs-current-baseline-pr-patch.yml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/docs-current-baseline-pr-patch.yml\n.github/workflows/notion-access-policy-guard.yml\nAI_Intelligence_Factory_最終仕様書.md\nREADME.md' || true
          grep -F '最終更新: 2026-09-13' 'AI_Intelligence_Factory_最終仕様書.md'
          grep -F 'Current Repository Baseline（PR #305）' 'AI_Intelligence_Factory_最終仕様書.md'
          grep -F 'Current repository simplification baseline' README.md
          python run267_documentation_contract_guard.py
          python run262_documentation_contract_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Docs: sync current Production baseline'
          git push origin HEAD:docs/current-baseline-20260913
