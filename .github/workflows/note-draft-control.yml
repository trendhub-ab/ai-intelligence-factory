name: Note Draft Queue Recovery

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aiif-note-draft-recovery-control
  cancel-in-progress: false

jobs:
  cancel-stale-pending:
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      startsWith(github.event.comment.body, '/aiif note cancel_stale_pending ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Parse exact run id
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os, re
          body = os.environ['BODY']
          match = re.fullmatch(r'/aiif note cancel_stale_pending ([0-9]{8,20})', body)
          if match is None:
              raise SystemExit('invalid recovery command')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'run_id={match.group(1)}\n')
          PY

      - name: Verify one orphaned note-draft run fail-closed
        env:
          RUN_ID: ${{ steps.parse.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::GH_PAT is required'; exit 1; }
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=1")"
          RUN_JSON="$run_json" JOBS_JSON="$jobs_json" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          run = json.loads(os.environ['RUN_JSON'])
          jobs = json.loads(os.environ['JOBS_JSON'])
          if run.get('path') != '.github/workflows/note-create-draft.yml':
              raise SystemExit('refusing non-note-draft workflow')
          if run.get('status') != 'pending':
              raise SystemExit('refusing non-pending workflow run')
          if int(jobs.get('total_count') or 0) != 0:
              raise SystemExit('refusing run that already has jobs')
          created = datetime.fromisoformat(str(run['created_at']).replace('Z', '+00:00'))
          age_minutes = (datetime.now(timezone.utc) - created).total_seconds() / 60
          if age_minutes < 30:
              raise SystemExit('refusing pending run younger than 30 minutes')
          print(f'validated stale orphan run age_minutes={age_minutes:.1f}')
          PY

      - name: Cancel only the validated stale pending run
        env:
          RUN_ID: ${{ steps.parse.outputs.run_id }}
        run: |
          set -euo pipefail
          run_id="$RUN_ID"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel"
          echo "Cancelled validated stale pending note-draft run ${run_id}."

  redispatch-exact-ready:
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      startsWith(github.event.comment.body, '/aiif note redispatch_exact ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Parse exact sync id
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os, re
          body = os.environ['BODY']
          match = re.fullmatch(r'/aiif note redispatch_exact ([0-9a-fA-F]{32})', body)
          if match is None:
              raise SystemExit('invalid exact redispatch command')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'sync_id={match.group(1).lower()}\n')
          PY

      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zero-browser dependency
        run: pip install requests

      - name: Revalidate exact Ready before redispatch
        env:
          NOTE_DRAFT_CONFIRM: CREATE_NOTE_DRAFT
          NOTE_TARGET_SYNC_ID: ${{ steps.parse.outputs.sync_id }}
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/exact_redispatch_preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
          NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
        run: |
          set -euo pipefail
          python run199_note_vm_preflight.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['NOTE_DRAFT_RESULT_FILE']).read_text(encoding='utf-8'))
          if result.get('status') != 'eligible_ready' or result.get('should_start_vm') is not True:
              raise SystemExit(f"refusing redispatch: {result.get('status', 'unknown')}")
          selected = str(result.get('selected_sync_id') or '').strip().lower()
          requested = os.environ['NOTE_TARGET_SYNC_ID'].strip().lower()
          if selected != requested:
              raise SystemExit('refusing redispatch: exact target mismatch')
          print('exact Ready revalidation passed')
          PY

      - name: Dispatch the exact Ready once
        env:
          SYNC_ID: ${{ steps.parse.outputs.sync_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::GH_PAT is required'; exit 1; }
          payload="$(printf '{"ref":"main","inputs":{"confirm":"CREATE_NOTE_DRAFT","sync_id":"%s","prepare_only":"false"}}' "$SYNC_ID")"
          printf '%s' "$payload" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/note-create-draft.yml/dispatches" \
            --input -
          echo "Exact publish-safe Ready was redispatched by sync_id."
