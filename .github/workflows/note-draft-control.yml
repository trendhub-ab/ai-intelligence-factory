name: Note Draft Queue Recovery

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aiif-note-draft-recovery-control
  cancel-in-progress: false

jobs:
  cancel-stale-pending:
    if: >-
      github.run_attempt == 1 &&
      github.event.issue.number == 71 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'trendhub-ab' &&
      github.actor == 'trendhub-ab' &&
      startsWith(github.event.comment.body, '/aiif note cancel_stale_pending ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Parse exact run id
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os, re
          body = os.environ['BODY']
          match = re.fullmatch(r'/aiif note cancel_stale_pending ([0-9]{8,20})', body)
          if match is None:
              raise SystemExit('invalid recovery command')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'run_id={match.group(1)}\n')
          PY

      - name: Verify one orphaned note-draft run fail-closed
        env:
          RUN_ID: ${{ steps.parse.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::GH_PAT is required'; exit 1; }
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=1")"
          RUN_JSON="$run_json" JOBS_JSON="$jobs_json" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          run = json.loads(os.environ['RUN_JSON'])
          jobs = json.loads(os.environ['JOBS_JSON'])
          if run.get('path') != '.github/workflows/note-create-draft.yml':
              raise SystemExit('refusing non-note-draft workflow')
          if run.get('status') != 'pending':
              raise SystemExit('refusing non-pending workflow run')
          if int(jobs.get('total_count') or 0) != 0:
              raise SystemExit('refusing run that already has jobs')
          created = datetime.fromisoformat(str(run['created_at']).replace('Z', '+00:00'))
          age_minutes = (datetime.now(timezone.utc) - created).total_seconds() / 60
          if age_minutes < 30:
              raise SystemExit('refusing pending run younger than 30 minutes')
          print(f'validated stale orphan run age_minutes={age_minutes:.1f}')
          PY

      - name: Cancel only the validated stale pending run
        env:
          RUN_ID: ${{ steps.parse.outputs.run_id }}
        run: |
          set -euo pipefail
          run_id="$RUN_ID"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel"
          echo "Cancelled validated stale pending note-draft run ${run_id}."
