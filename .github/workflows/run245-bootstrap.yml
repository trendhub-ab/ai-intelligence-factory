name: Run245 Bootstrap

on:
  push:
    branches:
      - run245-fact-validation-modularization

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run245-fact-validation-modularization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=8,<9'
      - name: Fail-closed migrate
        run: python run245_fact_validation_migration.py --write
      - name: Compile
        run: python -m compileall -q pipeline.py fact_validation_signals.py source_boundary_validation.py run245_fact_validation_migration.py
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Synthetic smoke
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: smoke
        run: python production_pipeline.py
      - name: Idempotency
        run: |
          python run245_fact_validation_migration.py --write
          git diff --check
      - name: Commit generated Run245 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py fact_validation_signals.py source_boundary_validation.py run245_fact_validation_migration.py
          git diff --cached --quiet && exit 0
          git commit -m 'Run245: extract deterministic fact validation signals'
          git push origin HEAD:run245-fact-validation-modularization
