name: P0-B Hosted Private Draft Census [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-hosted-b01-recovery-20261006

permissions:
  contents: read
  id-token: write

concurrency:
  group: p0b-hosted-private-draft-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      NOTE_DELIVERY_LEDGER_BACKEND: gcs
      NOTE_DELIVERY_LEDGER_PREFIX: delivery/v1
      NOTION_NOTE_READY_DATABASE_ID: '198667bce72443f3ad2e3b9706a0edb3'
      NOTION_NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install read-only dependencies
        run: pip install -q requests google-cloud-storage playwright
      - name: Run census contract tests
        run: python -m unittest tests.test_run_p0b_hosted_private_draft_census -v
      - name: Authenticate to private ledger with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Resolve private ledger bucket
        run: |
          set -euo pipefail
          bucket="${GCP_PROJECT_ID}-aiif-note-ledger-v1"
          echo "::add-mask::$bucket"
          echo "NOTE_DELIVERY_LEDGER_BUCKET=$bucket" >> "$GITHUB_ENV"
      - name: Pin current eligible candidate without browser
        env:
          NOTE_DRAFT_CONFIRM: CREATE_NOTE_DRAFT
          NOTE_TARGET_SYNC_ID: ''
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/p0b-census-preflight.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python run199_note_vm_preflight.py
      - name: Bind selected candidate privately
        env:
          PREFLIGHT_RESULT: ${{ runner.temp }}/p0b-census-preflight.json
        run: |
          set -euo pipefail
          selected="$(python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['PREFLIGHT_RESULT']).read_text(encoding='utf-8'))
          print(str(r.get('selected_sync_id') or '').strip())
          PY
          )"
          test -n "$selected" || { echo 'P0B_CENSUS=no_eligible_candidate'; exit 1; }
          echo "::add-mask::$selected"
          echo "NOTE_TARGET_SYNC_ID=$selected" >> "$GITHUB_ENV"
      - name: Require current ledger ambiguity without mutation
        env:
          NOTE_TARGET_IDENTITY: trendhub_biz
          NOTE_DRAFT_RESULT_FILE: ${{ runner.temp }}/p0b-census-ledger.json
        run: |
          set -euo pipefail
          bash note_delivery_ledger_preflight.sh
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['NOTE_DRAFT_RESULT_FILE']).read_text(encoding='utf-8'))
          if r.get('status') != 'ledger_blocked_ambiguous' or r.get('should_run_delivery') is not False:
              raise SystemExit('census requires the existing ambiguous ledger gate')
          print('P0B_CENSUS_LEDGER_GATE=blocked_ambiguous')
          PY
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Census private article list without mutation
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          P0B_HOSTED_DRAFT_CENSUS_RESULT_FILE: ${{ runner.temp }}/p0b-hosted-draft-census.json
        run: python run_p0b_hosted_private_draft_census.py
      - name: Summarize safe census result
        env:
          RESULT_FILE: ${{ runner.temp }}/p0b-hosted-draft-census.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RESULT_FILE']).read_text(encoding='utf-8'))
          allowed={
              'status','authenticated','private_note_card_count','exact_target_count',
              'suspicious_blank_count','unreadable_count','decision','zero_model_calls','mutation_count'
          }
          if set(r) != allowed:
              raise SystemExit('unsafe census result schema')
          if r.get('mutation_count') != 0 or r.get('zero_model_calls') is not True:
              raise SystemExit('census no-mutation contract failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### P0-B hosted private draft census\n')
              fh.write(f"- status: `{r.get('status')}`\n")
              fh.write(f"- authenticated: `{r.get('authenticated')}`\n")
              fh.write(f"- private note cards: `{r.get('private_note_card_count')}`\n")
              fh.write(f"- exact target: `{r.get('exact_target_count')}`\n")
              fh.write(f"- suspicious blank/minimal: `{r.get('suspicious_blank_count')}`\n")
              fh.write(f"- unreadable: `{r.get('unreadable_count')}`\n")
              fh.write(f"- decision: `{r.get('decision')}`\n")
              fh.write('- mutation count: `0`\n')
              fh.write('- model calls: `0`\n')
          PY
