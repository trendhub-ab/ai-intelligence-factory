name: P0-B Live Proof v2 Exact [OPS ONE-SHOT]

on:
  push:
    branches:
      - ops/p0b-live-proof-v2-exact-20261004
    paths:
      - .github/workflows/p0b-live-proof-v2-exact-once.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: '6f2c7b308ae2d49c4f34092dfbd682221d2bf040'
      EXPECTED_PR_HEAD: '471e2053af0fde55fc8e7d07a0cb63c942562c0a'
      TARGET_REF: 'design/p0-b-durable-delivery-ledger'
      APPROVAL_COMMENT_ID: '5978149007'
      TARGET_ARTICLE_TITLE: 'Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_API_VERSION: '2026-03-11'
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTE_READY_DATA_SOURCE_ID: '0b79b64d-4823-4084-be57-8bb11d7d2ce6'
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Verify immutable GitHub proof gates and v2 approval
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          pr_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${TARGET_REF}" --jq '.commit.sha')"
          approval="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${APPROVAL_COMMENT_ID}" --jq '.body')"
          test "$main_sha" = "$EXPECTED_MAIN_SHA" || {
            echo '::error::main moved; refusing live proof'
            exit 1
          }
          test "$pr_sha" = "$EXPECTED_PR_HEAD" || {
            echo '::error::PR branch moved; refusing live proof'
            exit 1
          }
          printf '%s' "$approval" | grep -F '<!-- p0b-live-proof:716:471e2053:armed:v2 -->' >/dev/null || {
            echo '::error::v2 approval marker absent; refusing live proof'
            exit 1
          }

      - name: Resolve exact source and verify queue is Ready / 投稿待ち with no draft/public identity
        id: resolve
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          token = os.environ['NOTION_API_KEY'].strip()
          version = os.environ['NOTION_API_VERSION']
          source_ds = os.environ['NOTION_DATA_SOURCE_ID'].strip()
          queue_ds = os.environ['NOTE_READY_DATA_SOURCE_ID'].strip()
          title = os.environ['TARGET_ARTICLE_TITLE']

          def query(ds, payload):
              req = urllib.request.Request(
                  f'https://api.notion.com/v1/data_sources/{ds}/query',
                  data=json.dumps(payload).encode(), method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'Notion-Version': version,
                  })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r).get('results') or []

          source_rows = query(source_ds, {
              'page_size': 10,
              'filter': {'and': [
                  {'property': '記事名', 'title': {'equals': title}},
                  {'property': '記事状態', 'select': {'equals': 'Ready'}},
              ]},
          })
          if len(source_rows) != 1:
              raise SystemExit(f'Expected one Ready source, got {len(source_rows)}')
          source = source_rows[0]
          files = ((source.get('properties') or {}).get('アイキャッチ') or {}).get('files') or []
          if len(files) != 1:
              raise SystemExit('Ready source must have exactly one eyecatch')
          sync_id = re.sub(r'[^0-9a-fA-F]', '', str(source.get('id') or '')).lower()
          if not re.fullmatch(r'[0-9a-f]{32}', sync_id):
              raise SystemExit('Invalid resolved source identity')
          print(f'::add-mask::{sync_id}')

          queue_rows = query(queue_ds, {
              'page_size': 10,
              'filter': {'and': [
                  {'property': '同期ID', 'rich_text': {'equals': sync_id}},
                  {'property': '品質状態', 'select': {'equals': 'Ready'}},
                  {'property': '投稿状態', 'select': {'equals': '投稿待ち'}},
                  {'property': 'note下書きID', 'rich_text': {'is_empty': True}},
                  {'property': 'note公開URL', 'url': {'is_empty': True}},
              ]},
          })
          if len(queue_rows) != 1:
              raise SystemExit(f'Expected one exact Ready/投稿待ち queue row, got {len(queue_rows)}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'sync_id={sync_id}\n')
          PY

      - name: Dispatch exactly one P0-B private-draft live proof
        env:
          TARGET_SYNC_ID: ${{ steps.resolve.outputs.sync_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::GH_PAT missing'; exit 1; }
          test -n "${TARGET_SYNC_ID:-}" || { echo '::error::target identity missing'; exit 1; }
          gh workflow run note-create-draft.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF" \
            -f confirm=CREATE_NOTE_DRAFT \
            -f sync_id="$TARGET_SYNC_ID" \
            -f prepare_only=false
          echo 'Exactly one P0-B private-draft live proof dispatch submitted.'
