name: Run156 Pilot Validate

on:
  push:
    branches: [feature/run156-paid-db-decision-density]
    paths:
      - run156_decision_review_import.py
      - external_reviews/run156_pilot.json
      - external_reviews/run156_whisper_fix.json
      - tests/test_run156_decision_density.py
      - .github/workflows/run156-pilot-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run156 focused tests
        run: python -m unittest -v tests.test_run156_decision_density
      - name: Validate six decision-grade reviews against production evidence
        env:
          TZ: Asia/Tokyo
          GEMINI_API_KEY: forbidden-run156
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: 'true'
          ENABLE_JAPANESE_DISPLAY_LABEL: 'true'
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_SUBSCRIBER_TECH_SYNC: 'true'
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
        run: |
          python - <<'PY'
          import json
          import run156_decision_review_import as r

          base = r.run(
              'external_reviews/run156_pilot.json',
              apply=False,
              audit_path='run156_artifacts/pilot_validate.json',
          )
          # Original pilot contains the one wording false-positive already diagnosed;
          # five other rows must remain production-valid.
          assert base['density_gate'] == 'passed', base
          assert base['product_review']['validated'] == 5, base['product_review']['results']
          failed = [x for x in base['product_review']['results'] if x.get('status') != 'validated']
          assert len(failed) == 1 and failed[0]['name'] == 'openai/whisper', failed

          whisper = r.run(
              'external_reviews/run156_whisper_fix.json',
              apply=False,
              audit_path='run156_artifacts/whisper_validate.json',
          )
          assert whisper['density_gate'] == 'passed', whisper
          assert whisper['validated'] == 1, whisper
          print(json.dumps({
              'decision_density_gate': 'PASS',
              'production_evidence_validated': 6,
              'zero_gemini_calls': True,
          }, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run156-pilot-validate-${{ github.run_id }}
          path: run156_artifacts/
          retention-days: 14
