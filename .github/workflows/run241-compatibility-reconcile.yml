name: Run241 Compatibility Reconcile

on:
  push:
    branches:
      - run241-batched-pipeline-modularization

permissions:
  contents: write

concurrency:
  group: run241-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: run241-batched-pipeline-modularization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore historical pipeline compatibility alias
        run: python run241_compatibility_reconcile.py
      - name: Compile and validate exact migration idempotency
        run: |
          python -m compileall -q pipeline.py note_manuscript.py run241_batched_modularization_migration.py
          python run241_batched_modularization_migration.py
          test "$(wc -l < pipeline.py)" -eq 11497
      - name: Run affected and Run241 integration tests
        run: |
          python -m unittest tests.test_run138_source_note_direction -v
          python -m unittest tests.test_run241_batched_modules -v
          python -m unittest tests.test_run241_batched_integration -v
      - name: Whitespace check
        run: git diff --check
      - name: Commit compatibility reconciliation
        run: |
          if git diff --quiet -- pipeline.py run241_batched_modularization_migration.py; then
            echo 'Run241 compatibility already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py run241_batched_modularization_migration.py
          git commit -m 'Run241: preserve SOURCE_RIGHTS_NOTE pipeline compatibility'
          git push origin HEAD:run241-batched-pipeline-modularization
