name: One-shot Gemini Timeout Verification

on:
  push:
    paths:
      - '.github/workflows/one-shot-timeout-hardening.yml'

permissions:
  actions: write
  contents: read

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Run harness self-test
        run: python regression_suite.py --self-test
      - name: Run synthetic smoke regression
        run: python regression_suite.py --bootstrap --smoke
      - name: Dispatch Daily after verification
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily.yml',
              ref: 'main'
            })
