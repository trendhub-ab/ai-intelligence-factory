name: Cross DB Contract Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cross_db_contract_guard.py'
      - 'content_db_contract_guard.py'
      - 'evidence_db_contract_guard.py'
      - 'decision_intelligence.py'
      - 'evidence_ledger.py'
      - 'pipeline.py'
      - 'member_presentation_sync.py'
      - 'member_presentation_identity.py'
      - 'provision_member_presentation_db.py'
      - 'notion_access_policy_guard.py'
      - 'notion_audit_views.json'
      - 'documentation_freshness_guard.py'
      - 'tests/test_cross_db_contract_guard.py'
      - 'tests/test_content_db_contract_guard.py'
      - 'tests/test_evidence_db_contract_guard.py'
      - 'tests/test_member_presentation_resolution_guard.py'
      - 'tests/test_run232_notion_integration_reconciliation.py'
      - '.github/workflows/cross-db-contract-guard.yml'
  push:
    branches: [main]
    paths:
      - 'cross_db_contract_guard.py'
      - 'content_db_contract_guard.py'
      - 'evidence_db_contract_guard.py'
      - 'decision_intelligence.py'
      - 'evidence_ledger.py'
      - 'pipeline.py'
      - 'member_presentation_sync.py'
      - 'member_presentation_identity.py'
      - 'provision_member_presentation_db.py'
      - 'notion_access_policy_guard.py'
      - 'notion_audit_views.json'
      - 'documentation_freshness_guard.py'
      - 'tests/test_cross_db_contract_guard.py'
      - 'tests/test_content_db_contract_guard.py'
      - 'tests/test_evidence_db_contract_guard.py'
      - 'tests/test_member_presentation_resolution_guard.py'
      - 'tests/test_run232_notion_integration_reconciliation.py'
      - '.github/workflows/cross-db-contract-guard.yml'
  workflow_run:
    workflows:
      - Daily Intelligence & Content Pipeline [ONE-SHOT]
      - Member Presentation Sync
    types: [completed]

concurrency:
  group: cross-db-contract-guard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest tests/test_cross_db_contract_guard.py
          python -m unittest tests/test_content_db_contract_guard.py
          python -m unittest tests/test_evidence_db_contract_guard.py
          python -m unittest tests/test_member_presentation_resolution_guard.py
          python -m unittest tests/test_run232_notion_integration_reconciliation.py

  live-schema-contract:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Daily Intelligence & Content Pipeline [ONE-SHOT]' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate live Content Intelligence DB contract
        run: python content_db_contract_guard.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: '2026-03-11'
      - name: Validate live Decision Intelligence DB contracts
        run: python cross_db_contract_guard.py schemas
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_DECISION_INTELLIGENCE_DB: ${{ vars.ENABLE_DECISION_INTELLIGENCE_DB || 'false' }}
          NOTION_TECH_DATABASE_ID: ${{ secrets.NOTION_TECH_DATABASE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
          ENABLE_SUBSCRIBER_TECH_SYNC: ${{ vars.ENABLE_SUBSCRIBER_TECH_SYNC || 'false' }}
          NOTION_SUBSCRIBER_TECH_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATABASE_ID }}
          NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_SUBSCRIBER_TECH_DATA_SOURCE_ID }}
          ENABLE_DECISION_MONTHLY_DIGEST: ${{ vars.ENABLE_DECISION_MONTHLY_DIGEST || 'false' }}
          NOTION_MONTHLY_DATABASE_ID: ${{ secrets.NOTION_MONTHLY_DATABASE_ID }}
          NOTION_MONTHLY_DATA_SOURCE_ID: ${{ secrets.NOTION_MONTHLY_DATA_SOURCE_ID }}
      - name: Validate live Evidence Ledger contract
        run: python evidence_db_contract_guard.py
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          ENABLE_EVIDENCE_LEDGER: ${{ vars.ENABLE_EVIDENCE_LEDGER || 'false' }}
          EVIDENCE_LEDGER_REQUIRED: ${{ vars.EVIDENCE_LEDGER_REQUIRED || 'false' }}
          NOTION_EVIDENCE_DATABASE_ID: ${{ secrets.NOTION_EVIDENCE_DATABASE_ID }}
          NOTION_EVIDENCE_DATA_SOURCE_ID: ${{ secrets.NOTION_EVIDENCE_DATA_SOURCE_ID }}

  live-member-contract:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Member Presentation Sync' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve clean member presentation DB
        run: python provision_member_presentation_db.py
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
          MEMBER_PRESENTATION_DB_TITLE: 'AI・技術一覧｜判断DB'
          MEMBER_PRESENTATION_CANONICAL_DATABASE_ID: 'b2787ee0-5b58-4ca7-b4eb-774f60237f1f'
          MEMBER_PRESENTATION_CANONICAL_DATA_SOURCE_ID: '7e4ceaa7-7bdf-4c4b-bf78-c2cccac44404'
          MEMBER_PRESENTATION_API_HOST_PAGE_ID: '3c5479ff-dca9-8178-867c-d9249a3ff5c8'
          MEMBER_PRESENTATION_ALLOW_CREATE: 'false'
      - name: Validate clean member product completeness
        run: python cross_db_contract_guard.py member
        env:
          NOTION_DECISION_INTELLIGENCE_API_KEY: ${{ secrets.NOTION_DECISION_INTELLIGENCE_API_KEY }}
          NOTION_API_VERSION: '2026-03-11'
