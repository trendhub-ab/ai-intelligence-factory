name: P0 C-1 World SSH Hardening [OPS ONE-SHOT v5]

on:
  push:
    branches: [ops/p0-c1-access-config-audit-20261005]
    paths: [.github/workflows/p0-c1-ssh-target-hardening.yml]

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_NOTE_VM_NAME: ${{ vars.GCP_NOTE_VM_NAME }}
      GCP_NOTE_VM_ZONE: ${{ vars.GCP_NOTE_VM_ZONE }}
      SSH_MAINTENANCE_TAG: aiif-c1-world-ssh-maintenance-20261005
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Guard, scope world SSH, and verify AIIF exclusion
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/c1-world-ssh"; mkdir -p "$tmp"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/vm-before.json"
          gcloud compute instances list --project "$GCP_PROJECT_ID" --format=json > "$tmp/instances.json"
          gcloud compute firewall-rules list --project "$GCP_PROJECT_ID" --format=json > "$tmp/fw-before.json"

          ROOT="$tmp" TAG="$SSH_MAINTENANCE_TAG" python3 - <<'PY'
          import ipaddress,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); tag=os.environ['TAG']
          vm=json.loads((root/'vm-before.json').read_text())
          instances=json.loads((root/'instances.json').read_text())
          rules=json.loads((root/'fw-before.json').read_text())
          nics=vm.get('networkInterfaces') or []; network=str((nics[0].get('network') if nics else '') or '')
          tags=set((vm.get('tags') or {}).get('items') or [])
          sas={str(x.get('email') or '') for x in (vm.get('serviceAccounts') or []) if x.get('email')}
          selflink=str(vm.get('selfLink') or '')
          if str(vm.get('status') or '')!='TERMINATED': raise SystemExit('guard: VM must be TERMINATED')
          if tag in tags: raise SystemExit('guard: AIIF VM must not have world-SSH maintenance tag')
          peers=[x for x in instances if str(x.get('selfLink') or '')!=selflink and any(str(n.get('network') or '')==network for n in (x.get('networkInterfaces') or []))]
          if peers: raise SystemExit('guard: peer VM appeared on target VPC')
          def allows22(r):
              if str(r.get('direction') or 'INGRESS').upper()!='INGRESS' or bool(r.get('disabled')): return False
              for a in (r.get('allowed') or []):
                  proto=str(a.get('IPProtocol') or '').lower(); ports=[str(p) for p in (a.get('ports') or [])]
                  if proto not in {'tcp','all'}: continue
                  if not ports: return True
                  for p in ports:
                      if p=='22': return True
                      if '-' in p:
                          try:
                              lo,hi=map(int,p.split('-',1))
                              if lo<=22<=hi: return True
                          except Exception: pass
              return False
          def applies(r):
              tt=set(r.get('targetTags') or []); ts=set(r.get('targetServiceAccounts') or [])
              return (not tt or bool(tt & tags)) and (not ts or bool(ts & sas))
          candidates=[]; effective_world=0
          for r in rules:
              if str(r.get('network') or '')!=network or not allows22(r): continue
              tt=set(r.get('targetTags') or []); ts=set(r.get('targetServiceAccounts') or [])
              sources=[]
              for s in (r.get('sourceRanges') or ['0.0.0.0/0']):
                  try: sources.append(ipaddress.ip_network(str(s),strict=False))
                  except Exception: pass
              is_world=any(str(n)=='0.0.0.0/0' for n in sources)
              if not is_world: continue
              is_owned=(tt=={tag} and not ts)
              is_effective_untargeted=(applies(r) and not tt and not ts)
              if is_effective_untargeted: effective_world += 1
              if not (is_owned or is_effective_untargeted): continue
              name=str(r.get('name') or '')
              if not name: raise SystemExit('guard: world SSH candidate missing name')
              candidates.append(name)
          if len(candidates)!=1 or len(set(candidates))!=1:
              raise SystemExit('guard: expected exact one effective-or-owned world SSH rule')
          if effective_world not in (0,1): raise SystemExit('guard: invalid effective world SSH count')
          (root/'candidate-name.txt').write_text(candidates[0]+'\n')
          print(json.dumps({'guard':'pass','world_candidate_count':1,'effective_world_before':effective_world,'peer_vm_count':0,'vm_status':'TERMINATED'},sort_keys=True))
          PY

          rule="$(cat "$tmp/candidate-name.txt")"
          gcloud compute firewall-rules update "$rule" --project "$GCP_PROJECT_ID" --target-tags="$SSH_MAINTENANCE_TAG" --quiet >/dev/null

          gcloud compute firewall-rules list --project "$GCP_PROJECT_ID" --format=json > "$tmp/fw-after.json"
          gcloud compute instances describe "$GCP_NOTE_VM_NAME" --project "$GCP_PROJECT_ID" --zone "$GCP_NOTE_VM_ZONE" --format=json > "$tmp/vm-after.json"
          ROOT="$tmp" TAG="$SSH_MAINTENANCE_TAG" python3 - <<'PY'
          import ipaddress,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); tag=os.environ['TAG']
          vm=json.loads((root/'vm-after.json').read_text()); rules=json.loads((root/'fw-after.json').read_text())
          name=(root/'candidate-name.txt').read_text().strip()
          nics=vm.get('networkInterfaces') or []; network=str((nics[0].get('network') if nics else '') or '')
          tags=set((vm.get('tags') or {}).get('items') or [])
          sas={str(x.get('email') or '') for x in (vm.get('serviceAccounts') or []) if x.get('email')}
          def allows22(r):
              if str(r.get('direction') or 'INGRESS').upper()!='INGRESS' or bool(r.get('disabled')): return False
              for a in (r.get('allowed') or []):
                  proto=str(a.get('IPProtocol') or '').lower(); ports=[str(p) for p in (a.get('ports') or [])]
                  if proto not in {'tcp','all'}: continue
                  if not ports: return True
                  for p in ports:
                      if p=='22': return True
                      if '-' in p:
                          try:
                              lo,hi=map(int,p.split('-',1))
                              if lo<=22<=hi: return True
                          except Exception: pass
              return False
          def applies(r):
              tt=set(r.get('targetTags') or []); ts=set(r.get('targetServiceAccounts') or [])
              return (not tt or bool(tt & tags)) and (not ts or bool(ts & sas))
          selected=[]; effective_world=[]
          for r in rules:
              if str(r.get('name') or '')==name: selected.append(r)
              if str(r.get('network') or '')!=network or not allows22(r) or not applies(r): continue
              nets=[]
              for s in (r.get('sourceRanges') or ['0.0.0.0/0']):
                  try: nets.append(ipaddress.ip_network(str(s),strict=False))
                  except Exception: pass
              if any(str(n)=='0.0.0.0/0' for n in nets): effective_world.append(r)
          if str(vm.get('status') or '')!='TERMINATED': raise SystemExit('verify: VM state changed')
          if tag in tags: raise SystemExit('verify: AIIF VM unexpectedly has world-SSH tag')
          if len(selected)!=1: raise SystemExit('verify: world rule count mismatch')
          if set(selected[0].get('targetTags') or [])!={tag} or (selected[0].get('targetServiceAccounts') or []): raise SystemExit('verify: world target mismatch')
          if effective_world: raise SystemExit('verify: world SSH still applies to AIIF VM')
          safe={'status':'c1_world_ssh_boundary_hardened','scoped_world_rule_count':1,'world_ssh_applicable_after':False,'vm_status':'TERMINATED','nonworld_rule_untouched':True}
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### P0 C-1 world SSH hardening v5\n- result: `'+json.dumps(safe,sort_keys=True)+'`\n')
          PY
