name: Production E2E Retry Reservation 2026-09-24

# One-date operational reservation created after the live E2E hit provider-wide 503s.
# The normal Daily workflow remains paused and daily-one-shot.yml remains workflow_dispatch-only.
# Two schedule entries provide a backup firing opportunity. The later run skips when any
# earlier reservation run has already verified that a new ONE-SHOT run was created.
on:
  schedule:
    - cron: '5 8 24 9 *'   # 17:05 JST
    - cron: '15 8 24 9 *'  # 17:15 JST backup

permissions:
  contents: read
  actions: read

concurrency:
  group: aiif-production-e2e-retry-20260924
  cancel-in-progress: false

jobs:
  dispatch-if-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Activate only on the intended UTC date
        id: date_guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(date -u +%F)" = "2026-09-24" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Reservation date has passed; inert no-op."
          fi

      - name: Detect prior successful reservation run
        if: ${{ steps.date_guard.outputs.active == 'true' }}
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::GH_PAT is required"; exit 1; }
          prior_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-e2e-retry-20260924.yml/runs?per_page=20"               --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .conclusion == \"success\" and .created_at >= \"2026-09-24T08:00:00Z\") | .id"               | head -1
          )"
          if [ -n "$prior_id" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Prior successful reservation run found: $prior_id; duplicate dispatch suppressed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture current ONE-SHOT head run
        if: ${{ steps.date_guard.outputs.active == 'true' && steps.prior.outputs.skip == 'false' }}
        id: before
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          before_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-one-shot.yml/runs?event=workflow_dispatch&per_page=1"               --jq '.workflow_runs[0].id // 0'
          )"
          echo "run_id=$before_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact Production E2E ONE-SHOT
        if: ${{ steps.date_guard.outputs.active == 'true' && steps.prior.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::GH_PAT is required"; exit 1; }
          gh workflow run daily-one-shot.yml --repo "${GITHUB_REPOSITORY}" --ref main             -f mode=production_e2e_validation             -f editorial_style=classic             -f excluded_models=''             -f exact_target=''             -f confirm=RUN_ONCE

      - name: Verify a new ONE-SHOT run actually exists
        if: ${{ steps.date_guard.outputs.active == 'true' && steps.prior.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BEFORE_ID: ${{ steps.before.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          observed=""
          for _ in $(seq 1 24); do
            current_id="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-one-shot.yml/runs?event=workflow_dispatch&per_page=1"                 --jq '.workflow_runs[0].id // 0'
            )"
            if [ -n "$current_id" ] && [ "$current_id" != "0" ] && [ "$current_id" != "${BEFORE_ID:-0}" ]; then
              observed="$current_id"
              break
            fi
            sleep 5
          done
          if [ -z "$observed" ]; then
            echo "::error::Dispatch returned but no new ONE-SHOT run was observed; leave reservation failed so the backup cron can retry."
            exit 1
          fi
          echo "Verified new Production E2E ONE-SHOT run: $observed"
          {
            echo "### Production E2E retry reservation"
            echo "- verified ONE-SHOT run id: `$observed`"
            echo "- duplicate suppression: prior successful reservation run required"
            echo "- public note release: `false`"
          } >> "$GITHUB_STEP_SUMMARY"
