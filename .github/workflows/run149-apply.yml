name: Run149 Apply Quality-First Product Review

on:
  push:
    branches:
      - fix/run149-product-review-quality-first
    paths:
      - tools/run149_apply.py
      - .github/workflows/run149-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply Run149 patch
        run: python tools/run149_apply.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q pipeline.py

      - name: Run focused Run148-149 tests
        run: |
          python -m unittest discover -s tests -p 'test_run148_product_review_output_budget.py' -v
          python -m unittest discover -s tests -p 'test_run149_product_review_quality_first.py' -v

      - name: Run full unittest
        run: python -m unittest discover -s tests -v

      - name: Run synthetic smoke
        env:
          SYNTHETIC_REGRESSION_MODE: 'true'
          SYNTHETIC_REGRESSION_TIER: smoke
        run: python pipeline.py

      - name: Commit validated Run149 change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/run149_apply.py .github/workflows/run149-apply.yml
          git add pipeline.py tests/test_run148_product_review_output_budget.py tests/test_run149_product_review_quality_first.py
          git commit -m 'Run149: preserve Product Review reasoning quality'
          git push origin HEAD:fix/run149-product-review-quality-first
